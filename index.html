r tenía aquella dinidad por su vida y era casado y era tan estimado que conpetía en razones con el Ynga y tenía poder sobre todos los oráculos y tenplos y quitava y ponía çaçerdotes. El Ynga y él jugavan muchas vezes a sus juegos; y eran estos tales de gran linaje y de parientes poderos[os], y no se dava la tal dinidad a honbres baxos ni oscuros, aunque tuviesen mucho mereçimiento. Nobles se llaman todos los que vivían en la parte del Cuzco, que llamavan \"Orencuzcos\" y \"Hanancuzcos\" y los hijos y deçendientes dellos, aunque en otras partes residiesen en otras tierras. E yo me acuerdo, estando en el Cuzco el año pasado de mill y quinientos y çinquenta por el mes de agosto, después de aver cojido sus sementeras, entrar los yndios con sus mugeres por la çibdad con gran ruydo, trayendo los arados en las manos y algunas papas y mayz y hazer su fiesta en solamente cantar y dezir quánto en lo pasado solían festejar sus cosechas. Porque no consienten los o las [a]pos y çaçerdotes questas fiestas jentílicas se hagan en público, como solían, ni en secreto los consinterían, si lo supiesen; pero como aya tantos millares de yndios sin se aver buelto cristianos, de creer es que, en donde no los bean, harán lo que se les antojare. La figura del Tiçiviracocha y la del Sol y la Luna y la maroma grande de oro y otras pieças conoçidas no se an hallado ni ay yndio ni cristiano que sepa ni atine adónde está; pero, aunque es mucho, esto es poco para lo que está enterrado en el Cuzco y en los oráculos y en otras [partes deste gran reyno].","zh":"大祭司终身担任这一职位，他是结了婚的，极受尊崇，说话可以同印加争辩；他掌管所有的神谕所和神庙，可以撤换、任命祭司。印加和他常常一起玩他们的游戏；担任这一职位的都是出身高贵、亲属有势力的人，出身低微、默默无闻的人，即使功劳再大，也不能担任。凡是住在库斯科城中被称为“乌林库斯科”和“哈南库斯科”的那一片的人，以及他们的子孙后裔，即使住在别处、别的地方，都称为贵族。我记得，1550年8月我在库斯科，收完庄稼以后，印第安人带着妻子大声喧闹着进城，手里拿着犁，带着些土豆和玉米，过他们的节，只是唱歌，说他们过去怎样庆祝丰收。因为当政的阿波们和神父们不许他们像从前那样公开举行这些异教节日，要是知道了，也不会许他们私下举行；不过既然有成千上万的印第安人还没有成为基督徒，可以想见，在看不见他们的地方，他们想怎么做就会怎么做。蒂西维拉科查的像、太阳和月亮的像、那条大金绳以及其他有名的器物，都没有找到，也没有哪个印第安人或基督徒知道或猜得到在哪里；不过，这些虽然多，比起埋在库斯科、埋在神谕所和这个大王国其他地方的东西，还是少的。","tr":"p"},"c31-1":{"src":"c","ch":31,"pg":"p. 94","es":"Pues con la más brevedad que pude escriví lo que entendí [de] la governaçión y costunbres de los Yngas, quiero bolver con mi escritura a contar los que ovo desde Mango Capa hasta Guascar, como atrás prometí. Y así, déste como de otros no dan mucha notiçia los orejones, porque, a la verdad, hizieron pocas cosas; porque los ynventores de lo escrito y los más valerosos de todos ellos fueron Ynga Yupangue y Topa Ynga, su hijo, y Guaynacapa, su nieto; aunque tanbién lo deve de causar la razón que ya tengo escrita, de ser éstos los más modernos.","zh":"我已尽可能简短地写下了我所了解的印加人的治理和习俗，现在要回到原来的叙述，像前面许诺的那样，讲从曼科·卡帕克到瓦斯卡尔之间的诸位印加。关于这一位和其他几位，大耳贵族讲不出多少，因为说实在的，他们做的事很少；上面所写那些制度的创立者、他们中间最勇武的人，是印加·尤潘基、他的儿子图帕克·印加，以及他的孙子瓦伊纳·卡帕克；当然，造成这种情况的，也应该有我已经写过的那个原因，即这几位离今天最近。","tr":"p"},"c31-2":{"src":"c","ch":31,"pg":"p. 94–95","es":"Luego pues que fue muerto Mango Capac y hechos por él los lloros generales y oçequias, Sinche Roca Ynga tomó la borla o corona con las çerimonias acostunbradas, procurando luego de alargar la casa del Sol y allegar así la más jente que pudo con halagos y grandes ofreçimientos, llamando, como ya se llamava, a la nueva poblaçión Cuzco. Algunos de los yndios naturales dél afirman que, adonde estava la gran plaça, ques la misma que agora tiene, avía un pequeño lago y tremadal de agua que le hera dificultoso para el labrar los edifiçios grandes que querían començar a edificar; mas, que como esto fuese conoçido por el rey Çinche Roca, procuró con ayuda de sus aliados y vezinos de desazer aquel palude, çegándolo con grandes losas y maderos grueços, allanando por ensima donde el agua y lomo solía estar con tierra, de tal manera que quedó como agora lo vemos. Y aun quentan más que todo el valle del Cuzco hera estéril y jamás dava buen fruto la tierra dél de lo que senbraron y que de dentro de la gran montaña de los Andes traxeron muchos millares de cargas de tierra, la qual tendieron por todo él, con lo qual, si es verdad, quedó el valle muy fértil, como agora vemos.","zh":"曼科·卡帕克死后，人们为他举行了全体哭丧和葬仪，辛奇·罗卡·印加按惯常的仪式接过王穗，也就是王冠。他随即着手扩建太阳之屋，又以抚慰和丰厚的许诺尽量招揽人口；这个新聚落已经叫作库斯科，他也仍这样称呼它。当地的一些本地印第安人断言，如今的大广场——与当年是同一个——所在之处，原先有一个小湖和一片泥沼，给他们想要兴建的大型建筑造成困难；国王辛奇·罗卡知道以后，便设法在盟友和邻人的帮助下除掉这片沼泽，用大石板和粗木料把它填塞，在原来积水和淤泥的地方铺土整平，弄成如今我们看到的样子。他们还说，整个库斯科谷原本贫瘠，所种的东西从来长不好；他们从安第斯大山深处运来成千上万担泥土，铺满整个山谷；如果此话属实，山谷就是这样变得肥沃的，正如我们现在所见。","tr":"p"},"c31-3":{"src":"c","ch":31,"pg":"p. 95","es":"Este Ynga ovo en su hermana e muger muchos hijos: al mayor nonbraron Quelloque Yupangue. Y visto por los comarcanos al Cuzco la buena horden que tenían los nuevos pobladores que en él estavan y cómo atrayan a su amistad las jentes, más por amor e benebolençia que no por armas ni rigor, algunos capitanes y prençipales vinieron a con ellos tener sus pláticas, holgándose de ver el tenplo de Curicancha y la buena orden con que se regan, que fue causa que afirmaron con ellos amistades de muchas partes. Y dizen más que, como oviese venido al Cuzco entre estos que digo, un capitán natural del pueblo que llaman Çaño, no muy lexos de la çibdad, que rogó a Çinche Roca, con gran vehemençia que en ello puso, que tuviese por bien que una hija quél tenía muy apuesta y hermosa, la quisiese reçibir para darla [por] muger a su hijo. Entendido esto por el Ynga, pesóle porque era lo que se le pedía cosa que, si lo otorgava, yva contra lo estableçido y ordenado por su padre; e, si no conçedía al dicho deste capitán, quél y los demás los ternían por honbres ynumanos, publicando que no heran más de para sí. Y aviendo tomado consejo con los orejones y prençipales de la çibdad, pareçió a todos que devía de reçibir la donzella para la casar con su hijo porque hasta que tuviesen más fuerça y potençia no se avían de guiar en aquel caso por lo que su padre dexó mandado. Y así dizen que respondió al padre de la que avía de ser muger de su hijo que la traxese y se hizieron las bodas con toda solenidad, a su costunbre y modo, y fue llamada en el Cuzco \"Coya\". Y una hija que tenía el rey, que avía de ser muger de su hermano, fue colocada en el tenplo de Curicanche, adonde ya avían puesto saçerdotes y se hazían sacrefiçios delante de la figura del Sol y avía porteros para guarda de las mugeres sagradas, de la manera y como está contado.","zh":"这位印加与他的姐妹兼妻子生了许多孩子，长子起名叫略克·尤潘基。库斯科周围的人看到住在那里的新居民秩序井然，看到他们争取各族的友谊靠的是关爱和善意，而不是武力和严厉，一些统领和头人便来同他们交谈，乐于参观科里坎查神庙和他们治理的良好秩序；因此，许多地方都同他们结下了友谊。他们还说，在我说的这些人当中，有一位来到库斯科的统领，是离城不远、名叫萨尼奥的村子的本地人，他十分恳切地请求辛奇·罗卡，希望他肯接纳自己一个美貌出众的女儿，把她嫁给他的儿子。印加听了这话，心里很为难：所求之事如果答应，就违背了他父亲的规定和命令；如果不答应这位统领的请求，此人和其他人就会认为他们不近人情，四处宣扬他们只顾自己。他同大耳贵族和城中头人商议之后，大家都认为应当接纳这位少女，让她嫁给他的儿子，因为在他们力量和权势壮大以前，这件事上不必照他父亲留下的命令行事。于是据说他回复那位未来儿媳的父亲，让他把女儿送来；婚礼按他们的风俗和方式隆重举行，她在库斯科被称为“科娅”。国王原本要嫁给其兄弟的那个女儿，则被安置在科里坎查神庙里；那里已经设立了祭司，在太阳像前举行献祭，还有守门人看守圣女，情形就像前面讲过的那样。","tr":"p"},"c31-4":{"src":"c","ch":31,"pg":"p. 95–96","es":"Como este casamiento se hizo, quentan los mismos yndios que aquella parçialidad se juntó con los vezinos del Cuzco, haziendo grandes conbites y borracheras confirmaron su hermandad y amistad de ser todos unos. Y por ello se hizieron grandes sacrefiçios en el çerro de Guanacaure y en Tanboquiro y en el mismo tenplo de Curicanche. Lo qual pasado, se juntaron más de quatro mill mançebos e hechas las çerimonias que para ello se avían ynventado, fueron armados cavalleros y quedaron tenidos por nobles y les fueron rasgadas las orejas y puesto en ellas aquel redondo que usar solían.","zh":"这门婚事办成以后，据这些印第安人自己说，那一部的人便同库斯科的居民合为一体，大摆筵席、畅饮，确认彼此的兄弟情谊和友好，从此不分彼此。为此，在瓦纳考里山、坦博基罗以及科里坎查神庙本身，都举行了盛大的献祭。此后，四千多名青年聚集起来，举行了为此专门创设的仪式，被授为骑士，从此被视为贵族；他们的耳朵被割开，戴上他们惯戴的那种圆形耳饰。","tr":"p"},"c31-5":{"src":"c","ch":31,"pg":"p. 96","es":"Pasado esto y otras cosas que suçedieron al rey Sinche Roca que no savemos, después de ser viejo y dexar muchos hijos y hijas, murió y fue mui llorado y plañido y le hizieron oçequias muy sontuosas, guardando su bulto para memoria de que avía sido bueno, creyendo que su ánima descansava en los çielos.","zh":"这些事，以及其他发生在辛奇·罗卡王身上而我们不知道的事过去之后，他年老去世，留下许多儿女；人们为他痛哭哀悼，为他举行了极为隆重的葬仪，保存他的像，以纪念他曾是一位好王，相信他的灵魂在天上安息。","tr":"p"},"c32-1":{"src":"c","ch":32,"pg":"p. 97","es":"Muerto de la manera que se a contado Çinche Roca, Lloque Yupangue, su hijo, fue reçibido por señor, aviendo primero ayunado los días para [ello] señalados; y como por sus adivinanças y pensamientos se tuviese grande esperança que en lo futuro la çibdad del Cuzco avía de floreçer, el nuevo rey, començó a la ennobleçer con nuevos edifiçios que en ella fueron hechos. Y rogó, a lo que quentan, a su suegro quisiese con todos sus aliados y confederados pasarse a vevir a su çibdad, adonde le sería guardado su onor y en ella ternía la parte que quisiese. Y el señor o capitán de Çaño haziéndolo así, se le dio y señaló para su bivienda la parte más oçidental de la çibdad, la qual, por estar en laderas y collados, se llamó Anancuzco; y en lo llano y más baxo quedó el rey con su casa y vezindad; y como ya todos heran orejones, ques tanto como dezir nobles, casi todos ellos oviesen sido en fundar la nueva çibdad, tuviéronse para sienpre por ylustres las jentes que bivían en los dos lugares de la çibdad llamados Hanancuzco y Orencuzco. Y aun algunos yndios quisieron dezir que el un Ynga avía de ser de uno destos linajes y otro del otro, mas no lo tengo por çierto, ni lo creo, ni ques más de lo que los orejones quentan, ques lo que ya está escrito. Por una parte y por otra de la çibdad avía grandes barrios en los collados, porque ella estava traçada en çerros y quebradas, como se contó en la Primera Parte desta Corónica.","zh":"辛奇·罗卡如前所述去世之后，他的儿子略克·尤潘基先按规定的日子斋戒，然后被奉为领主。由于从种种占卜和推想中，人们对库斯科城的未来繁荣寄予厚望，新王便开始在城中兴建新的建筑，使之更为壮观。据说，他还请求他的岳父带着全部盟友和同盟者迁到他的城里来住，在那里他的荣誉会得到维护，城中哪一部分他想要都可以给他。萨尼奥的领主或统领照此做了，于是把城的最西面一部分划给他居住；这一部分因为处在山坡和丘陵上，便叫作哈南库斯科；国王则带着他的家族和邻里留在平坦低下之处。由于这时人人都已是大耳贵族——也就是贵族的意思——而且他们几乎全都参与了这座新城的创建，住在城中称为哈南库斯科和乌林库斯科的两处地方的人，从此都被视为显贵。有些印第安人甚至想说，两位印加须一位出自其中一个世系，另一位出自另一个世系；但我并不认为此说确实，也不相信，这不过是大耳贵族所讲的，也就是上面已经写过的那些。城的这一边和那一边，山丘上都有很大的街区，因为这座城是依山势和沟谷布局的，正如本书第一部所讲。","tr":"p"},"c32-2":{"src":"c","ch":32,"pg":"p. 97–98","es":"No dan relaçión que en estos tienpos oviese guerra notable; antes afirman que los del Cuzco poco a poco, con buenas mañas que para ello tenían, allegavan a su amistad muchas jentes de las comarcas de su çibdad y acreçentavan el tenplo de Curicanche así en edifiçios como en riqueza, porque ya buscavan metales de plata y de oro y dello venía mucho a la çibdad al tianguez o mercado que en ella se hazía. Y metíanse en el tenplo mugeres mamaconas para no salir dél, segúnd y como está dicho en otros lugares.","zh":"他们没有讲到这一时期有过什么值得一提的战争；相反，他们断言，库斯科人凭着高明的手段，逐渐把城周围许多地方的人争取为朋友，并在建筑和财富两方面扩充科里坎查神庙，因为这时他们已经在寻找银矿和金矿，大量金银运进城里，送到城中的集市上。他们还把玛玛科纳妇女送进神庙，终身不出，正如别处已经讲过的那样。","tr":"p"},"c32-3":{"src":"c","ch":32,"pg":"p. 98","es":"Y reynando desta manera Lloque Yupangue en el Cuzco, pasándose lo más de su tienpo, allegó a ser mui biejo sin aver hijo en su muger. Mostrando mucho pesar dello, los vezinos de la çibdad hizieron grandes sacrifiçios y plegarias a sus dioses, así en Guanacaure como en Curicanche y en Tanboquiro y en otras partes; y dizen que por uno de aquellos oráculos donde oyan respuestas vanas oyeron que el Ynga engendraría hijo que le çusediese en el reyno; de lo qual mostraron mucho contento y alegres con la esperança, ponían al viejo rey ensima de su muger la Coya; y con tales bulras, a cavo de algunos días claramente por todos se conoçio estar preñada y a su tienpo parió un hijo.","zh":"略克·尤潘基就这样在库斯科统治，度过了大半生，已经年老，妻子却没有为他生下儿子。城中居民对此十分忧虑，在瓦纳考里、科里坎查、坦博基罗和别的地方向他们的神大举献祭祈祷；据说他们从一处神谕所——他们在那里听到的都是虚妄的回答——得知，印加会生一个儿子来继承王位；他们为此十分高兴，满怀希望，把老国王抬到他的妻子科娅身上；这样折腾了些日子，大家都清楚地看出她怀孕了，到时候生下了一个儿子。","tr":"p"},"c32-4":{"src":"c","ch":32,"pg":"p. 98","es":"Y Lloque Yupangue murió, mandando primero que la borla o corona del ynperio fuese puesta y depositada en el tenplo de Curicanche hasta que su hijo tuviese edad para reynar, al qual pusieron por nonbre Mayta Capa; y por governadores dizen que dexó a dos de sus hermanos, los nonbres de los quales no entendí.","zh":"略克·尤潘基去世了。他事先下令，把王穗即帝国的王冠存放在科里坎查神庙里，直到他的儿子长到可以统治的年纪；这个儿子起名叫迈塔·卡帕克；据说他留下两个兄弟摄政，他们的名字我没有弄清。","tr":"p"},"c32-5":{"src":"c","ch":32,"pg":"p. 98–99","es":"Muerto el Ynga Lloque Yupangue, fue llorado por todos los criados de su casa y en muchas partes de la çibdad, conforme a la çeguedad que tenían, se mataron muchas mugeres y muchachos con pensar que avían de yr a le servir al çielo, donde ya tenían por çierto que su ánima estava; y santificáronle por santo. Mandaron los mayores de la çibdad que fuese hecho bulto para sacar a las fiestas que se hizieren. Y çierto, grande es el preparamiento que se hazía para enterrar a uno destos reyes y generalmente en todas las provinçias le lloravan y en muchas dellas se tresquilavan la mugeres, çiniéndose sogas de esparto; y al cavo del año se hazían más lamentaçiones y sacrifiçios jentílicos, mucho más de lo que se puede pensar. Y esto los que se hallaron en el Cuzco el año de mill y quinientos y çinquenta verían lo que allí pasó sobre las onras de Paulo, quando le hizieron su cavo de año, que fue tanto que las más de las dueñas de la çibdad suvieron a su casa a lo ver; [y] yo me hallé presente y, çierto, era para consibir admiraçión. Y ase de entender que era aquello nada en conparaçión de lo pasado. Y diré agora de Mayta Capa.","zh":"印加略克·尤潘基死后，家中所有仆从都为他哭泣；按照他们的盲目信仰，城中许多地方有许多妇女和少年自尽，以为他们会到天上去服侍他——他们已经确信他的灵魂在那里；他们还把他奉为圣者。城中的长者下令为他做一尊像，以便在日后的节庆中抬出来。说实在的，安葬这样一位国王的排场十分浩大，各省普遍为他哭丧，许多省份的妇女剪去头发，腰系草绳；满一年时又举行更多的哀悼和异教献祭，远远超出人们的想象。1550年在库斯科的人，看到了当时为保罗举行周年祭的情形：场面之盛，城中大多数夫人都到他家去观看；我当时也在场，确实令人惊叹。而要知道，这与从前的相比根本算不了什么。下面我就讲迈塔·卡帕克。","tr":"p"},"c33-1":{"src":"c","ch":33,"pg":"p. 100","es":"Pasado pues lo que se a escrito, Mayta Capa se fue haziendo grande; el qual, después de aver hecho las çerimonias que se requerían, le fueron abiertas las orejas; y, siendo más honbre, en presençia de muchas jentes, así naturales como estranjeros, que para ello se juntaron, reçibió la corona o borla del ynperio; y porque no tenía hermana con quién casar, tomó por muger a una hija de un señorete o capitán del pueblo de Oma, questava en el Cuzco hasta dos leguas, la qual por nonbre avía Mamaca Guapata [sic].","zh":"前面所写的事过去之后，迈塔·卡帕克渐渐长大；他行过所需的仪式，耳朵被穿开；成年以后，在为此聚集的许多本地人和外乡人面前，接受了帝国的王冠即王穗。因为他没有姐妹可娶，便娶了离库斯科约两里格的奥马村一位小领主或统领的女儿，她名叫玛玛卡·瓜帕塔。","tr":"p"},"c33-2":{"src":"c","ch":33,"pg":"p. 100","es":"Hechas las vodas, estava un varrio çerca de la çibdad donde bivían un linaje de jente a quien llamavan Alcaviquiça, y éstos no avían querido tener amistad con los del Cuzco ninguna. Y estando llenos de sospechas unos de otros, dizen que, yendo a tomar agua una muger del Cuzco a çierta fuente que por allí estava, salió un muchacho del otro varrio y le quebró el cántaro y habló no sé qué palabras; la qual, dando gritos, bolvió al Cuzco. Y como estos yndios son tan alharaquientos, salieron luego con sus armas contra los otros, que tanvién avían tomado las suyas al ruydo que oyan, para ver en lo que parava el negoçio; y llegando el Ynga çerca con su jente se pusieron en horden de pelear, aviendo tomado por achaque cosa tan liviana como entre la yndia y [el] muchacho avía pasado, para querer sojuzgar los de aquel linaje o que la memoria dellos se perdiese.","zh":"婚礼办过以后，城附近有一个街区，住着一个被称为阿尔卡维萨的世系的人，他们一直不肯同库斯科人有任何友好往来。双方彼此满怀猜疑。据说，有一个库斯科妇女到那里的一处泉水去打水，另一个街区出来一个少年，打破了她的水罐，还说了些不知什么话；她哭喊着回到库斯科。这些印第安人本来就爱起哄，立刻拿起武器冲向对方；对方听到喧闹，也已拿起武器，要看看事情会怎样。印加带着他的人到了近前，双方摆开阵势要打。他们拿那妇人与少年之间这件小事做借口，其实是想征服那个世系的人，或者让他们从记忆中消失。","tr":"p"},"c33-3":{"src":"c","ch":33,"pg":"p. 100–101","es":"Y esto por los de Alcaviquiça bien era entendido; y como honbres de valor salieron a la batalla con gran denuedo, que fue la primera que se dio en aquellos tienpos; y pelearon gran rato así los unos como los otros, porque aviendo sido el caso tan súpito no avían podido allegar fabores ni buscar ayudas los de Alcaviquiça, los quales aunque mucho pelearon, fueron vençidos después de ser muertos todos los más, que casi no escaparon çinquenta con la vida. Y luego el rey Mayta Capa, tomando poseçión en los canpos y eredades de los muertos, usando de vençedor, lo repartió todo por los vezinos del Cuzco; y se hizieron grandes fiestas por la vitoria, yendo todos a sacrificar a los oráculos que tenían por sagrados.","zh":"阿尔卡维萨人对此心知肚明；他们作为勇敢的人，奋勇出战——这是那个时代打的第一仗；双方都打了很久，因为事情来得太突然，阿尔卡维萨人来不及纠集援手、寻求帮助。他们虽然奋战，但大部分人战死之后，还是被打败了，活着逃出来的几乎不到五十人。迈塔·卡帕克王随即以胜利者的身份占有死者的田地和产业，把它们全部分给库斯科的居民；人们为这场胜利大举庆祝，都到他们视为神圣的神谕所去献祭。","tr":"p"},"c33-4":{"src":"c","ch":33,"pg":"p. 101","es":"Deste Ynga no quentan los orejones más de que Mayta Capa reynó en el Cuzco algunos años; y estando allegando jente para salir a lo que llaman Condesuyo, le vino tal enfermedad que ovo de morir, dexando por su heredero al hijo mayor, llamado Capa Yupangue.","zh":"关于这位印加，大耳贵族讲的只有这些：迈塔·卡帕克在库斯科统治了若干年；他正在召集人马，准备出征他们称为孔德苏尤的地方时，得了一场病，不治而死，留下长子卡帕克·尤潘基为继承人。","tr":"p"},"c34-3":{"src":"c","ch":34,"pg":"p. 102–103","es":"Y en la provinçia de Condesuyo se avía entendido cómo al tienpo que el Ynga pasado murió estava determinado de les yr a dar guerra: avíanse aperçibido porque no los tomase descuydados; y dende a pocos días tuvieron tanbién notiçias de su muerte y de la salida que quería hazer Capa Yupangue, su hijo, a hazer sacrifiçios al serro de Guanacaure; y determinaron de venir a le dar guerra y cojer el despojo, si con la vitoria quedasen. Y así lo pusieron por obra y salieron de un pueblo questá en aquella comarca, a quien llaman Maxca, y así llegaron adonde ya era venido el Ynga, que siendo avisado de lo que pasava, estava a punto aguardando lo que viniese. Y sin se pasar muchos días, se juntaron unos con otros y se dieron batalla, la qual duró mucho espaçio y que todos pelearon animosamente; mas, al fin, los de Condesuyo fueron vençidos con muerte de muchos dellos. Y así el sacrefiçio se hizo con más alegría, matando algunos honbres y mugeres conforme a su çeguedad, y mucho ganado de ovejas y corderos, en las açaduras de los quales pronosticavan sus desvaríos y liviandades. Acavados estos sacrefiçios, el Ynga dio la buelta al Cuzco, adonde se hizieron grandes fiestas y alegrías por la vitoria que avían avido.","zh":"孔德苏尤省的人早已知道，前一位印加去世时正打算去攻打他们，所以早有防备，免得被他攻其不备；没过几天，他们又得知他已经死了，他的儿子卡帕克·尤潘基要出城到瓦纳考里山去献祭；于是决定前来攻打他，如果得胜，就夺取战利品。他们说干就干，从那一带一个叫马斯卡的村子出发，来到印加已经到达的地方；印加得到消息，早已准备停当，等着看来的是什么。没过几天，双方相遇交战，打了很久，人人奋勇；但最后孔德苏尤人被打败了，死了很多人。于是献祭办得更加欢喜，按他们的盲目信仰杀了一些男人和女人，还有大量的羊和羊羔，从它们的内脏里占卜他们那些荒唐轻妄的事。献祭完毕，印加回到库斯科，为所得的胜利举行了盛大的庆典和欢庆。","tr":"p"},"c34-4":{"src":"c","ch":34,"pg":"p. 103","es":"Los que escaparon de los enemigos, como mejor pudieron, fueron a parar a su provinçia, adonde de nuevo procuraron de allegar jente y buscar fabores, publicando que avían de morir o destruyr la çibdad del Cuzco, matando a todos los advenedizos que en ella estavan; y con mucha sobervia, ynflamados en yra, se davan prieça a recojer armas y, sin ver el tenplo de Curicancha, repartían entre ellos mismos las señoras que en él estavan. Y estando aparejados, se fueron la vía de Guanacaure para desde allí entrar en el Cuzco, donde avía aviso destos movimientos y Capa Yupangue avía juntado todos los comarcanos al Cuzco, sus aliados y confederados. Y con los orejones aguardó a los enemigos hasta que supo estar çerca del Cuzco, adonde fueron a encontrarse con ellos: y entre los unos y los otros se dio la vatalla, animando cada capitán a su jente. Mas, aunque los de Condesuyo pelearon hasta más no poder, fueron vençidos segunda vez con muerte de más de seys mill honbres dellos y los que escapa[ro]n bolvieron huyendo a sus tierras.","zh":"敌方逃脱的人，尽力逃回自己的省份，在那里又设法纠集人马、寻求援助，扬言要么战死，要么毁掉库斯科城，杀尽城里所有的外来者；他们满怀傲气、怒火中烧，急忙收集兵器；还没见到科里坎查神庙，就已经在自己人中间把庙里的贵妇分掉了。准备停当，他们取道瓦纳考里，打算从那里攻入库斯科；库斯科已经得到这些动静的消息，卡帕克·尤潘基召集了库斯科周围所有的人，即他的盟友和同盟者，同大耳贵族一起等待敌人，直到得知敌人已到库斯科附近，便出去迎击：双方交战，各统领都鼓舞自己的人。孔德苏尤人虽然拼尽全力，还是第二次被打败，死了六千多人，逃脱的人都逃回了自己的地方。","tr":"p"},"c34-5":{"src":"c","ch":34,"pg":"p. 103","es":"Capa Yupangue los fue siguiendo hasta su propia tierra, donde se les hizo la guerra de tal manera que vinieron a pedir paz, ofreçiendo de reconoçer al señor del Cuzco como lo hazían los otros pueblos que estavan en su amistad. Capa Yupangue los perdonó y se mostró muy alegre con todos, mandando a los suyos que no hiziesen daño ni robasen nada a los que ya tenían por amigos. Y en aquella comarca fueron luego buscadas algunas donzellas hermosas para llevar al tenplo del Sol questava en el Cuzco. Y Capa Yupangue anduvo algunos días por aquellas comarcas ynponiendo a los naturales dellas en que biviesen hordenadamente, sin tener sus pueblos por los altos y peñascos de nieves; y así fue hecho como él lo mandó y bolvióse a su çibdad, la qual se yva ennobleçiendo más cada día.","zh":"卡帕克·尤潘基一直追到他们自己的地方，在那里同他们打，打得他们只好来求和，表示愿意像其他同他友好的村子那样承认库斯科的领主。卡帕克·尤潘基赦免了他们，对大家都很和悦，命令自己的人不得伤害、不得抢夺已被视为朋友的人。随即在那一带挑选了一些美貌的少女，送往库斯科的太阳神庙。卡帕克·尤潘基在那些地方走了些日子，教导那里的本地人有秩序地生活，不要把村子建在高处和积雪的岩峰上；人们照他的命令做了，他也回到自己的城里，这座城一天比一天显赫。","tr":"p"},"c34-6":{"src":"c","ch":34,"pg":"p. 104","es":"Y se adornava el tenplo de Curicanche, y mandó hazer una casa para su morada, que era la mejor que hasta en aquel tienpo se avía hecho en el Cuzco. Y quentan que ovo en la Coya, su legítima muger, hijos que le çusedieron en el señorío. Y como ya se estendiese la fama por todas las provinçias comarcanas al Cuzco de la estada en ella de los Yngas y orejones y del tenplo que avían fundado y de quánta razón y buena orden avía en ellos y cómo andavan vestidos y adereçados, de todo esto se espantavan y la fama discurría por todas partes, dando pregones destas cosas.","zh":"科里坎查神庙也装饰起来，他又下令修一座宅邸给自己住，那是到那时为止库斯科修得最好的房子。据说他同他的合法妻子科娅生了几个儿子，后来继承了统治权。库斯科周围各省都已传开了诸印加和大耳贵族住在那里的名声，传开了他们所建的神庙，他们多么明理、多么有秩序，他们怎样穿着打扮；人们对这一切都感到惊奇，名声四处流传，到处宣扬这些事。","tr":"p"},"c34-7":{"src":"c","ch":34,"pg":"p. 104","es":"Y en aquellos tienpos [los] que tenían su señorío a la parte del Poniente de la çibdad del Cuzco y se estendía hasta donde agora es Andaguaylas, como lo oyesen, enbiaron a Capa Inga Yupangue sus enbaxadores con grandes dones y presentes, enbiándole a rogar los quisiese tener por amigos y confederados suyos; a lo qual respondió el Ynga mui bien, dándoles ricas pieças de oro y de plata que diesen a los que los enbiavan. Y haziéndoles buen tratamiento y ospedaje, estuvieron estos mensajeros algunos días en la çibdad, pareçiéndoles más lo que veyan que no lo que avían oydo; y así lo contaron en su tierra desque allá fueron bueltos.","zh":"那个时候，统治着库斯科城西面、一直到如今安达瓦伊拉斯一带的人，听说了这些，便派使者带着厚礼去见卡帕克·印加·尤潘基，请求他把他们当作朋友和盟友；印加回答得很好，给了他们一些贵重的金银器物，让他们带给派他们来的人。使者受到很好的款待，在城里住了些日子，觉得亲眼所见比所听说的还要好；回到本地以后，他们就照这样讲了。","tr":"p"},"c34-8":{"src":"c","ch":34,"pg":"p. 104","es":"Y algunos de los orejones del Cuzco afirman que la lengua general que se usó por todas las provinçias, que fue la que usavan y hablavan estos quichoas, los quales fueron tenidos por sus comarcanos por muy balientes hasta que los chancas los destruyeron. Aviendo pues el Ynga Capa muchos años, siendo ya muy viejo, murió. Y aviendo pasado los lloros y días de sus honras, su hijo fue reçibido sin contraste ninguno por rey del Cuzco, como su padre lo avía sido; el qual avía por nonbre Ynga Roque Ynga.","zh":"库斯科的一些大耳贵族肯定说，后来通行于各省的通用语，就是这些基丘亚人使用和说的语言；邻近的人一直认为基丘亚人非常勇敢，直到昌卡人把他们毁灭。印加·卡帕克活了很多年，年纪很老时去世了。哭丧和举哀的日子过后，他的儿子毫无异议地被接受为库斯科的国王，就像他父亲当年一样；他名叫印加·罗卡·印加。","tr":"p"},"c35-1":{"src":"c","ch":35,"pg":"p. 105–106","es":"Muerto por la manera que se a contado Cayocapac [sic], suçedió en el señorío Ynga Roque Ynga, su hijo, y para el tomar de la borla vinieron, como lo solían hazer, de muchas partes número grande de jente a se hallar presentes a ello; y fueron hechos grandes sacrefiçios en los oráculos y tenplos, conforme a su çeguedad. Y quentan estos yndios que al tienpo que le fueron rasgadas las orejas a este Ynga para poner en ellas aquel redondo que oy día tra[e]n los orejones, que le dolió mucho la una dellas, tanto que salió de la çibdad con esta fatiga y fue a un çerro questá çerca della muy alto, a quien llaman Chaca, adonde mandó a sus mugeres y a la Coya, su hermana Nicay Coca, la qual en vida de su padre avía reçibido por muger, que con él se estuviesen. Y quentan en este paso que çusedió un misterio fabuloso, el qual fue que como en aquel tienpo no corriese por la çibdad ni pasase ningún arroyo ni río, que no se tenía por pe[que]ña falta y neçesidad porque quando hazía calor se yvan a bañar por la redonda de la çibdad en los ríos que avía y aun sin calor se vañavan, y vañan los yndios, y para proveymiento de los moradores avía fuentes pequeñas, las que agora ay; y estando en este çerro el Ynga desviado algo de su jente, començó a hazer su oraçión al gran Tiçiviracocha y a Guanacaure y al Sol y a los Yngas, sus padres y abuelos, para que quisiesen declaralle cómo y por dónde podrían, a fuerças de manos de honbres, llevar algúnd río o açequia a la çibdad; y que estando en su oraçión, se oyó un trueno grande, tanto que espantó a todos los que allí estavan; y quel mismo Ynga, con el miedo que reçibió, abaxó la cabeça hasta poner la oreja ysquierda en el suelo, de la qual le corría mucha sangre; y que súpitamente oyó un gran ruydo de agua que por debaxo de aquel lugar yva; y que, visto el misterio, con mucha alegría mandó que viniesen muchos yndios de la çibdad, los quales con prieça grande cavaron por aquella sierra hasta que toparon con el golpe de agua, que aviendo abierto camino por las entrañas de la tierra, yva caminando sin dar provecho.","zh":"卡约卡帕克如前所述去世之后，他的儿子印加·罗卡·印加继承了统治权；为了他接受王穗，许多地方照例来了大批的人到场观礼；按照他们的盲目信仰，在各神谕所和神庙里举行了盛大的献祭。这些印第安人说，这位印加被割开耳朵、戴上大耳贵族至今还戴的那种圆形耳饰时，有一只耳朵疼得厉害，疼得他带着这份痛苦出了城，到城附近一座很高、名叫查卡的山上去，命他的妻妾和科娅——他的姐妹尼凯·科卡，他父亲在世时他就娶了她——同他一起待在那里。他们说，这时发生了一桩神奇的怪事：那时城里没有任何溪流或河流经过，这可不是小小的缺憾，因为天热时，他们要到城周围的河里去洗澡，即使不热也去洗——印第安人至今还常洗澡；城中居民用水，靠的是几处小泉，就是现在还有的那几处。印加在这座山上，离他的人稍远一些，开始向伟大的蒂西维拉科查、向瓦纳考里、向太阳、向他的父辈祖辈诸印加祈祷，求他们指示：怎样、从哪里可以凭人力把一条河或一道水渠引进城里。正祈祷时，响起一声巨雷，把在场的人都吓坏了；印加本人受了惊吓，低下头去，左耳贴到了地上，耳中流出很多血；他忽然听见那地方底下有很大的水声；见了这桩神奇的事，他十分高兴，命城里许多印第安人前来，他们急急忙忙地在那山上挖掘，一直挖到那股水流——它在大地腹中开出了一条路，白白地流着，毫无用处。","tr":"p"},"c35-2":{"src":"c","ch":35,"pg":"p. 106","es":"E prosiguiendo con este quento, dizen más que después que mucho ovieron cavado y visto el ojo de agua, hizieron grandes sacrefiçios a sus dioses, creyendo que por virtud de su deydad aquel benefiçio les avía venido; y que con mucha alegría se dieron tal maña que llevaron el agua por mitad de la çibdad, aviendo primero enlosado el suelo con losas grandes, sacando con çimientos fuertes unas paredes de biva piedra por una parte y por otra del río; y para pasar por ellas, se hizieron a trechos algunas puentes de piedra.","zh":"接着讲这个故事。他们还说，挖了很久、看见了泉眼以后，他们向自己的神大举献祭，相信这份恩惠是凭着神力降给他们的；他们满心欢喜，想方设法把水引到城中央，事先用大石板铺了河底，河的两边用坚固的地基砌起天然石墙；为了过河，每隔一段修了几座石桥。","tr":"p"},"c35-3":{"src":"c","ch":35,"pg":"p. 106","es":"Este río yo lo e visto y es verdad que corre de la manera que quentan, viniendo el naçimiento de hazia aquella sierra. Lo demás no sé lo ques, más de escrevir lo que sobre ello quentan; y bien podría yr algúnd ojo de agua metido en la misma tierra sin ser visto y oído el ruydo del agua echallo por la çibdad, como agora lo vemos; porque en muchas partes deste gran reyno van o corren ríos grandes y pequeños por debaxo de tierra, como ternán notiçia los que por los llanos y sierra dél uvieren andado. En este tienpo muladares grandes ay por la orilla deste río, lleno de ynmundiçias y bescozidades, lo que no estava en tienpo de los Yngas, sino muy linpio, corriendo el agua por ensima de las losas dichas; y algunas vezes se yvan a lavar los Yngas con sus mugeres; y en diverças vezes an algunos españoles hallado cantidad de oro, no puro sino en joy[i]tas menudas e de sus topos que dexavan o se les cayan quando se vañavan.","zh":"这条河我见过，确实像他们讲的那样流，源头在那座山的方向。其余的事，我不知道是怎么回事，只是把他们关于这件事所讲的写下来；很可能有一股泉水藏在地里，没有人看见，听到了水声，就把它引过城来，就像我们现在看到的那样；因为在这个大王国的许多地方，都有大大小小的河在地底下流，走过这里的平原和山地的人都会知道。如今这条河的岸边有大垃圾堆，满是污物和秽物，印加时代可不是这样，那时很干净，水从上面说的那些石板上流过；印加们有时带着妻子去河里洗澡；好几次，有些西班牙人在河里找到不少金子，不是纯金，而是她们洗澡时留下或掉落的小首饰和托波。","tr":"p"},"c35-4":{"src":"c","ch":35,"pg":"p. 106–107","es":"Después de pasado esto, Ynga Roque salió —a lo que dizen— del Cuzco a hazer sacrifiçios, procurando con grandes mañas y buenas palabras atraer a su amistad las jentes que más podía; y salió y fue hacia lo que llaman Condesuyo, adonde, en [el] lugar que llaman Pomatanbo, tuvo una batalla con los naturales de aquellas comarcas, de la qual quedó por vençedor y por señor de todos; porque, perdonándolos con mucha liveralidad y comunicando con ellos sus cosas grandes, le tomaron amor y se ofreçieron a su serviçio, obligándose de le acudir con tributos. Después de aver estado algunos días en Condesuyo y visitado los oráculos y tenplos que ay por aquellas tierras, se bolvió vitorioso al Cuzco, yendo delante dél yndios prençipales guardando su persona con hachas y alavardas de oro.","zh":"这件事以后，据说印加·罗卡出了库斯科去献祭，用种种高明的手段和好话，尽可能把各地的人争取为朋友；他出发往他们称为孔德苏尤的地方去，在一个叫波马坦博的地方同那一带的本地人打了一仗，获胜，成了他们所有人的领主；因为他十分宽厚地赦免了他们，又同他们谈论他的种种大事，他们便爱戴他，自愿为他效力，答应向他纳贡。他在孔德苏尤待了些日子，拜访了那一带的神谕所和神庙，然后凯旋回到库斯科，前面有头人手持金斧、金戟护卫着他。","tr":"p"},"c35-5":{"src":"c","ch":35,"pg":"p. 107","es":"Tuvo este Ynga muchos hijos y no hija ninguna; y aviendo hordenado y mandado algunas cosas grandes e de ynportançia para la governaçión murió, aviendo primero casado a su primogénito, que por nonbre avía Ynga Yupangue con una señora natural de Ayarmaca [sic], a quien nonbravan Mama Chiquia.","zh":"这位印加有许多儿子，没有一个女儿；他为治理国家规定、吩咐了一些重大而要紧的事，然后去世了；死前先为他的长子——名叫印加·尤潘基——娶了一位出身阿亚尔马卡的贵妇，名叫玛玛·奇基亚。","tr":"p"},"c36-1":{"src":"c","ch":36,"pg":"p. 108","es":"Muerto que fue Ynga Roque acudieron de Condesuyo, de Urcos, de Ayarmaca [sic], de las otras partes con quien avían asentado aliança y amistad mucha jente, así honbres como mugeres, y fueron hechos grandes llantos para el rey difunto; y muchas mugeres de las que en bida le amaron y sirvieron, conforme a la çegueda[d] general de los yndios, de sus mismos cavellos se ahorcaron y otras se mataron por otros modos para de presto enbiar sus ánimas a servir a la de Ynga Roque; y en la sepoltura, que fue magnífica y sontuosa, echaron grandes tesoros y mayor cantidad de mugeres y servientes con mantenimientos y ropa fina.","zh":"印加·罗卡死后，孔德苏尤、乌尔科斯、阿亚尔马卡以及其他同他们结了盟、交了好的地方，来了许多人，有男有女，为死去的国王大声哭丧；他生前爱过、侍奉过他的许多女人，按照印第安人普遍的盲目信仰，用自己的头发上吊，另一些用别的办法自尽，好让自己的灵魂赶快去侍奉印加·罗卡的灵魂；他的坟墓宏伟华丽，里面放进了大量财宝，还有更多的女人和仆从，连同给养和精美的衣物。","tr":"p"},"c36-2":{"src":"c","ch":36,"pg":"p. 108","es":"Ninguna sepoltura destos reyes se a hallado; y para que se conozca si serían ricas o no, no es menester más prueva de que, pues se hallavan en sepolturas comunes a sesenta mill pesos de oro y más y menos, ¿qué sería lo que ternían las que metían estos que tanto deste metal poseyeron y que tenían por cosa ynportantísima salir deste siglo ricos y adornados?","zh":"这些国王的坟墓一座也没有找到；它们是否富有，不必另找证据：既然在普通的坟墓里都能找到六万比索上下的金子，那么这些拥有如此多黄金、把富富足足、装扮停当地离开人世看得极其要紧的人，他们放进坟里的东西又会有多少呢？","tr":"p"},"c36-3":{"src":"c","ch":36,"pg":"p. 108","es":"Asimismo le fue hecho bulto a Ynga Roque, contándolo por uno de sus dioses, creyendo que ya descançava en el çielo.","zh":"人们也为印加·罗卡造了像，把他算作他们的神之一，相信他已经在天上安息。","tr":"p"},"c36-4":{"src":"c","ch":36,"pg":"p. 108–109","es":"Pasados los lloros y hechas las oçequias, el nuevo Ynga se ençerró a hazer el ayuno; y porque con su ausençia no recreçiese alguna çediçión o levantamiento de pueblo, mandó que uno de los más prençipales de su linaje estuviese en público representando su misma persona, al qual dio poder para que pudiese castigar a quien hiziese por qué, y tener la çibdad en todo soçiego y paz hasta quél saliese con la ynsinia real de la borla. Y este Ynga dizen que tienen por notiçia que fue de jentil presençia, grave y de autoridad; el qual entró en lo más secreto de sus palaçios, adonde hizo el ayuno metiéndole a tienpos el mayz con lo que más comía; se estava sin tener ayuntamiento carnal a muger ninguna. Acavado, salió luego, mostrando con su vista las jentes gran contento y se hizieron sus fiestas y sacrefiçios grandes. Y pasadas las fiestas, mandó el Ynga que se traxese de todas partes cantidad de oro y plata para el tenplo del Sol; y se hizo en el Cuzco la piedra que llamavan de la guerra, grande y bien engastonada en oro y piedras.","zh":"哭丧过去、葬仪办完以后，新印加闭门斋戒；为了防止他不在时有人作乱或起事，他命令本宗族一位最显要的人在公众面前代表他本人，给他权力，谁有过错就可以惩罚谁，使全城安宁太平，直到他戴着王权的标志王穗出来。据说，他们所知道的这位印加仪表堂堂，庄重而有威严；他进到宫殿最深处去斋戒，按时给他送进玉米和他常吃的东西；斋戒期间他不同任何女人亲近。斋戒完毕，他随即出来，人们见了他，都十分欢喜，举行了节庆和盛大的献祭。节庆过后，印加下令从各地运来大量金银，供太阳神庙之用；库斯科还造了一块他们称为“战争之石”的石头，很大，用金子和宝石镶嵌得很好。","tr":"p"},"c38-1":{"src":"c","ch":38,"pg":"p. 112","es":"Pasado lo que se contó conforme a la relaçión que los orejones del Cuzco dan destas cosas, dizen más que, como se oviesen hecho grandes lloros por las muertes del Ynga, se trató entre los prençipales de la çibdad quién sería llamado rey y mereçía tener la tal dinidad. Sobre esto avía diversas opiniones porque tales ovo que querían que no tuviesen rey, sino que governasen la çibdad los que señalasen, otros dezían que se perdería sin tener cabeça.","zh":"按库斯科大耳贵族对这些事的叙述，前面讲的事过去之后，他们还说，为印加之死大哭了一场以后，城中头人们商议该立谁为王、谁配有这样的尊位。这件事上意见纷纭：有人主张不要国王，由选定的人治理城市；另一些人说，没有首领，城就完了。","tr":"p"},"c38-2":{"src":"c","ch":38,"pg":"p. 112–113","es":"Sobre estas cosas avía gran ruydo; y temiendo su porfía se quenta que salió una muger de travez de los Hanancuzcos, la qual dixo: \"¿En qué estáys ay?, ¿por qué no tomáys a Viracocha Ynga por señor, pues lo mereçe tanbién?\" Oyda esta palabra, como son tan determinable[s] estas jentes, dexando los vasos del vino, a gran prieça fueron por Viracocha Ynga, sobrino de Ynga Yupangue, diziéndose —como le vieron— que ayunase lo acostunbrado y reçibiese la borla que darle querían. Viniendo Viracocha Ynga en ello, se entró a hazer el ayuno; encargó la çibdad a Ynga Roque, Ynga pariente suyo, y salió al tienpo con la corona muy adornado, y se hizieron fiestas solenes en el Cuzco y que muchos días duraron, mostrando todos gran contento con la eleçión del nuevo Ynga. Del qual algunos quisieron dezir queste Ynga se llamó Viracocha por venir de otras partes y que traya traje diferençiado y que en las fayçiones y aspeto mos[tró] ser como un español porque traya varbas. Quentan otras cosas que me cansaría si las oviese de escrevir. Yo lo pregunté en el Cuzco a Cayo Topa Yupangue y a los otros más prençipales que en el Cuzco me dieron la relaçión de los Yngas que yo voy escriviendo y me respondieron ser bulra y que nada es verdad, porque Viracocha Ynga fue naçido en el Cuzco y criado y que lo mismo fueron sus padres y abuelos y que el nonbre de Viracocha se lo pusieron por nonbre particular, como lo tiene cada uno.","zh":"为这些事吵得很凶；据说，正担心他们争执不下的时候，一个哈南库斯科的妇人从旁走出来，说：“你们还在那里磨蹭什么？为什么不奉维拉科查·印加为领主？他也配。”听了这话——这些人向来说定就定——他们放下酒杯，急忙去找印加·尤潘基的侄子维拉科查·印加，一见到他，就叫他照惯例斋戒，接受他们要给他的王穗。维拉科查·印加答应了，便进去斋戒；他把城托付给他的一位亲属、印加·罗卡，到时候戴着王冠、盛装出来；库斯科举行了隆重的节庆，持续了许多天，大家都对新印加的选立十分满意。关于这位印加，有人想说他叫维拉科查，是因为他从别处来，穿着不同的衣服，五官相貌像个西班牙人，因为他留着胡子。他们还讲了别的事，要是都写下来，我会写得厌烦。我在库斯科问过卡尤·图帕克·尤潘基和其他最显要的人——我正在写的印加诸王的事，就是他们在库斯科讲给我的——他们回答说这是笑话，全不是真的，因为维拉科查·印加生在库斯科、长在库斯科，他的父辈祖辈也是如此；维拉科查这个名字是给他起的个人名字，就像人人都有自己的名字一样。","tr":"p"},"c38-3":{"src":"c","ch":38,"pg":"p. 113","es":"Y como le fue entregada la corona, se casó con una señora prençipal llamada Rondo Caya, muy hermosa. E como la fiesta del regozijo oviese pasado, determinó de salir a conquistar algunos pueblos de la redonda del Cuzco que no avían querido el amistad de los Yngas pasados, confiados en la fuerça de sus pucaraes; y con la jente que quiso juntar, salió del Cuzco en sus ricas andas con guarda de los más prençipales y endereçó su camino a lo que llamavan Calca, donde avían sido reçibidos sus mensajeros con mucha sovervia; mas, como supieron [que] los del Cuzco ya estavan çerca dellos, se juntaron armándose de sus armas, se ponían por los altos de los collados en sus fuerças y albarradas, de donde desgalgavan grandes piedras encaminadas a los reales del Ynga para que matasen [a] los que alcançasen. El qual, como viese que hazían algún daño, mandó a sus capitanes que subiesen a lo alto con la jente convenible y desbaratasen a los enemigos; poniéndolo por obra, subieron por la sierra y a pesar de los contrarios pudieron ganarles una de aquellas fuerças. Como los de Calca vieron los del Cuzco en sus fuerças, saliero[n] a una gran plaça adonde pelearon con ellos reziamente: y duró la batalla desde por la mañana hasta mediodía y murieron muchos de entranbas partes y fueron más los presos. La vitoria quedó por los del Cuzco.","zh":"他接受王冠以后，娶了一位名叫龙多卡亚的贵妇，非常美丽。欢庆的节日过后，他决定出征库斯科周围的一些村子，那些村子仗着自己的普卡拉坚固，一直不肯同前几代印加交好；他带着他想召集的人马，坐着华丽的肩舆，由最显要的人护卫着出了库斯科，取道他们称为卡尔卡的地方——他的使者在那里受到了极其傲慢的对待；可是卡尔卡人得知库斯科人已经逼近，便聚在一起，拿起武器，守在山冈高处的堡垒和石垒里，从那里朝印加的营地滚下大石头，想砸死碰上的人。印加见他们造成了一些伤亡，便命他的统领们带足人马登上高处，打垮敌人；他们照办，沿山而上，不顾敌人抵抗，夺下了其中一座堡垒。卡尔卡人见库斯科人占了他们的堡垒，便出来到一个大广场上，同他们激烈交战：仗从早上打到中午，双方都死了很多人，被俘的更多。胜利归于库斯科人。","tr":"p"},"c38-4":{"src":"c","ch":38,"pg":"p. 113–114","es":"El Ynga estava junto a un río, donde tenía asentados sus reales, y como supo la vitoria mostró mucha alegría; y en esto, sus capitanes avaxavan con la presa y cativos. Los yndios que avían escapado de la vatalla con otros naturales de Calca y de sus comarcas, mirando que, pues que tan mal les avía quadrado el pensamiento, que el final remedio que les quedava era tentar la fe del vençedor y pedille paz con obligarse a servidunbre moderada, como otros muchos hazían; y así acordado, salieron por una parte de la sierra diziendo a bozes grandes: \"Biva, para sienpre biva el poderoso Ynga Viracocha, nuestro señor\". Oydo pues el ruydo que hazía el resonante de las bozes, se pusieron en armas los del Cuzco; mas no pasó mucho tienpo quando ya los vençidos estavan prostados [sic] por tierra delante de Viracocha Ynga, adonde, sin levantar, uno de los que entre ellos se tenía por más sabio, alçando la boz, començó a dezir: \"Ni te deves, Ynga, ensoberbeçer con la vitoria que Dios te a dado, ni tener en poco a nosotros por ser vençidos, pues a ti y a los Yngas es prometido señorear las jentes y a nosotros nos es dado con todas nuestras fuerças defender la libertad que de nuestros padres heredamos y, quando con ello salir no pudiéremos, obedeçer y reçibir con buen ánimo la sujeçión. Por tanto, manda que ya no muera más jente ni se haga daño y dispone de nosotros conforme a tu boluntad\". E como el yndio prençipal ovo dicho estas palabras, los demás que allí estavan dieron aullidos grandes, pidiendo misericordia.","zh":"印加在一条河边扎营，得知胜利，十分高兴；这时他的统领们正带着战利品和俘虏下山来。从战场上逃脱的印第安人，同卡尔卡和附近的其他本地人一起，想到他们的打算既然落得这样糟，剩下的最后办法只有试试胜利者的信义，向他求和，答应适度地服役，就像许多别的人那样；商定以后，他们从山的一边出来，高声喊道：“万岁，强大的维拉科查·印加，我们的领主，永远万岁！”库斯科人听到这一片回响的喊声，都拿起了武器；但没过多久，战败的人已经趴在维拉科查·印加面前的地上，没有起身，其中一个被他们认为最有见识的人，提高声音说道：“印加，你不必因为神给你的胜利而骄傲，也不必因为我们打败了就看轻我们；因为统治众人是许给你和印加们的，而给我们的，是竭尽全力保卫从父辈那里继承来的自由；做不到的时候，就服从，心平气和地接受臣服。所以，请下令不要再死人、不要再造成损害，随你的意思处置我们吧。”这位头人说完这些话，在场的其他人都大声哀号，乞求怜悯。","tr":"p"},"c38-5":{"src":"c","ch":38,"pg":"p. 114","es":"El rey Ynga respondió que si daño venido les avía, que suya avía sido la culpa, pues al prençipio no quisieron creer sus palabras ni tener su amistad, de que a él avía pesado; e liveralmente les otorgó que pudiesen estar en su tierra poseyendo, como primero, sus haziendas, con tanto que a tienpos y conforme a las leyes, trivutasen de lo que oviese en sus pueblos al Cuzco; y que dellos mismos fuesen luego a la çibdad y le hiziesen dos palaçios: uno dentro en ella y otro en Çaqui[xahuana], para se salir a recrear. Respondieron que lo harían y el Ynga mandó soltar los cativos sin que uno tan sólo faltase y restituyr sus haziendas a los que ya tenían por sus confederados. Y para que entendiesen lo que avían de hazer y entre ellos no oviese disençiones, mandó quedar un delegado suyo con poder grande, sin quitar el señorío al señor natural.","zh":"印加王回答说，他们遭了损害，是他们自己的过错，因为他们起初不肯相信他的话、不肯同他交好，这让他很难过；他宽厚地准许他们照旧住在自己的地方、保有自己的产业，只要按时、按法律把村里所产的东西向库斯科纳贡；并要他们立即派人到城里去，给他修两座宫殿：一座在城内，一座在哈基哈瓦纳，供他出去游乐。他们答应照办，印加下令释放俘虏，一个不少，并把产业归还给这些已被视为同盟的人。为了让他们明白该做什么，彼此之间不起纷争，他留下一位握有大权的代表，但不夺天然领主的统治权。","tr":"p"},"c38-6":{"src":"c","ch":38,"pg":"p. 114–115","es":"Pasado lo que se a escrito, Ynga Viracocha enbió un mensajero a llamar a los de Caytomarca, que estavan de la otra parte de un río hechos fuertes, sin jamás aver querido tener amistad con los Yngas que avía avido en el Cuzco; y como llegó el mensajero de Viracocha Ynga, le maltrataron de palabra, llamando al Ynga loco, pues ansy creya que ligeramente se avían de someter a su señorío.","zh":"上面写的事过去以后，印加·维拉科查派一个使者去召凯托马尔卡人；他们在一条河的对岸据险而守，从来不肯同库斯科历代的印加交好；维拉科查·印加的使者一到，他们就出言辱骂他，说印加是疯子，竟以为他们会这样轻易地臣服于他的统治。","tr":"p"},"c4-1":{"src":"c","ch":4,"pg":"p. 6","es":"Muchas vezes pregunté a los moradores destas provinçias lo que sabían que en ellas ovo antes que los Yngas los señoreasen; y sobre esto dizen que todos bivían desordenadamente y que muchos andavan desnudos, hechos salvajes, sin tener casas ni otras moradas que cuevas de las muchas que vemos aver en riscos grandes y peñascos de donde salían a comer de lo que hallavan por los canpos. Otros hazían en los serros castillos que llaman \"pucarais\", desde donde, aullando con lenguas estrañas, salían a pelear unos con otros sobre las tierras de lavor o por otras causas y se matavan muchos dellos, tomando el despojo que hallavan e las mugeres de los vençidos; con todo lo qual, yvan trufando [sic] a lo alto de los çerros donde tenían sus castillos y allí hazían sus sacrefiçios a los dioses en quienes ellos adoravan, derramando delante de las piedras e ydolos mucha sangre umana y de corderos. Todos ellos heran behetrías sin horden, porque çierto dizen no tener señores ni más que capitanes con los quales salían a las guerras. Si algunos andavan vestidos, heran las ropas pequeñas y no como agora las tienen. Los llautos y cordones que se ponen en las cabeças para ser conoçidos unos entre otros, dizen que los tenían como agora los usan.","zh":"我曾多次询问这些省份的居民，在印加人统治他们之前，这里有过什么。他们说，那时人人过着没有秩序的生活，许多人赤身裸体，形同野人，没有房屋，也没有别的住处，只住洞穴——我们在大岩壁和巉岩上见到的许多洞穴就是——从洞里出来，吃在野外找到的东西。另一些人在山上筑起称为“普卡拉”的堡垒，从那里出来，用奇怪的语言嚎叫着，为了耕地或别的缘故互相攻打，死者很多；他们抢走能找到的财物和战败者的妇女，带着这些得意洋洋地回到山顶的堡垒，在那里向他们所崇拜的神献祭，在石头和偶像前洒下大量人血和羊羔血。他们全都是没有秩序的无主之民，因为据说他们确实没有领主，只有带他们出去打仗的统领。即便有人穿衣服，衣服也很短小，不像现在这样。至于戴在头上、用来彼此辨认的头带和绳带，据说那时就和现在戴的一样。","tr":"p"},"c4-2":{"src":"c","ch":4,"pg":"p. 6–7","es":"Y estando estas jentes desta manera, se levantó en la provinçia de Collao un señor valentísimo llamado Çapana, el qual pudo tanto que metió debaxo de su señorío muchas jentes de aquella provinçia. Y quentan otra cosa, la qual si es çierta o no sábelo el altísimo Dios, que entiende todas las cosas, porque yo [de] lo que voy contando no tengo otros testimonios ni libros que los dichos destos yndios. Y lo que quiero contar es que afirman por muy çierto que después que se levantó en Hatuncollao aquel capitán o tirano poderoso, en la provinçia de los Canas, questá entre medias de los Canchez [sic] e Collao, çerca del pueblo llamado Chungara se mostraron una mugeres como si fueran honbres esforçados, [que] tomando las armas conpelían a los questavan en la comarca de donde ellas moravan; y quéstas, casi al uso de lo que quentan de las Amazonas, bivían con sus maridos, haziendo pueblos por sí; las quales, después de aver durado algunos años y hecho algunos hechos famosos, vinieron a contender con Çapana, el que se avía hecho señor de Hatuncollao y por defenderse de su poder, que era grande, hizieron fuerças y alvarradas, que oy biven, para defenderse, y que después de aver hecho hasta lo último de potençia fueron muertas y presas y su nonbre se lo ovo desecho.","zh":"这些人正处在这种状态时，科亚奥省出了一位极其勇武的领主，名叫萨帕纳，势力大到把那个省的许多人都收归自己统治。他们还讲了另一件事，是真是假，只有洞悉万事的至高上帝知道，因为我讲的这些，除了这些印第安人的说法以外，没有别的证据，也没有书籍可查。我要讲的是：他们十分肯定地说，那位强大的统领或僭主在阿通科亚奥兴起之后，在卡纳人的省份——位于坎奇人和科亚奥之间——琼加拉村附近，出现了一些妇女，像勇猛的男子一样拿起武器，制服了她们居住地一带的人；她们几乎像传说中的亚马逊女战士那样，同丈夫一起生活，自成村落。她们存续了若干年，做过一些出名的事，后来同已成为阿通科亚奥领主的萨帕纳相争；为了抵御他的强大势力，她们修筑了工事和土墙，至今犹存；最后她们竭尽全力，还是被杀被擒，她们的名号也就此消亡。","tr":"p"},"c40-1":{"src":"c","ch":40,"pg":"p. 118","es":"De todas las cosas que a Viracocha suçedían yvan al Cuzco las nuevas; y como en la çibdad se contase la guerra que tenía con los de Caytomarca, dizen que se levantó un tirano, hermano de Ynga Yupangue, el pasado, el qual aviendo estado muy sentido porque el señorío y mando de la çibdad se avía dado a Viracocha Ynga y no a él y aguardava tienpo oportuno para procurar de aver el señorío. Y este pensamiento tenía éste porque hallava fabor en algunos de los orejones y prençipales del Cuzco del linaje de los Orencuzcos; y con la nueva desta guerra que el Ynga tenía, pareçiéndoles que ternía harto que hazer en la feneçer, animavan a este que digo para que, sin más aguardar, matase al que en la çibdad por governador avía quedado para se apoderar della.","zh":"维拉科查遇到的一切事，消息都传到库斯科；城里正讲着他同凯托马尔卡人打仗的事，据说这时出了一个僭主，是前一位印加·尤潘基的兄弟；统治权和城中的号令给了维拉科查·印加而没有给他，他一直耿耿于怀，等待时机设法夺取统治权。他之所以有这个念头，是因为他在库斯科一些属于乌林库斯科世系的大耳贵族和头人中间得到支持；这些人听说印加正在打这场仗，以为他要了结这场仗有得忙，便怂恿我说的这个人不要再等，杀掉留在城里的长官，夺取这座城。","tr":"p"},"c40-2":{"src":"c","ch":40,"pg":"p. 118–119","es":"Capac, que así avía por nonbre, codiçioso del señorío, juntados sus aliados, en un día questavan en el tenplo del Sol todos los más de los orejones y entre ellos Ynga Roque, el governador del Ynga Viracocha, tomando las armas, publicando livertad del pueblo y que Viracoche Ynga no pudo aver el señorío, arremetieron para [el] lugarteniente e le mataron así a él como a otros muchos, la sangre de los quales regava los altares donde estavan las aras e santuarios y la figura del Sol. Las mamaconas con los çaçerdotes salieron con gran ruydo, maldiziendo a los matadores, diziendo que tan gran pecado gran castigo mereçía. De la çibdad acudió gran golpe de jente a ver lo que hera; y entendido, unos aprovando lo hecho, se juntaron con Capac; otros pesándole, se pusieron en armas sin querer pasar por ello; y así, aviendo división cayan muchos muertos de una parte y otra. La çibdad se alvorotó en tanta manera que, recundiendo por los ayres el sonido de sus propias vozes, no se oyan ni entendían. En esto, prevaleçiendo el tirano, se apoderó de la çibdad, matando a todas las mugeres del Ynga, aunque las más prençipales avían ydo con él. Huyéronse de la çibdad algunos, los quales fueron a parar adonde Viracoche Ynga estava; y como por él fue entendido, disimulando el pesar que sintió, mandó a sus jentes que caminasen la vía del Cuzco.","zh":"这个人名叫卡帕克，贪图统治权，他纠集了他的同党，趁大多数大耳贵族都在太阳神庙里的一天——其中有维拉科查·印加的长官印加·罗卡——拿起武器，宣布人民自由，说维拉科查·印加不能享有统治权，冲向那位代理者，把他和其他许多人都杀了，他们的血洒满了供奉祭坛、圣物和太阳像的地方。玛玛科纳和祭司们大声喧嚷着出来，诅咒杀人者，说这样的大罪应受大罚。城里涌来大批人看出了什么事；明白以后，有的赞成这件事，就同卡帕克合在一起；有的心中不平，拿起武器，不肯认可；于是分成两派，双方都死了许多人。全城骚乱到这种地步：他们自己的喊声在空中回荡，彼此都听不见、听不明白。这时僭主占了上风，夺取了城，杀死了印加所有的妻妾，不过最显要的几位已经随他走了。有些人逃出城去，逃到维拉科查·印加那里；他知道以后，掩饰住心中的悲痛，命他的人取道库斯科。","tr":"p"},"c40-3":{"src":"c","ch":40,"pg":"p. 119","es":"Pues bolviendo a Capac el tirano, como ovo tomado la çibdad en sí, quiso salir en público con la borla para por todos ser tenido por rey; mas como el primer ynpetu fue pasado y aquel furor con que los honbres, saliendo de su entero juyzio acometen grandes maldades, los mesmos que le ynçitaron a que se levantase, riéndose de que quisiese la dinidad real, le ynjuriaron de palabra y le desanpararon, saliendo a encontrarse con el verdadero señor, a quien pidieron perdón por lo que avían cometido. A Capac no le faltava ánimo para llevar el negoçio adelante; mas, viendo la poca parte que era, muy turvado por la mudança tan súpita, maldezía a los que le avían engañado y a sí propio por fiarse dellos; y por no ver con sus ojos al rey Ynga, castigó el mismo su hierro tomando ponçoña, [de que] quentan que murió. Sus mugeres e hijos con otros parientes le ymitaron en la muerte.","zh":"再说僭主卡帕克。他把城夺到手以后，想戴着王穗公开出来，让众人都奉他为王；可是第一阵冲动过去，那股使人失去理智、犯下大恶的狂怒消退以后，当初撺掇他起事的那些人，反倒笑他想要王位，出言辱骂他，丢下了他，出去迎接真正的领主，请他宽恕他们所犯的罪。卡帕克并不缺乏把事情干下去的勇气；可是他见自己势单力薄，又被这突如其来的变故弄得心慌意乱，便诅咒那些欺骗了他的人，也诅咒自己轻信了他们；为了不必亲眼见到印加王，他自己惩罚了自己的过错，服了毒，据说就这样死了。他的妻子儿女和其他亲属也学他一同死了。","tr":"p"},"c40-4":{"src":"c","ch":40,"pg":"p. 119","es":"La nueva de todo esto yva a los reales del Ynga, el qual como llegase a la çibdad y entrase en ella, fue derecho al tenplo del Sol a hazer sacrifiçios. Los cuerpos de Capac y de los otros que se avían muerto mandó que fuesen echados en los canpos para ser manjar de las aves; y buscados los participantes en la trayçión, fueron condenados a muerte. Entendido por los confederados y amigos de Viracoche Ynga lo çusedido, le enbiaron muchas enbaxadas con grandes presentes y ofreçimientos, congratulándose con él; y a estas enbaxadas respondió alegremente.","zh":"这一切的消息都传到印加的营中；他到了城里，一进城就直奔太阳神庙去献祭。他下令把卡帕克和其他自尽者的尸体扔到野外，给鸟吃；参与叛逆的人被搜捕出来，判了死刑。维拉科查·印加的同盟和朋友得知发生的事，派来许多使团，带着厚礼和效忠的表示，向他道贺；他高兴地答复了这些使团。","tr":"p"},"c40-5":{"src":"c","ch":40,"pg":"p. 119–120","es":"En este tienpo dizen los orejones que avía en el tenplo del Sol muchas señoras vírgines, las quales eran muy onradas y estimadas y no entendían en más de lo por mí dicho en muchas partes desta ystoria. Y quentan que quatro dellas usavan feamente de sus cuerpos con çiertos porteros de los que guardavan; y siendo sentidas, fueron presas y lo mismo los adult[era]dores, y el saçerdote mayor mando que fuesen justiçiadas ellas y ellos.","zh":"大耳贵族说，这时太阳神庙里有许多贵族处女，她们极受尊重和敬重，只做我在这部历史中多处说过的那些事。据说其中四个同一些看守神庙的门卫私通；事情被发觉，她们被抓了起来，那些奸夫也一样，大祭司下令把她们和他们都处死。","tr":"p"},"c40-6":{"src":"c","ch":40,"pg":"p. 120","es":"El Ynga estava con determinaçión de yr a lo de Condesuyo; mas, hallándose cançado y viejo, lo dexó por entonçes, mandando que le fuesen hechos en el valle de Xaquixaguana unos palaçios para salirse a recrear a ellos. Y como tuviese muchos hijos y conoçiese que el mayor dellos, que avía por nonbre Ynga Urco, en quien avía de quedar el mando del reyno, e conoçiese que tenía malas costunbres y era viçioso y muy cobarde, deseava privarle del señorío para lo dar a otro más mançevo, que por nonbre avía Ynga Yupangue.","zh":"印加本来决定要去孔德苏尤；可是他觉得自己又累又老，就暂且作罢，命人在哈基哈瓦纳谷给他修几座宫殿，好到那里去游乐。他有许多儿子，知道长子印加·乌尔科——国家的统治本该留给他——习气不好、放纵而且非常怯懦，就想剥夺他的统治权，交给另一个更年轻的儿子，名叫印加·尤潘基。","tr":"p"},"c6-1":{"src":"c","ch":6,"pg":"p. 13","es":"Ya tengo otras vezes dicho cómo, por exerçiçio de mi persona y por huyr los viçios que de la oçiosidad se recresen, tomé trabajo de escrevir lo que yo alcançé de los Yngas y de su regimiento y buena horden de governaçión; y como no tengo otra relaçión ni escritura que la quellos dan, si alguno atinare a escrevir esta materia más açertada que yo, bien podrá; aunque para claridad de lo que escrivo no dexé de pasar trabajo y por hazerlo con más verdad, vine al Cuzco, siendo en ella corregidor el capitán Juan de Sayavedra, donde hize juntar a Cayo Topa, ques el que ay bivo de los deçendientes de Guaynacapa, porque Xari Topa, hijo de Mango Ynga, está retirado en Viticos, adonde su padre se ausentó después de la guerra que en el Cuzco con los españoles tuvo, como adelante contaré, y a otros de los orejones, que son los que entre ellos se tienen por más nobles; y con los mejores yntrépetes [sic] y lenguas que se hallaron les pregunté estos señores Yngas qué jente hera y de qué naçión.","zh":"我已多次说过，为了砥砺自身，也为了避开闲散滋生的种种恶习，我承担起写作的辛劳，把我所了解的印加人、他们的统治和良好的施政秩序写下来。由于我除了他们提供的说法以外，没有别的叙述或文字可据，如果有人能把这个题目写得比我更准确，尽可以去写。不过，为了把我所写的弄清楚，我也没有少费工夫；为了写得更真实，我来到库斯科——当时任该城市政长官的是胡安·德·萨韦德拉上尉——在那里召集了卡尤·图帕克，他是瓦伊纳·卡帕克的后裔中如今还在世的那一位（因为曼科·印加之子萨里·图帕克隐居在比蒂科斯，他父亲在库斯科同西班牙人打过那场仗之后，就退到那里去了，这一点我后面会讲），还召集了其他一些大耳贵族，也就是他们中间被看作最高贵的人；我借助能找到的最好的通译，向他们询问这些印加领主是什么人、属于哪个民族。","tr":"p"},"c6-2":{"src":"c","ch":6,"pg":"p. 13–14","es":"Y pareçe que los pasados Yngas, por engrandeçer con gran hazaña su naçimiento porque en sus cantares se apregona lo que en esto tienen, ques, que estando todas las jentes que bivían en estas regiones desordenadas y matándose unos a otros y estando enbueltos en sus viçios, remaneçieron en una parte que a por nonbre Pacaritanbo, ques no muy lexos de la çibdad del Cuzco, tres honbres y tres mujeres. Y sigúnd se puede interpretar \"Pacaritanbo\" quiere tanto dezir como casa de produçimiento. Los nonbres de los que de allí salieron dizen ser Ayar Ocho el uno y el otro Ayar Hache Arauca y el otro dizen llamarse Ayar Mango; las mugeres, la una avía por nonbre Mamaco, la otra Mamacona, la otra Mamaragua.","zh":"看来，过去的印加人为了用宏大的业绩夸耀自己的出身——他们在歌谣里宣扬的就是这一套——说：当这一带所有的人都杂乱无序、互相残杀、沉溺于种种恶习的时候，在离库斯科城不很远、名叫帕卡里坦博的地方，出现了三个男人和三个女人。照可以解释的意思，“帕卡里坦博”相当于“产生之屋”。据说，从那里出来的人，一个叫阿亚尔·乌丘，一个叫阿亚尔·阿切·阿劳卡，再一个据说叫阿亚尔·曼科；女人中，一个叫玛玛科，一个叫玛玛科娜，一个叫玛玛拉瓦。","tr":"p"},"c6-3":{"src":"c","ch":6,"pg":"p. 14","es":"Algunos yndios quentan estos nonbres de otra manera y en más número, mas yo a lo que quentan los orejones y ellos tienen por tan çierto me allegaré, porque lo saben mejor que otros ningunos. Y así dizen que salieron vestidos de unas mantas largas y unas a manera de camisas sin collar ni mangas, de lana, riquísimas, con muchas pinturas de diferentes maneras, que ellos llaman \"tocabo\", que en nuestra lengua quiere dezir \"vestido de reyes\"; y quel uno destos señores sacó en la mano una honda de oro y en ella puesta una piedra, y que las mugeres salieron vestidas tan ricamente como ellos e sacaron mucho serviçio de oro. Y pasando adelante con esto, dizen más, que sacaron mucho serviçio de oro y quel uno de los hermanos, el que nonbravan Ayar Eche [sic], habló con los otros dos hermanos suyos para dar començo a las cosas grandes que por ellos avían de ser hechas, porque su presunçión hera tanta que pensavan hazerse únicos señores de la tierra, y por ellos fue determinado de hazer en aquel lugar una nueva poblaçión, a la qual pusieron por nonbre Pacaritanbo; y fue hecha brevemente, porque para ello tuvieron ayuda de los naturales de aquella comarca. Y andando los tienpos, pusieron gran cantidad de oro puro y en joyas con otras cosas preçiadas en aquella parte, de lo qual ay fama que ovo mucho dello Hernando Piçarro y don Diego de Almagro el moço.","zh":"有些印第安人讲这些名字讲法不同，人数也更多；但我依从大耳贵族所讲、他们认为确凿无疑的说法，因为他们比谁都清楚。他们说，这些人出来时穿着长长的斗篷和一种无领无袖的衫子，是羊毛织的，极其华贵，上面有许多不同样式的图案；这种衣服他们称为“托卡博”，在我们的语言里意思是“王者之服”；其中一位领主手里拿着一副金投石索，上面放着一块石头；女人们出来时穿得和他们一样华丽，还带出许多金器。他们接着又说，带出了许多金器，兄弟中名叫阿亚尔·埃切的那一位同另外两个兄弟商量，要着手做那些该由他们完成的大事，因为他们自视极高，想要成为这片土地唯一的领主；于是他们决定在那里建一个新聚落，起名叫帕卡里坦博；这个聚落很快就建成了，因为附近的本地人帮了他们。时间推移，他们在那里存放了大量纯金、金饰和别的珍贵之物；据传，埃尔南多·皮萨罗和小迭戈·德·阿尔马格罗从那里得到了许多。","tr":"p"},"c6-4":{"src":"c","ch":6,"pg":"p. 14–15","es":"E bolbiendo a la ystoria, dizen quel uno de los tres que ya emos dicho llamarse Ayar Cache hera tan baliente y tenía tan gran poder que con la honda que sacó, tirando golpes o lançando piedras, derribava los çerros y algunas vezes que tirava en alto ponía las piedras çerca de las nueves [sic], lo qual, como por los otros dos hermanos fuese visto, les pesava, pareçiéndoles que era afrenta suya no se le ygualar en aquellas cosas. Y así, apasionados con la envidia, dulçemente le rogaron con palabras blandas, aunque bien llenas de engaño, que bolbiese a entrar por la boca de una cueva donde ellos tenían sus tesoros a traer çierto vaso de oro que se les avía olvidado y a suplicar al Sol, su padre, les diese ventura próspera para que pudiesen señorear la tierra. Ayar Cache, creyendo que no avía cautela en lo que sus hermanos le dezían, alegremente fue a hazer lo que dicho le avían: y no avía bien acabado de entrar en la cueba, quando los otros dos cargaron sobre él tantas de piedras que quedó sin más pareçer. Lo qual pasado, dizen ellos por muy çierto que la tierra tenbló en tanta manera que se hundieron muchos çerros, cayendo sobre los valles.","zh":"回到故事上来。他们说，前面讲到的三人中，名叫阿亚尔·卡切的那一位勇猛无比，力量极大，用他带出来的投石索击打、投掷石块，能把山打塌；有时朝高处投，石头能飞到云边。另外两个兄弟见了，心里不快，觉得在这些事上比不上他，是自己的耻辱。于是，在嫉妒的驱使下，他们用软语温言——虽然满含欺诈——婉转地请他再进一次他们藏宝的那个洞口，去取回忘在里面的一只金杯，并向他们的父亲太阳祈求好运，好让他们统治这片土地。阿亚尔·卡切相信兄弟们的话里没有诡计，就高高兴兴地去照办了；他刚进洞，另两人就往他身上压了许多石头，他再也没有出来。他们十分肯定地说，此事过后，大地剧烈震动，许多山峰塌陷，倒在山谷上。","tr":"p"},"c6-5":{"src":"c","ch":6,"pg":"p. 15","es":"Hasta aquí quentan los orejones sobre el orijen de los Yngas, porque como ellos fueron de tan gran presunçión y hechos tan altos, quisieron que se entendiese aver remaneçido desta suerte y ser hijos del Sol; de donde después, quando los yndios los ensalsavan con renonbres grandes, les llamavan \"Ancha hatun apo yndechori\", que quiere en nuestra lengua dezir: \"¡O muy gran señor, hijo del Sol!\". Y lo que yo para mí tengo que se deva creer desto quéstos fingen será que, así como en Hatuncollao se levantó Çapana y en otras partes hizieron lo mismo otros capitanes valientes, questos yngas que remaneçieron devieron ser algunos tres hermanos valerosos y exforçados y en quien oviese grandes pensamientos, naturales de algúnd pueblo destas regiones o venidos de la otra parte de la sierra de los Andes, los quales, hallando aparejo, conquistarían y ganarían el señorío que tuvieron; y aún sin esto, podría ser lo que quentan de Ayar Cache e de los otros ser encantadores, que sería causa de por arte del demonio hazer lo que hazían. En fin, no podemos sacar dellos otra cosa questo.","zh":"关于印加人的起源，大耳贵族所讲到此为止。因为他们自视甚高、事业宏大，便希望人们相信他们是这样出现的，是太阳的儿子；后来印第安人用尊号颂扬他们时，称他们为“Ancha hatun apo yndechori”，用我们的话说就是：“啊，伟大的领主，太阳之子！”至于他们编造的这些事，我自己认为可信的是：正如萨帕纳在阿通科亚奥兴起，别处也有其他勇敢的统领这样做一样，这几位出现的印加人，大概是三个勇武刚强、胸怀大志的兄弟，或是这一带某个村落的本地人，或是从安第斯山脉另一侧来的，他们找到机会，就征服并取得了后来的统治权；即便不是这样，他们关于阿亚尔·卡切和其他人所讲的事，也可能说明这些人会法术，凭魔鬼的伎俩做出那些事来。总之，从他们那里我们得不出别的东西。","tr":"p"},"c6-6":{"src":"c","ch":6,"pg":"p. 15","es":"Pues luego que Ayar Cache quedó dentro en la queba, los otros dos hermanos suyos acordaron, con alguna jente que se les avía llegado, de hazer otra poblaçión, la qual pusieron por nonbre Tanbo Quiro, que en nuestra lengua querrá dezir \"dientes de aposento\" o \"de palaçio\"; y ase de entender questas poblaçiones no heran grandes ni más que algunas fuerças pequeñas. Y en aquel lugar estuvieron algunos días, aviéndoles ya pesado con aver echado de sí a su hermano Ayar Eche [sic], que por otro nonbre dizen tanbién llamarse Guanacaure.","zh":"阿亚尔·卡切被关在洞里以后，另外两个兄弟同一些投奔他们的人商定，再建一个聚落，起名叫坦博基罗，在我们的语言里大概是“居所之牙”或“宫殿之牙”的意思。要知道，这些聚落都不大，只不过是一些小堡垒。他们在那里住了些日子，这时已经后悔赶走了他们的兄弟阿亚尔·埃切——据说他又名瓦纳考里。","tr":"p"},"c7-1":{"src":"c","ch":7,"pg":"p. 16–17","es":"Prosiguiendo en la relaçión que yo tomé en el Cuzco, dizen los orejones que, después de aver asentado en Tanbo Quiro los dos yngas, sin se pasar muchos días, descuydados ya de más ver [a] Ayar Coche [sic], lo vieron venir por el ayre con alas grandes de pluma pintadas. Y ellos espantados, con gran temor que su vista les causó, quisieron huyr; mas él les quitó presto aquel pavor, diziéndoles: \"No temáys ni os congoxéys, que yo no vengo sino porque comiençe a ser conoçido el ynperio de los Yngas; por tanto, dexad, dexad esa poblaçión que hecho avéys y andad más abaxo, hasta que veáys un balle adonde luego fundad el Cuzco, ques lo que a de valer porque éstos son arrabales y de poca ynportançia y aquella será la çibdad grande donde el tenplo sontuoso se a de edeficar y ser tan servido, honrado y frequentado, quél sólo sea el más alabado. Y porque yo sienpre tengo de rogar a Dios por vosotros e ser parte para que con brevedad alcançéys gran señorío, en un çerro que está çerca de aquí me quedaré de la forma y manera que me veréys, e será para sienpre por vosotros y por vuestros deçendientes santificado y adorado y llamarléys Guanacauri. Y en pago de las buenas hobras que de mí avéys reçibido, os ruego para sienpre me adoréys por dios y en él me hagáys altares donde sean hechos los sacrifiçios; y haziendo vosotros esto, seréys en las guerras por mí ayudados; e la señal que de aquí adelante ternéys para ser estimados, honrados y temidos, será horadaros las orejas de la manera que agora me veréys\". Y así luego, dicho esto, dizen que les pareçió verlo con unas orejeras de oro, el redondo del qual era de un xeme.","zh":"接着讲我在库斯科取得的叙述。大耳贵族说，两位印加在坦博基罗住下以后，没过多少日子，正当他们再也想不到会见到阿亚尔·卡切的时候，却看见他长着彩绘的大羽翼从空中飞来。他们吓坏了，见了他心里十分恐惧，想要逃走；他很快打消了他们的恐惧，对他们说：“不要怕，也不要慌，我来，只是为了让印加的帝国开始为人所知。所以，离开吧，离开你们建的这个聚落，再往下走，直到看见一个山谷，就在那里建立库斯科，那才是要紧的地方，因为这里只是些城外的聚落，无足轻重；那里将是一座大城，要在那里建起华丽的神庙，受人供奉、尊崇、络绎朝拜，唯有它最受称颂。又因为我要永远为你们向上帝祈求，并帮你们早日取得大的统治权，我要以你们将会看到的样子留在附近的一座山上，你们和你们的后代要永远尊它为圣、崇拜它，称它为瓦纳考里。为了报答你们从我这里得到的恩惠，我求你们永远把我当作神来崇拜，在那座山上为我设祭坛献祭；你们这样做，打仗时就会得到我的帮助；从今以后，你们受人敬重、尊崇和畏惧的标志，就是像你们现在看到我这样穿耳。”据说他说完这番话，他们就看见他戴着一副金耳饰，耳饰的圆有一拃大。","tr":"p"},"c7-2":{"src":"c","ch":7,"pg":"p. 17","es":"Los ermanos, espantados de lo que vían, estavan como mudos, sin hablar; y al fin, pasada la turbaçión, respondieron que heran contentos de hazer lo que manda[ba]; e luego, a toda prieça, se fueron al serro que llaman de Guanacaure, al qual desde entonçes hasta agora tuvieron por sagrado. Y en lo más alto dél bolvieron a ver [a] Ayer Eche [sic] que sin duda devió de ser algúnd demonio si esto que quentan en algo es verdad; y, permitiéndole Dios, debaxo destas falças apariençias les hazía entender su deseo, que era que le adorasen y sacrificasen, ques lo que él más procura; y les tornó a hablar, diziéndoles que convenía que tomasen la bolra [sic] o corona del ynperio los que avían de ser soberanos señores y que se supiese cómo el tal ato se a de hazer para los mançebos ser armados cavalleros y ser tenidos por nobles. Los hermanos respondieron lo que ya avían primero dicho: que en todo su mandado se cunpliría; y en señal de obidiençia, juntas las manos y las cabeças ynclinadas, le hizieron la \"mocha\" o reverencia para que mejor se entienda. Y porque los orejones afirman que de aquí les quedó el tomar de la borla y el ser armados cavalleros, pondrélo en este lugar y servirá para no tener neçeçidad de lo tornar en lo de adelante a reyterar; y puédese tener por ystoria gustosa y muy çierta, por quando en el Cuzco Mango Ynga tomó la borla o corona suprema: ay bivos muchos españoles que se hallaron presentes a esta çerimonia e yo lo e oydo a muchos dellos, verdad que los yndios dizen tanbién que en tienpo de los reyes pasados se hazía con más solenidad y preparamientos y juntas de jentes y riqueza tan grande que no se puede ynumerar.","zh":"兄弟俩被眼前所见吓呆了，像哑巴一样说不出话；最后惊魂稍定，回答说愿意照他的吩咐去做；随即急忙赶到人称瓦纳考里的那座山上，从那时到现在，他们一直把这座山奉为圣地。在山顶上，他们又见到了阿亚尔·埃切——如果他们讲的这件事有几分真实，那么他无疑是个魔鬼；上帝容许他这样做，他便借着这些虚假的外貌让他们明白他的心愿，那就是要他们崇拜他、向他献祭，这正是他最想要的。他又对他们说话，说那些将来要做至高领主的人，应当接受帝国的王穗即王冠，还要让人知道，青年们被授为骑士、被认作贵族的那种仪式应当怎样举行。兄弟俩照先前的话回答：他的一切吩咐都会遵行；为表示服从，他们双手合拢、低下头，向他行了叩拜，说得明白些，就是致敬。大耳贵族肯定，接受王穗和授骑士身份的做法就是从这里留下来的，所以我把它放在这里，以后就不必回头再讲；这可以当作一段有趣而且十分确实的故事，因为曼科·印加在库斯科接受王穗即至高王冠的时候，在场的许多西班牙人至今还活着，我听他们中许多人讲过；不过印第安人也说，从前诸王的时代，这个仪式办得更隆重，准备更周全，聚集的人更多，财富之巨，无法计算。","tr":"p"},"c7-3":{"src":"c","ch":7,"pg":"p. 17–18","es":"Segúnd pareçe, estos señores hordenaron esta horden para que se tomase la borla o corona e dizen que Ayor Eche [sic] en el mismo çerro de Guanacaure se vistió de aquesta suerte y el que avía de ser Ynga se vestía en un día de una camisola negra, sin collar, con pinturas coloradas y en la cabeça con una trença leonada se a de dar çiertas bueltas y cubierto con una manta larga leonada a de salir de su aposento e yr al canpo a cojer un haçe de paja y a de tardar todo el día en traerlo, sin comer ni bever porque a de ayunar. Y la madre y ermanas del que fuere Ynga an de quedar hilando con tanta prieça que en aquel propio día se an de hilar e texer quatro vestidos para el mismo negoçio y an de ayunar sin comer ni bever las que en esta obra estuvieren ocupadas. El uno destos vestidos a de ser la camiseta leonada y la manta blanca y el otro colorado con lista blanca y el otro a de ser la manta y camiseta todo blanco y el otro a de ser azul con flocaduras y cordones. Estos vestidos se a de poner el que fuere Ynga y a de aver ayunado el tienpo estableçido ques un mes y a este ayuno llaman \"çaçi\", el qual se haze en un aposento del palaçio real sin ver lunbre ni tener ayuntamiento con muger; y estos días del ayuno las señoras de su linaje an de tener gran cuydado en hazer con sus propias manos mucha cantidad de su chicha, ques vino hecho de mayz y an de andar vestidos ricamente.","zh":"看来，这些领主为接受王穗即王冠定下了这样的规矩。据说阿亚尔·埃切就在那座瓦纳考里山上这样穿戴过。将要做印加的人，有一天要穿上一件无领的黑色短衫，上面有红色的图纹，头上用一条黄褐色的发辫缠几圈，披一件黄褐色的长斗篷，走出住处，到野外去割一捆草，要花一整天才拿回来，其间不吃不喝，因为他要斋戒。将要做印加的人的母亲和姐妹，要留在家里赶着纺线，在同一天之内为这件事纺好、织好四套衣服；做这活计的女人也要斋戒，不吃不喝。这四套衣服，一套是黄褐色的短衫配白斗篷，一套是红色带白条纹的，一套是斗篷和短衫全白的，还有一套是蓝色、带流苏和绳饰的。将要做印加的人要穿这些衣服，还要斋戒规定的时间，即一个月，这种斋戒他们叫作萨西；斋戒在王宫里的一间屋中进行，不见火光，也不近女色。斋戒期间，他本宗族的贵妇们要格外用心，亲手做大量的奇恰酒——那是用玉米做的酒——而且要穿着华丽的衣服。","tr":"p"},"c7-4":{"src":"c","ch":7,"pg":"p. 18","es":"Después de aver pasado el tienpo del ayuno, sale el que a de ser señor llevando en sus manos una alabarda de plata [y] de oro y va a casi algún pariente ançiano adonde le an de ser tresquilados los cavellos; e vestido una de aquellas ropas, salen del Cuzco ques donde se haze esta fiesta y van al çerro de Guanacaure, donde dezimos questavan los hermanos; y hechas algunas çirimonias y sacrefiçio, se buelven a donde está aparejado el vino, donde lo beven. Y luego sale el Ynga a un çerro nonbrado Anaguar y desde el prinçipio dél va corriendo para que bean cómo es ligero y será valiente en la guerra; y luego abaxa dél trayendo un copo de lana atado a una alavarda en señal que quando anduviere peleando con sus enemigos a de procurar de traer los cabellos y cabeças dellos.","zh":"斋戒期满，将要做领主的人出来，手持一柄金银戟，到一位年长的亲属家里去，在那里给他剪发；穿上那几套衣服中的一套，他们出了库斯科——这个节庆就在城里举行——到我们说过兄弟俩待过的瓦纳考里山去；举行了一些仪式和献祭以后，回到备好酒的地方喝酒。随后印加到一座名叫阿纳瓦尔的山上去，从山脚起一路奔跑，让人看到他身手矫健，将来打仗会很勇敢；然后从山上下来，戟上系着一团羊毛，表示他日后同敌人作战时，要设法带回敌人的头发和首级。","tr":"p"},"c7-5":{"src":"c","ch":7,"pg":"p. 18–19","es":"Hecho esto, yvan al mismo çerro de Guanacaure a cojer paja muy derecha y el que avía de ser rey tenía un manojo grande della de oro, muy delgada y pareja, y con ella yva a otro çerro llamado Yaguira adonde se vestía otra de las ropas ya dichas y en la cabeça se ponía unas trenças o llauto, que llaman \"pillaca\", ques como corona, debaxo del qual colgavan unas orejeras de oro y ençima se ponía un bonete de pluma casi como diadema quellos llaman \"paucarchuco\" y en la alavarda atavan una çinta de oro larga que llegava hasta el suelo, y en los pechos lleva[ba] puesta una luna de oro; y desta suerte en presençia de todos los que allí se hallavan matavan una obeja cuya sangre y carne repartían entre todos los más prençipales para que cruda la comiesen, en lo qual sinificava que si no fueren valientes que sus enemigos comerían sus carnes de la suerte que ellos avían comido la de la obeja que se mató. Y allí hazían juramento solene a su usança por el Sol de sustentar la orden de cavallería y por la defensa del Cuzco morir si neçesario fuese; y luego les abrían las orejas poniéndoselas tan grandes que tiene un xeme cada una dellas en redondo. Y hecho esto, poníanse unas cabeças de leones fieros y buelven con gran estruendo a la plaça del Cuzco en donde estava una gran maroma de oro que la çercava toda, sosteniéndose en horcones de plata y de oro. En el comedio desta plaça vaylavan y hazían grandísimas fiestas a su modo; y anda[va]n los que an de ser cavalleros cubiertos con las cabeças de leones que tengo dicho para dar a entender que serán valientes y fieros como lo son aquellos animales. Dado fin a estos vayles, quedan armados cavalleros y son llamados orejones y tienen sus previllejos y gozan de grandes libertades y son dinos, si los eligen, de tomar la corona, ques la borla; la qual, quando se da al señor que lo a de ser del ynperio, se hazen mayores fiestas y se junta gran número de jente, y el que a de ser enperador a primero de tomar a su única hermana por muger, porque el estado real no çuseda en linaje baxo, y haze el \"çaçi\" grande, ques el ayuno.","zh":"这些做完以后，他们又到瓦纳考里山去采很直的草；将要做王的人拿着一大把用金子做的这种草，又细又齐，带着它到另一座名叫亚维拉的山去，在那里换上前面说的另一套衣服，头上戴一种发辫，即头带，他们叫作皮利亚卡，就像王冠，下面挂着一副金耳饰；上面再戴一顶几乎像冠冕的羽毛帽，他们叫作保卡尔丘科；戟上系一条长长的金带，一直垂到地上，胸前戴一面金月牌。就这样，当着在场所有人的面，他们宰一头羊，把羊血和羊肉分给所有最显要的人生吃，意思是说：如果他们不勇敢，敌人就会像他们吃这头羊的肉那样吃他们的肉。他们在那里按自己的习俗，对着太阳庄严宣誓，要维护骑士之道，必要时为保卫库斯科而死；随后给他们穿耳，把耳洞撑得很大，每只都有一拃圆。这些做完，他们戴上凶猛的狮子头，大声喧闹着回到库斯科的广场，广场四周围着一条大金绳，用金银的叉柱撑着。他们在广场中央按自己的方式跳舞，大肆庆祝；将要成为骑士的人身上披着我说的那些狮子头，表示他们将像那些野兽一样勇猛凶悍。舞蹈结束，他们就成了骑士，被称为大耳贵族，享有特权和很大的自由，如果被选中，就有资格接受王冠，即王穗。给将来要做帝国领主的人授王穗时，庆典更为盛大，聚集的人也多得多；将要做皇帝的人要先娶他唯一的姐妹为妻，以免王位传到低贱的血统里去，还要做大萨西，也就是斋戒。","tr":"p"},"c7-6":{"src":"c","ch":7,"pg":"p. 19–20","es":"Y en el ynter questas cosas pasan, porque estando el señor ocupado en los sacrifiçios e ayunos no sale a entender en los negoçios privados y de governaçión, hera ley entre los Yngas que quando alguno falleçía y se dava a otro la corona o borla, que pudiese señalar uno de los prençipales varones del pueblo y que tuviese maduro consejo y gran autoridad para que governase todo el ynperio de los Yngas como el mismo señor durante aquellos días; y a este tal le era permitido tener guarda y hab[lal]le con reverençia. Y hecho esto y reçibidas las bendiçiones en el tenplo de Curicanche, reçibe la borla, que hera grande e salía del llauto que tenía en la cabeça cobriéndole hasta caer ençima de los ojos: y éste era tenido y reberençiado por soberano señor. Y a las fiestas se hallavan los prencipales señores que avía en más de cuatro leguas quellos mandaron y pareçía en el Cuzco grandísima riqueza de oro e plata y pedrería y plumaje, çercándolo todo la gran maroma de oro y la admirable figura del Sol, que hera todo de tanta grandeza que pesava —a lo que afirman por çierto los yndios— más de quatro mill quintales de oro; y sinó no se dava la borla en el Cuzco, tenían al que se llamava Ynga por cosa de bulra sin tener su señorío por çierto ni firme: y así Atabalipa no es contado por rey aunque, como fue de tan gran valor y mató tanta jente, por temor fue obedeçido de muchas naçiones.","zh":"这些事进行期间，因为领主忙于献祭和斋戒，不出来处理私事和政务，印加人中有一条法律：每当有人去世、要把王冠即王穗授给另一人时，可以指定一位城中显要、老成持重、极有威望的人，在那些日子里像领主本人一样治理整个印加帝国；这个人可以有护卫，人们同他说话要恭敬。这些办完，在科里坎查神庙领受祝福以后，新王接受王穗；王穗很大，从他头上的头带垂下，一直盖到眼睛上：从此他就被奉为至高的领主而受尊崇。他们所统治的四里格多地方的主要领主都来参加这些庆典；库斯科城里金银、宝石、羽饰之富，无以复加，四周围着那条大金绳，还有那尊令人惊叹的太阳像，一切都大得出奇——印第安人十分肯定地说——重达四千多担黄金。王穗如果不是在库斯科授的，他们就把那个自称印加的人当作笑话，不认为他的统治确实稳固；所以阿塔瓦尔帕不算王，尽管他勇武过人，杀人又多，许多族群出于畏惧服从了他。","tr":"p"},"c7-7":{"src":"c","ch":7,"pg":"p. 20","es":"Bolviendo a los questavan en el çerro de Guanacaure, después que Ayor Eche [sic] les ovo dicho de la manera que avían de tener para ser armados cavalleros, quentan los yndios que mirando contra su hermano Ayar Mango, [le dijo] que se fuese con las dos mugeres al valle que dicho le avía, a donde luego fundase el Cuzco, sin olvidar de le venir a hazer sacrifiçios [a] aquel lugar como primero rogado le avía; y que como esto oviese dicho, así él como el otro hermano se convertieron en dos figuras de piedras, que demostravan tener talles de honbres: lo qual visto por Ayar Mango, tomando sus mugeres, bino adonde agora es el Cuzco a fundar la çibdad, nonbrándose y llamándose dende adelante Mango Capa, que quiere dezir \"rey y señor rico\".","zh":"再回到瓦纳考里山上的人。阿亚尔·埃切告诉他们怎样才能被授为骑士以后，据印第安人说，他望着兄弟阿亚尔·曼科，叫他带着两个女人到他说过的那个山谷去，立即在那里建立库斯科，不要忘了像他先前所求的那样，到这个地方来给他献祭；他说完这些，他和另一个兄弟都化成了两尊石像，看得出人的形状。阿亚尔·曼科见了，便带着他的女人们来到如今库斯科所在的地方建城，从此自称曼科·卡帕克，意思是“王与富有的领主”。","tr":"p"},"c8-1":{"src":"c","ch":8,"pg":"p. 21–22","es":"Reydome de lo que tengo escripto destos yndios, yo quento en mi escritura lo quellos a mí contaron por la suya y antes quito muchas cosas que añadir una tan sola. Pues como Mango Capa oviese visto lo que de sus hermanos avía çusedido e llegase al valle donde agora es la çibdad del Cuzco, alçando los ojos al çielo, dizen los orejones que pedía con grande umildad al Sol que le faboreçiese e ayudase en la nueva poblaçión que hazer quería e que, buelto los ojos hazia el çerro de Guanacaure, pedía lo mismo a su hermano, que ya lo tenía y reverençiava por Dios; e mirando en el buelo de las aves y en las señales de las estrellas y en otros prodixios llenos de confiança, teniendo por çierto que la nueva poblaçión avía de floreçer y él ser tenido por el fundador della y padre de todos los Yngas que en ella avían de reynar. Y así, en nonbre de su Tiçiviracocha y del Sol y de los otros sus dioses, hizo la fundaçión de la nueva çibdad, el origen y prençipio de la qual fue una pequeña casa de piedra cubierta de paja que Mango Capa con sus mugeres hizo, a la qual pusieron por nonbre \"Curicancha\", que quiere dezir \"çercado de oro\": lugar donde después fue aquel sélebre y tan riquísimo tenplo del Sol y que agora es monesterio de frayles de la Orden de Santo Domingo. Y tiénese por çierto que en el tienpo questo por Mango Capa se hazía, avía en la comarca del Cuzco yndios en cantidad, mas como él no les hiziese mal ni ninguna molestia, no le ynpedían la estada en su tierra, antes se holgavan con él; y así Mango Capa entendía en hazer la casa ya dicha y era dado a sus relig[i]ones y culto de sus dioses y fue de gran presunçión y de persona que representava gran autoridad.","zh":"对于我所写的这些印第安人的事，我自己也觉得好笑；我在书里讲的，是他们按他们的说法讲给我的，而且我宁可删去许多，也不添一件。且说曼科·卡帕克看到兄弟们的遭遇，来到如今库斯科城所在的山谷，大耳贵族说，他抬眼望天，十分谦卑地祈求太阳在他想要建立的新聚落中眷顾他、帮助他；又转眼望向瓦纳考里山，向他的兄弟祈求同样的事——他已把那位兄弟当作神来尊奉；他观察鸟的飞翔、星辰的征兆和其他预兆，满怀信心，认定这个新聚落必将兴盛，他自己将被奉为它的创建者，以及日后在此统治的所有印加人的始祖。于是，他以他的蒂西维拉科查、太阳和其他诸神的名义，建立了这座新城。新城的起源和开端，是曼科·卡帕克同他的妻子们建的一座茅草顶的小石屋，他们给它起名叫“科里坎查”，意思是“黄金围院”：后来那座著名而富丽无比的太阳神庙就在此地，如今是多明我会修士的修道院。人们确信，曼科·卡帕克做这件事的时候，库斯科一带已有大量印第安人；但由于他没有伤害他们，也没有给他们添任何麻烦，他们并不阻止他留在自己的土地上，反而乐于与他相处。于是曼科·卡帕克专心建造上面说的那座屋子，热心于他的宗教和对诸神的崇拜；他自视甚高，是个仪表威严的人。","tr":"p"},"c8-2":{"src":"c","ch":8,"pg":"p. 22","es":"La una de sus mugeres fue estéril, que nunca se enpreñó; en la otra ovo tres hijos varones y una hija: el mayor fue nonbrado Çinche Roca Ynga y la hija Achi Oclo; los nonbres de los otros dos no quentan ni dizen más de que casó al hijo mayor con su hermana, a los quales mostró lo que avían de hazer para ser amados de los naturales y no aborreçidos y otras cosas grandes. En este tienpo en Hatuncollao se avían hecho poderosos los deçendientes de Çapana y con tiranía querían ocupar toda aquella comarca. Pues como el fundador del Cuzco, Mango Capa, ovo casado a sus hijos y allegado a su serviçio algunas jentes con amor y buenas palabras, con las quales engrandeçió la casa de Curicanche, después de aver bivido muchos años, mur[i]ó estando ya muy biejo y le fueron hechas las oçequias con toda sontuosidad, sin lo qual se le hizo un bulto para reverençialle como a hijo del Sol.","zh":"他的妻子中有一位不育，从未怀孕；另一位为他生了三个儿子和一个女儿：长子名叫辛奇·罗卡·印加，女儿名叫阿奇·奥克略；另外两个儿子的名字，他们没有讲，只说他让长子娶了自己的姐妹，并教导他们怎样做才能受本地人爱戴而不遭憎恨，以及其他重大的事。这个时候，在阿通科亚奥，萨帕纳的后裔已经强大起来，想用暴政占据那一带全境。库斯科的创建者曼科·卡帕克为儿子们完了婚，又以关爱和好言招揽了一些人为他效力，用这些人扩建了科里坎查之屋；他活了许多年，年纪很老时去世，人们以极其隆重的葬仪为他送葬；此外还为他做了一尊像，把他当作太阳之子来尊奉。","tr":"p"},"c9-1":{"src":"c","ch":9,"pg":"p. 23–24","es":"Aunque pudiera escrevir lo que pasó en el reynado de Sinche Roca Ynga, hijo que fue de Mango Capa, fundador del Cuzco, en este lugar, lo dexé pareçiéndome que en lo de adelante avría confusión para saber por entero la manera que se tuvo en la governaçión destos señores, porque unos ordenaron unas leyes y otros otras y así pusieron unos los mitimaes y otros las guarniçiones de gente de guerra en los lugares estableçidos en el reyno para la defença dél; y porque son todas cosas grandes y dinas de memoria y para que las repúblicas que se rijen por grandes letrados y varones desto tomen aviso y unos y otros consiban admiraçión considerando que pues en jente várbara y que no tuvo letras se halló lo que de çierto savemos que ovo así en lo del govierno como en sojuzgar las tierras y naçiones para que debaxo de una monarquía obedeçiesen a un señor que solo fuese soberano y dino para reynar en el ynperio que los Yngas tuvieron, que fueron más de mill y dozientas leguas de costa; y así por no variar en dezir que unos dizen que çiertos dellos constituyeron lo uno y otros lo otro, en lo qual muchos naturales varían, pondré en este lugar lo que yo entendí y tengo por çierto, conforme a la relaçión que dello tomé en la çibdad del Cuzco y de las reliquias que vemos aver quedado destas cosas todos los que en el Perú avemos andado. Y no paresca a los letores que en tomar esta orden salgo de la que el libro conviene que lleve porque para que ellos con más claridad lo entiendan se pone como declaro. Y esto haré con gran brevedad sin querer ocuparme en contar cosas menudas de que sienpre huyo y así con ella misma proçigueré en tratar del reynado de los Yngas y la çuseçión dellos hasta que con la muerte de Guascar y entrada de los españoles se acavó.","zh":"辛奇·罗卡·印加是库斯科创建者曼科·卡帕克的儿子，他在位期间的事，我本可以在这里写，但我没有写，因为我觉得那样一来，往后要完整了解这些领主的治理方式就会混乱：有的定了这些法律，有的定了那些；有的设置了移民，有的在国中为防御而设定的地方安置了驻军。这些都是重大而值得记住的事。为了让那些由大学者和贤人治理的国家从中得到借鉴，也为了让人人感到惊叹——想一想，一个没有文字的野蛮民族，在治理上，在征服各地各族、使之在一个君主政体之下服从一位独掌主权、配得上统治印加人那个帝国的领主上，竟有我们确知的这些成就，而那个帝国单是沿海岸就有一千二百多里格；又为了不在“某些事是这几位定的、那些事是那几位定的”这类说法上来回纠缠——在这一点上许多本地人说法不一——我把我所了解并认为确实的放在这里，所据的是我在库斯科城取得的叙述，以及我们这些走遍秘鲁的人所见到的这些事物留下的遗迹。读者不要以为我这样安排背离了本书应有的顺序，这样安排是为了让读者理解得更清楚，正如我所说明的。我会写得十分简短，不去讲那些我一向避免的琐事；然后仍照这个方式，接着讲诸印加的统治和他们的世系相承，直到瓦斯卡尔死去、西班牙人进入，统治告终。","tr":"p"},"c9-2":{"src":"c","ch":9,"pg":"p. 24","es":"Y quiero que sepan los que esto leyeren que, entre todos los Yngas que fueron honze, tres salieron entre ellos tan bastantísimos para la governaçión de su señorío que cuentan y no acaban los orejones de loarlos; y éstos no se pareçieron en las condiçiones tanto como en el juyzio y en ser valerosos, los quales son Guaynacapa y Topa Ynga Yupangue, su padre e Ynga Yupangue, padre del uno y agüelo del otro. Y tanbién se puede presumir que, como éstos fuesen tan modernos questá el reyno lleno de yndios que conoçieron a Topa Ynga Yupangue y con él anduvieron en las guerras y a sus padres oyeron lo que Ynga Yupangue hizo en el tienpo de su reynado, podría ser destas cosas como vistas casi por los ojos tener más lunbre para las poder contar; y lo çusedido a los otros señores, sus projinetores, averse dello mucho olvidado aunque çierto para lo tener en la memoria y que no se pierda en muchos años tienen grande aviso para no tener letras, quéstas ya tengo escrito en la Primera Parte desta Corónica cómo no se an hallado en este reyno ni aun en todo este orbe de las Yndias. Y por tanto prosigamos lo començado.","zh":"我还要让读者知道：在全部十一位印加中，有三位治国才能极为出众，大耳贵族说起他们来赞不绝口；这三位的相似之处，与其说在性情，不如说在见识和勇武，他们就是瓦伊纳·卡帕克、他的父亲图帕克·印加·尤潘基，以及前者的祖父、后者的父亲印加·尤潘基。还可以推想，由于这几位离今天很近，国中满是认识图帕克·印加·尤潘基、跟他一起打过仗的印第安人，他们又从父辈那里听说过印加·尤潘基在位时的作为，这些事几乎是亲眼所见，讲起来就更清楚；而其他几位领主、他们的先祖的事，就大多已被遗忘了——尽管他们为了把事情记住、多年不失，确实有很好的办法来弥补没有文字的缺憾；至于文字，我已在本书第一部写过，在这个王国乃至整个西印度都没有发现过。所以，我们接着讲已经开始讲的事吧。","tr":"p"},"s10-1":{"src":"s","ch":10,"pg":"p. 116","es":"Sabido cómo en las antiguas edades toda esta tierra era behetría, es necesario decir cómo los ingas empezaron su tiranía. Aunque todas vivían en simple libertad, sin reconocer señor, siempre había entrellos algunos valientes que, aspirando a mayoridad, hacían violencias a sus patrias y otros extranjeros, por subjetallos y traellos a su obediencia y ponellos debajo de su mando, para servirse dellos y hacellos tributarios. Y así salían bandas de unas regiones e iban a otras a hacer guerrerías y robos y muertes y usurpar las tierras de los otros.","zh":"知道了远古时代这整片土地都是无主之民，就有必要讲一讲诸印加是怎样开始他们的暴政的。虽然各地都生活在单纯的自由中，不承认领主，但他们中间总有一些勇猛之徒想出人头地，对本乡人和外乡人施加暴力，要使他们屈服，归顺于己，置于自己的号令之下，供自己役使，向自己纳贡。于是成帮的人从一个地方出发，到别的地方去打仗、抢劫、杀人，霸占别人的土地。","tr":"p"},"s10-2":{"src":"s","ch":10,"pg":"pp. 116–117","es":"Y como ésto[s] anduviesen en muchas partes y por muchas naciones, procurando cada uno de sujetar a su vecino, sucedió que seis leguas del valle del Cuzco, en un asiento que nombran Pacaritambo, hubo cuatro hombres y cuatro hermanas de feroces bríos y mal intencionados, aunque de altos pensamientos. Éstos, como fuesen de más habilidad que los otros y entendiesen la pusilanimidad de los naturales de aquellas comarcas y su facilidad en creer cualquiera cosa que con alguna autoridad o fuerza se les proponga, concibieron en sí que podrían enseñorearse de muchas tierras con fuerzas e imbaimientos. Y así, juntáronse todos los ocho hermanos, cuatro hombres y cuatro mujeres, y trataron el modo que tendrían para tiranizar las otras gentes fuera del asiento donde ellos estaban, y propusieron de acometer tal hecho con violencia. Y entendiendo que la generalidad destos naturales es innorante, y con facilidad creen lo que se les dice, mayormente si se les propone con alguna aspereza, rigor y autoridad, contra lo cual no tiene[n] réplica ni resistencia, porque son de su natural tímidos, y para ser tenidos y temidos, fing[i]eron ciertas fábulas de su nacimiento, diciendo que ellos eran hijos del Viracocha Pachayachachi, su criador, y que habían salido de unas ventanas para mandar a los demás. Y como eran feroces, hiciéronse creer, temer y tener por más que hombres, y aun adorarse por dioses. Y así introdujeron la religión que quisi
