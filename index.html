<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>库斯科建政编年</title>
<meta name="description" content="印加库斯科建政编年：贝坦索斯、西萨、萨米恩托与1572年库斯科调查录的原文与译文。">
<style>
@font-face{font-family:"ZCOOL XiaoWei";src:url("fonts/zcool.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Noto Serif SC";src:url("fonts/notoserifsc-400.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Noto Serif SC";src:url("fonts/notoserifsc-600.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:"EB Garamond";src:url("fonts/ebgaramond.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"EB Garamond";src:url("fonts/ebgaramond-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
</style>
<style>
:root{
  /* one khipu cord laid on its side: every life is a thread twisted into the main cord; when a life has a scene it loops out, is knotted, and goes back in */
  --wool:#15110e;
  --loom:#1d1712;
  --rule:#3a3028;
  --ink:#eee5d1;
  --dim:#a29581;
  --spark:#fff1cf;
  --display:"ZCOOL XiaoWei","Noto Serif SC","Songti SC","STSong",serif;
  --body:"Noto Serif SC","Songti SC","Source Han Serif SC","STSong",serif;
  --latin:"EB Garamond",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background-color:var(--wool);
  background-image:
    repeating-linear-gradient(0deg,rgba(255,238,205,.016) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);
  color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.app{display:grid;grid-template-rows:auto auto auto minmax(0,1fr);height:100%}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 32px;padding:16px 22px 10px;border-bottom:1px solid var(--rule)}
.top h1{font-family:var(--display);font-weight:400;font-size:clamp(26px,3vw,40px);letter-spacing:.08em;line-height:1.05;margin:0}
.sub{margin:7px 0 0;color:var(--dim);font-size:14px;letter-spacing:.02em}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:7px;max-width:640px}
.stats{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.hint{color:var(--dim);font-size:12.5px;line-height:1.6;text-align:right;margin:0}
.pill-btn{border:1px solid var(--rule);border-radius:999px;padding:4px 13px;font-size:13px;white-space:nowrap}
.pill-btn:hover{border-color:var(--dim)}

/* filter bar */
.bar{display:flex;align-items:center;gap:7px;padding:8px 22px;border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:thin}
.bar .lbl{font-size:12px;color:var(--dim);letter-spacing:.14em;margin:0 2px 0 6px;flex:none}
.bar .lbl:first-child{margin-left:0}
.bar .sep{flex:none;width:1px;height:18px;background:var(--rule);margin:0 6px}
.chip{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:3px 11px;white-space:nowrap;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--dim)}
.chip .n{color:var(--dim);font-variant-numeric:tabular-nums;font-size:11.5px}
.chip[aria-pressed="true"]{background:var(--spark);border-color:var(--spark);color:var(--wool)}
.chip[aria-pressed="true"] .n{color:#6b5a44}
.chip svg{width:13px;height:13px;flex:none}
.chip svg *{fill:var(--undyed,#d8c8a4)}
.chip[aria-pressed="true"] svg *{fill:var(--wool)}
.status{flex:none;margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);padding-left:12px}
.status[hidden]{display:none}
.who-btn{display:none}

/* minimap */
.mini{position:relative;height:58px;border-bottom:1px solid var(--rule);background:var(--loom);cursor:pointer;touch-action:none;user-select:none}
.mini svg{position:absolute;inset:4px 0;width:100%;height:calc(100% - 8px);display:block}
.mini .vp{position:absolute;top:2px;bottom:2px;border:1px solid rgba(255,241,207,.55);background:rgba(255,241,207,.06);border-radius:3px;pointer-events:none}
.mini .mrope{stroke:#5b4b3c;stroke-width:3;fill:none;vector-effect:non-scaling-stroke}
.mini .mth{fill:none;stroke-width:1.1;vector-effect:non-scaling-stroke;opacity:.55}
.mini .mtick{stroke:var(--dim);stroke-width:1;vector-effect:non-scaling-stroke;opacity:.6}
.mini .mband{fill:rgba(255,240,210,.035)}
body.filt .mini .mth{opacity:.12}
body.filt .mini .mth.on{opacity:1;stroke-width:1.8}
body.filt .mini .mtick{opacity:.12}
body.filt .mini .mtick.lit{opacity:1;stroke:var(--spark)}
.mini .mtick.sel{opacity:1;stroke:var(--spark);stroke-width:2.5}

/* main grid */
.main{display:grid;grid-template-columns:196px minmax(0,1fr) 460px;min-height:0}
.side{overflow:auto;border-right:1px solid var(--rule);padding:10px 0 30px;scrollbar-width:thin}
.gh{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;color:var(--dim);padding:12px 16px 5px}
.gh i{width:14px;height:3px;border-radius:2px;display:block}
.pr{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:4px 14px 4px 16px;font-size:14px;line-height:1.35}
.pr:hover{background:rgba(255,240,210,.05)}
.pr .sw{flex:none;width:12px;height:12px;border-radius:3px;border:1.5px solid var(--gc);background:transparent}
.pr .pn{flex:1;min-width:0}
.pr .pa{display:block;font-size:11.5px;color:var(--dim)}
.pr .pc{flex:none;font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.pr.on .sw{background:var(--hc);border-color:var(--hc)}
.pr.on .pn{color:var(--spark)}
.side-foot{padding:14px 16px 0;font-size:12px;color:var(--dim);line-height:1.6}

.sc{overflow:auto;position:relative;scrollbar-width:thin;outline:none}
.canvas{position:relative}
.eras{position:sticky;top:0;z-index:3;height:50px;background:rgba(21,17,14,.94);border-bottom:1px solid var(--rule);backdrop-filter:blur(2px)}
.era{position:absolute;top:0;height:100%;border-left:1px solid var(--rule);display:flex;align-items:center}
.era .en{position:sticky;left:0;padding:0 12px;white-space:nowrap}
.era .en b{display:block;font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.05em;line-height:1.2}
.era .en span{display:block;font-size:11.5px;color:var(--dim);letter-spacing:.06em}
#braid{display:block}

/* braid */
.band{fill:rgba(255,240,210,.022)}
.eline{stroke:var(--rule);stroke-width:1;stroke-dasharray:2 5}
.rope-body{stroke:#2b221a;stroke-width:20;stroke-linecap:round;fill:none}
.th{fill:none;stroke:var(--c);stroke-width:1.5;opacity:.62;transition:opacity .2s,stroke-width .2s;stroke-linejoin:round}
.th.hov{opacity:1;stroke-width:2.6}
body.lf .th{opacity:.34}
body.pf .th{opacity:.09}
body.pf .th.on{opacity:1;stroke-width:2.6;filter:drop-shadow(0 0 3px var(--c))}
body.filt .th.hov{opacity:.8}
.tag.rep{opacity:.8}
.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.tag{cursor:pointer}
.tag rect{fill:var(--wool);stroke:var(--c);stroke-width:1.2;opacity:.95}
.tag text{fill:var(--c);font-size:12px;text-anchor:middle;dominant-baseline:central}
body.pf .tag{opacity:.12}
body.pf .tag.on{opacity:1}
.bind{fill:#3d3127;stroke:#6b5a48;stroke-width:1}
.fray text{fill:var(--dim);font-size:12px}
.k{cursor:pointer;outline:none}
.k .sh{fill:var(--c);stroke:var(--wool);stroke-width:1.2;transition:transform .15s}
.k .sh.o{fill:var(--wool);stroke:var(--c);stroke-width:1.6}
.k .hz{fill:transparent}
.k:hover .sh,.k:focus-visible .sh{stroke:var(--spark);stroke-width:1.8}
.k.sel .sh{stroke:var(--spark);stroke-width:2.2;transform:scale(1.4)}
.tie{stroke:var(--dim);stroke-width:1;stroke-dasharray:1.5 3.5;opacity:.6}
.tie.sel{stroke:var(--spark);stroke-dasharray:none;opacity:.9;stroke-width:1.4}
.lab{fill:#cbbfa8;font-size:12.5px;text-anchor:middle;cursor:pointer;paint-order:stroke;stroke:var(--wool);stroke-width:4px;stroke-linejoin:round}
.lab:hover{fill:var(--spark)}
.lab.sel{fill:var(--spark);font-weight:600}
body.lf .k:not(.lit),body.pf .k:not(.lit){opacity:.13}
body.lf .lab:not(.lit),body.pf .lab:not(.lit){opacity:.13}
body.lf .tie:not(.lit),body.pf .tie:not(.lit){opacity:.08}
.k.sel,.lab.sel,.tie.sel{opacity:1!important}
.arc{fill:none;stroke:var(--spark);stroke-width:1.2;stroke-dasharray:4 4;opacity:.65}
.arcdot{fill:var(--spark)}

/* tooltip */
.tip{position:fixed;z-index:20;pointer-events:none;max-width:280px;background:#2a221b;border:1px solid #4a3d31;border-radius:6px;padding:7px 10px;font-size:13px;line-height:1.5;box-shadow:0 6px 18px rgba(0,0,0,.4);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip small{display:block;color:var(--dim);font-size:11.5px}

/* panel */
.panel{overflow:auto;border-left:1px solid var(--rule);padding:18px 22px 60px;scrollbar-width:thin}
.panel h2{font-family:var(--display);font-weight:400;font-size:25px;letter-spacing:.04em;line-height:1.3;margin:4px 0 10px}
.panel h3{font-size:12px;letter-spacing:.16em;color:var(--dim);font-weight:400;margin:22px 0 8px}
.ctx{font-size:12.5px;color:var(--dim);letter-spacing:.04em}
.back{font-size:12.5px;color:var(--dim);margin-bottom:8px;display:inline-block}
.back:hover{color:var(--ink)}
.who{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.pchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--rule);border-radius:999px;padding:2px 10px 2px 8px}
.pchip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.pchip:hover{border-color:var(--dim)}
.pchip.on{border-color:var(--c)}
.x{font-size:15px;line-height:1.95;margin:0 0 6px}
.q{margin:12px 0 0;padding:11px 14px 12px;border-left:2px solid var(--qc);background:rgba(255,240,210,.03);border-radius:0 4px 4px 0}
.q figcaption{font-size:12px;color:var(--dim);margin-bottom:7px;display:flex;gap:7px;align-items:flex-start;line-height:1.5}
.q figcaption svg{flex:none;width:12px;height:12px;margin-top:3px}
.q figcaption svg *{fill:var(--qc)}
.qh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ctxbtn{font-size:12px;color:var(--dim);border:1px solid var(--rule);border-radius:999px;padding:2px 10px;flex:none}
.ctxbtn:hover{color:var(--ink);border-color:var(--dim)}
.pu{margin:0 0 12px}
.pu .pl{font-size:11px;color:var(--dim);letter-spacing:.04em;margin-bottom:3px;font-variant-numeric:tabular-nums}
.pu .es{margin:0;font-family:var(--latin);font-size:16px;line-height:1.55;color:#e6dac2;hyphens:none;overflow-wrap:break-word}
.pu .zh{margin:7px 0 0;font-size:14.5px;line-height:1.85}
.pu .nozh{margin:5px 0 0;font-size:12px;color:var(--dim)}
.pu.ctx{opacity:.5;border-left:1px dashed var(--rule);padding-left:10px;margin-left:-11px}
.pu.ctx .es{font-size:14.5px}.pu.ctx .zh{font-size:13px}
.pu.ctx:hover{opacity:.85}
body.noctx .pu.ctx{display:none}
.pu mark{background:rgba(220,171,76,.24);color:#fff6e2;border-radius:2px;padding:0 1px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.q .tr{font-size:11.5px;color:var(--dim);margin-top:2px}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.rel{margin-top:6px}
.rel .rn{font-size:13px;color:var(--ink);margin:12px 0 4px}
.li{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;padding:5px 6px;border-radius:4px;font-size:14px;line-height:1.5}
.li:hover{background:rgba(255,240,210,.06)}
.li.cur{background:rgba(255,241,207,.1)}
.li .dots{flex:none;display:inline-flex;gap:3px;min-width:14px}
.li .dots i{width:7px;height:7px;border-radius:50%;background:var(--c);display:block;transform:translateY(-1px)}
.li .lt{flex:1;min-width:0}
.li .ls{flex:none;display:inline-flex;gap:2px}
.li .ls svg{width:10px;height:10px}
.li .ls svg *{fill:var(--dim)}
.li small{color:var(--dim);font-size:12px;margin-right:4px}
.eh{font-size:12px;color:var(--dim);letter-spacing:.08em;margin:14px 0 3px;padding-bottom:3px;border-bottom:1px solid var(--rule)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:26px;padding-top:12px;border-top:1px solid var(--rule);font-size:13px;color:var(--dim)}
.nav button{border:1px solid var(--rule);border-radius:999px;padding:4px 12px;color:var(--ink)}
.nav button:hover{border-color:var(--dim)}
.nav button:disabled{opacity:.3;cursor:default}
.card{border:1px solid var(--rule);border-left:3px solid var(--c);border-radius:4px;padding:10px 12px;margin:10px 0}
.card b{font-size:16px;font-weight:600}
.card .al{color:var(--dim);font-size:12.5px;margin-left:6px}
.card p{margin:5px 0 0;font-size:13.5px;line-height:1.75}
.card .st{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.7}
.intro p{font-size:14.5px;line-height:1.9;margin:0 0 10px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13.5px;margin:6px 0 4px}
.legend svg{width:14px;height:14px}
.legend svg *{fill:var(--ink)}
.relbtn{display:flex;justify-content:space-between;width:100%;text-align:left;padding:5px 6px;border-radius:4px;font-size:14px}
.relbtn:hover{background:rgba(255,240,210,.06)}
.relbtn span{color:var(--dim);font-size:12px}
.foot{font-size:11.5px;color:var(--dim);line-height:1.7;margin-top:26px;border-top:1px solid var(--rule);padding-top:10px}

@media (max-width:1180px){.main{grid-template-columns:172px minmax(0,1fr) 380px}}
@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .meta{align-items:flex-start}.hint{text-align:left}
  .main{grid-template-columns:1fr;grid-template-rows:62vh auto}
  .side{display:none;position:fixed;z-index:30;left:0;top:0;bottom:0;width:240px;background:var(--loom);box-shadow:4px 0 24px rgba(0,0,0,.5)}
  .side.open{display:block}
  .panel{border-left:0;border-top:1px solid var(--rule);overflow:visible}
  .who-btn{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>库斯科建政编年</h1>
      <p class="sub">众人拧成一股绳；轮到谁有戏，谁就从绳里绕出来。本图所列，皆有所本。</p>
    </div>
    <div class="meta">
      <div class="stats" id="stats"></div>
      <p class="hint">点绳结读一件事；点左边的人名或直接点一根线，只看这些人，可以多选；点出处或母题，看同一样东西在哪里出现；← → 逐件翻阅，Esc 复原。</p>
      <button class="pill-btn" id="again">从头读起</button>
    </div>
  </header>
  <nav class="bar" id="bar" aria-label="筛选"></nav>
  <div class="mini" id="mini" aria-label="全图缩略" role="slider" aria-valuemin="0" aria-valuemax="100" tabindex="0"><svg id="msvg" preserveAspectRatio="none"></svg><div class="vp" id="vp"></div></div>
  <div class="main">
    <aside class="side" id="side" aria-label="人物"></aside>
    <div class="sc" id="sc" tabindex="-1">
      <div class="canvas" id="canvas">
        <div class="eras" id="eras"></div>
        <svg id="braid" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
</div>
<div class="tip" id="tip"></div>
<script>

:[[439,549]]},"hz":{"c7-7":[[114,137]]}}]},{"id":"ucho_wings","e":1,"l":["ucho","manco"],"t":"飞天改名","h":"阿亚尔·乌丘生翼飞天","m":["stone","name"],"x":"阿亚尔·乌丘站起来，展开一对大翅膀，说该由他留在瓦纳考里山上做神像，去同他的父亲太阳说话。他飞上天去，飞得谁也看不见，回来以后吩咐阿亚尔·曼科改名曼科·卡帕克，又把自己的妻子库拉给了他，然后带着翅膀原样化成了石头。","Q":[{"src":"b","ch":4,"u":["b4-1","b4-2"],"pre":"b3-4","post":"b4-3","hl":{"b4-1":[[844,1018]],"b4-2":[[96,188],[489,579]]},"hz":{"b4-1":[[226,272]],"b4-2":[[39,77],[167,193]]}}]},{"id":"ucho_stuck","l":["ucho"],"t":"粘在神像上","h":"阿亚尔·乌丘坐上一尊神像","m":["stone","heaven"],"x":"萨米恩托的说法：到了瓦纳考里山顶，他们看见彩虹，又看见一尊人形的神像，想把它捉走。阿亚尔·乌丘自告奋勇，坐到神像身上，问它在这里做什么；神像回过头来，却被压着看不见他。阿亚尔·乌丘想下来，脚底已经粘在神像背上。他说：兄弟们，你们害了我……你们去吧，去吧，你们会成为大领主；行成年礼的时候，要把我当作父亲来拜。说完化为石头，叫阿亚尔·乌丘·瓦纳考里，直到西班牙人来时都是全国最隆重的圣地，印加人在那里受成年礼，到二十年前才被基督徒取消。","e":1,"Q":[{"src":"s","ch":12,"u":["s12-5"],"pre":"s12-4","post":"s13-1","hl":{"s12-5":[[826,861],[1324,1359],[1830,1887]]},"hz":{"s12-5":[[264,273],[407,416],[586,610]]}}]},{"id":"ucho_wing_broken","e":1,"l":["ucho"],"t":"断了一翼","h":"石像的一只翅膀","m":["stone"],"x":"阿亚尔·乌丘化成石头以后，附近村子的几个印第安人来了。他们先前看见过它飞上高空，便朝它扔了一块石头，打断了它的一只翅膀。从此它再也飞不起来了。他们见它已经成了石头，就没有再去惹它。","Q":[{"src":"b","ch":4,"u":["b4-2"],"pre":"b4-1","post":"b4-3","hl":{"b4-2":[[664,953]]},"hz":{"b4-2":[[223,306]]}}]},{"id":"ucho_apomayta","e":1,"l":["ucho","apomayta"],"t":"奉新首领","h":"阿亚尔·乌丘化为石头以后","m":["stone"],"x":"阿亚尔·乌丘化为石头以后，他的后人奉阿波迈塔为军事首领。","Q":[{"src":"t","ch":3,"u":["t3-8"],"pre":"t3-7","post":"t3-9","hl":{"t3-8":[[3,221]]},"hz":{"t3-8":[[0,82]]}}]},{"id":"manco_matagua","e":2,"l":["manco"],"t":"望见村子","h":"望见阿尔卡维萨的村子","m":[],"x":"他们挪到马塔瓜的山沟，从山上俯看库斯科谷，看到阿尔卡维萨的村子，觉得那地方好，商定去和那村里的人同住。","Q":[{"src":"b","ch":4,"u":["b4-1"],"pre":"b3-4","post":"b4-2","hl":{"b4-1":[[236,379],[510,579]]},"hz":{"b4-1":[[64,111],[126,143]]}}]},{"id":"gold_staff","l":["huaco","manco"],"t":"金杖试土","h":"用金杖试土","m":["land","gold"],"x":"萨米恩托说，在马塔瓜住了两年，玛玛·瓦科朝北扔出两根金杖，一根在科尔卡班巴插不住，一根在瓦奈帕塔插得很牢，于是知道那里土地肥沃。也有人说试土的是曼科·卡帕克带来的金杖。抄本页脚有纳瓦穆埃尔的批注：两种说法中，证人确认是曼科·卡帕克的那一种。他们决定不管那里的主人和本地人愿不愿意，用武力把那片地据为己有。","e":2,"Q":[{"src":"s","ch":13,"u":["s13-2","s13-3"],"pre":"s13-1","post":"s13-4","hl":{"s13-2":[[111,173]],"s13-3":[[357,458]]},"hz":{"s13-2":[[31,53]],"s13-3":[[107,143]]}}]},{"id":"auca_cozco","l":["auca","manco"],"t":"飞成界石","h":"阿亚尔·奥卡化为界石","m":["name","stone","land"],"x":"萨米恩托说，曼科从马塔瓜望见今圣多明我修道院附近有一块界石，便叫阿亚尔·奥卡——据说他长出了翅膀——飞过去，坐在那里占地。阿亚尔·奥卡一坐下就变成了石头，成了占地的界石；界石在这个山谷的古语里叫 cozco，库斯科由此得名。也有人说名字是曼科取的，意思是“悲伤而肥沃”；萨米恩托说前一说更可信。","e":2,"Q":[{"src":"s","ch":13,"u":["s13-4"],"pre":"s13-3","post":"s13-5","hl":{"s13-4":[[578,647],[716,829]]},"hz":{"s13-4":[[162,179],[195,235]]}}]},{"id":"huaco_coca","e":2,"l":["huaco"],"t":"古柯村","h":"玛玛·瓦科与古柯村","m":["exile"],"x":"离阿尔卡维萨的村子还有两火绳枪射程的地方，有一个种古柯和辣椒的小村。玛玛·瓦科用绊索打死了村里一个人，剖开他的身体，掏出肺和心，当着村里人的面把肺吹得鼓起来。全村的人当即逃往瓦利亚谷；今天在瓦利亚经营古柯的印第安人，就是他们传下来的。","Q":[{"src":"b","ch":4,"u":["b4-3"],"pre":"b4-2","post":"b4-4","hl":{"b4-3":[[171,550],[671,810]]},"hz":{"b4-3":[[49,163],[189,229]]}}]},{"id":"huaco_gualla","l":["huaco","manco","walla"],"t":"瓦奈帕塔","h":"玛玛·瓦科在瓦奈帕塔","m":["exile","memory","water","land"],"x":"萨米恩托说，曼科一行到了瓦奈帕塔，那里住着本地的瓦利亚人。曼科和玛玛·瓦科不顾瓦利亚人的意愿，夺他们的土地和水。瓦利亚人自卫，玛玛·瓦科杀了一个瓦利亚人，把他剖开，把心和肺含在嘴里，手里拿着拴石头的绳索 haibinto，冲向瓦利亚人。瓦利亚人吓得逃走。玛玛·瓦科怕因此被人说成暴君，索性一个不留，能抓到的都杀了，连孕妇腹中的胎儿也剖出来，好让那些可怜的瓦利亚人不留一点痕迹。","e":2,"Q":[{"src":"s","ch":13,"u":["s13-6"],"pre":"s13-5","post":"s13-7","hl":{"s13-6":[[115,182],[253,315],[610,644],[1017,1066],[1260,1317]]},"hz":{"s13-6":[[34,54],[82,101],[201,209],[335,346],[409,426]]}}]},{"id":"manco_sun","e":2,"l":["manco","alca"],"t":"太阳所遣","h":"是太阳派我们来的","m":["gold","heaven"],"x":"曼科·卡帕克对阿尔卡维萨说，是太阳派他们来，要他们和他一起住在库斯科这个村子里。阿尔卡维萨看见他们打扮得那样好，手里拿着金戟，还有别的金器，就相信他们是太阳之子，对他们说：在哪里住最合适，就在哪里住。","Q":[{"src":"b","ch":4,"u":["b4-3","b4-4"],"pre":"b4-2","post":"b5-1","hl":{"b4-3":[[866,1051]],"b4-4":[[0,163]]},"hz":{"b4-3":[[249,305]],"b4-4":[[0,51]]}}]},{"id":"manco_house","e":2,"l":["manco","alca"],"t":"自己盖屋","h":"曼科不让人帮忙盖屋","m":["land"],"x":"曼科看中了如今圣多明我修道院所在的地方，也就是后来的太阳殿，和同伴、四个女人在那里自己盖了一间屋，没有让阿尔卡维萨的人帮忙，尽管他们想帮。种完玉米，曼科·卡帕克和阿尔卡维萨就友好和睦地一起欢乐、嬉游。","Q":[{"src":"b","ch":4,"u":["b4-4"],"pre":"b4-3","post":"b5-1","hl":{"b4-4":[[382,542],[935,1040]]},"hz":{"b4-4":[[105,157],[282,311]]}}]},{"id":"manco_cori","e":2,"l":["manco"],"t":"黄金围院","h":"曼科建科里坎查","m":["local","gold"],"x":"曼科·卡帕克同妻子们建了一座茅草顶的小石屋，起名“科里坎查”，意思是“黄金围院”；后来那座富丽无比的太阳神庙就在此地，如今是多明我会的修道院。那时库斯科一带已经有大量印第安人；他没有伤害他们，他们也就不阻止他住下，反而乐于和他相处。","Q":[{"src":"c","ch":8,"u":["c8-1"],"pre":"c7-7","post":"c8-2","hl":{"c8-1":[[975,1132],[1271,1505]]},"hz":{"c8-1":[[279,326],[363,443]]}}]},{"id":"manco_yupanqui","e":2,"l":["manco"],"t":"又名尤潘基","h":"曼科·卡帕克又名尤潘基","m":["name"],"x":"“尤潘基”是曼科·卡帕克的别名，也是他整个宗族的姓。","Q":[{"src":"b","ch":17,"u":["b17-1"],"pre":"b16-10","post":"b17-2","hl":{"b17-1":[[692,812]]},"hz":{"b17-1":[[220,263]]}}]},{"id":"manco_brothers","e":2,"l":["manco","alca","sahua","quizco"],"t":"都是兄弟","h":"住口，大家都是兄弟","m":["brother","land"],"x":"曼科·卡帕克用诡计进了三个亲族共同体的地方。他一面用好话笼络他们，一面不断从别处带人来，趁夜安插进来，一点一点侵入他们的土地。他们对他说，不要侵入他们的土地。他回答：住口，大家都是兄弟。","Q":[{"src":"t","ch":3,"u":["t3-9"],"pre":"t3-8","post":"t3-10","hl":{"t3-9":[[125,514]]},"hz":{"t3-9":[[25,146]]}}]},{"id":"manco_stroll","e":2,"l":["manco"],"t":"慷他人慨","h":"招揽闲散的人","m":["land"],"x":"萨米恩托说，阿尔卡维萨人住在离因迪坎查（太阳殿）约半火绳枪射程的地方，一直到今天圣克拉拉一带。曼科想站稳脚跟，招揽了一批游荡闲散的人，拿别人的东西慷慨相赠；为了养活他们，不分是谁的地都拿。萨瓦西赖人和瓦利亚人的地已经拿了，又要拿阿尔卡维萨人的；阿尔卡维萨人给了他一些，他还要全部或几乎全部。","Q":[{"src":"s","ch":14,"u":["s14-1"],"pre":"s13-8","post":"s14-2","hl":{"s14-1":[[204,261],[410,497],[520,561]]},"hz":{"s14-1":[[67,90],[139,167],[176,190]]}}]},{"id":"alca_stones","e":2,"l":["alca"],"t":"立界石","h":"阿尔卡维萨人立界石","m":["land","stone"],"x":"萨米恩托说，阿尔卡维萨人过去是、现在也是库斯科谷的本地族群之一。他们见曼科的人一直侵到他们房前，说：这些人好战，不讲道理，夺我们的地！走，把剩下的地立上界石。","Q":[{"src":"s","ch":14,"u":["s14-1"],"pre":"s13-8","post":"s14-2","hl":{"s14-1":[[65,91],[860,899],[926,963]]},"hz":{"s14-1":[[19,33],[291,301],[311,323]]}}]},{"id":"huaco_water","e":2,"l":["huaco","manco"],"t":"断水","h":"玛玛·瓦科出了个主意","m":["water","land"],"x":"玛玛·瓦科说：把阿尔卡维萨人的水全部拿走，他们就只能把剩下的地也交给我们。","Q":[{"src":"s","ch":14,"u":["s14-1"],"pre":"s13-8","post":"s14-2","hl":{"s14-1":[[1023,1062],[1125,1167]]},"hz":{"s14-1":[[350,366],[387,401]]}}]},{"id":"alca_shout","l":["alca","manco"],"t":"滚出去","h":"滚出我们的土地","m":["land","local"],"x":"曼科的人多，也更能打，迫使阿尔卡维萨人让出他们想要的地，并像侍奉主人那样侍奉他们。萨米恩托说，阿尔卡维萨人从来不是心甘情愿侍奉曼科、奉他为主的，总是冲着曼科的人高喊：滚出去，滚出我们的土地！曼科因此更要用暴政毁灭、压制他们。","e":2,"Q":[{"src":"s","ch":14,"u":["s14-1"],"pre":"s13-8","post":"s14-2","hl":{"s14-1":[[1395,1464],[1536,1566]]},"hz":{"s14-1":[[467,500],[519,530]]}}]},{"id":"huaco_gold","e":2,"l":["huaco","sahua"],"t":"金子兵器","h":"玛玛·瓦科来到萨瓦西赖的居地","m":["gold"],"x":"玛玛·瓦科来到萨瓦西赖的居地，开始大肆行凶，用一件绑着一块金子的 ayuinto 杀人。萨瓦西赖看到这个女人的残暴、凶悍与勇猛，逃往荒野。","Q":[{"src":"t","ch":3,"u":["t3-9"],"pre":"t3-8","post":"t3-10","hl":{"t3-9":[[1149,1481]]},"hz":{"t3-9":[[342,431]]}}]},{"id":"copalimaita","l":["copali","sahua"],"t":"打退印加","h":"科帕利迈塔率众抵抗","m":["local","land"],"x":"萨米恩托说，曼科在库斯科东南约一英里的地方遇到科帕利迈塔。他虽是外来者，已经本地人同意成了本地人，并入萨瓦西赖人。萨瓦西赖人见外人进来强占土地，又见了瓦利亚人的遭遇，便奉他为首领。他出来阻挡，叫他们不要进本地人的土地，抵抗得很猛，把曼科一伙打得退回瓦奈帕塔。几个月后印加人又来，突然袭击萨瓦西赖人的村子，抓了科帕利迈塔，杀了许多人。科帕利迈塔怕死，丢下产业换得放行，从此再没出现；曼科和玛玛·瓦科占了他的房屋、产业和人。","e":2,"Q":[{"src":"s","ch":13,"u":["s13-7","s13-8"],"pre":"s13-6","post":"s14-1","hl":{"s13-7":[[86,137],[580,646]],"s13-8":[[345,435]]},"hz":{"s13-7":[[31,50],[184,205]],"s13-8":[[93,127]]}}]},{"id":"four_canchas","l":["manco","huaco","sinchi"],"t":"四个坎查","h":"太阳殿与四个坎查","m":["name"],"x":"萨米恩托说，曼科、玛玛·瓦科、辛奇·罗卡和曼科·萨帕卡在两河之间住下，建太阳殿因迪坎查，把从圣多明我到两河汇流处的地方分成四个街区：金蒂坎查、春比坎查、赛里坎查、亚兰布伊坎查，分给自己人。1572年萨瓦西赖亲族的证人说，金蒂坎查和春比坎查是萨瓦西赖最初的居地。","e":2,"Q":[{"src":"s","ch":13,"u":["s13-8"],"pre":"s13-7","post":"s14-1","hl":{"s13-8":[[618,669],[812,871]]},"hz":{"s13-8":[[200,215],[257,274]]}}]},{"id":"manco_night","e":2,"l":["manco","alca"],"t":"趁夜","h":"趁夜","m":["land"],"x":"他们不断抵抗，曼科·卡帕克和他的人就开始趁夜秘密地、背信弃义地杀害他们。双方为土地起了纷争；曼科的人每天都带人来，还掳走阿尔卡维萨的人去杀掉，因为这些人保卫自己的土地。","Q":[{"src":"t","ch":3,"u":["t3-9"],"pre":"t3-8","post":"t3-10","hl":{"t3-9":[[517,848]]},"hz":{"t3-9":[[147,243]]}}]},{"id":"three_refuse","e":2,"l":["sahua","quizco","alca"],"t":"不认领主","h":"三家都没有承认他","m":[],"x":"上述三个亲族共同体，没有一个承认曼科·卡帕克，奉他为领主，或尊敬他。","Q":[{"src":"t","ch":3,"u":["t3-9"],"pre":"t3-8","post":"t3-10","hl":{"t3-9":[[918,1008]]},"hz":{"t3-9":[[269,296]]}}]},{"id":"walla_flee","e":2,"l":["walla","manco"],"t":"出走","h":"瓦利亚人跟着首领出走","m":["exile","name"],"x":"曼科·卡帕克从坦博托科来，在库斯科住下，不久先后两次带人进来，开始杀瓦利亚人。瓦利亚人害怕，跟着首领阿波卡瓦出走，在离城约二十里格的地方住下，把那里的一个村子也叫作瓦利亚，和他们原先的名字一样。","Q":[{"src":"t","ch":4,"u":["t4-4"],"pre":"t4-3","post":"t4-5","hl":{"t4-4":[[140,402],[571,822]]},"hz":{"t4-4":[[41,118],[165,249]]}}]},{"id":"alca_named","e":2,"l":["alca"],"t":"得名","h":"印加人给他们取了名字","m":["name"],"x":"阿亚尔·乌丘的后人，属于印加人命名为“阿尔卡维萨”的那个亲族共同体。这是他们的祖先告诉他们的。","Q":[{"src":"t","ch":3,"u":["t3-6"],"pre":"t3-5","post":"t3-7","hl":{"t3-6":[[274,385]]},"hz":{"t3-6":[[87,127]]}}]},{"id":"manco_cayau","e":2,"l":["manco","alca"],"t":"流放","h":"曼科把其余的人流放到卡亚乌卡奇","m":["exile","land"],"x":"萨米恩托说，曼科占了所有本地人的房屋产业，尤其是阿尔卡维萨人的，把他们的首领终身监禁，把其余的人流放到卡亚乌卡奇，逼他们纳贡。但这些人和那些人始终想摆脱暴政。","Q":[{"src":"s","ch":14,"u":["s14-2"],"pre":"s14-1","post":"s14-3","hl":{"s14-2":[[465,539],[578,642]]},"hz":{"s14-2":[[151,177],[187,208]]}}]},{"id":"auca_dies","l":["auca","manco"],"t":"两年后死","h":"阿亚尔·奥卡死了","m":[],"x":"贝坦索斯说，曼科·卡帕克来到库斯科两年以后，他的同伴阿亚尔·奥卡死了，没有留下孩子；他的妻子留下来，同曼科的其他女人在一起。","e":2,"Q":[{"src":"b","ch":5,"u":["b5-1"],"pre":"b4-4","post":"b5-2","hl":{"b5-1":[[0,72]]},"hz":{"b5-1":[[0,27]]}}]},{"id":"manco_guard","l":["manco","sinchi"],"t":"不信本地人","h":"十个亲族做护卫","m":[],"x":"曼科年老，自知所作所为，怕儿子和后人保不住他夺来的东西，便命随他从坦博托科来的十个亲族共同体在儿子身边组成护卫，由他们推举继承人。萨米恩托说，他不信本地人会推举他，因为他知道自己对他们作过什么恶、用过什么强。临死他把神鸟 indi、权杖和王者标志留给辛奇·罗卡，没有经过任何本地人同意或推举。萨米恩托说他活了一百四十四岁，死后化为一块一瓦拉高的石头。","e":2,"Q":[{"src":"s","ch":14,"u":["s14-3","s14-4","s14-5"],"pre":"s14-2","post":"s14-6","hl":{"s14-3":[[346,410],[706,767]],"s14-5":[[87,151]]},"hz":{"s14-3":[[115,133],[211,230]],"s14-5":[[21,37]]}}]},{"id":"alca_outlives","e":2,"l":["alca","manco"],"t":"多活五年","h":"阿尔卡维萨比曼科多活了五年","m":[],"x":"曼科·卡帕克死后五年，阿尔卡维萨也死了。","Q":[{"src":"b","ch":5,"u":["b5-1"],"pre":"b4-4","post":"b5-2","hl":{"b5-1":[[604,662]]},"hz":{"b5-1":[[196,215]]}}]},{"id":"sinchi_marry","e":3,"l":["sinchi","sano"],"t":"娶妻","h":"辛奇·罗卡娶了萨尼奥酋长的女儿","m":["marriage"],"x":"辛奇·罗卡二十岁时，娶了离库斯科一里格的萨尼奥村酋长的女儿玛玛·科卡。","Q":[{"src":"b","ch":5,"u":["b5-1"],"pre":"b4-4","post":"b5-2","hl":{"b5-1":[[738,863]]},"hz":{"b5-1":[[236,285]]}}]},{"id":"sinchi_gather","e":3,"l":["sinchi"],"t":"招揽人口","h":"靠关爱，不靠武力","m":["marriage"],"x":"辛奇·罗卡接过王穗，扩建太阳之屋，又用好言抚慰和丰厚的许诺尽量招揽人口。周围的人看到新居民秩序井然，争取各族友谊靠的是关爱和善意，而不是武力和严厉，许多地方都同他们结下了友谊。","Q":[{"src":"c","ch":31,"u":["c31-2","c31-3"],"pre":"c31-1","post":"c31-4","hl":{"c31-2":[[87,276]],"c31-3":[[91,285]]},"hz":{"c31-2":[[24,77]],"c31-3":[[31,81]]}}]},{"id":"sinchi_lake","e":3,"l":["sinchi"],"t":"填湖","h":"填平小湖，运来泥土","m":["water","stone","land"],"x":"当地人说，如今大广场所在之处原有一个小湖和一片泥沼，辛奇·罗卡在盟友和邻人帮助下，用大石板和粗木把它填平。他们还说，整个库斯科谷原本贫瘠，从安第斯大山深处运来成千上万担泥土铺满山谷。西萨说：如果此话属实，山谷就是这样变肥的。","Q":[{"src":"c","ch":31,"u":["c31-2"],"pre":"c31-1","post":"c31-3","hl":{"c31-2":[[445,545],[705,750],[986,1175]]},"hz":{"c31-2":[[136,165],[198,210],[266,320]]}}]},{"id":"sinchi_little","e":3,"l":["sinchi"],"t":"做事不多","h":"说实话，做的事不多","m":["memory"],"x":"关于辛奇·罗卡，和关于其他几位一样，大耳贵族说不出多少事来，因为说实话，他们本来就没做多少事。","Q":[{"src":"c","ch":31,"u":["c31-1"],"pre":"c30-3","post":"c31-2","hl":{"c31-1":[[215,311]]},"hz":{"c31-1":[[67,102]]}}]},{"id":"sinchi_not_elected","l":["sinchi"],"t":"非由推举","h":"本地人都已逃散","m":["memory"],"x":"萨米恩托说，辛奇·罗卡继位，是父亲指定、由那些亲族共同体护着，而不是本地人推举的，因为本地人当时都已逃散、被囚、受伤、被逐，全都是他父亲的死敌。他不是武人，没有什么武功，从没为打仗亲自或派统领出过库斯科；父亲留给他多少就是多少，只靠他的亲族共同体压着父亲打垮的那些人。","e":3,"Q":[{"src":"s","ch":15,"u":["s15-1"],"pre":"s14-6","post":"s16-1","hl":{"s15-1":[[447,550],[689,724]]},"hz":{"s15-1":[[177,210],[252,264]]}}]},{"id":"sano_daughter","e":3,"l":["sano","sinchi","lloque"],"t":"嫁女","h":"萨尼奥统领把女儿嫁给王子","m":["marriage","brother"],"x":"萨尼奥的统领恳切地请辛奇·罗卡收下他美貌的女儿，嫁给王子。印加很为难：答应了，就违背父亲兄妹相婚的规矩；不答应，人家会说库斯科人不近人情、只顾自己。商议之后，大家认为在力量壮大以前不必拘泥父亲的命令。婚事办成，萨尼奥一部同库斯科居民大摆筵席，确认兄弟情谊，从此不分彼此。","Q":[{"src":"c","ch":31,"u":["c31-3","c31-4"],"pre":"c31-2","post":"c31-5","hl":{"c31-3":[[648,968]],"c31-4":[[60,208]]},"hz":{"c31-3":[[182,257]],"c31-4":[[20,65]]}}]},{"id":"lloque_birth","e":4,"l":["lloque"],"t":"生而有齿","h":"略克·尤潘基出生","m":[],"x":"略克·尤潘基生下来就有牙，一生下来就会走路，从来不肯吃奶，随即说出令人惊异的话。贝坦索斯说，依他看，这该是传说里所讲的又一个梅林。","Q":[{"src":"b","ch":5,"u":["b5-2"],"pre":"b5-1","post":"b5-3","hl":{"b5-2":[[32,220]]},"hz":{"b5-2":[[16,76]]}}]},{"id":"lloque_stone","e":4,"l":["lloque","boy"],"t":"投石","h":"出生当天的一块石头","m":["water","stone"],"x":"据说他一生下来就拿起一块石头，朝另一个男孩打去。那男孩是阿尔卡维萨的后裔，当时正从那里经过，手里拿着一个容器，要到泉边去打水。这一石头打断了男孩的一条腿。","Q":[{"src":"b","ch":5,"u":["b5-2"],"pre":"b5-1","post":"b5-3","hl":{"b5-2":[[254,534]]},"hz":{"b5-2":[[85,173]]}}]},{"id":"lloque_prophecy","e":4,"l":["lloque","alca"],"t":"预言","h":"占卜者说","m":["heaven","exile"],"x":"占卜者们就此事说，略克·尤潘基的后裔将成为大领主，统治那个村子；阿尔卡维萨的后裔将被略克·尤潘基的后裔逐出那个村子。据讲述此事的人说，后来果然如此。","Q":[{"src":"b","ch":5,"u":["b5-2"],"pre":"b5-1","post":"b5-3","hl":{"b5-2":[[549,880]]},"hz":{"b5-2":[[174,256]]}}]},{"id":"lloque_nothing","e":4,"l":["lloque"],"t":"此外无事","h":"此外没有更值得一提的事","m":["memory"],"x":"略克·尤潘基在世时，除了上面说的这件事，没有做过更值得一提的事。","Q":[{"src":"b","ch":5,"u":["b5-2"],"pre":"b5-1","post":"b5-3","hl":{"b5-2":[[883,991]]},"hz":{"b5-2":[[257,298]]}}]},{"id":"lloque_hanan","e":4,"l":["lloque","sano"],"t":"让出上城","h":"哈南库斯科给了岳父","m":["marriage","land"],"x":"略克·尤潘基请岳父萨尼奥统领带着全部盟友迁进城里，城中哪一部分他想要都可以给。于是把城最西面山坡上的一部分给了他，叫哈南库斯科；国王带着家族留在平坦低下之处。有人说两位印加须一位出自上城、一位出自下城，西萨说他不信。","Q":[{"src":"c","ch":32,"u":["c32-1"],"pre":"c31-5","post":"c32-2","hl":{"c32-1":[[369,793],[1038,1179]]},"hz":{"c32-1":[[93,226],[305,358]]}}]},{"id":"lloque_heir","e":4,"l":["lloque"],"t":"求子","h":"老王求子","m":["heaven"],"x":"略克·尤潘基年老无子。城中居民到处献祭祈祷，从一处神谕所听说印加会有儿子；大家满怀希望，把老国王抬到他的妻子科娅身上。这样折腾了些日子，她怀孕了，生下了迈塔·卡帕克。西萨说，那处神谕所里听到的都是虚妄的回答。","Q":[{"src":"c","ch":32,"u":["c32-3"],"pre":"c32-2","post":"c32-4","hl":{"c32-3":[[317,650]]},"hz":{"c32-3":[[83,179]]}}]},{"id":"lloque_sun","l":["lloque","god"],"t":"太阳显形","h":"太阳以人形显现","m":["heaven","marriage"],"x":"萨米恩托说，略克·尤潘基越过哥哥曼科·萨帕卡继位，从没为打仗出过库斯科，只同周围几个地方往来，没做过值得记住的事。他年老无子，一天正愁苦，太阳以人形显现，安慰他说：不要难过，略克·尤潘基，你会有许多大领主做后代。他的哥哥曼科·萨帕卡懂他的体质，替他在离库斯科两里格的奥马找了一个合适的女人，叫玛玛·卡瓦，生了迈塔·卡帕克。","e":4,"Q":[{"src":"s","ch":16,"u":["s16-2","s16-3"],"pre":"s16-1","post":"s17-1","hl":{"s16-2":[[141,211],[550,583]],"s16-3":[[0,57]]},"hz":{"s16-2":[[40,63],[168,178]],"s16-3":[[0,16]]}}]},{"id":"mayta_modest","e":5,"l":["mayta"],"t":"不求更大","h":"没有求比先人更大","m":["memory"],"x":"据说迈塔·卡帕克没有求比先人更大。","Q":[{"src":"b","ch":5,"u":["b5-3"],"pre":"b5-2","post":"b5-4","hl":{"b5-3":[[157,270]]},"hz":{"b5-3":[[45,78]]}}]},{"id":"mayta_wed","e":5,"l":["mayta"],"t":"成婚","h":"迈塔·卡帕克娶了奥马的女子","m":["marriage"],"x":"迈塔·卡帕克穿了耳，在许多本地人和外乡人面前接受了王穗。他没有姐妹可娶，便娶了离库斯科约两里格的奥马村一位小领主的女儿，名叫玛玛卡·瓜帕塔。","Q":[{"src":"c","ch":33,"u":["c33-1"],"pre":"c32-5","post":"c33-2","hl":{"c33-1":[[185,425]]},"hz":{"c33-1":[[42,108]]}}]},{"id":"mayta_hercules","l":["mayta"],"t":"三月而生","h":"像赫拉克勒斯一样","m":["memory"],"x":"萨米恩托说，迈塔·卡帕克在这些印第安人中就像我们的赫拉克勒斯：父亲老得被认为不能生育了，母亲怀孕三个月就生下他，生下来就有牙，一岁有八岁孩子的身量和力气，两岁就同大孩子打架、打破他们的头。萨米恩托说，这一切似乎都可以算作神话，但这是本地人对自己和祖先的说法，他们深信不疑，谁要说别的，他们会同他拼命。","e":5,"Q":[{"src":"s","ch":17,"u":["s17-1"],"pre":"s16-3","post":"s17-2","hl":{"s17-1":[[75,125],[481,556],[897,970]]},"hz":{"s17-1":[[33,56],[165,187],[287,316]]}}]},{"id":"mayta_leg","l":["mayta","boy","alca"],"t":"泉边断腿","h":"为泉水打断一条腿","m":["water"],"x":"萨米恩托说，迈塔还很小的时候，同阿尔卡维萨人和库伦奇马人的孩子玩，伤了许多，还打死几个；有一天为在泉边喝水还是打水，他打断了阿尔卡维萨首领儿子的一条腿，又把别的孩子一路追到家里——阿尔卡维萨人本来住在家里，并没有招惹印加。","e":5,"Q":[{"src":"s","ch":17,"u":["s17-2"],"pre":"s17-1","post":"s17-3","hl":{"s17-2":[[195,289],[348,401]]},"hz":{"s17-2":[[65,100],[122,145]]}}]},{"id":"mayta_ball","l":["mayta","alca"],"t":"一个球","h":"十个阿尔卡维萨人闯进太阳殿","m":[],"x":"阿尔卡维萨人受不了迈塔仗着父亲和亲族共同体胡作非为，决定为自由拼命，挑了十个人到太阳殿去杀略克·尤潘基父子。迈塔正在院子里同别的孩子玩球，见敌人拿着兵器进来，抓起一个球打死一个，又打死一个，把其余的人追跑了。","e":5,"Q":[{"src":"s","ch":17,"u":["s17-3"],"pre":"s17-2","post":"s17-4","hl":{"s17-3":[[146,215],[546,606]]},"hz":{"s17-3":[[50,63],[165,183]]}}]},{"id":"lloque_scold","l":["lloque","mayta"],"t":"叫他住口","h":"父亲骂儿子，亲族叫父亲住口","m":["local"],"x":"库斯科谷剩下的本地人都聚起来，要同印加打仗。略克·尤潘基十分害怕，骂儿子：孩子，你为什么对这地方的本地人这样作恶？你想让我老了死在敌人手里吗？那些守着他的亲族共同体靠抢掠为生，喜欢热闹和抢劫，不喜欢安静，便替迈塔说话，叫略克·尤潘基住口，让他儿子去干。略克·尤潘基就不再说了。","e":5,"Q":[{"src":"s","ch":17,"u":["s17-4"],"pre":"s17-3","post":"s17-5","hl":{"s17-4":[[459,521],[762,837]]},"hz":{"s17-4":[[130,147],[214,239]]}}]},{"id":"boy_jug","e":5,"l":["boy","mayta","alca"],"t":"打破水罐","h":"泉边，一只水罐被打破了","m":["water"],"x":"婚礼办过以后，一个库斯科妇女到城边的一处泉水去打水。阿尔卡维萨的街区里出来一个少年，打破了她的水罐，还说了些不知什么话。她哭喊着回到库斯科。这些印第安人本来就爱起哄，立刻拿起武器冲向对方；对方听到喧闹，也已拿起了武器。","Q":[{"src":"c","ch":33,"u":["c33-2"],"pre":"c33-1","post":"c33-3","hl":{"c33-2":[[238,528]]},"hz":{"c33-2":[[65,148]]}}]},{"id":"mayta_pretext","e":5,"l":["mayta","alca"],"t":"借口","h":"拿一件小事做借口","m":["memory"],"x":"印加带着他的人到了近前，双方摆开阵势。他们拿那妇人与少年之间这件小事做借口，其实是想征服那个世系的人，或者让他们从记忆中消失。阿尔卡维萨人很明白这一点。","Q":[{"src":"c","ch":33,"u":["c33-2","c33-3"],"pre":"c33-1","post":"c33-4","hl":{"c33-2":[[693,863]],"c33-3":[[0,48]]},"hz":{"c33-2":[[193,237]],"c33-3":[[0,12]]}}]},{"id":"mayta_battle","e":5,"l":["mayta","alca"],"t":"第一场仗","h":"那个时代的第一场战斗","m":[],"x":"阿尔卡维萨人作为勇敢的人奋力出战，这是那个时代打的第一仗。事出突然，他们来不及找援兵。他们战败了，大多数人被杀，逃出性命的不到五十人。","Q":[{"src":"c","ch":33,"u":["c33-3"],"pre":"c33-2","post":"c33-4","hl":{"c33-3":[[52,163],[357,454]]},"hz":{"c33-3":[[13,39],[85,114]]}}]},{"id":"mayta_hail","e":5,"l":["mayta","alca"],"t":"冰雹","h":"冰雹落在阿尔卡维萨人头上","m":["heaven"],"x":"萨米恩托说，阿尔卡维萨人和库伦奇马人起兵，第一仗被迈塔的亲族共同体打败；又分三路攻太阳殿，迈塔从住处出来，在广场上把他们打败，行了成年礼；阿尔卡维萨人第三次约战，正打着，冰雹落在阿尔卡维萨人头上，他们第三次战败，彻底溃散。迈塔把他们的首领终身监禁，直到他死。","Q":[{"src":"s","ch":17,"u":["s17-5","s17-6"],"pre":"s17-4","post":"s17-7","hl":{"s17-5":[[94,145]],"s17-6":[[196,229],[318,386]]},"hz":{"s17-5":[[29,37]],"s17-6":[[59,76],[97,120]]}}]},{"id":"mayta_indi","l":["mayta"],"t":"打开匣子","h":"迈塔打开了神鸟的匣子","m":["heaven"],"x":"萨米恩托说，曼科从坦博托科带来的神鸟 indi，历代都关在一个草编的匣子里，谁也不敢打开；迈塔·卡帕克胆子比谁都大，想看看祖先这样藏着的是什么，打开匣子，看见了那只鸟，还同它说了话——据说它会降神谕；从此迈塔很有智谋，知道该做什么、会遇到什么。但他还是没有出库斯科谷。","e":5,"Q":[{"src":"s","ch":17,"u":["s17-8","s17-9"],"pre":"s17-7","post":"s18-1","hl":{"s17-8":[[487,539]],"s17-9":[[0,44]]},"hz":{"s17-8":[[150,169]],"s17-9":[[0,16]]}}]},{"id":"mayta_distribut ],"x":"据说他没有求比父亲略克·尤潘基留给他的更大。","Q":[{"src":"b","ch":5,"u":["b5-3"],"pre":"b5-2","post":"b5-4","hl":{"b5-3":[[0,128]]},"hz":{"b5-3":[[2,40]]}}]},{"id":"capac_oath","l":["capac"],"t":"逼兄弟发誓","h":"逼兄弟们发誓","m":["brother"],"x":"萨米恩托说，卡帕克·尤潘基并不是长子；长子孔德·迈塔相貌丑陋，父亲剥夺了他的继承权，让他做大祭司。卡帕克·尤潘基自知即便照他们暴政的规矩也算不得合法的领主，一继位就逼兄弟们发誓，说他们愿意他做卡帕克；兄弟们怕他傲慢残忍，就发了誓。","e":6,"Q":[{"src":"s","ch":18,"u":["s18-1"],"pre":"s17-9","post":"s18-2","hl":{"s18-1":[[181,240],[490,561]]},"hz":{"s18-1":[[53,71],[150,174]]}}]},{"id":"capac_first_out","l":["capac","apomayta"],"t":"第一次出谷","h":"第一个出库斯科谷的印加","m":[],"x":"萨米恩托说，据说他是第一个出库斯科谷去征伐的，用武力征服了离城四里格的库尤马尔卡和安卡斯马尔卡；阿亚尔马卡的一个首领害怕，把女儿送给他做妻子。他的孙子阿波迈塔是极有名的统领，后来同维卡基劳一起，在印加·罗卡和维拉科查·印加时立下大功。","e":6,"Q":[{"src":"s","ch":18,"u":["s18-2"],"pre":"s18-1","post":"s19-1","hl":{"s18-2":[[0,43],[593,670]]},"hz":{"s18-2":[[0,20],[221,252]]}}]},{"id":"capac_outsiders","e":6,"l":["capac"],"t":"外来者","h":"孔德苏尤人要杀尽外来者","m":["local"],"x":"孔德苏尤人趁新王到瓦纳考里献祭时来攻，被打败了。逃回去的人重新召集人马，扬言要么战死，要么毁掉库斯科、杀尽城里所有的外来者；他们还没见到科里坎查神庙，就已经在自己人中间把庙里的贵妇分掉了。第二仗他们又败了，死了六千多人。","Q":[{"src":"c","ch":34,"u":["c34-4"],"pre":"c34-3","post":"c34-5","hl":{"c34-4":[[149,431]]},"hz":{"c34-4":[[33,108]]}}]},{"id":"capac_pardon","e":6,"l":["capac"],"t":"赦免","h":"孔德苏尤人求和","m":["marriage"],"x":"卡帕克·尤潘基追到孔德苏尤人的地方，打到他们来求和，愿意像其他友好的村子那样承认库斯科的领主。他赦免了他们，命自己的人不得伤害、抢夺已经成了朋友的人；又在那里住了些日子，教本地人有秩序地生活，不要再把村子建在高处和雪峰上。那一带还挑了些美貌的少女送往库斯科的太阳神庙。","Q":[{"src":"c","ch":34,"u":["c34-5"],"pre":"c34-4","post":"c34-6","hl":{"c34-5":[[227,375],[557,679]]},"hz":{"c34-5":[[62,106],[153,184]]}}]},{"id":"capac_andahuaylas","e":6,"l":["capac"],"t":"遣使结盟","h":"西面的领主遣使来","m":["marriage"],"x":"库斯科的名声传开了。西面直到安达瓦伊拉斯的领主派使者带着厚礼来，请卡帕克·尤潘基把他们当作朋友和盟友。使者在城里住了些日子，觉得亲眼所见比听说的还好，回去照实说了。","Q":[{"src":"c","ch":34,"u":["c34-7"],"pre":"c34-6","post":"c34-8","hl":{"c34-7":[[161,307],[520,575]]},"hz":{"c34-7":[[37,71],[125,139]]}}]},{"id":"roca_children","e":7,"l":["roca"],"t":"三十子女","h":"六个妻子，三十个儿女","m":[],"x":"据说他有六个妻子，生了三十个儿女。","Q":[{"src":"b","ch":5,"u":["b5-3"],"pre":"b5-2","post":"b5-4","hl":{"b5-3":[[319,429]]},"hz":{"b5-3":[[88,119]]}}]},{"id":"roca_ear","e":7,"l":["roca"],"t":"耳血引水","h":"印加·罗卡的左耳","m":["water","heaven"],"x":"印加·罗卡穿耳时，一只耳朵疼得厉害，他出城到附近一座叫查卡的高山上。那时城里没有河流经过。他向蒂西维拉科查、瓦纳考里、太阳和祖先祈祷，求他们指示怎样凭人力把一条河或一道水渠引进城里。一声巨雷，他吓得低下头，左耳贴到地上，耳中流出很多血；他忽然听见地底下有很大的水声。城里的人赶来挖，挖到了那股水，用大石板铺了河底，把它引到城中央。","Q":[{"src":"c","ch":35,"u":["c35-1","c35-2"],"pre":"c34-8","post":"c35-3","hl":{"c35-1":[[1502,1792]],"c35-2":[[263,447]]},"hz":{"c35-1":[[399,467]],"c35-2":[[66,101]]}}]},{"id":"roca_waters","l":["roca","apomayta"],"t":"上水下水","h":"上水与下水","m":["water"],"x":"萨米恩托说，印加·罗卡靠侄子阿波迈塔，征服了离城四里格多的穆伊纳和皮纳瓦，杀了首领穆伊纳·蓬戈（另一个首领瓦曼图帕克据说逃走了）；又发现并开渠引来“上水”和“下水”，库斯科的田地至今靠这两道水灌溉，他的子孙后代至今还占有着。后来他就沉湎于享乐宴饮，过起安逸日子，溺爱儿子，为了他们，把村子乃至自己都忘了。","e":7,"Q":[{"src":"s","ch":19,"u":["s19-1","s19-2"],"pre":"s18-2","post":"s19-3","hl":{"s19-1":[[591,655]],"s19-2":[[0,68]]},"hz":{"s19-1":[[208,227]],"s19-2":[[0,17]]}}]},{"id":"roca_hanan","l":["roca"],"t":"另立上城","h":"印加·罗卡另立哈南库斯科","m":["land","name"],"x":"萨米恩托说，此前历代印加都住在库斯科的下部，所以叫乌林库斯科；印加·罗卡命令他的后人另立一部，叫哈南库斯科，即“上部的库斯科人”；从他起，历代都搬出太阳殿，往城的高处另建宅第，每一代都不住父亲的房子。他又说，这些亲族共同体到帕查库蒂时又改组过，所以也有人说这两部是那时才分的。","e":7,"Q":[{"src":"s","ch":19,"u":["s19-3"],"pre":"s19-2","post":"s19-4","hl":{"s19-3":[[245,326],[1066,1163]]},"hz":{"s19-3":[[73,90],[326,352]]}}]},{"id":"roca_pomatambo","e":7,"l":["roca"],"t":"宽赦","h":"在波马坦博获胜","m":["gold","marriage"],"x":"印加·罗卡出城献祭，用许多巧计和好话，尽可能把人拉为朋友。他在孔德苏尤的波马坦博同当地人打了一仗，获胜后十分宽厚地赦免了他们，同他们共商大事；他们因此爱戴他，自愿为他效力、纳贡。他凯旋回城时，前面有头人手持金斧金戟护卫。","Q":[{"src":"c","ch":35,"u":["c35-4"],"pre":"c35-3","post":"c35-5","hl":{"c35-4":[[271,512]]},"hz":{"c35-4":[[76,150]]}}]},{"id":"roca_son","e":7,"l":["roca"],"t":"为子娶妇","h":"为长子娶妇","m":["marriage"],"x":"印加·罗卡有许多儿子，没有一个女儿。他死前为长子娶了阿亚尔马卡的一位女子，名叫玛玛·奇基亚。","Q":[{"src":"c","ch":35,"u":["c35-5"],"pre":"c35-4","post":"c36-1","hl":{"c35-5":[[0,45],[143,290]]},"hz":{"c35-5":[[0,16],[45,88]]}}]},{"id":"roca_mourn","e":7,"l":["roca"],"t":"盟友吊丧","h":"盟友来吊丧","m":["marriage","memory"],"x":"印加·罗卡死后，孔德苏尤、乌尔科斯、阿亚尔马卡以及其他已经结盟交好的地方，来了许多男女，为他大哭。人们为他造了像，把他算作他们的神之一。","Q":[{"src":"c","ch":36,"u":["c36-1"],"pre":"c35-5","post":"c36-2","hl":{"c36-1":[[0,232]]},"hz":{"c36-1":[[0,62]]}},{"src":"c","ch":36,"u":["c36-3"],"pre":null,"post":"c36-4","hl":{"c36-3":[[0,114]]},"hz":{"c36-3":[[0,34]]}}]},{"id":"yahuar_blood","e":8,"l":["yahuar"],"t":"哭血","h":"生下来就哭出血来","m":["name","memory"],"x":"据说他生下来就哭出血来，所以人们叫他亚瓦尔·瓦卡克，意思是“哭血”。据说他有二十个妻子，生了五十个儿女；据说他也没有求比先人留给他的更大。","Q":[{"src":"b","ch":5,"u":["b5-3","b5-4"],"pre":"b5-2","post":"b6-1","hl":{"b5-3":[[552,759]],"b5-4":[[0,34]]},"hz":{"b5-3":[[159,215]],"b5-4":[[0,12]]}}]},{"id":"yahuar_kidnap","l":["yahuar","roca","tocay"],"t":"被劫","h":"八岁的孩子被劫走","m":["marriage"],"x":"萨米恩托说，瓦伊利亚坎人原把玛玛·米凯许给阿亚尔马卡人的首领托凯·卡帕克，却把她嫁给了印加·罗卡，两边打了多年。阿亚尔马卡人强，提出讲和的条件：把印加·罗卡的儿子提托·库西·瓦尔帕交到他们手里。孩子的舅家瓦伊利亚坎人答应了，骗印加·罗卡把八岁的孩子送到保罗村，说要让他认亲、立他做产业的继承人，然后让阿亚尔马卡人趁他们下地时来把孩子劫走；护送孩子的库斯科大耳贵族全被杀了。","e":8,"Q":[{"src":"s","ch":20,"u":["s20-1"],"pre":"s19-4","post":"s20-2","hl":{"s20-1":[[1184,1269],[1546,1580]]},"hz":{"s20-1":[[356,385],[463,476]]}}]},{"id":"yahuar_tears","l":["yahuar","tocay","roca"],"t":"血泪","h":"对着库斯科哭","m":["name","heaven"],"x":"萨米恩托说，托凯·卡帕克问孩子是不是玛玛·米凯的儿子，孩子大胆回答：我是母亲玛玛·米凯、父亲印加·罗卡的儿子。托凯·卡帕克大怒，下令杀他。孩子怕死哭起来，眼里迸出血泪，诅咒阿亚尔马卡人：你们要是杀我，诅咒会落到你们和你们子孙身上，叫你们全族灭绝，不留记忆。阿亚尔马卡人吓住了，收回成命，给他起名亚瓦尔·瓦卡克，意思是“血泪”；又叫他转过脸去对着库斯科哭，好让诅咒落到库斯科人身上，他照做了。他们把他关在牧场里，只给很少的吃的，想让他慢慢饿死。印加·罗卡不知儿子死活，怕他被杀，不敢对阿亚尔马卡开战。","e":8,"Q":[{"src":"s","ch":21,"u":["s21-2","s21-3"],"pre":"s21-1","post":"s22-1","hl":{"s21-2":[[751,790],[1454,1477],[1726,1772]],"s21-3":[[456,532]]},"hz":{"s21-2":[[229,237],[445,457],[510,522]],"s21-3":[[137,163]]}}]},{"id":"chimbo_rescue","l":["chimbo","yahuar","tocay"],"t":"暗中送饭","h":"钦博·奥尔玛","m":[],"x":"孩子在牧场关了一年。托凯·卡帕克的妾钦博·奥尔玛是安塔头人的女儿，能随意进出，见了这个俊秀的孩子，问了他的身世，便暗中给他送吃的，又同父亲兄弟设计：一天孩子同别的孩子比赛跑上山，安塔人藏在山后，抱起他就往安塔跑。看守追到瓦伊蓬湖，被安塔人打败。","e":8,"Q":[{"src":"s","ch":22,"u":["s22-1","s22-2"],"pre":"s21-3","post":"s22-3","hl":{"s22-1":[[345,384],[770,800]],"s22-2":[[965,1002]]},"hz":{"s22-1":[[105,120],[239,249]],"s22-2":[[274,284]]}}]},{"id":"anta_kin","l":["yahuar","roca"],"t":"称作亲戚","h":"安塔人成了亲戚","m":["marriage","name"],"x":"安塔人把孩子藏了一年，才派人去问印加·罗卡：请让我们见见你的继承人。印加·罗卡说儿子被阿亚尔马卡人偷了；追问再三，才知道儿子在安塔，又派一个穷人假装讨饭去打听，确实如此。他送去金银衣物，安塔人不要，说只有一个条件：从此库斯科的大耳贵族要称他们为亲属。印加·罗卡亲自去安塔答应了，从此安塔人就称为库斯科人的亲属。","e":8,"Q":[{"src":"s","ch":22,"u":["s22-3"],"pre":"s22-2","post":"s22-4","hl":{"s22-3":[[561,614],[743,813],[927,1001]]},"hz":{"s22-3":[[173,197],[239,259],[305,330]]}}]},{"id":"tocay_peace","l":["roca","yahuar","tocay"],"t":"互嫁女儿","h":"同托凯·卡帕克讲和","m":["marriage"],"x":"萨米恩托说，印加·罗卡死前同托凯·卡帕克讲和：托凯·卡帕克的女儿玛玛·奇基亚嫁给亚瓦尔·瓦卡克，印加·罗卡把自己的女儿库里·奥克略嫁给托凯·卡帕克。西萨也说，印加·罗卡为长子娶了阿亚尔马卡的女子玛玛·奇基亚。","e":8,"Q":[{"src":"s","ch":22,"u":["s22-4"],"pre":"s22-3","post":"s23-1","hl":{"s22-4":[[333,389],[451,512]]},"hz":{"s22-4":[[127,153],[166,202]]}}]},{"id":"yahuar_proxy","e":8,"l":["yahuar"],"t":"替身","h":"新王闭门斋戒","m":[],"x":"印加·罗卡死后，新王闭门斋戒，不近女色。为防他不在时城中生乱，他命本宗族一位最显要的人在公众面前代表他本人，可以惩罚有过错的人，直到他戴着王穗出来。西萨书中这位第七位王名叫印加·尤潘基。","Q":[{"src":"c","ch":36,"u":["c36-4"],"pre":"c36-3","post":"c38-1","hl":{"c36-4":[[87,429]]},"hz":{"c36-4":[[20,98]]}}]},{"id":"elders_songs","e":8,"l":["elders"],"t":"少提不提","h":"王死以后","m":["memory"],"x":"王死以后，长老们评议他的一生。若他勇敢、善于治理，没有丢掉父亲留下的任何一个省，就为他编出光荣的歌谣，在大聚会和节庆时对着印加高声吟唱。若他懈怠、怯懦、耽于逸乐、没有扩大疆土，就下令对他少提或不提；保留下来的，只是为了不忘他的名字和世系。西萨说，所以直到今天，他们讲五百年前的事，就像讲不到十年前的事一样。","Q":[{"src":"c","ch":11,"u":["c11-1","c11-2"],"pre":"c9-2","post":"c11-3","hl":{"c11-1":[[2020,2158]],"c11-2":[[1045,1321]]},"hz":{"c11-1":[[550,588]],"c11-2":[[250,333]]}}]},{"id":"elders_rule","e":8,"l":["elders"],"t":"不准讲","h":"诸王的出身，只在特定日子讲","m":["memory"],"x":"每位王在位时，挑三四位老人把这期间各省发生的事，无论好坏，都记在心里，编成歌谣；这些歌谣只准在王面前唱，王在世时不得谈论，王死后才向新王禀报。诸王的伟大、起源和出身，只在大喜的日子或王室有人去世的哭丧日才准讲，其余时候谁讲就严惩。","Q":[{"src":"c","ch":12,"u":["c12-1"],"pre":"c11-4","post":"c12-2","hl":{"c12-1":[[835,930],[2335,2573]]},"hz":{"c12-1":[[200,223],[607,684]]}}]},{"id":"vira_woman","e":9,"l":["vira"],"t":"妇人提名","h":"哈南库斯科的一位妇人","m":[],"x":"前王死后，城中头人商议立谁为王。有人主张不要国王，由选定的人治理城市；有人说没有首领城就完了。争得正凶，一个哈南库斯科的妇人从旁走出来说：你们还在磨蹭什么？为什么不奉维拉科查·印加为领主？他也配。众人放下酒杯，急忙去找维拉科查·印加。","Q":[{"src":"c","ch":38,"u":["c38-1","c38-2"],"pre":"c36-4","post":"c38-3","hl":{"c38-1":[[311,448]],"c38-2":[[70,352]]},"hz":{"c38-1":[[75,109]],"c38-2":[[25,120]]}}]},{"id":"vira_name","e":9,"l":["vira","god"],"t":"王与神","h":"神在夜里同他说话了","m":["name","heaven"],"x":"他待自己的人十分友善、和蔼，常常赏赐他们，他的人都真心爱戴他。有一天早上，他高高兴兴地出来，说维拉科查·帕查亚查奇克在那天夜里同他说话了。他的人都站起来，称他为维拉科查·印加，意思是“王与神”。","Q":[{"src":"b","ch":5,"u":["b5-4"],"pre":"b5-3","post":"b6-1","hl":{"b5-4":[[354,679]]},"hz":{"b5-4":[[101,202]]}}]},{"id":"vira_urcos","l":["vira","god"],"t":"乌尔科斯","h":"维拉科查在乌尔科斯夜里显现","m":["name","heaven"],"x":"萨米恩托说，他小时候叫哈通·图帕克·印加。有一次在离库斯科五里格多的乌尔科斯——那里有蒂西维拉科查的华丽圣地——维拉科查夜里向他显现，预告他和他的后代有大福。早上他把这事告诉大耳贵族，他的总管瓦尔帕·里马切向他道贺，称他：啊，维拉科查·印加！众人跟着称呼，他就一辈子用了这个名字。也有人说，是因为他穿耳成年时，以蒂西维拉科查为教父。","e":9,"Q":[{"src":"s","ch":24,"u":["s24-1"],"pre":"s23-4","post":"s24-2","hl":{"s24-1":[[490,522],[784,804],[1028,1079]]},"hz":{"s24-1":[[172,182],[264,272],[352,370]]}}]},{"id":"carmenga","l":["vira","alca"],"t":"城内互攻","h":"卡尔门加与卡亚乌卡奇","m":["local"],"x":"萨米恩托说，前几代印加只抢掠，不在征服的地方留驻军，人家一有机会就起来争自由，所以同一个村子被好几代印加征服过。甚至在库斯科城内，卡尔门加郊区的人也同卡亚乌卡奇郊区的人打仗。前七代印加只是靠亲族共同体的力量吓住库斯科人和近处几个地方，刀枪一离开，人家就喊着自由拿起武器；连库斯科城里的人，也一直坚持到维拉科查·印加的时候。","e":9,"Q":[{"src":"s","ch":24,"u":["s24-2"],"pre":"s24-1","post":"s24-3","hl":{"s24-2":[[956,1076],[1288,1355]]},"hz":{"s24-2":[[302,341],[401,425]]}}]},{"id":"vira_cuzco","l":["vira","apomayta"],"t":"先征服库斯科","h":"先征服库斯科城里的人","m":["local"],"x":"维拉科查选了两个大耳贵族阿波迈塔和维卡基劳做统领，萨米恩托说这两人残忍不仁；他首先征服库斯科城里那些不是印加大耳贵族的居民，杀了许多人。萨米恩托又说：可以说他连库斯科本身也重新以暴政征服了一遍。","e":9,"Q":[{"src":"s","ch":24,"u":["s24-3"],"pre":"s24-2","post":"s24-4","hl":{"s24-3":[[256,341]]},"hz":{"s24-3":[[93,115]]}},{"src":"s","ch":25,"u":["s25-3"],"pre":"s25-2","post":"s25-4","hl":{"s25-3":[[1780,1829]]},"hz":{"s25-3":[[576,599]]}}]},{"id":"vira_tocay","l":["vira","tocay"],"t":"杀托凯","h":"杀了托凯·卡帕克","m":[],"x":"萨米恩托说，维拉科查以长子印加·罗卡为统帅，阿波迈塔、维卡基劳为副，带着少年印加·尤潘基出征，摧毁了瓦伊帕尔马尔卡村和阿亚尔马卡人，杀了他们的首领托凯·卡帕克；他征服的地方都在库斯科周围最多七八里格以内。","e":9,"Q" :28,"u":["s28-5"],"pre":"s28-4","post":"s29-1","hl":{"s28-5":[[735,813]]},"hz":{"s28-5":[[244,273]]}}]},{"id":"pacha_crowned","l":["pacha"],"t":"太阳像授穗","h":"太阳像手里的王穗","m":["heaven","name"],"x":"萨米恩托说，印加·尤潘基不等父亲指定他，也不等父亲死，就在太阳殿献祭，问太阳像谁该做印加；那里的魔鬼神谕——或许是他们藏起来的哪个印第安人——回答说，太阳指定帕查库蒂·印加·尤潘基。第二天众人领他到太阳殿，太阳像手里拿着王穗，像是自愿献出；大祭司从像手中取下王穗，给他戴在额上。萨米恩托说，他就这样做了唯一的印加，没有父亲的推举，也没有各族的推举，只有那些因他的赏赐而归附他的人。","e":10,"Q":[{"src":"s","ch":29,"u":["s29-1","s29-2"],"pre":"s28-5","post":"s30-1","hl":{"s29-1":[[449,519]],"s29-2":[[220,290],[968,1003]]},"hz":{"s29-1":[[129,149]],"s29-2":[[77,96],[332,354]]}}]},{"id":"pacha_sun","e":10,"l":["pacha"],"t":"太阳之子","h":"太阳之子","m":["heaven","name"],"x":"印加·尤潘基推想，战前所见那位光芒四射、始终没有说出自己是谁的人，应当就是太阳。那一位对他说的第一句话是“孩子，别怕”，他的人后来便称他为太阳之子。","Q":[{"src":"b","ch":11,"u":["b11-1"],"pre":"b8-2","post":"b12-1","hl":{"b11-1":[[577,806]]},"hz":{"b11-1":[[172,243]]}}]},{"id":"pacha_fake","e":10,"l":["pacha"],"t":"假装","h":"太阳同他说话","m":["heaven"],"x":"贝坦索斯说，这位领主更可笑的是：他每要造一个神像，就走进太阳殿，假装太阳同他说话，他自己也回答太阳，好让他的人相信是太阳命他造那些神像和圣地。","Q":[{"src":"b","ch":32,"u":["b32-2","b32-3"],"pre":"b32-1","post":"b32-4","hl":{"b32-2":[[1027,1186]],"b32-3":[[0,110]]},"hz":{"b32-2":[[320,364]],"b32-3":[[0,26]]}}]},{"id":"lords_native","e":10,"l":["pacha"],"t":"本地人","h":"库斯科的领主们","m":["local"],"x":"印加·尤潘基要建太阳殿，召集身边的库斯科领主商量。领主们说，请他定下规制和图样，因为这样的殿，理应由他们这些库斯科城的本地人来修建。","Q":[{"src":"b","ch":11,"u":["b11-1"],"pre":"b8-2","post":"b12-1","hl":{"b11-1":[[1046,1217]]},"hz":{"b11-1":[[314,365]]}}]},{"id":"victory_song","e":10,"l":["pacha","usco"],"t":"歌舞六天","h":"战胜昌卡的庆典","m":["memory"],"x":"库斯科领主的妻子们领唱，唱乌斯科维尔卡来攻、维拉科查·印加出走、印加·尤潘基得太阳之助擒杀敌人，向太阳和太阳之子致谢。奇恰酒极多，古柯分给众人，歌舞了六天。","Q":[{"src":"b","ch":13,"u":["b13-1"],"pre":"b12-7","post":"b14-1","hl":{"b13-1":[[107,333]]},"hz":{"b13-1":[[29,93]]}}]},{"id":"pacha_land","e":10,"l":["pacha"],"t":"界石埋炭","h":"重新分地，立永久界石","m":["land","stone"],"x":"印加·尤潘基把库斯科城周围的土地按户分给库斯科的领主和居民，命他们竖起高大的界桩和界石，造得永不湮没，并在每一块界石底下埋上一些木炭：万一哪天界石倒了，凭木炭也能认出地界。","Q":[{"src":"b","ch":12,"u":["b12-3"],"pre":"b12- 亲眼见过保罗·印加死后一年为他举行的这种祭礼（约在1550年）。","e":11,"Q":[{"src":"b","ch":31,"u":["b31-5"],"pre":"b31-4","post":"b31-6","hl":{"b31-5":[[520,566],[939,1027]]},"hz":{"b31-5":[[128,140],[246,271]]}}]},{"id":"topa_rule","e":11,"l":["topa","pacha"],"t":"不出两溪","h":"王者世系","m":["local","name"],"x":"父亲死后，图帕克·印加·尤潘基规定，印加·尤潘基的后裔谁都不得住到库斯科两条溪流以外；这些后裔称为“卡帕克·艾柳·印加·尤潘基·瓦伊明”，意思是王者世系、印加·尤潘基的子孙，在库斯科人中最受尊崇，头上可以戴两根羽毛。","Q":[{"src":"b","ch":32,"u":["b32-3"],"pre":"b32-2","post":"b32-4","hl":{"b32-3":[[1001,1285]]},"hz":{"b32-3":[[286,377]]}}]},{"id":"topa_walla","e":11,"l":["topa","walla"],"t":"再次征服","h":"瓦利亚人在新村被再次征服","m":["exile"],"x":"瓦利亚人的祖先逃走以后，没有领主，也没有臣服于任何人，直到图帕克·印加·尤潘基凭武力，在他们迁去居住的地方再次征服了他们。不服从的人被他杀掉。","Q":[{"src":"t","ch":4,"u":["t4-5"],"pre":"t4-4","post":"t5-1","hl":{"t4-5":[[1039,1301]]},"hz":{"t4-5":[[298,385]]}}]},{"id":"juan_saw","e":12,"l":["juan"],"t":"见过二王","h":"他见过瓦伊纳·卡帕克","m":[],"x":"胡安·皮萨罗、塞巴斯蒂安·尤潘基、堂弗朗西斯科·基斯皮、堂迭戈·尤潘基和堂佩德罗·莱昂·皮奥卡里说，他们本人见过瓦伊纳·卡帕克和他的儿子瓦斯卡尔·印加，但从未心甘情愿地奉他们为领主，只是怕被杀而畏惧他们。","Q":[{"src":"t","ch":3,"u":["t3-12"],"pre":"t3-11","post":"t3-13","hl":{"t3-12":[[368,656]]},"hz":{"t3-12":[[99,202]]}}]},{"id":"alca_glad","e":13,"l":["alca","juan"],"t":"很高兴","h":"西班牙人来了","m":["gold","land"],"x":"西班牙人进入这片土地时，阿尔卡维萨人很高兴。阿尔卡维萨的后人瓦尔帕罗卡，也就是胡安·皮萨罗的兄弟，让人从他们的圣地、仓库和藏匿处尽可能多地取出金银，送给西班牙人，好让西班牙人帮他们对付印加人，并把原属他们祖先的土地还给他们。","Q":[{"src":"t","ch":3,"u":["t3-11"],"pre":"t3-10","post":"t3-12","hl":{"t3-11":[[565,989]]},"hz":{"t3-11":[[148,278]]}}]},{"id":"juan_gold","e":13,"l":["juan"],"t":"交出金银","h":"金银交给了皮萨罗侯爵","m":["gold"],"x":"阿塔瓦尔帕被俘以后，西班牙人进行了一次总征收。胡安·皮萨罗·尤潘基和其他许多人一起，随这次总征收把那些金银送了过去，交给了弗朗西斯科·皮萨罗侯爵。","Q":[{"src":"t","ch":3,"u":["t3-11"],"pre":"t3-10","post":"t3-12","hl":{"t3-11":[[992,1187],[1257,1300]]},"hz":{"t3-11":[[279,345],[368,385]]}}]},{"id":"juan_grudge","e":13,"l":["juan"],"t":"结怨","h":"瓦伊纳·卡帕克的后裔知道了","m":[],"x":"瓦伊纳·卡帕克的后裔诸印加得知此事，对他们非常怨恨。证人们认为，要不是西班牙人占领并统治了这片土地，那些印加会因为这次背叛把他们全部杀光。","Q":[{"src":"t","ch":3,"u":["t3-11"],"pre":"t3-10","post":"t3-12","hl":{"t3-11":[[1301,1519]]},"hz":{"t3-11":[[386,453]]}}]},{"id":"atahualpa_not_king","l":["cieza"],"t":"不算王","h":"阿塔瓦尔帕不算王","m":["name"],"x":"西萨说，印加诸王的王穗要在库斯科授。授穗之前，新王要斋戒一个月，到阿纳瓦尔山上从山脚一路跑上去，在亚维拉山上当众同显要们生吃羊肉——意思是若不勇敢，敌人就会这样吃他们——对着太阳宣誓保卫库斯科，然后穿耳；做皇帝的还要先娶他唯一的姐妹。斋戒期间，由城中一位显要代行统治。新王在科里坎查神庙领受祝福，他们所统治的四里格多地方的主要领主都来观礼。王穗不是在库斯科授的，他们就把那个自称印加的人当作笑话，不认为他的统治确实稳固。所以阿塔瓦尔帕不算王，尽管他勇武过人、杀人很多，许多族群出于畏惧服从了他。","e":13,"Q":[{"src":"c","ch":7,"u":["c7-4","c7-5","c7-6"],"pre":"c7-3","post":"c7-7","hl":{"c7-4":[[465,572]],"c7-5":[[648,754],[1920,1993]],"c7-6":[[1166,1213],[1256,1293]]},"hz":{"c7-4":[[118,154]],"c7-5":[[182,240],[499,517]],"c7-6":[[305,344]]}}]},{"id":"angelina_gold","e":13,"l":["angelina","pacha"],"t":"金像下落","h":"墓上的金像","m":["gold"],"x":"帕查库蒂葬在帕塔利亚克塔，墓上立着一尊照他模样做的金像。多尼亚·安赫利娜·尤潘基告诉弗朗西斯科·皮萨罗侯爵这尊像在哪里，侯爵就和其他财宝一起得到了它。用他指甲和头发做的那尊像，曼科·印加起兵时从库斯科带走了。今天只剩他的遗体还在帕塔利亚克塔。","Q":[{"src":"b","ch":32,"u":["b32-3"],"pre":"b32-2","post":"b32-4","hl":{"b32-3":[[554,852]]},"hz":{"b32-3":[[158,254]]}}]},{"id":"cieza_laugh","e":14,"l":["cieza"],"t":"自己也笑","h":"宁可删去许多，也不添一件","m":["memory"],"x":"西萨写到曼科·卡帕克建城时说：对于我写的这些印第安人的事，我自己也觉得好笑；我写的是他们讲给我的，而且我宁可删去许多，也不添一件。","Q":[{"src":"c","ch":8,"u":["c8-1"],"pre":"c7-7","post":"c8-2","hl":{"c8-1":[[0,161]]},"hz":{"c8-1":[[0,60]]}}]},{"id":"cieza_cayu","e":14,"l":["cieza"],"t":"访谈","h":"西萨召集卡尤·图帕克","m":["memory"],"x":"西萨到了库斯科，召集了瓦伊纳·卡帕克的后裔中唯一还在世的卡尤·图帕克，还有其他大耳贵族，通过能找到的最好的通译，问他们：这些印加君主是什么样的人，属于哪个民族。他说有些印第安人讲法不同，他依从大耳贵族，因为他们比谁都清楚。","Q":[{"src":"c","ch":6,"u":["c6-1"],"pre":"c4-2","post":"c6-2","hl":{"c6-1":[[454,609],[867,991]]},"hz":{"c6-1":[[148,215],[306,341]]}},{"src":"c","ch":6,"u":["c6-3"],"pre":null,"post":"c6-4","hl":{"c6-3":[[0,189]]},"hz":{"c6-3":[[0,54]]}}]},{"id":"cieza_rational","l":["cieza"],"t":"三个兄弟","h":"西萨自己的解释","m":["memory"],"x":"西萨记下帕卡里坦博的起源故事以后说：至于他们编造的这些，我自己认为可信的是，正如萨帕纳在阿通科亚奥兴起一样，这几个出现的印加人，大概是三个勇武刚强、胸怀大志的兄弟，或是本地某个村落的人，或是从安第斯山那边来的，找到机会，就征服、取得了后来的统治权；不然，他们讲的阿亚尔·卡切那些事，也可能说明这些人会法术，凭魔鬼的伎俩办事。总之，从他们那里得不出别的东西。","e":14,"Q":[{"src":"c","ch":6,"u":["c6-5"],"pre":"c6-4","post":"c6-6","hl":{"c6-5":[[576,664],[1040,1080]]},"hz":{"c6-5":[[180,207],[308,325]]}}]},{"id":"cieza_vira","e":14,"l":["cieza"],"t":"问名","h":"维拉科查这个名字从何而来","m":["name"],"x":"西萨拿“维拉科查留着胡子、像个西班牙人”的说法去问卡尤·图帕克和其他最显要的人。他们回答说这是笑话，全不是真的：维拉科查·印加生在库斯科、长在库斯科，他的父辈祖辈也是如此；维拉科查只是给他起的个人名字，就像人人都有自己的名字一样。","Q":[{"src":"c","ch":38,"u":["c38-2"],"pre":"c38-1","post":"c38-3","hl":{"c38-2":[[1030,1418]]},"hz":{"c38-2":[[306,331],[359,438]]}}]},{"id":"cieza_forgot","e":14,"l":["cieza"],"t":"多已遗忘","h":"前代的事遗忘了许多","m":["memory"],"x":"西萨写道：十一位印加中，只有三位的事迹清楚；国中到处是认识图帕克·印加·尤潘基、跟他打过仗的印第安人，而前代诸位君主的事，已经遗忘了许多。","Q":[{"src":"c","ch":9,"u":["c9-2"],"pre":"c9-1","post":"c11-1","hl":{"c9-2":[[440,573],[744,824]]},"hz":{"c9-2":[[124,164],[208,232]]}}]},{"id":"cieza_river","e":14,"l":["cieza"],"t":"看过那河","h":"西萨看过那条河","m":["water","gold"],"x":"西萨亲眼看过印加·罗卡引进城的那条河，确实像人们说的那样流。如今河岸边堆满了垃圾和污物；印加时代河里很干净，水从石板上流过，印加人有时带着妻子去河里洗澡。好几次，有西班牙人在河里捡到不少金子，不是纯金，是她们洗澡时留下或掉落的小首饰和托波。","Q":[{"src":"c","ch":35,"u":["c35-3"],"pre":"c35-2","post":"c35-4","hl":{"c35-3":[[0,69],[503,657],[768,927]]},"hz":{"c35-3":[[0,17],[150,187],[217,261]]}}]},{"id":"cieza_quipu","l":["cieza"],"t":"一双麻鞋","h":"西萨看了一回结绳账","m":["memory","gold"],"x":"西萨原先不信结绳记账，大半当作无稽之谈；他在豪哈的迈卡维尔卡，请领主瓦科拉波拉给他看账。领主叫仆人取来基普，告诉他：自总督皮萨罗进入这个山谷以来，他这一方交给西班牙人的一切都记在上面，一样不少。西萨看了金、银、衣物、玉米、牲畜的账，目瞪口呆。他说这种账目精到连一双麻鞋也藏不住；又说要不是印第安人习惯了这样严密的秩序，经过西班牙人那样的战争、残暴、抢劫和暴政，早就灭绝了。他后来又在页边补了一条：国王派去查账的大耳贵族要是死在路上，本地人就当场作证，掏去他的肠子，一村一村把他抬回出发的地方，连同发誓亲眼见他死去的人一起呈给国王。","e":14,"Q":[{"src":"c","ch":12,"u":["c12-2","c12-3"],"pre":"c12-1","post":"c12-4","hl":{"c12-2":[[1348,1402]],"c12-3":[[166,232],[554,696]]},"hz":{"c12-2":[[388,400]],"c12-3":[[52,68],[155,201]]}},{"src":"c","ch":12,"u":["c12-5"],"pre":null,"post":"c30-1","hl":{"c12-5":[[363,439],[548,588]]},"hz":{"c12-5":[[86,132],[144,154]]}}]},{"id":"cieza_harvest","e":14,"l":["cieza"],"t":"只唱不祭","h":"1550年8月，丰收节只唱歌","m":["memory"],"x":"1550年8月，西萨在库斯科看见印第安人收完庄稼，带着妻子、扛着犁、拿着土豆和玉米进城，过节只是唱歌，唱他们从前怎样庆祝丰收。当政的阿波们和神父们不许公开过这些异教节日，知道了也不许私下过；西萨说，有这么多没信教的印第安人，看不见的地方，他们想怎么过就怎么过。","Q":[{"src":"c","ch":30,"u":["c30-3"],"pre":"c30-2","post":"c31-1","hl":{"c30-3":[[609,951],[1113,1251]]},"hz":{"c30-3":[[185,258],[308,357]]}}]},{"id":"paullu_1550","e":14,"l":["cieza","betanzos"],"t":"都在场","h":"1550年，两个人都在场","m":["memory"],"x":"1550年，保罗·印加去世一周年，库斯科为他举行周年祭。贝坦索斯说他亲眼见过，扮演的人在他看来更像魔鬼，不像人，也不像天使；西萨说他也在场，场面之盛，城中大多数夫人都到保罗家去看，确实令人惊叹，而这同从前相比根本算不了什么。","Q":[{"src":"b","ch":31,"u":["b31-3"],"pre":"b31-2","post":"b31-4","hl":{"b31-3":[[183,424]]},"hz":{"b31-3":[[46,113]]}},{"src":"c","ch":32,"u":["c32-5"],"pre":"c32-4","post":"c33-1","hl":{"c32-5":[[732,1103]]},"hz":{"c32-5":[[190,272]]}}]},{"id":"bultos_hidden","e":14,"l":["betanzos"],"t":"藏在瓮里","h":"先王的像还在","m":["memory"],"x":"贝坦索斯写道：给先王像唱歌、献祭这些事，从帕查库蒂时一直做到今天，有的偷偷做，有的公开做，因为西班牙人不懂这是什么。这些像，他们藏在储粮的大瓮里、罐子和大缸里、墙洞里，这样就找不到。","Q":[{"src":"b","ch":17,"u":["b17-4"],"pre":"b17-3","post":"b19-1","hl":{"b17-4":[[128,491]]},"hz":{"b17-4":[[27,140]]}}]},{"id":"capac_aillu_claim","e":14,"l":["betanzos"],"t":"都自称是","h":"人人都自称是那一系的","m":["name","local"],"x":"帕查库蒂的后裔称为“卡帕克·艾柳”，娶了外族女子的要另立名号，好让本系能纯正地自称卡帕克·艾柳。贝坦索斯说，西班牙人来了以后，这种情形更厉害了：西班牙人问他们是哪个世系的，这些人和那些人都说自己是那一系的。","Q":[{"src":"b","ch":32,"u":["b32-4"],"pre":"b32-3","post":null,"hl":{"b32-4":[[441,777]]},"hz":{"b32-4":[[132,200],[201,249]]}}]},{"id":"betanzos_book","e":14,"l":["betanzos","angelina"],"t":"成书","h":"贝坦索斯写完他的书","m":["memory"],"x":"贝坦索斯奉总督安东尼奥·德·门多萨之命写成《印加史综述》，1551年完稿。他娶了阿塔瓦尔帕的正妻库西里迈·奥克略，即受洗后的多尼亚·安赫利娜；书中大量材料，来自她和她的王族亲属的口述。","s":{"o":"贝坦索斯《印加史综述》成书经过，见项目《书目与版本说明》"},"Q":[]},{"id":"vira_word","l":["betanzos"],"t":"海的泡沫","h":"维拉科查不是海的泡沫","m":["name"],"x":"贝坦索斯说，印第安人称造物者为维拉科查；西班牙人来时，他们把西班牙人全体、每一个人都叫作维拉科查。那些似乎渐渐懂了这种语言的人，便揣测 vira 是油脂、cocha 是海，说这个词是“海的油脂”“海的泡沫”。贝坦索斯说其实不是，它恰恰就是“神”；西班牙人刚来时，他们就用这个名字称呼西班牙人，把他们当作神。","e":14,"Q":[{"src":"b","ch":16,"u":["b16-8"],"pre":"b16-7","post":"b16-9","hl":{"b16-8":[[602,659],[747,800]]},"hz":{"b16-8":[[229,254],[279,296]]}}]},{"id":"betanzos_fest","e":14,"l":["betanzos"],"t":"城外过节","h":"1551年，节还在过","m":["memory"],"x":"贝坦索斯写道：帕查库蒂定下的太阳节和其他节庆，一直照样举行，直到他写书的1551年；在库斯科城里有人想取缔，他们就跑到城外的小村子里，偷偷地举行。","Q":[{"src":"b","ch":14,"u":["b14-4"],"pre":"b14-3","post":"b16-1","hl":{"b14-4":[[306,620]]},"hz":{"b14-4":[[75,178]]}}]},{"id":"polo_finds","l":["polo","manco","sinchi","lloque","mayta","capac","roca","yahuar","vira"],"t":"找到诸王","h":"波洛找到了历代印加","m":["memory","stone"],"x":"萨米恩托一章一章记下：曼科·卡帕克死后化为一块一瓦拉高的石头，在因迪坎查受人供奉，1559年市政长官波洛在库斯科附近的宾比利亚村找到了它；辛奇·罗卡的遗体和他的鱼形石神像，也是波洛在宾比利亚的一堆铜条中间找到的；略克·尤潘基——抄本原写“找到了遗体和神像”，改成了“找到了像”，页边纳瓦穆埃尔注明：因为证人们说找到的不是遗体，是像；迈塔·卡帕克、卡帕克·尤潘基的遗体和神像，波洛也找到了，为了免除偶像崇拜，同别的藏在一起；印加·罗卡的遗体在拉拉帕村，备受尊崇；亚瓦尔·瓦卡克的遗体没有找到，据信在保罗村，页边批注又说：证人们说他们相信是波洛带走了；维拉科查葬在卡基亚·哈基哈瓦纳，贡萨洛·皮萨罗听说墓里有财宝，挖出遗体、取了财宝、烧了遗体，本地人把骨灰藏进一只小罐，连同他的神像，也被波洛找到了。","e":14,"Q":[{"src":"s","ch":14,"u":["s14-5"],"pre":"s14-4","post":"s14-6","hl":{"s14-5":[[339,382]]},"hz":{"s14-5":[[88,123]]}},{"src":"s","ch":15,"u":["s15-1"],"pre":null,"post":"s16-1","hl":{"s15-1":[[1811,1846]]},"hz":{"s15-1":[[661,677]]}},{"src":"s","ch":16,"u":["s16-3"],"pre":"s16-2","post":"s17-1","hl":{"s16-3":[[724,769]]},"hz":{"s16-3":[[258,286]]}},{"src":"s","ch":17,"u":["s17-9"],"pre":"s17-8","post":"s18-1","hl":{"s17-9":[[518,585]]},"hz":{"s17-9":[[164,195]]}},{"src":"s","ch":18,"u":["s18-2"],"pre":null,"post":"s19-1","hl":{"s18-2":[[1485,1539]]},"hz":{"s18-2":[[541,570]]}},{"src":"s","ch":19,"u":["s19-4"],"pre":"s19-3","post":"s20-1","hl":{"s19-4":[[530,598]]},"hz":{"s19-4":[[175,197]]}},{"src":"s","ch":23,"u":["s23-4"],"pre":"s23-3","post":"s24-1","hl":{"s23-4":[[423,455]]},"hz":{"s23-4":[[153,162]]}},{"src":"s","ch":25,"u":["s25-5"],"pre":"s25-4","post":"s26-1","hl":{"s25-5":[[252,309],[523,579]]},"hz":{"s25-5":[[92,108],[156,178]]}}]},{"id":"toledo_decree","e":15,"l":["toledo"],"t":"已获悉","h":"总督阁下已获悉","m":[],"x":"1572年1月4日，总督堂弗朗西斯科·德·托莱多宣称：印加人以暴政征服此地，已有多项事实证明；此外，阁下又获悉，最早被印加人以暴政手段征服的，正是原住在如今本城所在之地的印第安人，他们从未心甘情愿地承认印加为领主。阁下下令查明此事，拟定了八个问题。","Q":[{"src":"t","ch":1,"u":["t1-1"],"pre":null,"post":"t1-2","hl":{"t1-1":[[346,664],[713,813]]},"hz":{"t1-1":[[87,170],[184,220]]}}]},{"id":"toledo_q4","e":15,"l":["toledo"],"t":"第四问","h":"第四个问题","m":["exile"],"x":"第四问：这位第四位印加迈塔·卡帕克，是否确实凭武力征服他们、对他们施行暴政，霸占他们的土地，把他们的祖先逐出这些土地，杀了许多人，使他们成为纳贡者，并把他们流放到自那时起一直被流放至今的地方——就在库斯科城旁，相距一火绳枪射程多一点。","Q":[{"src":"t","ch":1,"u":["t1-5"],"pre":"t1-4","post":"t1-6","hl":{"t1-5":[[1,320]]},"hz":{"t1-5":[[5,117]]}}]},{"id":"toledo_together","e":15,"l":["toledo"],"t":"一同作证","h":"查明真相的最好办法","m":[],"x":"总督规定，调查应让若干证人一同作证，因为这是此地向来查明真相的最好办法。","Q":[{"src":"t","ch":1,"u":["t1-10"],"pre":"t1-9","post":"t2-1","hl":{"t1-10":[[1,163]]},"hz":{"t1-10":[[0,36]]}}]},{"id":"witnesses","e":15,"l":["sahua","quizco","alca","juan"],"t":"十四人","h":"十四个人出庭","m":["memory"],"x":"1月26日，萨瓦西赖、安塔萨亚克、阿亚尔·乌丘三家的十四个人出庭，以我主上帝和亲手画出的十字记号宣誓。年纪最大的堂迭戈·尤潘基94岁，胡安·皮萨罗·尤潘基79岁，最小的弗朗西斯科·比尔卡斯18或20岁。他们说，所述一切都是从父辈和先人那里听来的，一代一代传下去，不让人遗忘。他们都说自己不会写字。","Q":[{"src":"t","ch":3,"u":["t3-13"],"pre":"t3-12","post":"t4-1","hl":{"t3-13":[[649,875]]},"hz":{"t3-13":[[190,257]]}}]},{"id":"witnesses_bold","e":15,"l":["alca","juan"],"t":"现在敢说","h":"现在敢说了","m":["local","land"],"open":true,"x":"直到如今，印加的后裔仍对他们怀恨在心，因为这些证人对他们说：你们违背我们的意愿占着我们的土地，你们是外来者，我们和我们的祖先才是这片库斯科谷地的本地人。他们说，现在敢这样说，是因为有西班牙人在；以前是不敢说的。","Q":[{"src":"t","ch":3,"u":["t3-11"],"pre":"t3-10","post":"t3-12","hl":{"t3-11":[[1526,1852]]},"hz":{"t3-11":[[454,571]]}}]},{"id":"walla_1572","e":15,"l":["walla"],"t":"多次讨地","h":"瓦利亚人想要回土地","m":["land"],"open":true,"x":"1月31日，瓦利亚人的后裔十五人出庭。他们说，印加的某些后裔如今占着他们祖先在库斯科的土地，他们已经多次设法要回来。","Q":[{"src":"t","ch":4,"u":["t4-5"],"pre":"t4-4","post":"t5-1","hl":{"t4-5":[[1794,2003]]},"hz":{"t4-5":[[522,585]]}}]},{"id":"antasaya_struck","l":["quizco","sarmiento"],"t":"删去一句","h":"划去“第二族叫安塔萨亚克”","m":["memory","local"],"x":"萨米恩托第9章写：库斯科谷极古之时住着三个族群，第一萨瓦西赖，第二安塔萨亚克，第三瓦利亚。抄本这里页边有纳瓦穆埃尔的批注：“第二族叫安塔萨亚克”一处已划去，因为核验时印第安人说并非如此。同一年1月26日的调查录里，安塔萨亚克亲族共同体的五名证人自称是印加人到来以前就住在这里的人，说给这地方取名“库斯科”的正是他们的祖先基斯科。","e":15,"Q":[{"src":"s","ch":9,"u":["s9-2"],"pre":"s9-1","post":"s9-3","hl":{"s9-2":[[271,291]]},"hz":{"s9-2":[[68,77]]}},{"src":"t","ch":3,"u":["t3-4"],"pre":"t3-3","post":"t3-5","hl":{"t3-4":[[1,89]]},"hz":{"t3-4":[[0,32]]}}]},{"id":"sarm_purpose","l":["sarmiento","toledo"],"t":"为了名分","h":"为什么要这样仔细","m":["memory"],"x":"萨米恩托在第9章为自己的史料辩护：他向各阶层最明智、最年长、最可信的人查访，让各家把自己世系和对头世系的事分别写成备忘录，互相对质、更正，最后当着所有派别和亲族共同体的面，经法官授权、由宣过誓的通译公开宣誓核定。他说这样费尽心力，是因为查明这些残暴的印加人的暴政，是一件大事的事实根据：为了让世界各国都明白，卡斯蒂利亚国王对这些西印度、尤其对秘鲁诸王国，拥有合乎法理、而且再正当不过的权利。","e":15,"Q":[{"src":"s","ch":9,"u":["s9-6"],"pre":"s9-5","post":"s10-1","hl":{"s9-6":[[529,599],[1116,1239]]},"hz":{"s9-6":[[144,174],[324,386]]}}]},{"id":"loarte_decree","e":15,"l":["loarte"],"t":"司法裁定","h":"在诉讼内外均具效力","m":["memory"],"x":"1572年2月27日，王室法庭法官洛阿尔特博士审阅本调查录，在其中加具他的权威与司法裁定，使之在诉讼内外均具效力与公信。","Q":[{"src":"t","ch":5,"u":["t5-1"],"pre":"t4-5","post":"t5-2","hl":{"t5-1":[[139,335]]},"hz":{"t5-1":[[22,69]]}}]},{"id":"sarmiento_read","e":15,"l":["sarmiento","toledo","loarte"],"t":"念给证人","h":"书被逐章念给四十二人听","m":["memory"],"x":"1572年2月29日，萨米恩托把书呈给托莱多。托莱多命洛阿尔特法官把十二位印加的十二个亲族共同体中最显要、最明白的人召来，当着秘书的面，由通译贡萨洛·戈麦斯·希门尼斯把书读给他们听、讲给他们听。到场的按亲族共同体列名，共四十二人。读了两天，从他们说的创世神话一直读到印加历史的末尾，每读一章就讲解一章，他们彼此商量。他们一致说，这部史好而真实，同他们所知、所听父辈说的相符；只改了一些人名、地名和其他小事。他们说，相信再没有哪一部史会像这部这样确实，因为从来没有人这样仔细查考过，也从来没有人问过他们。3月2日，托莱多下令把修订本呈送国王。","Q":[{"src":"s","ch":"fee","u":["sfee-4","sfee-5","sfee-6","sfee-7","sfee-8","sfee-9","sfee-10","sfee-11","sfee-12","sfee-13","sfee-14","sfee-15","sfee-16","sfee-17","sfee-18","sfee-19"],"pre":"sfee-3","post":"sfee-20","hl":{"sfee-4":[[506,603]],"sfee-19":[[3136,3225],[3734,3815]]},"hz":{"sfee-4":[[138,167]],"sfee-19":[[877,898],[1031,1057]]}}]}],"U":{"b11-1":{"src":"b","ch":11,"pg":"p. 50a","es":"[...] e volviendo a nuestra historia este señor Ynga Yupangue como quisiese hacer casa y adoratorio a quien él reverenciase y los demás de su pueblo queriéndola hacer reverencia e semejanza del que había visto antes de su batalla y considerando él ansi que el que ansi viera a quien él llamaba el Viracocha que le vió con gran resplandor según ellos dicen y en tanta manera que le paresció que todo el día era allí delante y su lumbre lo cual viendo delante de sí dicen que hubo gran pavor e que nunca le dijo quien fuese considerado en que si cuando esta casa quería edificar que aquel que viera según la lumbre que él había visto que debía ser el sol y que como llegase a él y la primer palabra que le dijo: hijo no tengas temor ansi los suyos como la historia os contará le llamaron después hijo del sol e teniendo él en sí lo que ya habeis oído prosupuso de hacer esta casa del sol e como lo prosupusiese llamó los señores de la ciudad del Cuzco que el allí consigo tenía e díjoles lo que ansi tenía pensado y que quería edificar esta casa y ellos le dijeron que diese la orden y traza del edificio della porque tal casa como aquella ellos los naturales y propios de la ciudad del Cuzco la debían edificar e hacer [...]","zh":"[……]回到我们的叙述。这位印加·尤潘基想建一座殿堂和祭拜之所，供他自己和他城里的人崇拜，想按战前他所见的那一位的样子来敬奉它、塑造它。他这样思量：他所见的、他称为维拉科查的那一位——据他们说，他见到时光芒四射，亮得好像整个白昼都在他面前、都是那人的光——他见了以后，据说十分惊恐，而那一位始终没有告诉他自己是谁；于是他在想建这座殿的时候推想，按他所见的光来看，他见到的应当是太阳。又因为那一位来到他跟前时说的第一句话是“孩子，别怕”，所以，如历史下文要讲的，他的人后来都称他为太阳之子。印加·尤潘基心里有了你们听到的这些想法，便决定建这座太阳殿。他一拿定主意，就召集了身边的库斯科城领主们，把自己的打算告诉他们，说要建这座殿。他们对他说，请他定下这座建筑的规制和图样，因为这样的殿，理应由他们这些库斯科城的本地人、本城的人来修建[……]","tr":"p"},"b12-1":{"src":"b","ch":12,"pg":"p. 55a","es":"Acabado de dar orden Ynga Yupangue e de haber hecho los ídolos e casas del sol que habeis oído mandó en la ciudad del Cuzco que en un cierto día señalado fuesen juntos en ella todos los señores caciques y principales que en las provincias e comarcas dentorno de la ciudad del Cuzco vivían y a él habían dado obediencia para que tenía ciertas cosas que comunicar con ellos e oído el mando por los principales del Cuzco luego enviaron sus orejones por las provincias e comarcas que ya habeis oído con los cuales enviaban a mandar a los tales señores della el mando que el Ynga tenía hecho y que para aquel día señalado fuesen todos a la ciudad e como los tales señores supiesen el mando de Ynga Yupangue con la más brevedad que posible les fuese vinieron a la ciudad del Cuzco y siendo ya todos juntos Ynga Yupangue les dijo que ya veían que el sol era en su favor y que no era justo que se contentasen con poco que le parescía que porque andando el tiempo la guerra no les daría lugar a hacer sus tierras y repararlas de la tal manera","zh":"印加·尤潘基定好规矩，造好你们听到的那些神像和太阳殿以后，在库斯科城下令：凡住在库斯科城周围各省各地、已向他臣服的领主、酋长和头人，都要在指定的某一天到城里集合，因为他有些事要同他们商量。库斯科的头人们接到命令，随即派他们的大耳贵族到你们听到的那些省份和地方去，借他们向当地的领主传达印加的命令，叫他们在指定那天都到城里来。那些领主得知印加·尤潘基的命令，都以最快的速度来到库斯科城。人到齐以后，印加·尤潘基对他们说：他们已经看到太阳在眷顾他们，不该满足于这一点点；他认为，日后战事会使他们没有工夫去耕种、整修自己的土地，所以他要一次把地","tr":"p"},"b12-2":{"src":"b","ch":12,"pg":"p. 55b","es":"que de una vez quería que se reparasen que para perpetuamente ellos y sus descencientes sembrasen y se sustentasen que le parescía que sería bien que cada uno tuviese sus tierras señaladas y conocidas para que las labrasen y aderezasen cada uno con las gentes de su casa e amigos todo lo cual decía a los señores e moradores de la ciudad del Cuzco y ansi todos juntos habiendo la merced grande que les hacía de darles tierras que conociesen para perpetuamente a cada uno dellos todos juntos y a una voz le dieron grandes gracias llamándolo e intitulándolo indichuri que dice hijo del sol e luego de allí mandó Ynga Yupangue que todos fuesen a cierto sitio do las tales tierras estaban pintadas donde como allí fuese dió e repartió las dichas tierras dando a cada uno dellos las tierras que les paresció que le bastaban y esto hecho mandó allí luego que aquellos tres señores sus amigos se las fuesen a repartir todos los de la ciudad bien ansi como se las había dado e señalado y que esto hecho volviesen todos ellos delante del y ansi los señores fueron y dieron e repartieron las tierras e metieron en la posesión dellas a los tales que","zh":"修好，让他们和他们的子孙永远在上面耕种、赖以为生；他认为每人都应当有划定的、人人认得的土地，各自带着家人和朋友去耕种、整理。这些话，他是对库斯科城的领主和居民说的。于是他们全体一起，为他赐给他们土地、让各人永远认得自己那一份这一大恩，齐声向他道谢，称他、尊他为“因迪丘里”，意思是“太阳之子”。随后印加·尤潘基命令所有人到某个地方去，那里已经把这些土地画了出来；到了那里，他把上述土地分给了大家，给每个人他认为够用的地。分完，他当即命令他的那三位领主朋友去按他所给、所定的那样，把地分给城里所有的人，分完以后都回到他跟前来。三位领主就去把地分了，让领受印加这份恩赐的人","tr":"p"},"b12-3":{"src":"b","ch":12,"pg":"p. 56a","es":"ansi les era hecha la merced por el Ynga y vueltos mandó el Ynga a los caciques y señores que allí estaban que le trujesen por cuenta cada uno dellos los indios que allí consigo tenían e luego los señores caciques le trujeron por quipo que dice cuenta la suma de los indios que tenian y sabido por el Ynga los indios que había mandó a los señores que luego los repartiesen por casas y ansi fue hecho e mandó que luego otro día que cada uno de los del Cuzco como le había cabido la suerte de las tierras saliesen a las aderezar y reparar y hacer sus caños y regaderas e todo lo cual fuese reparado y hecho de piedra de cantería porque fuese el tal edificio de tal manera hecho que para que perpetuamente durase mandándoles que pusiesen sus linderos e mojones altos de tal manera hechos que nunca se perdiesen debajo de los cuales mojones y de cada uno dellos mandó que fuese puesta cierta carga de carbón diciendo que si en algún tiempo se cayese el mojon que por el carbón que allí se hallase se conocerían los linderos de la tales tierras y esto proveído Ynga Yupangue estuvo algunos días mientras en el aderezar de las tierras se daba orden holgándose y recreándose y viendo como cada uno trabajaba y aderezaba la parte que le había cabido y al que veía que con algún trabajo lo hacía dábale ayuda e como viese que el edificio y reparación de las tales tierras iba a la larga y que a según iban los reparos que los tales hacían y que era edificio que no se podría acabar tan ayna mandó que los señores e caciques que allí eran se juntasen en su casa cierto día y luego fueron juntos bien ansi como él lo mandó y siendo allí en sus casas díjoles que había gran necesidad que en la ciudad","zh":"取得了土地。他们回来以后，印加命令在场的酋长和领主们把各自带来的印第安人一一报数。酋长们就用“基普”——意思是“账目”——把所带印第安人的总数报给他。印加知道了有多少人以后，命令领主们立刻把他们按户分派，事情就这样办了。他又命令第二天库斯科城的人各自到抽到的土地上去整地、修地，开挖渠道和水沟，全都用琢好的石料修筑，使这项工程造得能够永远存留；又命令他们竖起高大的界桩和界石，造得永不湮没，并在每一块界石底下埋上一些木炭，说万一哪天界石倒了，凭那里找到的木炭也能认出这些土地的地界。这些安排好了，在整地的那些日子里，印加·尤潘基消遣游乐，看着每个人怎样干活、怎样整理分到的那一份；看到谁干得吃力，就帮他一把。后来他见整修土地的工程旷日持久，照他们修的进度，这项工程不会很快完成，就命令在场的领主和酋长们某一天到他家里集合。他们照他的命令到齐了，他在家中对他们说，城里很需要","tr":"p"},"b12-4":{"src":"b","ch":12,"pg":"p. 56b","es":"del Cuzco hubiese depósitos de todas comidas ansi de maiz como de ají e fríjoles e chochos e chuño e quinua e carnes secas e todos los demás proveimientos e comidas curadas que ellos tienen y que para aquello había necesidad que de sus tierras lo mandasen traer e luego los señores caciques dijeron que les placía de toda voluntad de lo mandar traer que mandase que de la ciudad del Cuzco fuesen algunos orejones en compañía de los indios que ansi ellos enviasen para que en sus tierras les costase a los que allá eran que era su voluntad que el tal proveimiento hiciese a la ciudad del Cuzco porque aquel servicio primero que ellos hacían e por ellos muy mucho deseado de hacer el tal servicio a la ciudad del Cuzco y a su señor Ynga Yupangue todo lo cual les fue agradescido por Ynga Yupangue e mandó luego a aquellos señores del Cuzco que proveyesen allá en sus posadas juntamente con aquellos caciques los orejones que ansi habían de ir por los pueblos e provincias a juntar e traer las tales comidas e mantenimientos y ansi fueron los señores a sus posadas y hicieron allá su junta ellos e los caciques e repartieron lo que cada provincia había de traer e contribuir y ansi se les repartió a los caciques que allí eran los depósitos que ansi habían de hacer e se les mandó e señaló el tiempo que de tanto a tantos años se les hinchiesen in perpetum si por el Ynga no les fuese mandado otra cosa todo lo cual aceptaron de hacer los tales caciques porque entendían que Ynga Yupangue era señor que sabía bien satisfacer todo servicio que le fuese hecho e luego allí en su junta los señores señalaron los orejones que habían de ir e ansi mismo los caciques","zh":"库斯科有储存各种食物的仓库，如玉米、辣椒、菜豆、羽扇豆、冻干薯、藜麦、肉干，以及他们所有的其他给养和熟制的食物；为此需要他们从自己的地方运来。酋长们说，他们非常乐意下令运来；请他下令从库斯科城派一些大耳贵族，同他们派去的印第安人一道，在他们的地方向那里的人分派摊征；他们愿意为库斯科城做这样的供应，因为这是他们头一回服的役，他们早就十分渴望为库斯科城和他们的领主印加·尤潘基服这样的役。印加·尤潘基对他们表示感谢，随即命令库斯科的那几位领主在各自住处，会同这些酋长，安排派到各村各省去征集、运送这些食物给养的大耳贵族。领主们就回到住处，同酋长们在那里商议，分派每个省份应运来、应缴纳多少；于是给在场的酋长们分派了各自要建的仓库，并给他们规定了期限，每隔若干年要把仓库装满，永远如此，除非印加另有命令。酋长们都答应照办，因为他们知道印加·尤潘基是一位懂得酬报一切效劳的领主。领主们随即在会上选定了要去的大耳贵族，酋长们也","tr":"p"},"b12-5":{"src":"b","ch":12,"pg":"p. 57a","es":"los principales que ellos enviaban e ansi se partieron estos orejones e principales a traer las tales comidas e proveimiento que los señores e caciques salieron de su junta e fueron do Ynga Yupangue estaba al cual le dijeron lo que ansi habían hecho y ordenado como él lo había avisado e que les señalase los sitios e lugares do habían de ser hechos los depósitos porque los que cada uno habían de hacer ya entre ellos los tenían repartidos y luego Ynga Yupangue les señaló ciertas chapas e láderas de sierras que en torno de la ciudad del Cuzco estaban y a vista y allí les mandó que luego fuesen edificados los tales depósitos para que cuando el tal proveimiento fuese traído hallasen en que lo meter e luego fueron los señores a los sitios que por el Inga le fueron señalados e pusieron por obra el edificio de los tales depósitos e tardóse en hacer estos depósitos e reparar las tierras cinco años porque fueron muy muchos los depósitos que se hicieron los cuales mandaba hacer Ynga Yupangue por tener mucha e muy gran cantidad de comida y tanta que no le faltáse e mediante la comida que ansi tuviese quería edificar la ciudad del Cuzco de cantería e reparar los arroyos que la cercan e tenía en sí que teniendo bastimentos en tanta cantidad que no le faltasen que podía le dar la gente que él quisiese a hacer y edificar los edificios y casas que ansi reedificar quería y los depósitos hechos y proveídos e siendo ya las tierras reparadas e acabadas todas de reparar Ynga Yupangue mandó juntar los caciques e señores que en todo lo ya dicho le habían hecho servicio e paresciéndole que era justo hacerles algunas mercedes e darles algún contentamiento e siendo","zh":"选定了各自派去的头人。这些大耳贵族和头人就出发去运这些食物和给养了。领主和酋长们散了会，来到印加·尤潘基那里，向他禀报他们照他的指示所做的安排，请他指定建仓库的地点，因为各人要建的仓库已经在他们中间分派好了。印加·尤潘基随即给他们指定了库斯科城周围看得见的一些山坡，命他们立即在那里建仓库，好让这些给养运到时有地方存放。领主们于是到印加给他们指定的地方，动工修建仓库。修这些仓库和整治土地一共用了五年，因为修的仓库非常之多。印加·尤潘基下令修这么多仓库，是要储存大量的、多到用不完的粮食；他要凭着这样储下的粮食，用石料修建库斯科城，并整治环绕城市的溪流；他心里想，只要有大量用不完的给养，他就能调集他想要的人手，来建造他想重建的那些建筑和房屋。仓库修好、装满，土地都已整治完毕，印加·尤潘基命令把在上述各事中为他效劳的酋长和领主们召集起来；他认为应当给他们一些赏赐，让他们有些满足；","tr":"p"},"b12-6":{"src":"b","ch":12,"pg":"p. 57b","es":"ansi juntos dióles e repartióles muchas joyas de oro e plata que mediante aquel tiempo que en la obra estivieron él había mandado labrar e ansi mismo les dio cada dos vestidos de las ropas de su vestir e a cada uno dellos les dio unas señoras naturales del Cuzco y de su linaje para que fuesen cada una destas mujer principal del cacique a quien ansi le habían dado e que los hijos que en las tales hubiesen fuesen herederos de los tales estados e señoríos que sus padres tuviesen fundándose Ynga Yupangue que por el deudo que con ellos por esta vía había que nunca ninguno dellos en sus días se le rebelaría e que habría entre ellos e los de la ciudad del Cuzco perpetua amistad y confederación todo lo cual ansi hecho y visto por los caciques las grandes mercedes que les hacía todos se inclinaron a le besar los pies y a le dar grandes gracias a los cuales mandó Inga Yupangue que se fuesen a descansar a sus tierras y que dentro de un año volviesen a la ciudad del Cuzco e que mediante este tiempo cada uno dellos en sus tierras hiciesen sembrar muchas sementeras de todas comidas porque tenía que serían menester andando el tiemqo e que les encomendaba que en sus tierras no hubiese ociosidad en los mancebos ni en las mujeres porque no fuesen causa las tales ociosidades de tener los suyos resabios de mal ejemplo e que los procurasen ejercitar todo tiempo que entendiésen en hacer sementeras en las cosas de la guerra y en los semejantes ejercicios como era en saber esgrimir hondas tirar flechas jugar con hachas a manera de pelea en batalla blandear lanz 颂致谢，把他当作太阳之子来致敬，然后又坐下来，开始喝那里备下的奇恰酒；据他们说，那里的酒极多，数量极大。随后又给他们端来大量古柯，分给众人。之后他们又站起来，像你们已经听到的那样唱歌跳舞；这场节庆持续了六天[……]","tr":"p"},"b14-1":{"src":"b","ch":14,"pg":"p. 65a","es":"Y acabado de proveer Ynga Yupangue la orden que se había de tener en el proveímiento de la ciudad dei Cuzco e su república volvieron los señores sus tres buenos amigos que ansi él había enviado a casar los solteros como ya la historia os ha contado e siendo ya en el Cuzco estos señores e los demás que en la ciudad eran mandó Ynga Yupangue que todos se juntasen en su casa otro día de mañana porque quería comunicar con ellos cierta fiesta (sic) hubiese memoria quería constituir en ella cierta cosa que allá con ellos en su junta comunicaría y otro día de mañana se juntaron estos señores en las casas del Ynga donde comunicó con ellos la fiesta que ansi quería hacer e para que della hubiese memoria para siempre díjoles Ynga Yupangue que sería bien que en esta fiesta se hiciesen los orejones con ciertas ceremonias y ayunos porque una cosa semejante que aquella que era señal y insignia para que por toda la tierra fuesen conocidos desde el menor hasta el mayor de aquella ciudad por tales señores e hijos del sol porque le parescía que","zh":"印加·尤潘基定好了库斯科城及其“共和”的供应办法，他那三位好友——如历史已经讲过的，他派他们去为单身的人成婚——也回来了。这几位领主和城里的其他人都到了库斯科以后，印加·尤潘基命令他们第二天早上都到他家里集合，因为他想同他们商量一个节庆（原文如此）……留下纪念，想在节庆中规定一件事，到时在会上同他们商量。第二天早上，这些领主在印加家中会齐，他同他们商量了他想举行的节庆。为了让这个节庆永远为人纪念，印加·尤潘基对他们说，最好在这个节庆上，按一定的仪式和斋戒授予大耳贵族身份，因为这样一件事是一种标志和徽号，能让那座城里从最小到最大的人，在全境都被认作这样的领主、太阳之子；因为他认为","tr":"p"},"b14-2":{"src":"b","ch":14,"pg":"p. 65b","es":"desde allí adelante habían de ser tenidos y respetados los de aquella ciudad por los de toda la tierra más que habían sido hasta allí e que porque habían de ser llamados hijos del sol querían que fuesen hechos y ordenados orejones en aquella fiesta del sol con muchas ceremonias e ayunos porque los que habían sido hechos orejones hasta allí ellos e sus padres les oradaban las orejas cada e cuando que querían e bien les estaba e por
