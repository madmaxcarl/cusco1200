位叫维卡基劳，一位叫阿波迈塔，一位叫基利斯·卡切·乌尔科·瓦兰加。从太阳殿往上，两条溪流之间的全部地方，直到今天城堡所在的那座山，他分给了与他血缘最近的亲属，即他宗族中直系的后裔，是同他同一血缘、同一宗族的领主和贵妇所生的子女。因为他命在太阳殿以下定居的那三位领主，如你们听到的，是私生子，","tr":"p"},"b16-7":{"src":"b","ch":16,"pg":"p. 78a","es":"de señores aunque eran de su linaje los cuales habían habido en mujeres extrañas de su nación e de baja suerte a los cuales hijos ansi habidos llaman ellos Guacchaconcha que quiere decir deudos de pobre gente e baja generación y estos tales aunque sean hijos del Ynga son llamados ansi e no son tenidos ni acatados ninguno destos ansi hombres como mujeres de los demás señores si no como por un orejón de los otros comunes porque habran de saber que el Ynga que ansi es señor tiene una mujer principal y esta ha de ser de su deudo e linaje hermana suya o prima hermana suya a la cual mujer llaman ellos Piviguarni y por otro nombre Mamanguarme y la gente común como de tal mujer principal del señor llaman cuando ansi la entran a saludar Paxxa Yndi Usus Capaicoya Guacchacoyac luna e hija del sol e sola reina amigable a los pobres y esta tal señora había de ser de padre e de madre derechamente señora e deuda del Ynga sin que en ella hubiese raza ni punta de Guacha Concha que es lo que ya habeis oído y esta tal señora rescibía el Ynga por mujer principal suya el día que tomaba la borla del estado e insignia real e los hijos que ansi tal señora había se nombraban Pivichuri que dice como si dijéramos hijos legítimos y el mayor destos era señor del estado y heredero legítimo e si caso fuese que el Ynga muriese dejando este tal tan niño que no supiese gobernar hacíanle señor e poníanle la borla en la cabeza aunque este tal estuviese mamando e llamábanle al tal niño Guaina Capac que dice mancebo rey aunque los que construyen este nombre no entendiendo lo que quiere decir dícen que dice mancebo rico porque habran de saber que capa sin c postrera","zh":"虽然也属他的宗族，却是领主们和本族以外的低贱女子所生的；这样生的儿子，他们称为“瓦查孔查”，意思是“穷人和低贱出身的亲属”。这样的人即使是印加的儿子，也是这样称呼，无论男女，其他领主都不尊重、不敬重他们，只把他们当作一个普通的大耳贵族看待。因为你们要知道，身为领主的印加有一位正妻，这位正妻必须是他的亲属和本宗族的人，是他的姐妹或堂表姐妹。他们称这位妻子为“皮维瓦尔米”，又叫“玛曼瓦尔梅”。平民进见、向领主的这位正妻致敬时，称她为“Paxxa Yndi Usus Capaicoya Guacchacoyac”，意思是“月亮、太阳的女儿、唯一的王后、怜爱穷人的人”。这位贵妇的父亲和母亲都必须是正统的贵族、是印加的亲属，身上不能有半点你们听到的“瓦查孔查”的血统。印加在接受王穗和王权标志那一天，娶这位贵妇为正妻。这位贵妇所生的儿子称为“皮维丘里”，意思就像我们说的“嫡子”；嫡子中的长子是统治的继承者、合法的继承人。万一印加死时这个儿子还很小，不会治理，就立他为领主，把王穗戴在他头上，哪怕他还在吃奶；人们称这个孩子为“瓦伊纳·卡帕克”，意思是“少年王”。不过有些不懂这个名字意思的人解释说，它的意思是“少年富人”，因为你们要知道，末尾没有c的capa","tr":"p"},"b16-8":{"src":"b","ch":16,"pg":"p. 78b","es":"dice rico y Guaina dice mancebo e si dijera este nombre Capaguaina dijera mancebo rico más dice Guaina Capac postrera que dice mancebo rey e ansi mesmo construyen otro nombre los que no lo entienden que dice Viracocha que quiere decir y podremos tener que dice dios porque este nombre nombran ellos al que dicen e tienen que fue el hacedor e como los españoles viniesen gente muy ajena de su ser como la historia adelante os contará llamáronlos a todos y a cada uno por sí Viracocha y queriendo construir este nombre los cuales parescía que iban entendiendo el hablar parábanse a pensar y imaginar que Vira quiere decir en esta lengua manteca y cocha dice mar todo lo cual declaraban e decían que quería decir manteca de la mar y espuma de la mar lo cual no quiere decir aquello sino propiamente dios y aún cuando los españoles vinieron a esta tierra los llamaron deste nombre e tuvieron por dioses e volviendo a nuestra historia a este tal niño señalabanles sus ayos y gobernadores los cuales gobernasen todo el tiempo que viesen que no era de edad para gobernar e si el Ynga después de haber rescibido a esta por mujer o antes desta tuviese otras cincuenta mujeres hermanas y deudas suyas porque ansi era su cosmtubre de tener a todas sus hermanas por mujeres los tales hijos que en éstas había no heredaban ninguno destos su estado si no fuese el hijo de la tal Pivi mujer legítima que ellos dicen e si caso fuese que ésta tal no hobiese el Ynga en ella hijos o la tal pariese hijas en tal caso se daba por fin de los días del Ynga al hijo mayor que ansi hobiese habido en cualquier de las otras sus hermanas o deudas como viesen que tal mostrase en sí ser","zh":"意思是“富”，Guaina意思是“少年”；如果这个名字是Capaguaina，那才是“少年富人”；但它是Guaina Capac，末尾带c，意思是“少年王”。同样，那些不懂的人还解释另一个名字，就是“维拉科查”。它的意思，我们可以认为就是“神”，因为他们用这个名字称呼他们所说、所信的那位创造者。西班牙人来时，如历史下文要讲的，是一群与他们本性迥异的人，他们就把西班牙人全体、每一个人都称为维拉科查。那些似乎渐渐懂了这种语言的人，想解释这个名字，便琢磨揣想，说vira在这种语言里是“油脂”，cocha是“海”，所以说这个词的意思是“海的油脂”“海的泡沫”。其实它不是这个意思，而恰恰就是“神”；西班牙人刚到这片土地时，他们就用这个名字称呼西班牙人，把他们当作神。回到我们的叙述：他们给这样的幼主指定辅导和摄政，在他们认为他还没有到治理年龄的这段时间里替他治理。如果印加在娶这位正妻之后或之前，另有五十个女人，都是他的姐妹和亲属——因为他们的习俗就是把所有的姐妹都娶为妻——这些女人所生的儿子都不能继承他的统治，只有他们所说的“皮维”、即合法正妻所生的儿子才能继承。如果印加同这位正妻没有生儿子，或者她只生了女儿，在这种情况下，印加死后，就把统治交给他与其他任何一位姐妹或亲属所生的长子，只要他们看到这个儿子显出","tr":"p"},"b16-9":{"src":"b","ch":16,"pg":"p. 79a","es":"e capacidad para regir el gobernar su reino e república e si no era tal cual debiese escogían entre sus hermanos el que mejor les parecía que los podría gobernar e a este tal e con éste tal daban e casaban la tal su hermana en la manera que ya habeis oído que ansi su padre había habido en la tal Piviguarme o mujer principal a la cual tenían e respetaban ansi los señores de la ciudad del Cuzco como los demás señores de toda la tierra como a su tal reina e señora principal de todos ellos e volviendo al propósito del repartir de la ciudad e casas della Ynga Yupangue las repartió en la manera que ya habeis oído tomando él para sí en ella las casas e solares que ansi vio que le bastaban y esto ansi hecho mandó que porque no hobiese en esta ciudad mezcla de otras gentes ni generación si no fuese la suya y de sus orejones porque esta ciudad tenía el","zh":"治理国家和“共和”的才能；如果他不合格，就从他的兄弟中挑选他们认为最能治理他们的人，把上面说的那位姐妹嫁给他——就像他父亲娶那位“皮维瓦尔米”、即正妻那样。无论库斯科城的领主还是全境其他的领主，都把这位正妻当作他们所有人的王后和主母来对待、敬重。回到分城和分房的话题：印加·尤潘基照你们听到的方式分了城和房屋，他自己在城里拿了他认为够用的房屋和宅基。这些办完，为了让这座城里除了他自己和他的大耳贵族一系之外，不混杂别的人群和血统——因为这座城在他心目中","tr":"p"},"b17-1":{"src":"b","ch":17,"pg":"p. 83a–83b","es":"[...] dijo Viracocha Ynga Yupangue: verdaderamente tu eres hijo del sol e yo te nombro rey y señor y tomando la borla en sus manos quitándola de su misma cabeza se la puso a Ynga Yupangue encima de su cabeza y era una costumbre entre estos señores que cuando aquello ansi se hacía el que la tal borla le ponía en la cabeza al otro juntamente con ponérsela le había de nombrar e dar nombre el cual había de tener desde allí adelante e ansi Viracocha Ynga como le pusiese la borla en la cabeza le dijo: Yo te nombro para que de hoy y más te nombren los tuyos en las demás naciones que fuesen sujetas Pachacuti Ynga Yupangue Capac e Indichuri que dice vuelta de tiempo Rey Yupangue hijo del sol el Yupangue es el Alcuña el linaje de do ellos son porque ansi se llamaba Mango Capac que por sobrenombre tenía Yupangue e ansi nombrado Ynga Yupangue por rey e señor en presencia de los que allí estaban [...]","zh":"[……]维拉科查·印加对印加·尤潘基说：你确实是太阳之子，我立你为王、为领主。他双手拿起王穗，从自己头上取下，戴到印加·尤潘基的头上。这些领主中有一个习俗：这样做的时候，把王穗戴到别人头上的人，在给他戴上的同时，要给他起名，起一个他从此要用的名字。于是维拉科查·印加给他戴上王穗时对他说：我给你起名，从今以后，你的人和臣服于你的其他民族都要这样称呼你：帕查库蒂·印加·尤潘基·卡帕克·因迪丘里，意思是“时代的翻转、王、尤潘基、太阳之子”。“尤潘基”是姓氏，是他们所出的宗族之名，因为曼科·卡帕克就叫这个名字，他的别名就是尤潘基。印加·尤潘基就这样当着在场众人被立为王和领主[……]","tr":"p"},"b17-2":{"src":"b","ch":17,"pg":"p. 85b","es":"[...] el cual Viracocha Ynga dende a diez años de la coronación de Pachacuti Yupangue estando en su pueblo del peñol llamado Caquea Xaquixaguana que es por encima del pueblo de Calca siete leguas de la ciudad del Cuzco holgándose y regocijándose enfermó de cierta enfermedad de la cual dende a cuatro meses que enfermó este Viracocha Ynga murió el cual murió siendo de edad de ochenta y tantos años el cual después de muerto Ynga Yupangue le honró muy mucho haciendo traer su cuerpo en andas bien adornado bien ansi como si fuera vivo a la ciudad del Cuzco cada e cuando que fiestas había haciendo honrar e respetar su persona a los señores del Cuzco e a los demás caciques bien ansi como si fuera vivo delante del cual bulto hacía sacrificar e quemar muchas ovejas e corderos y ropa y maiz e coca e derramar mucha chicha diciendo que el tal bulto comía e que era hijo del sol e que estaba con él en el cielo e hizo hacer muy muchos bultos y tantos cuantos señores habían sucedido desde Mango Capac hasta su padre Viracocha Ynga e ansi hechos mandó que se hiciesen ciertos escaños de madera e muy galanamente labrados e pintados en las cuales pinturas fueron pegadas nuchas plumas de diversos colores y esto ansi hecho mandó este señor que todo estos bultos fuesen asentados en los escaños juntamente con el de su padre a los cuales mandó que todos acatasen e reverenciasen como a ídolos e que ansi les fuesen hechos sacrificios como a tales los cuales fueron","zh":"[……]这位维拉科查·印加在帕查库蒂·尤潘基加冕十年之后，住在他那座山岩上的村子里——名叫卡基亚·哈基哈瓦纳，在卡尔卡村上方，离库斯科城七里格——正在消遣游乐，得了一种病，病了四个月就死了，死时八十多岁。他死后，印加·尤潘基十分尊崇他：每逢有节庆，就命人把他的遗体装饰好，用肩舆抬到库斯科城，完全如同他还活着一样，叫库斯科的领主和其他酋长尊崇、敬重他本人，也完全如同他还活着一样。他在这尊像前命人献祭、焚烧许多羊和羊羔、衣物、玉米和古柯，泼洒大量奇恰酒，说这尊像会吃东西，说他是太阳之子，正同太阳一起在天上。他又命人造了许多许多像，从曼科·卡帕克到他父亲维拉科查·印加，相继在位的领主有多少，就造多少。造好以后，他命人做了一些木凳，雕刻精美，描绘华丽，彩绘上粘了许多各色羽毛。这些做好，这位领主命令把这些像和他父亲的像一起安放在凳子上，命令所有人都要把它们当作神像来尊崇、敬拜，并把它们当作神像来献祭。这些像","tr":"p"},"b17-3":{"src":"b","ch":17,"pg":"p. 86a","es":"puestos en sus casas y cada y cuando que algunos señores entraban a do el Ynga estaba hacían acatamiento al sol y luego a los bultos y luego entraban a do el Ynga estaba e hacían lo mismo para el servicio de los cuales bultos señaló y nombró cierta cantidad de yanaconas y mamaconas y dioles tierras para en que sembrasen e cogiesen para el servicio destos bultos y ansi mismo señaló muchos ganados para los sacrificios que ansi se les habían de hacer y este servicio e tierras e ganado dió e repartió a cada bulto por sí e mandó que se tuviese gran cuidado del continuamente a la noche e a la mañana de dar de comer e beber a estos bultos e sacrificarlos para lo cual mandó e señaló que tuviesen cada uno de estos un mayordomo de los tales sirvientes que ansi le señaló que ansi mismo mandó a estos mayordomos e a cada uno por sí que luego hiciesen cantares los cuales cantasen estas mamaconas y yanaconas con los lores de l n el día de hoy y porque este","zh":"[……]回到我们的叙述。据说他在卡查省行了这个奇迹之后，继续前行，一路做他的工作，如你们已经听到的那样。他来到如今称为乌尔科斯驿站的地方，离库斯科城六里格，登上一座高山，坐在山顶；据说他从那里命令如今住在那一带的本地印第安人从那高处产生、出来。因为这位","tr":"p"},"b2-2":{"src":"b","ch":2,"pg":"p. 15a","es":"viracocha allí se hubiese sentado le hicieron en aquel lugar una muy rica y suntuosa guaca en la cual guaca porque se sentó en aquel lugar este viracocha pusieron los que la edificaron un escaño de oro fino y el bulto que en lugar deste viracocha pusieron le asentaron en este escaño el cual valió de fino oro en las partes del Cuzco que los xipianos se hicieron cuando le ganaron diez y seis o diez y ocho mil pesos y de allí el viracocha se pertió y vino haciendo sus gentes como ya habeis oído hasta que llegó al Cuzco donde llegado que fue dícen que hizo un señor al cual puso el mesmo nombre Alcabicca y puso nombre ansi mismo a este sitio do este señor hizo Cuzco y dejando orden como después que él pasase produciese los","zh":"维拉科查在那里坐过，人们就在那个地方为他建了一座极其华丽的圣地。因为他在那里坐过，建圣地的人在里面放了一张纯金的凳子，又把代替这位维拉科查而立的像安放在这张凳子上；基督徒攻取这里的时候，在库斯科一带把它分了，单是纯金就值一万六千或一万八千比索。维拉科查从那里动身，一路造出他的人们，如你们已经听到的那样，一直来到库斯科。据说他到了那里，造了一位领主，就给他取名阿尔卡维萨，又给这位领主所在的地方取名库斯科；他留下命令，要在他走后产生出大耳贵族，","tr":"p"},"b2-3":{"src":"b","ch":2,"pg":"p. 15b","es":"orejones se partió adelante haciendo su obra y como llegase a la provincia de Puerto Viejo se juntó allí con los suyos que antes él enviara en la manera ya dicha donde como allí se juntase se metió por el mar juntamente con ellos por do dícen que andaba él y los suyos por el agua así como si anduviera por tierra. Otras muchas cosas hubiéramos aquí escrito deste viracocha según que estos indios me han informado del si no por evitar proligidad y grandes idolatrías y bestialidades no las puse donde las dejaremos y hablaremos del producimiento de los orejones de la ciudad del Cuzco que ansi mismo van y siguen la bestialidad idolatría gentileza y bárbara que ya habeis oído.","zh":"然后继续前行，做他的工作。他来到波多维耶霍省，在那里与他先前按上述方式派出去的部下会合；会合之后，他和他们一起走进海里，据说他和部下在水上行走，就像在陆地上一样。关于这位维拉科查，这些印第安人还告诉了我许多别的事，我们本可以写在这里，但为了避免冗长，也避免那许多偶像崇拜和兽行，我没有写进来。我们就此放下，来讲库斯科城大耳贵族的产生；他们同样沿袭你们已经听到的那种兽行、偶像崇拜、异教与野蛮。","tr":"p"},"b3-1":{"src":"b","ch":3,"pg":"p. 17a","es":"En el lugar e sitio que hoy dícen y llaman la Gran Ciudad del Cuzco en la provincia del Piru en los tiempos antiguos antes que en él hubiese señores orejones yngas Capac Cuna que ellos dícen Reyes había un pueblo pequeño de hasta treinta casas pequeñas pajizas y muy ruines y en ellas había trinta indios y el señor y cacique deste pueblo se llamaba Alcavicça y lo demás de entorno deste pueblo pequeño era una ciénaga de junco hierba cortadera la cual ciénaga causaban los maniantales de agua que de la sierra y lugar do agora es la fortaleza salían y esta ciénaga era y se hacía en el lugar do agora es la plaza y las casas del Marqués Don Francisco Pizarro que después esta ciudad ganó y lo mismo era en el sitio de las casas del Comendador Hernándo Pizarro y ansi mismo era ciénaga en el lugar y sitio do es en esta ciudad de la parte del arroyo que por medio della pasa el mercado (tianguez) plaza de contratación de los mismos naturales indios. Al cual pueblo llaman los moradores del desde su antigüedad Cuzco y lo que quiere decir este nombre Cozco no lo saben declarar mas dé decir que ansi se nombraba antiguamente y viviendo","zh":"在今天称为“大库斯科城”的这个地方，在秘鲁省，古时候，还没有大耳贵族印加诸王——他们称之为卡帕克·库纳，意思是“王”——在此的时候，有一个小村，大约三十间又小又破的草屋，里面住着三十个印第安人。这个村子的领主兼酋长名叫阿尔卡维萨。小村四周是一片长着灯心草和锯齿草的沼泽，沼泽是从山上、从如今城堡所在之处流出的泉水造成的。这片沼泽在今天广场所在之处，也就是后来夺取此城的侯爵堂弗朗西斯科·皮萨罗的宅第所在之处；骑士团长埃尔南多·皮萨罗的宅第所在之处也是如此；本城穿城而过的那条溪流一侧，如今本地印第安人做买卖的集市广场所在之处，同样是沼泽。这个村子，当地居民自古就叫它库斯科；至于“库斯科”这个名字是什么意思，他们说不出来，只说古时候就这样叫。正当","tr":"p"},"b3-2":{"src":"b","ch":3,"pg":"p. 17b","es":"y residiendo en este pueblo Alcavicça abrió la tierra una cueva siete leguas deste pueblo do llaman hoy Pocarictambo que díce casa de producimiento y esta cueva tenía la salida della cuanto un hombre podía caber saliendo o entrando a gatas de la cual cueva luego que se abrió salieron cuatro hombres con sus mujeres saliendo en esta manera salió el primero que se llamó Ayarcache y su mujer con él que se llamó Mamaguaco. Y tras éste salió otro que se llamó Ayaroche y tras él su mujer que se llamó Cura y tras éste salió el otro que se llamó Ayarauca y su mujer que se llamó Raguaocllo y tras estos salió otro que se llamó Ayarmango a quien después llamaron Mango Capac que quiere decir el Rey Mango y tras éste salió su mujer que llamaron Mama Ocllo los cuales sacaron en sus manos de dentro de la cueva unas alabardas de oro y ellos salieron vestidos de unas vestiduras de lana fina tejida con oro fino y a los cuellos sacaron unas bolsas ansi mismo de lana y oro muy labradas en las cuales bolsas sacaron unas hondas de niervos y las mujeres salieron ansi mismo vestidas muy ricamente con unas mantas y fajas que ellos llaman chumbis","zh":"阿尔卡维萨在这个村子里生活、居住的时候，在离此村七里格、如今称为帕卡里坦博——意思是“产生之屋”——的地方，大地裂开了一个洞穴。这个洞口只容一个人爬着进出。洞一开，就有四个男人带着他们的妻子出来，出来的次序是这样的：先出来的名叫阿亚尔·卡切，同他一起出来的妻子名叫玛玛·瓦科；接着出来的一个名叫阿亚尔·乌丘，随后是他的妻子，名叫库拉；再接着出来的一个名叫阿亚尔·奥卡，他的妻子名叫拉瓦奥克略；最后出来的一个名叫阿亚尔·曼科，后来人们叫他曼科·卡帕克，意思是“曼科王”，随后出来的是他的妻子，人们叫她玛玛·奥克略。他们手里从洞里拿出几柄金戟；男人们身穿用细羊毛织金的衣服，颈上挂着几个同样用羊毛和金线精工织成的袋子，袋里装着筋绳做的投石索；女人们出来时也穿得十分华丽，披着斗篷，系着他们称为“琼比”的腰带，","tr":"p"},"b3-3":{"src":"b","ch":3,"pg":"p. 18a","es":"muy labradas de oro y con los prendederos de oro muy fino los cuales son los unos alfileres largos de dos palmos que ellos llaman topos y ansi mismo sacaron estas mujeres el servicio con que habían de servir y guisar de comer a sus maridos como son ollas y cantaros pequeños y platos y escudillas y vasos para beber todo de oro fino los cuales como fuesen de allí salidos fueronse por la cordillera de los cerros siete leguas de allí hasta un cerro que está legua y media del Cozco que llaman Guanacaure y decindiéronse de allí a las espaldas deste cerro a un valle pequeño que en él se hace donde como fuesen allí sembraron unas tierras de papas comida destos indios y subiendo un día al cerro Guanacaure para de allí mirar y divisar donde fuese mejor asiento y sitio para poblar y subiendo ya encima del cerro Ayarcache que fue el primero que salió de la cueva sacó su honda y puso en ella una piedra y tiróla a un cerro alto y del golpe que dio derribó el cerro y hizo en él una quebrada y ansi mismo tiró otras tres piedras y hizo de cada tiro una quebrada grande en los cerros altos los cuales tiros eran y son desde donde los tiró hasta do el golpe hicieron segun que ellos lo fantasean espacio de legua y media y de una legua y viendo estos tiros de honda los otros tres sus compañeros paráronse a pensar en la fortaleza de","zh":"上面织满了金线，还佩着十分精致的金别针——就是一些两拃长的长针，他们称为“托波”。这些女人还从洞里带出了伺候丈夫、给丈夫做饭用的器具，如小罐、小壶、盘子、碗和酒杯，全是纯金的。他们从那里出来以后，沿着山脊走了七里格，到了离库斯科一里格半、名叫瓦纳考里的一座山，又从那里下到山背后的一条小山谷里。到了那里，他们种了几块土豆地——土豆是这些印第安人的食物。有一天他们登上瓦纳考里山，想从那里眺望，看哪里是更好的定居之地。到了山顶，最先从洞里出来的阿亚尔·卡切取出投石索，放上一块石头，朝一座高山打去，这一击把山打塌，打出一道山沟；他又打出三块石头，每一击都在高山上打出一道大沟。照他们的幻想，从投石之处到石头落处，远的有一里格半，近的也有一里格。另外三个同伴看见这几下投石，便思量起","tr":"p"},"b3-4":{"src":"b","ch":3,"pg":"p. 18b","es":"este Ayarcache y apartáronse de allí un poco aparte y ordenaron de dar manera como aquel Ayarcache se marchase de su compañía porque les parecía que era hombre de grandes fuerzas y valerosidad y que los mandaría y sujetaría andando el tiempo y acordaron de tornar desde allí a la cueva do habían salido y porque ellos al salir habían dejado mucha riqueza de oro y ropa y del demás servicio dentro de la cueva ordenaron sobre cautela que tenían necesidad deste servicio y que volviése a lo sacar Ayarcache el cual dijo que le placía y siendo ya a la puerta de la cueva Ayarcache entró a gatas bien ansi como había salido que no podían entrar menos y como le viesen los demás dentro tomaron una gran losa todos tres y cerráronle la salida y puerta por donde entró y luego con mucha piedra y mezcla hicieron a esta entrada una gruesa pared de manera que cuando volviese a salir no pudiese y se quedase allá y esto acabado estuviéronse allí hasta que dende a cierto rato oyeron como daba golpes en la losa de dentro Ayarcache y viendo los compañeros que no podía salir tornáronse al asiento de Guanacaure donde estuvieron los tres juntos un año y las cuatro mujeres con ellos y la mujer de Ayarcache que ya era quedado en la cueva diéronla a Ayarmango para que le sirviese.","zh":"这位阿亚尔·卡切的力气来。他们走到一边商量，要想办法让这位阿亚尔·卡切离开他们，因为他们觉得他力大勇猛，日后会统治他们、使他们臣服。他们商定从那里回到出来的那个洞穴去。因为他们出来时在洞里留下了许多金子、衣物和其他器具，他们便设下圈套，说需要这些东西，让阿亚尔·卡切回去取出来。阿亚尔·卡切说他愿意。到了洞口，阿亚尔·卡切像出来时那样爬了进去——别的方法也进不去。其他人见他进去了，三个人一起抬起一块大石板，把他进去的出口和洞门堵住，又用大量石头和灰浆在入口砌了一道厚墙，叫他回来时出不来，只能留在里面。做完这些，他们在那里等了一会儿，听见阿亚尔·卡切在里面敲打石板；同伴们见他出不来，便回到瓦纳考里的住处，三个人在那里一起住了一年，四个女人也同他们在一起。阿亚尔·卡切的妻子——阿亚尔·卡切已经留在洞里了——他们把她给了阿亚尔·曼科，让她伺候他。","tr":"p"},"b31-1":{"src":"b","ch":31,"pg":"p. 145a","es":"Mandó Ynga Yupangue que el año cumplido desde el día de su muerte y en fin del le hiciesen cierta fiesta que es casi canonizable como a santo en la cual fiesta mandó que se hiciesen tantas ceremonias y se disfrazasen en tantos vestidos que por la gran prolijidad dellos no los diremos aquí todos más de los que a mi me paresció que debía poner porque en esto no me tuviesen por corto la cual fiesta mandó que le hiciesen en la ciudad del Cuzco y por otra parte y la cual fiesta estuviesen un mes y la cual hiciesen los señores y señoras del Cuzco en esta manera que el primer día que comenzasen que saliesen todos los del Cuzco hechos sus escuadrones ansi hombres como mujeres embadurnados los rostros con una color negra y que fuesen a los cerros de entorno de la ciudad e ansi mismo fuesen a las tierras do él sembraba y cogía y que todos ansi anduviesen llorando y que cada uno y cada una destos que trujesen en las manos las ropas de su vestir y arreos de su persona y armas con que peleaba y que llegados que ansi fuesen todos ellos en las partes do se paró y sitios do se sentó cuando el vivía y andaba por allí que le llamasen a voces y le preguntasen donde estaba y que le relatasen allí sus hechos y que cada uno dellos","zh":"印加·尤潘基命令：从他去世那天起满一年，到这一年终了，为他举行某种节庆——这几乎就像把他当作圣徒封圣一样。他命令在这个节庆上举行许多仪式，用许多服装装扮，名目繁多，我们这里不全讲，只讲我认为应当写下的，好叫人不至于说我写得太简略。他命令这个节庆在库斯科城和另外的地方为他举行，节期一个月，由库斯科的领主和贵妇们按如下方式举行：第一天开始时，库斯科所有的人，男男女女，都编成队伍，脸上涂满黑色，走到城市四周的山上，也走到他耕种收获过的田地里，所有人都这样一边走一边哭；每个男人、每个女人手里都拿着他生前穿的衣服、身上的饰物和他打仗用的兵器；他们全都走到他生前到过那里时停留过的地方、坐过的地方，高声呼唤他，问他在哪里，在那里向他述说他的功业；每个人","tr":"p"},"b31-2":{"src":"b","ch":31,"pg":"p. 145b","es":"hablase con la cosa que tuviese en las manos suya que si tenía alguna camiseta que dijese ves aquí el vestido que te vestías y según que fuese el vestido que si era el que se vestía en las fiestas que ansi lo dijese y si eran armas con que peleaba que dijesen ves aquí tus armas con que venciste y sujetaste tal provincia y tantos caciques que eran señores dellas y ansi por el consiguiente le relatasen y dijesen lo que hacía cuando vivo era con cada cosa que en las manos trajese y que esto habían de hacer quince días desde la mañana hasta la noche por los cerros y tierras y casas y calles de toda la ciudad y acabado de relatar lo que ansi cada uno dijese según que lo que llevaba en las manos que le llamasen en alta voz y que a estas voces respondiese el señor más principal de los que allí iban y que dijese en el cielo está con su padre el sol y que luego respondiesen a esta voz que se acordase dellos y les enviase buenos temporales y les quitase enfermedades y todo mal que les viniese pues era en el cielo y pasados los quince días que esto hubiesen hecho que le hiciesen una fiesta a la cual fiesta llamó y mandó que se llamase Purucaya en la cual fiesta saliesen el primer día a la plaza cuatro hombres vestidos con unas vestimentas","zh":"都对着手里拿的他的东西说话：如果拿的是一件长衫，就说“看，这是你穿过的衣服”，并按衣服的种类，如果是他节庆时穿的，就这样说；如果是他打仗用的兵器，就说“看，这是你的兵器，你用它打败、征服了某某省份和那里的许多酋长领主”；照此类推，凭着手中的每一样东西，向他述说他生前用它做过的事。这件事要做十五天，从早到晚，走遍全城的山野、田地、房屋和街道。各人照手中所拿之物述说完毕，就高声呼唤他；对这呼唤，由同行之人中地位最高的那位领主应答，说“他在天上，同他的父亲太阳在一起”；众人随即接着呼喊，求他记着他们，给他们降下好年景，替他们除去疾病和一切降临的灾祸，因为他在天上。做了十五天以后，再为他举行一个节庆，他命令这个节庆叫做“普鲁卡亚”。在这个节庆的第一天，有四个男人出来到广场上，身穿","tr":"p"},"b31-3":{"src":"b","ch":31,"pg":"p. 146a","es":"de plumas y los gestos con muchas pinturas y otras unturas y que las vestimentas de estos que fuesen hechas de tal manera que de nadie fuesen conocidos y a todos fuesen espantables y es verdad que yo vi hacer esta fiesta en la ciudad del Cuzco donde a un año que Paulo murió por él y estos hombres ansi disfrazados más me parescieron figuras en su traje y cosas que hacían demonios que no de personas ni de ángeles del cielo y volviendo a nuestra historia mandó que estos cuatro hombres trujesen atadas a las cinturas unas cuerdas largas hechas de oro y lana fina y que trujese cada uno destos diez mujeres consigo vestidas y adornadas de vestiduras preciadas y estas mujeres viniesen asidas de la cuerda que cada uno dellos traía atada a la cintura y que los dos destos estuviesen a la una parte de la plaza y los otros dos a la otra apartados los unos de los otros algún tanto y que cada uno destos trujese un muchacho y una muchacha consigo los cuales le trujesen en medio y que la muchacha trajese a cuestas un costalejo de coca el cual costal fuese y había de ser de oro o plata y que el muchacho trujese unos ayllos (sic) en las manos lo cual fuese arrastrando por el suelo y que cada uno de aquellos cuatro anduviesen haciendo visajes a una parte y a otra por la plaza y las diez mujeres estando en un lugar quedas teniendo el cordel en su mano con que el disfrazado anda atado y cuando fuese un trecho dellas el disfrazado que largasen parte del cordel el que a ellas les paresciese y cuando anduviese para atrás hacía ellas que cogiesen el cordel y que la muchacha que la coca llevase que cuando","zh":"羽毛做的衣服，脸上画满了彩绘，涂着别的颜料；这些人的衣服要做得谁也认不出来，人人见了都害怕。我确实在库斯科城亲眼见过举行这个节庆，那是保罗死后一年为他举行的；这些人这样装扮，穿戴和举动在我看来更像魔鬼，不像人，也不像天上的天使。回到我们的叙述：他命令这四个男人腰间系着用金线和细羊毛做的长绳，每人身边带十个女人，穿戴着珍贵的衣服，这些女人都抓着那人系在腰间的绳子；四人中两个站在广场一边，另两个站在另一边，彼此隔开一段距离；每人身边带一个男孩、一个女孩，让他走在两人中间；女孩背着一个装古柯的小袋，这袋子要用金或银做；男孩手里拿着一副绊索（原文如此），拖在地上走；这四个人在广场上四处做着怪相，那十个女人站在原地不动，手里抓着系住这装扮者的绳子；装扮者离她们走远一段，她们就按自己的意思放出一段绳子；他往回朝她们走，她们就把绳子收回来；背古柯的女孩，时不时","tr":"p"},"b31-4":{"src":"b","ch":31,"pg":"p. 146b","es":"en cuando le metiese coca ella en la boca sacándola de aquel costalejo de oro o plata y mientras él anduviese haciendo estos visajes que esta muchacha fuese a salticoncillos a un lado del llevando un palillo en las manos y amagándole con él como que se lo quería tirar so braço y el muchachuelo ansi mismo fuese descendiendo por el suelo aquella cordezuela y ayllo que esto significar dicen que es que aquellos demuestran en aquella figura a sus enemigos en la guerra y la muchacha de la coca que significa una mujer que le daba coca cuando peleaba y el muchacho con el ayllo que le servía con él y con las demás armas y se las daba a mano cuando ansi peleaban porque habrán de saber que este ayllo es una cordezuela hecha en triángulo y en las dos puntas de los dos cabos están atadas en cada una dellas una pelota del gordor de una naranja y ansi redonda y en la otra punta del otro ramal otra ni más ni menos las cuales son hechas de piedra de metal y asen de la una bola y cuelgan las dos abajo y cuando las quieren tirar traénla en el aire bien ansi como cuando uno quiere tirar una honda y tienen tino a los que quisiesen tirar y si es a hombre le tiran a las piernas cíñele de tal manera que le entrailla y no le deja dar paso si no tiene socorro con que se desenvuelve el tal cordel no lo puede cortar el que ansi está tan breve que no sea más en breve con él el enemigo que se le tiró y le prenda y mate y lo mismo hace a los brazos si a los brazos le tira y estos son de una braza y braza y media los de la guerra y de cordeles de niervos","zh":"从那个金袋或银袋里取出古柯放进他嘴里；他做这些怪相的时候，这女孩在他身边一蹦一跳地走，手里拿着一根小棍，作势要从胳膊上方向他打去；那个小男孩也同样把那根细绳和绊索在地上拖着走。据说这表示的是：这些人在扮演他们在战争中的敌人；背古柯的女孩代表在他打仗时给他古柯的女人；拿绊索的男孩代表在他打仗时用绊索和其他兵器服侍他、把兵器递到他手里的人。因为你们要知道，这种绊索是一根做成三叉的细绳，两个绳头上各系一个橘子大小、同样圆的球，另一股绳的末端也同样系一个；这些球是用金属石料做的。他们抓住一个球，让另两个垂下来，要投的时候，就像投石索那样在空中抡起来，投得很准；如果是投人，就投向人的腿，把腿缠住，把人绊住，使他迈不开步；他要是没有人帮着解开，被缠住的人是来不及割断绳子的，投绊索的敌人很快就赶到，把他捉住杀死；投向胳膊也是一样。战场上用的绊索长一寻到一寻半，用筋做的绳子，","tr":"p"},"b31-5":{"src":"b","ch":31,"pg":"p. 147a","es":"otros pequeños traen ellos con que tiran a aves en el aire y como les acierten asenlas porque se les revuelven los cordeles de tal manera que no las dejan volar y estan diestros en estos tiros porque los usan desde niños que por maravilla yerran tino destos y volviendo a esta historia las diez mujeres dicen significar la voluntad de aquel señor que si la voluntad le daba larga de la cuerda con que le traía atado que hacía como hombre suelto y si le tiraba della que no hacía cosa más de como le daba larga de cuerda diciendo que la voluntad tenía atado al hombre y estos cansados que saliesen de la plaza y que luego hiciesen gran llanto en ella por el nuevo señor y los demás señores y la demás gente que allí estuviese y esto hecho que saliesen dos escuadrones de gente de guerra uno de la gente de Hanan Cuzco y tros de Hurin Cuzco y que el un escuadron saliese por la una parte de la plaza y el otro por la otra y que batallasen y que se mostrasen vencidos los de la gente de Hurin Cuzco y vencedores los de Hanan Cuzco significando las guerras que el señor tuvo en su vida y que esto acabado su llanto todos los señores del Cuzco asídos por las manos en el cual llanto dijesen en alta voz y relatasen sus victorias y grandezas y esto acabado que saliesen otros dos escuadrones de mujeres vestidas como hombres encima de sus mesmos vestidos y en las cabezas ansi mismo las ataduras de hombre y que ansi mesmo trujesen en la cabeza unos plumajes y que el un escuadrón de mujeres trujesen unos paveses y el otro unas alabardas altas en las manos y que anduviesen estas mujeres en torno de la plaza a cierto paso moderado a manera de sus bailes entre las cuales fuesen algunos","zh":"另有小的，他们用来投空中的鸟；投中了就能抓住，因为绳子把鸟缠住，使它飞不了。他们投这种东西非常熟练，因为从小就用，难得失手。回到这段叙述：据说那十个女人代表这位领主的意志：意志放长绳子，他就像自由的人那样行动；意志拉紧绳子，他就只能在绳子放出的范围内行动；意思是说，意志把人拴住了。这几个人跳累了，就离开广场；随后广场上的众人为新领主、为其他领主和在场的其他人大哭一场。这件事做完，出来两队兵士，一队是哈南库斯科的人，另一队是乌林库斯科的人；一队从广场一边出来，另一队从另一边出来，两队交战；乌林库斯科的人要装作战败，哈南库斯科的人要装作战胜，以此表示这位领主一生所打的仗。这件事做完，库斯科所有的领主手拉着手痛哭，一边哭一边高声述说他的胜利和伟业。这件事做完，又出来两队女人，在自己的衣服外面穿上男人的衣服，头上也缠着男人的头饰，同样头戴羽饰；一队女人拿着大盾，另一队手持高高的长戟；这些女人以舞蹈的步子，从容地绕着广场行进，她们中间夹着","tr":"p"},"b31-6":{"src":"b","ch":31,"pg":"p. 147b–148b","es":"hombres los cuales llevasen unas hondas en las manos como varones preguntando qué significa esto dicen que este señor va al cielo con estas ceremonias preguntando como saben ellos aquello dicen que Ynga Yupangue lo dijo cuando esto ordenó y esto hecho es acabado el mes desde el día que comenzaron y mandó Ynga Yupangue como esto acabasen que fuesen a lavar todos del luto que ansi tenían puesto todo el año y esto hecho y esto (sic) que viniesen a la plaza y que trujesen a ella todas sus vestiduras y cosas con que ansi le habían llorado en la cual plaza estuviese hecho un gran fuego en el cual echasen todas aquellas vestiduras y cosas y traerán luego allí mil ovejas vestidas con sus vestimentas de todos colores y allí en aquel fuego me seran sacrificadas y luego traerán otras dos mil ovejas sin vestimenta las cuales serán allí degolladas y a mí ofrecidas y carne destas será repartida entre todos los de la ciudad que por mi han hecho sentimiento y luego traerán otros mil corderos y en aquel fuego me serán sacrificados y otros tantos me sacrificarán en toda la ciudad en mis casas do yo he dormido y en las demás partes y lugares do yo haya estado quemándolos en fuegos en cada parte destas y ansi mismo traeran mil muchachos y muchachas y serme han enterrado en los lugares y sitios en do yo dormía y me solía holgar y recrear y esto hecho todo mi servicio de oro y plata será metido debajo de tierra conmigo y en mis casas y todo mi ganado y depósitos será quemado en las partes do yo le tuviese diciendo que todo iba con él y que aquello acabado estaba en el cielo con el sol y todas estas fiestas ya acabadas el nuevo señor hiciese de su cuerpo un bulto y lo tuviese en su casa do todos le reverenciasen y adorasen porque con las ceremonias e idolatrías que ya habeis oído era canonizado y tenían que era santo.","zh":"一些男人，手里像男子那样拿着投石索。问这是什么意思，他们说，这位领主借着这些仪式升天；问他们怎么知道，他们说是印加·尤潘基规定这些事时亲口说的。这些做完，从开始那天算起，一个月就满了。印加·尤潘基又命令，这些做完以后，所有人都去洗掉这一整年所戴的丧；洗完以后（原文如此），来到广场，把他们哭他时用的一切衣服和东西都带到广场上；广场上要生起一堆大火，把这些衣服和东西统统扔进去烧掉。“随后要把一千只穿着各色衣服的羊带到那里，在那火里献祭给我；再带来两千只不穿衣服的羊，在那里宰杀，献给我，羊肉分给城里所有为我哀悼过的人；再带来一千只羊羔，在那火里献祭给我；在全城我睡过的房屋里，在我待过的其他地方，也要献祭同样多的羊羔，在每一处各生火焚烧；还要带来一千个男孩和女孩，把他们埋在我睡过、游乐休憩过的地方。这些做完，我所有的金银器具都要同我一起埋入地下，埋在我的宅第里；我所有的牲畜和仓库都要在我存放它们的地方烧掉。”他说，这一切都随他而去，这些做完，他就同太阳一起在天上了。所有这些节庆做完以后，新领主要用他的遗体做一尊像，放在自己家中，让所有人都尊崇、敬拜它，因为借着你们听到的这些仪式和偶像崇拜，他已经被封圣，人们认为他是圣徒了。","tr":"p"},"b32-1":{"src":"b","ch":32,"pg":"p. 149a","es":"Dado que hubo orden este señor Ynga Yupangue a las idolatrías y variedades que ya habeis oído mandó que luego que él muriese se hiciesen las tales variedades y sacrificios que ansi mismo luego que esto fuese hecho enviasen a toda la tierra y que de todas las provincias y pueblos tornasen a traer de nuevo todo lo necesario para el servicio del nuevo señor ansi de oro como de plata como de ganados y ropa y de los demás menesteres fuesen tornados a henchir y reparar todos los depósitos que por su fin y muerte habían sido vaciados para los sacrificios y cosas que ansi mandaba que se hiciese y que fuesen tan abundantes porque via y le parescía que iba aumentando y engrandeciendo más el estado del que ansi Ynga era y estando ansi hablando y mandando Ynga Yupangue lo que se había de hacer después que falleciese alzó en alta voz un cantar el cual cantar el día de hoy cantan los de su generación en su memoria el cual cantar decía en esta manera desde que florecía como la flor del huerto hasta aquí he dado orden y razón en esta vida y mundo hasta que mis fuerzas bastaron y ya soy tornado tierra y diciendo","zh":"这位领主印加·尤潘基对你们听到的那些偶像崇拜和种种花样作了安排以后，命令在他死后立即举行这些花样和献祭；又命令这些做完以后，立即派人到全境，从各省各村再运来新领主所需的一切供奉，金、银、牲畜、衣物和其他用品，把因他去世、为他命人所做的献祭和种种事情而用空了的仓库全部重新装满、补足；而且要比以前更丰足，因为他看到、也认为，做印加的人的地位正越来越高、越来越大。印加·尤潘基正这样说着、吩咐着他死后要做的事，忽然高声唱起一支歌，这支歌今天他的后人还在唱，来纪念他。这支歌是这样唱的：“自从我像园中的花一样开放，直到今天，在这一生、这世上，只要力气还够，我都安排了秩序和道理；如今我已化为尘土。”说着","tr":"p"},"b32-2":{"src":"b","ch":32,"pg":"p. 149b","es":"estas palabras en su cantar expiró Ynga Yupangue Pachacuti dejando toda la tierra y razón y la orden y razón ya dicha y bien proveído su pueblo de ídolos e idolatrías y variedades y siendo ya muerto fue llevado a un pueblo que se llama Patallacta en el cual pueblo él había hecho edificar unas casas do su cuerpo fuese sepultado y sepultáronle metiendo su cuerpo debajo de tierra en una tinaja grande de barro nueva y él bien vestido y encima de su sepulcro mandó Ynga Yupangue que fuese puesto un bulto de oro hecho a su semejanza y en su lugar a quien las gentes que allí fuesen adorasen en su nombre y luego fue puesto y de las uñas y cabellos que en su vida se cortaba mandó que fuese hecho un bulto el cual ansi fue hecho en aquel pueblo do el cuerpo estaba y de allí trujeron este bulto en unas andas a la ciudad del Cuzco muy suntuosamente a las fiestas de la ciudad el cual bulto pusieron en las casas de Topa Ynga Yupangue y cuando ansí fiestas había en la ciudad le sacaban a las tales fiestas con los demás bultos y lo que es más de reir deste señor Ynga Yupangue es que cuando quería hacer algún ídolo entraba en las casa del sol y fingía que hablaba el sol con él y él ansi","zh":"这些话，在他的歌声中，印加·尤潘基·帕查库蒂去世了，留下了整个国家和你们听到的秩序与规矩，给他的城里配备齐了神像、偶像崇拜和种种花样。他死后，被抬到一个名叫帕塔利亚克塔的村子，他曾在那里命人建了一些房屋，作为埋葬他遗体的地方。他们把他埋了，把他的遗体放进一口新的大陶瓮里，埋在地下，他穿戴得很好；印加·尤潘基曾命令在他的墓上放一尊照他的模样做的金像，代表他，让到那里去的人以他的名义敬拜它；这尊像随即放上去了。他又命令用他生前剪下的指甲和头发做一尊像，这尊像就在他遗体所在的那个村子做成了；人们用肩舆把这尊像从那里极其隆重地抬到库斯科城去参加城里的节庆，把它安放在图帕克·印加·尤潘基的宅第里；每逢城里有节庆，就把它同其他像一起抬出来参加。这位领主印加·尤潘基更可笑的是，他每要造一个神像，就走进太阳殿，假装太阳同他说话，他自己","tr":"p"},"b32-3":{"src":"b","ch":32,"pg":"p. 150a","es":"mismo que le respondía para hacer en creyente a los suyos que el sol le mandaba hacer aquellos ídolos y guacas y ellos los adorasen por tales y como el bulto fuese en la ciudad mandó Topa Ynga Yupangue que este bulto sacasen los de su mismo linaje a las fiestas que ansi hubiese en el Cuzco y que cuando ansi le sacasen le sacasen cantando las cosas que él hizo en su vida ansi en las guerras como en su ciudad y que ansi le sirviesen y reverenciasen y mudasen las ropas y vestidos como él los mudaba y era servido en su vida todo lo cual ansi fue hecho el cual bulto se llevó Mango Ynga de la ciudad del Cuzco cuando se alzó y el de oro que estaba encima de su sepultura por aviso que doña Angelina Yupangue dió del al marqués de don Francisco Pizarro le hubo el marqués con la demás riqueza que tenía y solo su cuerpo está el día de hoy en Patallacta el cual por sus miembros parece que era en su vida hombre de buen altor y gran estatura del cual se dice que murió de edad de ciento y vinte años y mandó Topa Ynga Yupangue después de la muerte de su padre que ninguno de los descendientes de Ynga Yupangue su padre poblase de la parte afuera de los dos arroyos del Cuzco y a los descendientes deste Ynga Yupangue llamaron desde entonces hasta hoy Capac aillo Ynga Yupangue Haguaymin que dice de linaje de","zh":"也回答太阳，好让他的人相信是太阳命他造那些神像和圣地，让他们把它们当作神像和圣地来敬拜。这尊像到了城里以后，图帕克·印加·尤潘基命令由他本宗族的人把这尊像抬出来参加库斯科的节庆；抬出来时，要一边抬一边唱他生前在战争中和在城里所做的事，并要侍奉它、敬重它，像他生前那样给它更换衣服，像他生前那样服侍它。这一切都照办了。这尊像，曼科·印加起兵时从库斯科城带走了；墓上那尊金像，因为多尼亚·安赫利娜·尤潘基向侯爵堂弗朗西斯科·皮萨罗告知了它的下落，侯爵就和他的其他财宝一起得到了；今天只剩下他的遗体还在帕塔利亚克塔。从遗体的肢体看，他生前是个身材高大的人；据说他死时一百二十岁。父亲死后，图帕克·印加·尤潘基命令，他父亲印加·尤潘基的后裔，谁都不得住到库斯科两条溪流以外的地方；从那时直到今天，人们称这位印加·尤潘基的后裔为“卡帕克·艾柳·印加·尤潘基·瓦伊明”，意思是“王者世系、","tr":"p"},"b32-4":{"src":"b","ch":32,"pg":"p. 150b","es":"reyes descendientes y nietos de Ynga Yupangue y estos son los más sublimados y tenidos en más entre los del Cuzco que de otro linaje ninguno y estos son a quien fue mandado traer las dos plumas en la cabeza y como andando el tiempo fueron multiplicando esta generación de orejones hubo y hay el día de hoy muchos que hicieron cabezas y nombradías como mayorazgos y tomaron apellidos diversos casándose con mujeres que no eran de su linaje y viendo esto los de Ynga Yupangue que ordenaron que los que ansi mezclasen sangre ajena que apellidasen nuevo apellido y sobrenombre para que ellos pudiesen limpiamente nombrarse Capac Caillo y descendientes de Ynga Yupangue y como viniesen los españoles todo esto se acrecentó que ansi los unos como los otros se nombran de aquel linaje y en la manera que ya habeis oído esto cuando los españoles se lo preguntan de qué linaje son del cual señor Ynga Yupangue no se tratará más aunque dicen que en un año que estuvieran preguntándoles a cada uno de los del Cuzco por sí de los antiguos que desto tienen memoria no podrían dar fin de contar y decir las grandezas y gran ser deste señor Pachacuti Ynga Yupangue y hablaremos de su hijo y sucesor Topa Ynga Yupangue que en sus cosas y hechos quiso parescer en algún tanto a su padre Ynga Yupangue.","zh":"印加·尤潘基的子孙后代”。他们在库斯科人当中最受尊崇、地位最高，没有哪个世系比得上；规定头上可以戴两根羽毛的，就是他们。随着时间推移，这一支大耳贵族人丁繁衍，过去和今天都有许多人像设立长子继承产业那样另立门户、自立名号，娶本宗族以外的女子为妻，取了各种各样的姓氏。印加·尤潘基一系的人见此情形，就规定这样混入外人血统的人要另取新姓、新名号，好让他们自己能纯正地称为“卡帕克·艾柳”、印加·尤潘基的后裔。西班牙人来了以后，这种情形更加厉害，西班牙人问他们是哪个世系的，这些人和那些人都自称是那个世系的，就是你们听到的那样。这位领主印加·尤潘基我们就不再讲了，不过据说，即使花上一年工夫，把库斯科那些记得此事的老人一个一个地问，他们也讲不完、说不尽这位领主帕查库蒂·印加·尤潘基的伟业和伟大。下面我们来讲他的儿子和继承人图帕克·印加·尤潘基，他的所作所为，有几分想要像他的父亲印加·尤潘基。","tr":"p"},"b4-1":{"src":"b","ch":4,"pg":"p. 19a","es":"Ya el año cumplido que allí estuvieron pareciéndoles que aquél sitio do estaban no era cual les convenía pasáronse de allí media legua más hacia el Cuzco a otra quebrada que llaman Matagua y en esta quebrada estuvieron otro medio año y desde encima de los cerros de esta quebrada miraban el valle del Cuzco y el pueblo que tenía poblado Alcabicça y parescióles que era buen sitio aquel do estaba poblado aquel pueblo de Alcabilcça y decendidos que fueron al sitio y ranchería que tenían entraron en su acuerdo y parecióles que sería bien poblar con los que vivían en aquel pueblo y ansi mismo les paresció que el uno dellos se quedase en el cerro de Guanacaure hecho ídolo en que los demás adorasen y que este que ansi quedase hecho ídolo hablase con el sol su padre que los guardase y aumentase y diese hijos y los enviase buenos temporales y luego se levantó en pie Ayaroche y mostró unas alas grandes y dijo que él había de ser el que quedase allí en el cerro de Guanacaure por ídolo para hablar con el sol su padre y luego subieron el cerro arriba y siendo ya en el sitio do había de quedar","zh":"在那里住满一年，他们觉得所住的地方不合适，就从那里再往库斯科方向挪了半里格，到了另一条名叫马塔瓜的山沟，在这条山沟里又住了半年。他们从这条山沟上面的山上俯看库斯科谷，看到阿尔卡维萨所建的村子，觉得那个村子所在的地方是好地方。他们下到自己的营地以后商议，认为最好去和住在那个村子里的人同住；又认为他们当中应当有一人留在瓦纳考里山上化为神像，供其余的人崇拜，并由这化为神像的人同他们的父亲太阳说话，求太阳保佑他们、使他们繁盛、赐给他们子嗣、降给他们好年景。阿亚尔·乌丘随即站起来，展开一对大翅膀，说该由他留在瓦纳考里山上做神像，去同他的父亲太阳说话。于是他们登上山去，到了他要留下来","tr":"p"},"b4-2":{"src":"b","ch":4,"pg":"p. 19b","es":"hecho ídolo dio un vuelo hacia el cielo el Ayaroche tan alto que no lo devisaron y tornóse allí y díjole a Ayarmango que de allí se nombrase Mango Capac porque él venía de do el sol estaba y que ansi lo mandaba el sol que se nombrse y que se descendiesen de allí y se fuesen al pueblo que habían visto y que les sería hecha buena compañía por los moradores del pueblo y que poblase allí y que su mujer Cura que se la daba para que le sirviese y que llevase consigo a su compañero Ayarauca y acabado de decir esto por el ídolo Ayaroche tornóse piedra ansi como estaba con sus alas y luego se descendió Mango Capac y Ayarauca a sú ranchería y descendidos que fueron vinieron do el ídolo estaba unos indios de un pueblo de allí cercano y como viesen el ídolo hecho piedra que le habían visto cuando el vuelo dio en lo alto tiráronle una piedra y de esta pedrada le quebraron al ídolo un ala de donde como ya le hubiesen quebrado un ala no pudo volar ya más y como le viesen hecho piedra no le hicieron más enojo y volviéronse estos indios que esto hicieron hacia su pueblo y","zh":"化为神像的地方，阿亚尔·乌丘向天空飞去，飞得极高，众人都看不见了。他飞回原处，对阿亚尔·曼科说，从此以后他要改名叫曼科·卡帕克，因为他是从太阳所在之处来的，太阳命令他这样改名；又说他们要从这里下山，到他们看见的那个村子去，村里的居民会好好接纳他们，他要在那里定居；又说把他的妻子库拉给曼科，让她伺候他，并让他带上同伴阿亚尔·奥卡同去。神像阿亚尔·乌丘说完这些话，就带着翅膀原样化成了石头。曼科·卡帕克和阿亚尔·奥卡随即下山回到营地。他们下山以后，附近一个村子的几个印第安人来到神像所在之处，见神像已化为石头——他们先前曾看见它飞上高空——就朝它扔了一块石头，这一下打断了神像的一只翅膀，翅膀断了，它再也飞不起来了。他们见它已成了石头，便没有再去惹它，回自己村子去了。","tr":"p"},"b4-3":{"src":"b","ch":4,"pg":"p. 20a","es":"Mango Capac y su compañero Ayarauca salieron de sus rancherías llevando consigo sus cuatro mujeres ya nombradas y caminaron para el pueblo del Cuzco do estaba Alcabicça y antes que llegasen al pueblo dos tiros de arcabuz estaba poblado un pueblo pequeño en el cual pueblo había coca y ají y la mujer de Ayarcache el que se perdió en la cueva llamada Mamaguaco dio a un indio de los deste pueblo de coca un golpe con unos ayllos y matólo y abrióle de presto y sacóle los bofes y el corazón y a vista de los demás del pueblo hinchó lo fobes soplándolos y visto por los indios del pueblo aquel caso tuvieron gran temor e con el miedo que habían tomado luego en aquella hora se fueron huyendo al valle que llaman el día de hoy Gualla de donde han procedido los indios que el día de hoy benefician la coca de Gualla y esto hecho pasaron adelante Mango Capac y su gente y hablaron con Alcabicça diciéndole que el sol los enviaba a que poblasen con él allí en aquel pueblo del Cuzco y el Alcabicça como le viese tan bien aderezado a él y a su compañero y las","zh":"曼科·卡帕克和他的同伴阿亚尔·奥卡带着前面说过的四个女人离开营地，朝阿尔卡维萨所在的库斯科村走去。离那村子还有两火绳枪射程的地方，有一个小村，村里有古柯和辣椒。阿亚尔·卡切——就是那个丢在洞里的人——的妻子玛玛·瓦科用绊索朝这个古柯村的一个印第安人打去，把他打死，随即剖开他的身体，掏出肺和心，当着村里其他人的面把肺吹得鼓起来。村里的印第安人看到这件事，非常害怕，当时就怀着恐惧逃到今天称为瓦利亚的山谷去了；今天在瓦利亚经营古柯的印第安人，就是从他们传下来的。这件事过后，曼科·卡帕克一行继续前行，同阿尔卡维萨说话，告诉他太阳派他们来，要在那库斯科村里和他同住。阿尔卡维萨见曼科和他的同伴打扮得这样好，又见他们","tr":"p"},"b4-4":{"src":"b","ch":4,"pg":"p. 20b","es":"alabardas de oro que en las manos traían y el demás servicio de oro entendió que era ansi y que eran hijos del sol y díjoles que poblasen donde mejor les pareciese y el Mango Capac agradecióselo y paresciéndole bien el sitio y asiento do agora es en esta ciudad del Cuzco las casas y convento de Santo Domingo que antes solía ser las casas del sol como adelante la historia lo dirá hizo allí el Mango Capac y su compañero y con el ayuda de las cuatro mujeres una casa sin consentir que gente de Alcabicça les ayudase aunque les querían ayudar en la cual casa se metieron ellos dos y sus cuatro mujeres y esto hecho dende a cierto tiempo el Mango Capac y su compañero con sus cuatro mujeres sembraron unas tierras de maíz la cual semilla de maíz dícen haber sacado ellos de la cueva a la cual cueva nombró este señor Mango Capac Pacarictambo que dice casa de producimiento porque como ya habeis oído dícen que salieron de aquella cueva y su sementera hecha holgábanse y regocijábanse Mango Capac y Alcabicça en buena amistad y contentamiento.","zh":"手里拿着金戟，还有其他金器，就相信确是如此，相信他们是太阳之子，便对他们说，他们愿意在哪里住就在哪里住。曼科·卡帕克谢了他。他看中了如今本城圣多明我会的房舍和修道院所在的地方——那里原是太阳殿，下文还要讲到——曼科·卡帕克和他的同伴在四个女人帮助下，在那里建了一所房子，没有让阿尔卡维萨的人帮忙，尽管他们是想帮忙的。他们两人和四个女人住进这所房子。此后过了一些时候，曼科·卡帕克和他的同伴同四个女人种了几块玉米地；据说玉米种子是他们从洞里带出来的——曼科·卡帕克这位领主给那个洞起名帕卡里坦博，意思是“产生之屋”，因为如你们已经听到的，据说他们是从那个洞里出来的。种完地，曼科·卡帕克和阿尔卡维萨就友好和睦地一起欢乐、嬉游。","tr":"p"},"b5-1":{"src":"b","ch":5,"pg":"p. 21a","es":"E dende a dos años que allí vino Mango Capac murió su compañero Ayarauca y quedó la mujer en compañía de las demás de Mango Capac sin que en ella hubiese habido hijo ninguno el Ayarauca y ansi quedó sólo Mango Capac con su mujer y las otras tres de sus compañeros ya dichos sin que tuviese que ver con ninguna de ellas para en cuanto a tenerlas por mujeres propias sino con la suya propia en la cual dende a poco tiempo hubo un hijo al cual hijo llamó Sincheroca y siendo ya Sincheroca mancebo de hasta quince o dieciseis años murió su padre Mango Capac sin dejar otro hijo si no fue aqueste Sincheroca. E dende a cinco años que murió Mango Capac murió Alcabicça y como fuese ya de edad de veinte años este Sincheroca hijo de Mango Capac hubo por mujer una señora llamada Mamacoca hija de un cacique señor de un pueblo que está una legua del Cuzco que llaman Zaño en la cual señora hubo Sincheroca","zh":"曼科·卡帕克来到那里两年以后，他的同伴阿亚尔·奥卡死了，他的妻子留下来，同曼科·卡帕克的其他女人在一起，阿亚尔·奥卡没有和她生过孩子。于是只剩下曼科·卡帕克带着自己的妻子和前面说过的三位同伴的妻子；他并没有把那三位当作自己的妻子来亲近，只亲近自己的妻子，不久就和她生了一个儿子，取名辛奇·罗卡。辛奇·罗卡长成十五六岁的少年时，他的父亲曼科·卡帕克去世了，除了这位辛奇·罗卡，没有留下别的儿子。曼科·卡帕克死后五年，阿尔卡维萨也死了。曼科·卡帕克的儿子辛奇·罗卡到了二十岁，娶了一位名叫玛玛·科卡的贵妇为妻，她是一个村子的酋长兼领主的女儿，那村子离库斯科一里格，名叫萨尼奥。辛奇·罗卡和这位贵妇","tr":"p"},"b5-2":{"src":"b","ch":5,"pg":"p. 21b","es":"un hijo llamado Lloque Yupangue este Lloque Yupangue nació con dientes y luego que nació anduvo y nunca quiso mamar y luego habló cosas de admiración que a mi parescer debió de ser otro Merlin según que las fábulas dícen y ansi como este nació dícen que tomó una piedra en las manos y tiróla a otro muchacho descendiente de Alcabicça que al presente por allí pasaba el cual íba por agua a una fuente con cierta vasija en las manos de la cual pedrada el Lloque Yupangue recién nacido quebró una pierna al muchacho de Alcabicça ya dicho del cual caso los agoreros dijeron que los que descendiesen deste Lloque Yupangue serían grandes señores y que señorearían aquel pueblo y que los descendientes de Alcabicça serían hechados de aquel pueblo por los descendientes del Lloque Yupangue lo cual ansi fue como la historia lo dirá adelante según que lo dijeron los que dieron razón dello y porque este Lloque Yupangue no hizo cosas más notables que esta ya dicha en el tiempo que vivió le dejaremos. Y después de los días de éste sucedió en su lugar","zh":"生了一个儿子，名叫略克·尤潘基。这位略克·尤潘基生下来就有牙，一生下来就会走路，从来不肯吃奶，随即说出令人惊异的话，依我看，他该是传说里所讲的又一个梅林。据说他一生下来就拿起一块石头，朝另一个男孩打去；那男孩是阿尔卡维萨的后裔，当时正从那里经过，手里拿着一个容器，要到泉边去打水。刚生下来的略克·尤潘基这一石头，打断了阿尔卡维萨家那个男孩的一条腿。占卜者们就此事说，这位略克·尤潘基的后裔将成为大领主，统治那个村子，阿尔卡维萨的后裔将被略克·尤潘基的后裔逐出那个村子。据讲述此事的人说，后来果然如此，下文还要讲到。这位略克·尤潘基在世时，除了上面说的这件事，没有做过更值得一提的事，我们就把他放下。他死后，接替他","tr":"p"},"b5-3":{"src":"b","ch":5,"pg":"p. 22a","es":"un hijo suyo que se llamó Capac Yupangue del cual se dice no haber procurado más ser que el que su padre Lloque Yupangue le dejó y después de los días deste sucedió en su lugar un hijo suyo que se dijo Mayta Capac el cual dícen no haber procurado más ser que sus pasados y después de los días deste sucedió en su lugar un hijo suyo que se dijo Yngaroca Ynga del cual dícen haber habido seis mujeres que tuvo treinta hijos y hijas y después de los días deste sucedió en su lugar un hijo suyo y mayor de los otros que se llamó Yaguar Guaca Ynga Yupangue deste dícen que nació llorando sangre y por eso le llamaron Yaguar Guaca que díce llora sangre deste dícen que tuvo veinte mujeres en las cuales hubo cincuenta hijos e hijas del cual dícen no haber procurado","zh":"的是他的一个儿子，名叫卡帕克·尤潘基，据说他没有求比父亲略克·尤潘基留给他的更大。他死后，接替他的是他的一个儿子，名叫迈塔·卡帕克，据说他也没有求比先人更大。他死后，接替他的是他的一个儿子，名叫印加·罗卡，据说他有六个妻子，生了三十个儿女。他死后，接替他的是他一个比其他人年长的儿子，名叫亚瓦尔·瓦卡克·印加·尤潘基；据说他生下来就哭出血来，所以人们叫他亚瓦尔·瓦卡克，意思是“哭血”。据说他有二十个妻子，生了五十个儿女；据说他也","tr":"p"},"b5-4":{"src":"b","ch":5,"pg":"p. 22b","es":"más ser que le dejaron sus pasados y después de los días deste sucedió en su lugar un hijo suyo que llamaron Viracocha Ynga deste dícen que le llamaron Viracocha Ynga porque era muy amigable a los suyos y afable y los gobernaba en mucha quietud dándoles siempre dádivas y haciéndoles mercedes y como esto fuese ansi amábanle los suyos de gran voluntad y levantándose un día por la mañana salió alegre a los suyos y preguntándole los suyos que de qué se regocijaba dícen que les respondió que el Viracochapachayachachic le había hablado diciendo que Dios le había hablado aquella noche y luego se levantaron todos los suyos y le llamaron Viracocha Ynga que quiere decir Rey y Dios y desde allí se nombró éste deste nombre.","zh":"没有求比先人留给他的更大。他死后，接替他的是他的一个儿子，人们叫他维拉科查·印加。据说人们这样叫他，是因为他待自己的人十分友善、和蔼，治理他们十分安宁，常常赏赐他们、给他们恩惠；因此他的人都真心爱戴他。有一天早上他起身，高高兴兴地出来见他的人。他们问他为什么这样高兴，据说他回答说，维拉科查·帕查亚查奇克同他说话了——意思是说，神在那天夜里同他说话了。他的人都站起来，称他为维拉科查·印加，意思是“王与神”；从此他就用了这个名字。","tr":"p"},"b6-1":{"src":"b","ch":6,"pg":"p. 23a","es":"En el tiempo deste Viracocha Ynga había más de doscientos señores caciques de pueblos y provincias cincuenta y sesenta lugares en la redondez desta ciudad del Cuzco los cuales se intitulaban y nombraban en sus tierras y pueblos Capac Ynga que quiere decir señores e reyes y lo mismo hacía este Viracocha Ynga e intitulábase como arriba dijimos dios de donde vieron los demás señores ya dichos que se intitulaba de más ser que ninguno dellos y como un señor destos de nación changa que se decía Uscovilca el cual era señor de mucha suma de gente e tenía seis capitanes muy valerosos sus sujetos que se llamaron Malma y otro Rapa y otro Yanabilca y otro Tecdovilca y otro Guamanguaraca y otro Tomayguaraca y este Uscovilca como tuviese noticia que en el Cuzco residía Viracocha Ynga y que se intitulase de mayor señor quel siendo él más poderoso de gente y intitulándose él señor","zh":"在这位维拉科查·印加的时代，在本城库斯科周围五六十处地方，有二百多位领主，都是各村各省的酋长；他们在自己的地方和村子里都自称、号称“卡帕克·印加”，意思是“领主与王”。这位维拉科查·印加也是这样，而且如上所说，还自称为神。其他领主由此看出，他自封的地位比他们任何一个都高。这些领主当中有一位昌卡族的领主，名叫乌斯科维尔卡，统率着大批人众，手下有六位十分勇猛的将领，一个叫马尔马，一个叫拉帕，一个叫亚纳维尔卡，一个叫特克多维尔卡，一个叫瓦曼瓦拉卡，一个叫托迈瓦拉卡。这位乌斯科维尔卡听说库斯科住着维拉科查·印加，而且自封为比他更大的领主——而他自己人马更多，又自称是","tr":"p"},"b6-2":{"src":"b","ch":6,"pg":"p. 23b","es":"de toda la tierra pareciéndole que era bien ver qué poder era el de Viracocha Ynga y para ver esto estando este Uscovilca en el pueblo de Paucaray que es tres leguas de Parcos entró en consulta con los suyos que orden deviesen tener para este hecho y viendo que su poder era grande acordaron en su acuerdo que debían ir sus capitanes a descubrir por la parte de Condesuyo tierras e provincias y ansi mesmo por la parte de Andesuyo a lo mesmo y que él ansi mesmo con dos capitanes de los suyos y con la gente que le quedase fuese por el medio destas dos provincias derechamente a la ciudad del Cuzco y que desta manera sería señor de toda la tierra y que él de su mano sujetaría al Viracocha Ynga y ansi salió de su acuerdo y desque hubo salido mandó que par[a un] día señalado se juntase toda su gente en aquel pueblo e llano de Paucaray do él era natural y ansi se juntaron todos los suyos el día que","zh":"全境的领主——觉得应当去看看维拉科查·印加有多大的势力。为此，乌斯科维尔卡在离帕尔科斯三里格的保卡赖村同他的人商议，看该如何行事。他们见自己势力强大，商定派他的将领从孔德苏尤方向去寻找土地和省份，同样也从安德苏尤方向去，他自己则带两名将领和剩下的人马，从这两个方向的中间直取库斯科城；他认为这样一来，他就会成为全境之主，并亲手制服维拉科查·印加。商议既定，他一出议事之所，就下令在指定的一天，把他所有的人马集合在他的家乡保卡赖那个村子和平地上。到了指定那天，他的人全都集合起来。","tr":"p"},"b6-3":{"src":"b","ch":6,"pg":"p. 24a","es":"les fue mandado y siendo ansi juntos mandó a sus capitanes que hiciesen tres partes toda aquella gente y siendo ya apartadas y hechas las tres partes mandólos proveer de armas a todos que fueron lanzas alabardas y hachas y porras y hondas y rodelas los cuales siendo ya proveídos deste menester mandóles proveer de mucho mantenimiento para su camino como es carne seca e maíz e pescado seco. E de las demás comidas haciéndoles gracia e merced de todo el despojo que en la guerra hubiesen de ganado ropa e oro e plata e mujeres e otras piezas e anaconas que ansi en la guerra hubiesen e dando la una parte destas gentes a dos capitanes de los suyos que llamaron Malma y Rapa a los cuales mandó que luego se partiesen y que fuesen conquistando por la provincia de Condesuyo hasta donde gentes no hallasen qué conquistar pudiese y ansi se fueron estos dos capitanes ya dichos llevando la gente ya dicha y al tiempo que se despidieron del señor diéronle grandes gracias e lores ansi los capitanes como la demás gente por la merced que les fue hecha del despojo y ansi fueron conquistando estos dos capitanes Malma y Rapa por la provincia de Condesuyo llevando gran poder de gente fue tanta la ventura destos dos capitanes que ganaron e sujetaron yendo desde el pueblo de Paucaray por la provincia de Condesuyo hasta llegar a los chichas cincuenta leguas más allá de los Charcas dejaremos estos capitanes y hablaremos de los otros dos que envió ansi mismo Uscovilca por la parte de Condesuyo los cuales se llamaron Yanavilca y Tequellovilca a los cuales como les diese su","zh":"集合完毕，他命令将领们把全部人马分成三部分。分好以后，他下令给所有人配发兵器，有长矛、戟、斧、棍棒、投石索和圆盾；配齐了兵器，又下令给他们准备大量路上的给养，如肉干、玉米、鱼干和其他食物，并恩准他们在战争中所获的一切掳获——牲畜、衣物、金银、妇女，以及他们在战争中得到的其他人口和亚纳科纳——都归他们所有。他把其中一部分人马交给他的两名将领马尔马和拉帕，命他们立即出发，沿孔德苏尤省一路征服，直到再无可征服的人为止。这两名将领就带着这部分人马出发了；临别时，将领们和众人都向领主再三致谢，感谢他把掳获赏给他们。马尔马和拉帕两名将领率领大军沿孔德苏尤省一路征服，运气极好，从保卡赖村出发，经孔德苏尤省，一直打到查尔卡斯以外五十里格的奇查人那里。我们暂且放下这两名将领，来讲乌斯科维尔卡同样派往孔德苏尤方向的另外两名将领。这两名将领名叫亚纳维尔卡和特克多维尔卡。他们的","tr":"p"},"b6-4":{"src":"b","ch":6,"pg":"p. 24b","es":"señor Uscovilca la otra parte de gente partieron de allí de Paucaray a los cuales al partir les fue mandado por Uscovilca que no llegasen al Cuzco con diez leguas sino que pasasen apartados del porque él Uscavilca quería esta empresa del Cuzco para sí y ansi se partieron estos dos capitanes metiéndose por la provincia de Andesuyo ganando y conquistando provincias hasta que llegaron a los chiriguanaes donde los dejaremos y hablaremos de Uscovilca el cual como hubiese despachado sus cuatro capitanes en la manera que ya habeis oído y él tuviese gran voluntad de por su persona ir e sujetar al Cuzco y al Viracocha Ynga tomando la otra tercia parte de gente que le quedó dejando su tierra e pueblo con el recaudo y guarda necesaria para que si alguien sobre él le viniese le avisasen para volver en su guarda e reparo e ansi esto ya hecho e proveído se partió con su gente y llevando consigo sus dos capitanes en busca e demanda del Viracocha Ynga el cual estaba muy quieto de aquella zozobra porque él no hacía guerra a nadie ni procuraba tomar ni enquietar a nadie lo suyo y estando ansi quiso (sic) desta guerra que sobre él venía llegaron a él dos mensajeros que le enviaba Uscovilca por los cuales le enviaba a decir que le diese obediencia como a señor que era donde no que se aparejase que él le íba a hacer guerra. E que pensaba darle batalla e sujetarle que le hacía saber que él quedaba en Vilcacunga que es siete leguas de la ciudad del Cuzco e que sería bien en breve con él y como Viracocha Ynga viese la tal embajada que el Uscovilca le enviaba y que traía gran poder y que","zh":"领主乌斯科维尔卡把另一部分人马交给他们，他们便从保卡赖出发。出发时乌斯科维尔卡命令他们，不得进到离库斯科十里格以内，而要绕开它过去，因为他乌斯科维尔卡要把攻取库斯科这件大事留给自己。于是这两名将领出发，进入安德苏尤省，一路攻城略地，一直到了奇里瓜纳人那里。我们在那里放下他们，来讲乌斯科维尔卡。他如你们所听到的，派出了四名将领，又一心想亲自去征服库斯科和维拉科查·印加，便带上剩下的三分之一人马，给自己的地方和村子留下必要的守备和看护，以便有人来攻时通知他回去守卫救援。这些安排妥当，他就带着人马和两名将领出发，去寻找维拉科查·印加。维拉科查·印加对这场风波毫无防备，因为他不对任何 decía Viracocha Ynga que su señor tenía presupuesto aquello y que en ninguna manera dejaría de morir o vencer él y los que con él estaban antes que venir en sujeción y a esto le respondió Viracocha Ynga que se volviese y pues era aquella la opinión de su señor y su voluntad que pelease y hiciese todo su poder que lo que entendía que había de ser al fin de su batalla que sería ser preso e muerto como mozo y sin entendimiento e que le dijese a su señor que él no pensaba ir allá que en ninguna manera le tornase a enviar con embajada semejante y esto oído por el mensajero se partió con su respuesta a do su señor Ynga Yupangue estaba y llegado que fue díjole lo [...]","zh":"[……]他已经下定决心，宁可去死，也不愿让人说他身为领主、生而自由，却甘心受人奴役。于是从留在那里的四个青年中选出一人，叫他去传你们已经听到的那番话。这位使者出发，到了维拉科查·印加那里，代印加·尤潘基向他们传了话。维拉科查·印加听了儿子派人传来的话，对这番话大笑一通，说：我是一个同神交谈、同神说话的人，神已经告知我、提醒我，我不是乌斯科维尔卡的对手；我得了这样的提醒，才离开库斯科，好更妥善地设法使乌斯科维尔卡不至于羞辱我、虐待我的人。那个小子印加·尤潘基想去送死，还以为我考虑不周。你们回去告诉他，我笑他年少；叫他和他身边的人都过来；他要是不肯，我很难过，因为他是我的儿子，却要那样去死。使者回答维拉科查·印加的这番话说，他的主人已经下定决心，无论如何，他和同他在一起的人不是死就是胜，决不会屈服。维拉科查·印加回答说，那就让他回去吧，既然这是他主人的主意和意愿，那就让他去打，尽他的全力；他料定这一仗的结局，是他作为一个不懂事的少年被擒被杀；又叫使者告诉他的主人，自己不打算到那边去，也决不许再派人送这样的话来。使者听了，带着答复离开，回到他的主人印加·尤潘基那里，到了以后，向他禀告了[……]","tr":"p"},"b8-1":{"src":"b","ch":8,"pg":"p. 32a","es":"muy muchas mujeres de todo lo cual era muy ajeno Ynga Yupangue por ser como ya habeis oído aborrecido de su padre y tener amor a Ynga Urco. Y ansi cuando vido Viracocha Ynga que se había quedado Ynga Yupangue en la ciudad del Cuzco holgóse dello pensando que allí acabara sus días e cuando le envió a pedir el socorro que ya habeis oído no le quiso socorrer e apartándose Ynga Yupangue de sus compañeros la noche que ya la historia os ha contado dicen que se fue a cierta parte do ninguno de los suyos le viesen espacio de dos tiros de onda de la ciudad e que allí se puso en oración al hacedor de todas las cosas que ellos llaman Viracocha Pacha Yachachic y que estando en su oración que decía en esta manera: Señor Dios que me hiciste e diste ser de hombre socórreme en esta necesidad en que estoy pues tú eres mi padre y tú me formaste y diste ser y forma de hombre no permitas que yo sea muerto por mis enemigos dáme favor contra ellos no permitas que yo sea sujeto de ellos y pues tú me hiciste libre y sólo a tí sujeto no permitas que yo sea sujeto de estas gentes que ansi me quieren sujetar y meter en servidumbre dame Señor poder para poderlos resistir y haz de mi a tu voluntad pues soy tuyo que cuando estas razones decíalas llorando de todo corazón e que estando en su oración se cayó adormido siendo vencido del sueño y que estando en su sueño vino a él el Viracocha en figura de hombre y que le dijo: Hijo no tengas pena que yo te enviaré el día que a batalla estuvieses con tus enemigos gente con que los desvarates e quedes victorioso e Ynga","zh":"[……]许许多多的女人，而印加·尤潘基同这一切毫不相干，因为如你们已经听到的，他被父亲所憎，父亲爱的是印加·乌尔科。所以维拉科查·印加看到印加·尤潘基留在库斯科城，心里高兴，以为他会在那里送命；印加·尤潘基派人向他求援时——你们已经听到了——他不肯援助。在历史已经讲过的那一夜，印加·尤潘基离开同伴，据说他到了离城两个投石射程远、他的人谁也看不见的一个地方，在那里向万物的创造者——他们称之为维拉科查·帕查亚查奇克——祈祷。据说他祈祷时这样说：主啊，神啊，是你造了我，给了我人的形体，在我这样危难的时候救救我吧；因为你是我的父亲，是你造了我，给了我人的形体和样貌，不要让我死在敌人手里，帮我对付他们，不要让我受他们辖制；你造我是自由的，只属于你，不要让我受这些要奴役我、使我做奴仆的人辖制；主啊，给我力量抵挡他们，你要怎样处置我都可以，因为我是你的。据说他说这些话时，是满心哭着说的；祈祷中他睡着了，敌不过睡意；睡梦中，维拉科查以人的样子来到他面前，对他说：孩子，不要难过，在你同敌人交战的那天，我会派人给你，让你打败他们，取得胜利。于是印加·","tr":"p"},"b8-2":{"src":"b","ch":8,"pg":"p. 32b","es":"Yupangue entonces recordó deste sueño alegre tomó ánimo y que se fue a los suyos y que les dijo que estuviesen alegres porque el lo estaba e que no tuviesen temor que no serían vencidos de sus enemigos que él tenía gente cuando menester la hubiese e que no les quiso decir otra cosa de qué ni de cómo ni de dónde aunque ellos se lo interrogaron y que de allí adelante cada noche se apartaba de sus compañeros e se iba al sitio do su oración había hecho a do siempre la continuó a hacer ni más ni menos que la primera vez la hizo y no para que le viniese cada noche el sueño que la primera más de que la postrer noche que estando él en su oración que tornó a él el Viracocha en figura de hombre y estando despierto que le dijo: Hijo mañana se vernan tus enemigos a dar batalla yo te socorreré con gente para que lo desbarates y quedes victorioso y otro día de mañana dicen que descendiendo Uscovilca con su gente por Carmenga abajo que es un cerro que está a la descendida a la ciudad del Cuzco yendo de la ciudad de los Reyes y como descendiese este Uscovilca con todo su poder y gente que asomaron veinte escuadrones de gente no vista ni conocida por Ynga Yupangue ni los suyos la cual gente asomó por la parte de Collasuyo y por el camino de Accha y por el camino de Condesuyo y que como llegase esta gente a do Ynga Yupangue estaba el cual estaba mirando con sus compañeros como descendían a él sus enemigos y que como a él llegasen los que en su favor venían que le tomaron en medio diciéndole: acocapa Ynga aucay quita atixu llacxaimoctiangui cuna punchaupi que dice: vamos sólo rey y vencere- [...]","zh":"尤潘基从梦中醒来，心里高兴，鼓起勇气，回到他的人那里，对他们说，大家都高兴起来吧，因为他自己就很高兴；又说不要害怕，他们不会被敌人打败，他需要人的时候自然有人；至于是什么人、怎样来、从哪里来，尽管他们追问，他都不肯说。据说从那以后，他每天夜里都离开同伴，到他做过祈祷的地方去，像第一次那样一直祈祷下去，不过并不是每夜都像第一次那样做梦；直到最后一夜，他正在祈祷，维拉科查又以人的样子来到他面前，这一次他是醒着的，维拉科查对他说：孩子，明天你的敌人就要来同你交战，我会派人来援助你，让你打败他们，取得胜利。据说第二天早上，乌斯科维尔卡带着人马从卡尔门加——那是从诸王之城方向来、下到库斯科城的坡上的一座山——往下走；乌斯科维尔卡率领全部兵力人马下山的时候，出现了二十队人，印加·尤潘基和他的人都从没见过、也不认识；这些人从科利亚苏尤方向、从阿查路和孔德苏尤路上出现。据说这些人到了印加·尤潘基那里——他正和同伴们看着敌人朝他们冲下来——这些来助战的人到了他跟前，把他围在中间，对他说：acocapa Ynga aucay quita atixu llacxaimoctiangui cuna punchaupi，意思是：走吧，唯一的王，我们会打败[……]","tr":"p"},"c11-1":{"src":"c","ch":11,"pg":"p. 27–28","es":"Entendí, cuando en el Cuzco estuve, que se ovo entre los reyes Yngas que el rey, que entre ellos era llamado Ynga, luego como hera muerto se hazían los lloros generales y continos y se hazían los otros sacrifiçios grandes conforme a su religión y costunbre; lo qual pasado, entre los más ançianos del pueblo se tratava sobre qué tal avía sido la bida y costunbres de su rey ya muerto y qué avía aprovechado a la república o qué vatallas avía vençido que dado se oviesen contra los enemigos; y tratadas estas cosas entre ellos y otras que no entendemos por entero, se determinavan si el rey difunto avía sido tan benturoso que dél quedase loable fama para que por sus valentías y buen govierno mereçiese que para sienpre quedase entre ellos, mandavan llamar los grandes quiposcamayos donde la quenta se feneçía y savían dar razón de las cosas que suçedido avían en el reyno para quéstos la comunicasen con otros que entre ellos, siendo escojidos por más retóricos y abundantes de palabras, saben contar por buena orden cada cosa de lo pasado, como entre nosotros se quentan por romançes y villançicos; y éstos en ninguna otra cosa entienden que en aprender y saberlos conponer en su lengua, para que sean por todos oydos y en regozijos de casamientos y otros pasatienpos [que] tienen para aquel propósito, ya savido lo que se a de dezir de lo pasado en semejantes fiestas a los señores muertos y si se trata de guerra por el consiguiente con horden galana contavan de muchas batallas que en lugares de una parte y otra del reyno se dieron; y por el consiguiente para cada negoçio tenían ordenados sus cantares o romançes, que, viniendo a propósito se cantasen para que por ellos se animase la jente con los oyr y entendiesen lo pasado en otros tienpos, sin lo ynorar por entero. Y estos yndios que por mandado de los reyes sabían estos romançes eran onrados por ellos y faboreçidos y tenían cuydado grande de los enseñar a sus hijos o a onbres de sus provinçias los más avisados y entendidos que entre todos se hallavan; y así por boca de unos lo savían otros, de tal manera que oy día entre ellos quentan lo que pasó a quinientos años como si no ovieran diez.","zh":"我在库斯科时了解到，印加诸王中有这样的做法：他们称为印加的国王一死，就举行全体的、连续不断的哭丧，并按他们的宗教和习俗举行其他盛大的献祭；这些过去以后，城中最年长的人便评议这位已故国王的一生和品行如何，他对国家有什么好处，在同敌人的交战中打赢了哪些仗；这些事以及其他一些我们不完全明白的事评议过后，他们便作出决定：如果已故的国王福泽深厚，留下了值得称颂的名声，凭他的勇武和善治，配得上永远留在他们中间，就命人召来那些大基普卡马约——账目在他们那里结算，他们能说明国中发生过的事——让他们把这些事告诉另一些人。这些人是从他们中间挑出来的，最善言辞、词汇最丰富，懂得按好的次序讲述过去的每一件事，就像我们这里用谣曲和村歌来讲一样；这些人别的什么也不做，只学习、只懂得用他们的语言编这些歌，好让所有人都能听到。在婚礼的欢宴和其他为此而设的消遣中，在这样的节庆上该向已故的领主们讲哪些往事，他们都已知道；如果讲的是战争，他们就用优美的次序讲述在国中这里那里打过的许多仗；同样，每一件事他们都编好了相应的歌或谣曲，到合适的时候就唱，好让人们听了受到鼓舞，了解过去的事，不至于全然无知。这些奉国王之命记得谣曲的印第安人，受到国王的尊重和眷顾，他们很用心地把这些歌教给自己的儿子，或是教给本省最聪明、最有见识的人；就这样一人传一人，所以直到今天，他们讲五百年前的事，就像讲不到十年前的事一样。","tr":"p"},"c11-2":{"src":"c","ch":11,"pg":"p. 28","es":"Y entendida la orden que se tenía para no se olvidar de lo que pasava en el reyno, es de saber que, muerto el rey dellos, si valiente avía sido y bueno para la governaçión del reyno, sin aver perdido provinçia de las que su padre le dexó ni usado de baxesas y poquedades ni hecho otros desatinos, que los prínçipes locos con la soltura se atreven a hazer en su señorío, era permitido y ordenado por los mismos reyes que fuesen hordenados cantares honrados y que en ellos fuesen muy alabados y ensalçados, de tal manera que todas las jentes se admirasen en oyr sus hazañas y hechos tan grandes; y quéstos no sienpre ni en todo lugar fuesen publicados ni apregonados, sino quando estuviese hecho algúnd ayuntamiento grande de jente venida de todo el reyno para algúnd fin y quando se juntasen los señores prençipales con el rey en sus fiestas y solazes o quando se hazían los \"taquis\" o borracheras suyas. En estos lugares, los que sabían los romançes a bozes grandes, mirando contra el Ynga, le contavan lo que por sus pasados avía sido hecho; y si entre los reyes alguno salía remiso, covarde, dado a biçios y amigo de holgar sin acreçentar el señorío de su ynperio, mandavan que destos tales oviese poca memoria o casi ninguna; tanto miravan esto, que si alguno se hallava era por no olvidar el nonbre suyo y la çuseçión; pero en lo demás, se callava sin contar los cantares de otros que de los buenos y valientes.","zh":"明白了他们为不忘国中之事所定的办法，还要知道：他们的国王死后，如果他勇敢、善于治国，没有丢掉父亲留给他的任何一个省，没有做过卑劣猥琐的事，也没有做过那些疯癫的君主仗着放纵敢在自己领地上做的荒唐事，那么国王们自己就允许并下令为他编出光荣的歌谣，在歌中大加称颂，使所有人听了他的伟业都惊叹不已；但这些歌谣不是随时随地都公开宣唱，只在为某事从全国各地聚来大批人的时候，在主要领主们同国王一起过节游乐的时候，或者在他们举行塔基即酒会的时候才唱。在这些场合，记得谣曲的人望着印加，高声向他讲述他的先人做过的事；如果诸王中有谁懈怠、怯懦、耽于恶习、贪图安逸而没有扩大帝国的版图，就下令对这样的王少留记忆，或几乎不留；他们对此十分在意，即使还留下一点，也只是为了不忘他的名字和世系；至于其余，就一概不提，只唱那些好王和勇王的歌，别人的都不唱。","tr":"p"},"c11-3":{"src":"c","ch":11,"pg":"p. 28–29","es":"Y porque tuvieron en tanto sus memorias que muerto uno destos señores tan grandes no aplicava su hijo para si otra cosa que el señorío, porque era ley entre ellos que la riqueza y aparato real del que avía sido rey del Cuzco no lo oviese otro en su poder ni se perdiese su memoria; para lo qual se hazía un bulto de mantas con la figura que ellos ponerle querían, al qual llaman el nonbre del rey ya muerto y salían estos bultos a ponerse en la plaça del Cuzco quando se hazían sus fiestas y en rededor de cada bulto destos reyes estavan sus mugeres y criados y benían todos, aparejándole allí su comida y bevida, porque el demonio devía de hablar en aquellos bultos, pues que esto por ellos se usava. Y cada bulto tenía sus truhanes o desidores questavan con palabras alegres contentando al pueblo; y todo el tesoro quel señor tenía siendo bivo, se estava en poder de sus criados y familiares y se sacava a las fiestas semejantes con gran aparato; sin lo qual no dexavan de tener sus \"chacaras\", ques nonbre de heredades, donde cojían sus mayzes y otros mantenimientos con que se sustentavan las mugeres con toda la demás familia destos señores que tenían bultos y memorias aunque ya eran muertos. Y çierto esta usança fue harta parte para que en este reyno oviese la suma tan grande de tesoros que se an visto por nuestros ojos; y a españoles conquistadores e oydo que, quando descubriendo las provinçias del reyno entraron en el Cuzco, avía destos bultos, lo qual pareçió ser verdad quando dende a poco tienpo queriendo tomar la borla Mango Ynga Yupangue, hijo de Guaynacapa, públicamente fueron sacados en la plaça del Cuzco a vista de todos los españoles e yndios que en ella en aquel tienpo estavan.","zh":"他们把对先王的记忆看得极重，所以这样一位大领主死后，他的儿子除了统治权，什么也不归自己；因为他们有一条法律：曾做过库斯科国王的人的财富和王家排场，不得落到别人手里，对他的记忆也不得湮没。为此，他们用布匹做一尊像，按他们想给它的样子做成，用已故国王的名字称呼它；举行节庆时，这些像就被抬出来，摆在库斯科的广场上，每一尊王像周围站着他的妻妾和仆从，大家都来，在那里为它备好饮食——魔鬼大概就在这些像里说话，因为他们向来这样做。每尊像都有自己的弄臣或说笑的人，用欢快的话逗百姓高兴；这位领主生前的全部财宝，仍由他的仆从和家人掌管，在这类节庆上大张排场地拿出来；此外，他们还保有自己的查卡拉——这是田产的名称——在那里收获玉米和别的粮食，供养这些领主的妻妾和其余家人；这些领主虽然已经死去，仍有像，仍受纪念。确实，这一习俗是这个王国积聚起我们亲眼见到的那样巨量财宝的一大原因；我听西班牙征服者说，他们探查这个王国的各省、进入库斯科的时候，那里有这样的像；这一点不久就得到证实：瓦伊纳·卡帕克的儿子曼科·印加·尤潘基要接受王穗时，这些像当着当时在场的所有西班牙人和印第安人的面，被公开抬到了库斯科的广场上。","tr":"p"},"c11-4":{"src":"c","ch":11,"pg":"p. 29","es":"Verdad es que ya avían los españoles avido mucha parte del tesoro y lo demás se escondió y puso en tales partes que pocos o no ninguno deve saber dél; ni de los bultos ni otras cosas suyas grandes ay ya otra memoria que la que ellos dan y tienen en sus cantares.","zh":"诚然，那时西班牙人已经得到了大部分财宝，其余的被藏到了那样的地方，恐怕很少有人、甚至没有人知道在哪里；至于那些像和他们其他的宏大之物，如今除了他们自己所讲、保存在歌谣里的，再没有别的记忆了。","tr":"p"},"c12-1":{"src":"c","ch":12,"pg":"p. 30–31","es":"Fue ordenado por los Yngas lo que ya avemos escrito açerca del poner los bultos en sus fiestas y en que se escojiesen algunos de los más sabios dellos para que en cantares supiesen las vidas de los señores qué tal avía sido y cómo se avían avido en el govierno del reyno para el efeto por mí dicho. Y es tanbién de saver que, sin esto, fue costunbre dellos y ley muy usada y guardada de escojer cada uno en tienpo de su reynado o señorío tres o quatro honbres ançianos de los de su naçión a los quales, viendo que para ello eran áviles y sufiçientes, les mandavan que todas las cosas que çusediesen en las provinçias durante el tienpo de su reynado, ora fuesen prósperas, ora fuesen adversas, las tuviesen en la memoria y dellas hiziesen y ordenasen cantares para que por aquel sonido se pudiese entender en lo futuro aver así pasado, con tanto questos cantares no pudiesen ser publicados ni dichos fuera de la presençia del señor. Y eran obligados estos que avían de tener esta razón durante la vida del rey no tratar ni dezir cosa alguna de lo que a él tocava, y luego que era muerto al çusesor en el ynperio le dezían casi por estas palabras: \"¡O Ynga grande y poderoso, el Sol y la luna, la tierra, los montes, los árboles, las piedras y tus padres te guarden de ynfortunio e hagan próspero, dichoso y bienaventurado sobre todos quantos naçieron! Sábete que las cosas que suçedieron a tú anteçesor son éstas\". Y luego, en diziendo esto, los ojos puestos en el suelo, e baxadas las manos, con gran umildad les davan quenta y razón de todo lo que ellos sabían, lo qual podían muy bien hazer porque entre ellos ay muchos de gran memoria, sutiles de yngenio y de bivo juyzio y tan abastados de razones como oy día son testigos los que acá estamos e los oymos. Y así, dicho esto, luego que por el rey era entendido, mandava a llamar a otros de sus yndios viejos, a los quales mandava que tuviesen cuydado de saber los cantares que aquellos tenían en la memoria y de ordenar otros de nuevo de lo que pasava en el tienpo de su reynado, y que las cosas que se gastavan y lo que las provinçias contribuyan se asentase en los quipos para que se supiese lo que davan y contribuyan muerto él y reynando su progenitor, y si no hera en un día de gran regozijo o en otro que oviesen lloros y tristeza por muerte de algúnd hermano o hijo del rey, porque en los tales días se permitía contar su grandeza dellos y su origen y naçimiento, y fuera déstos a ninguno hera permitido tratar dello porque estava así hordenado por los señores suyos; y si lo hazían, eran castigados rigurosamente.","zh":"印加人规定了我们已经写过的那些事：在节庆中摆出那些像，并挑选他们中间一些最有学问的人，让他们用歌谣记住历代领主的一生如何、治国如何，作我所说的那种用途。还要知道，除此之外，他们还有一个习俗，也是一条十分通行、严格遵守的法律：每位国王在位或统治期间，都从本族中挑选三四位老人，看他们能干、胜任，就命令他们把在位期间各省发生的一切事，无论顺逆，都记在心里，编成歌谣，好让后人凭这歌声知道事情是这样过去的；只是这些歌谣不得在领主面前以外的地方公开或吟诵。担负这项职责的人，在国王在世期间不得谈论有关他的任何事；国王一死，他们就对帝国的继承者说，大致是这样的话：“啊，伟大而强有力的印加，愿太阳和月亮、大地、群山、树木、石头和你的父辈保佑你免遭不幸，使你比所有生在世上的人都更兴旺、幸运、有福！你要知道，你的前任所经历的事是这样的。”说完这些，他们便两眼看着地面，垂下双手，十分谦卑地把他们所知的一切向他禀报。这一点他们完全做得到，因为他们中间有许多人记性极好、心思灵巧、判断敏捷、能言善辩，我们这些在这里听过他们说话的人至今可以作证。他们这样说过之后，国王明白了，就命人召来他的另一些老人，命他们用心记住那些人记着的歌谣，再为他在位期间发生的事编新的歌；花费了什么，各省缴纳了什么，都记在基普上，好让人在他死后、他的继承者统治时知道各省缴纳了什么。除非是在大喜的日子，或者在为国王的某个兄弟或儿子去世而哭丧悲伤的日子——只有在这样的日子里，才准许讲述他们的伟大、他们的起源和出身——除此以外，任何人都不准谈论这些，因为他们的领主就是这样规定的；谁要是讲了，就要受到严厉的惩罚。","tr":"p"},"c12-2":{"src":"c","ch":12,"pg":"p. 31–32","es":"Sin lo qual tuvieron otra orden para saber y entender cómo se avía de hazer en la contribuçión, en las provinçias, de los mantenimientos, ora pasase el rey con exérçito, ora fuese visitando el reyno, o que sin hazer nada desto se entendiese lo que entrava en los depósitos y pagavan los súditos, de tal manera que no fuesen agraviados, tan buena y sutil que eçede en artifiçio a los carateres que usaron los mexicanos para sus quentas y contrataçión. Y esto fue los \"quipos\", que son ramales grandes de cuerdas anudadas, y los que desto eran contadores y entendían el guarismo destos nudos davan por ello razón de los gastos que se avían hecho o de otras cosas que oviesen pasado de muchos años atrás; y en estos nudos contavan de uno hasta diez y de diez hasta çiento y de çiento hasta mill; y [en] uno destos ramales está la quenta de lo uno y en otro lo de lo otro, de tal manera está esto que para nosotros es una quenta donosa y çiega y para ellos singular. En cada cabeça de provinçia avía contadores a quien llaman \"quiposcamayos\" e por estos nudos tenían la quenta y razón de lo que avían de tributar los que estavan en aquel distrito desde la plata, oro, ropa y ganado hasta la leña, y las otras cosas más menudas; y por los mismos quipos se dava a cavo de un año, o de diez o de veynte, razón a quien tenía comiçión para tomar la quenta, tan bien que un par de alpargates no se podía esconder.","zh":"除此以外，他们还有另一套办法，用来知道、弄清各省应当怎样缴纳给养——无论是国王率军经过，还是巡视国土，或者什么事都没有的时候，也能知道仓库里收进了什么、臣民缴纳了什么——使臣民不致受亏待；这套办法又好又精巧，其技艺胜过墨西哥人用来记账和交易的那些字符。这就是基普，那是一大束一大束打了结的绳子；掌管这件事的会计，懂得这些结所表示的数目，凭它们说明已经花费了什么，或者多年以前发生过的其他事情；他们在这些结上计数，从一到十，从十到一百，从一百到一千；一根绳上记一样东西的账，另一根绳上记另一样东西的账；这东西就是这样，在我们看来是一种有趣而莫测的账目，在他们却是绝妙的。每个省的首府都有会计，他们称为基普卡马约，凭这些结掌握这个辖区的人应当缴纳的贡赋的账目，从银、金、衣物、牲畜到柴火以及其他更细小的东西，无不记明；凭这些基普，过一年、十年或二十年，都能向奉命查账的人交代清楚，清楚到连一双麻鞋也藏不住。","tr":"p"},"c12-3":{"src":"c","ch":12,"pg":"p. 32","es":"Yo estava yncrédulo en esta quenta y, aunque lo oya afirmar y tratar, tenía lo más dello por fábula; y estando en la provinçia de Xauxa, en lo que llaman Maycavilca, rogué al señor Guacorapora que me hiziese entender la quenta dicha de tal manera que yo me sastifiziese [sic] a mí mismo para estar çierto que era fiel y verdadera; y luego mandó a sus criados que fuesen por los quipos, y como este señor sea de buen entendimiento y razón para ser yndio, con mucho reposo sastifizo a mi demanda y me dixo que, para que mejor lo entendiese, que notase que todo lo que por su parte avía dado a los españoles desde que entró el governador don Francisco Piçarro en el valle estava allí sin faltar nada; y así vi la quenta del oro, plata, ropa que avían dado con todo el mayz y ganado y otras cosas, que en verdad yo quedé espantado dello. Y es de saber otra cosa, que tengo para mí por muy çierto, segúnd an sido las guerras largas y las crueldades, robos y tiranías que los españoles an hecho en estos yndios, que si ellos no estuvieran hechos a tan grande orden y conçierto totalmente se [o]vieran todos consumido y acavado; pero ellos, como entendidos y cuerdos y questavan ynpuestos por prínçipes tan sabios, entre todos determinaron que si un exérçito de españoles pasase por qualquiera de las provinçias, que si no fuere el daño que por ninguna vía se puede escusar, como es destruyr las sementeras, robar las casas, hazer otros daños mayores quéstos, que en lo demás todas las comarcanas [sic] tuviesen en el camino real por donde pasavan los nuestros sus contadores y éstos tuviesen proveymiento lo más cunplido que ellos pudiesen para que con achaque de la falta no los destruyesen del todo: y así eran proveydos. Y después de salidos, juntos los señores, vían los quipos de las quentas y por ellos, si uno avía gastado más que otros, los que menos avían proveydo lo paga[va]n, de tal suerte que yguales quedasen todos.","zh":"我原先不相信这种账目，虽然听人这样肯定、这样讲，大半还是当作无稽之谈；我在豪哈省一个叫迈卡维尔卡的地方，请领主瓦科拉波拉让我弄懂这种账目，好让我自己满意，确信它忠实可靠；他随即命仆人去取基普来。这位领主作为一个印第安人，是很有见识、很讲道理的，他不慌不忙地满足了我的要求，对我说，为了让我更好地明白，请我注意：自从总督弗朗西斯科·皮萨罗进入这个山谷以来，他这一方交给西班牙人的一切，都记在那里，一样不少；于是我看到了他们交出的金、银、衣物，连同全部玉米、牲畜和其他东西的账目，说实话，我看得目瞪口呆。还有一件事要知道，我自己十分确信：西班牙人对这些印第安人进行了那样长久的战争，施加了那样多的残暴、抢劫和暴政，如果他们不是习惯于如此严密的秩序和协调，早就全部耗尽、灭绝了；但他们聪明审慎，又受过那样贤明的君主的教化，便共同决定：如果一支西班牙军队经过哪个省份，除了那些无论如何也免不了的损害——如毁坏庄稼、抢劫房屋，以及比这更大的损害——其余方面，所有邻近的地方都要在我们的人经过的王道上派驻他们的会计，让这些人尽可能备足给养，免得西班牙人借口缺粮把他们彻底毁掉；他们就是这样供应的。等西班牙人走了，领主们聚在一起，查看基普上的账目，凭着这些账，如果谁比别人出得多，出得少的就补给他，使大家负担均等。","tr":"p"},"c12-4":{"src":"c","ch":12,"pg":"p. 32–33","es":"Y en cada valle ay esta quenta oy día y sienpre ay en los aposentos tantos contadores como en él ay señores y de quatro en quatro meses fenesen sus quentas por la manera dicha. Y con la horden que an tenido an podido sufrir conbates tan grandes que si Dios fuese servido que del todo oviesen çesado con el buen tratamiento que en este tienpo reçiben y con la buena orden y justiçia que ay, se restaura[ría]n y multiplicarían para que en alguna manera buelva a ser este reyno lo que fue, aunque yo creo que será tarde o nunca. Y es verdad que yo e visto pueblo[s] y pueblos bien grandes, y de una sola vez que cristianos españoles pasen por él, quedar tal que no pareçía sino que fuego lo avía consumido; y como las jentes no eran de tanta razón, ni unos a otros se ayudavan, perdíanse después con hanbres y enfermedades, porque entre ellos ay poca caridad y cada uno es señor de su casa y no quiere más quenta. Y esta horden del Perú dévese a los señores que lo mandaron y supieron ponerla en todas las cosas tan grandes como vemos los que acá estamos por estas cosas y otras mayores. Y, con tanto, pasaré adelante.","zh":"至今每个山谷都还有这种账目，驿舍里总有和那里的领主一样多的会计，每四个月按上面说的办法结一次账。靠着他们一向的这种秩序，他们才经受住了那样大的冲击；如果上帝愿意让这些冲击完全停止，凭着他们如今所受的善待，凭着现有的良好秩序和公正，他们会恢复起来、繁衍起来，使这个王国多少回到从前的样子，虽然我相信那会很迟，或者永远不会。确实，我见过一些村子，而且是很大的村子，信基督的西班牙人只经过一次，就变得像被火烧光了一样；那里的人没有那么明理，彼此也不相帮，事后便死于饥荒和疾病，因为他们之间少有仁爱，各人只管自家，别的一概不问。秘鲁的这种秩序，要归功于统治过这里的领主们，他们懂得把它施行于一切事务，其规模之大，我们这些身在此地的人从这些事和其他更大的事上都看得到。就说到这里，我往下讲。","tr":"p"},"c12-5":{"src":"c","ch":12,"pg":"p. 33（页边长注）","es":"Ase de notar que quando el señor rey enbiava desde el Cuzco algúnd de los orejones prençipales a tomar la quenta a los governadores, si por caso en el camino adoleçía de enfermedad que moría, luego en el pueblo o parte donde la muerte le tomava hazían los naturales testigos de cómo avía sido y enbiavan mensajeros al señor adondequiera questuviese, y al muerto, sacadas las tripas le lleva[va]n de pueblo en pueblo hasta donde avía salido y lo presentavan ante el señor con yndios que juravan averle visto morir y contavan la enfermedad que tuvo, tanto temían a los reyes que hazían esto. Y si abaxava a los llanos o a otra tierra con poder de tomar quenta algúnd orejón, salíanle a reçibir al camino y hazíanle grande onra; estimávanle tanto como en España estimarían al Presidente del Consejo Real si fuese por ella visitando y tomando quenta de cosa por menudo.","zh":"须注意：国王从库斯科派某位大耳贵族头人去向各地长官查账时，如果此人在途中得病死了，那么在他死去的村子或地方，本地人就当场为他怎样死的作证，派信使去禀报领主，不论领主在哪里；死者则被掏去肠子，一村一村地抬回他出发的地方，连同发誓亲眼见他死去的印第安人一起呈到领主面前，并说明他得的是什么病：他们就是这样畏惧国王。若有大耳贵族带着查账的权力下到沿海平原或别处去，人们就到路上迎接，给他极大的礼遇；他们敬重他，就像在西班牙人们敬重巡视全国、逐项查账的王室议会主席一样。","tr":"p"},"c30-1":{"src":"c","ch":30,"pg":"p. 92","es":"Abaxo deste trono tenían la figura del Sol, que no oso afirmar lo que quentan de la riqueza que tenía y primor con que hera hecha, y tanbién ponían la de la Luna y otros bultos de dioses esculpidos en palos y en piedras. Y crean los letores que tenemos por muy çierto que ni en Jerusalén, Roma, ni en Perçia ni en ninguna parte del mundo por ninguna república ni rey dél se juntava en un lugar tanta riqueza de metales de oro y plata y pedrería como en esta plaça del Cuzco quando estas fiestas y otras semejantes se hazían; porque heran sacados los bultos de los Yngas, reyes suyos ya muertos, cada uno con su serviçio y aparato de oro y plata que tenían —digo los que aviendo sido en bida buenos y valerosos, piadosos con los yndios, generosos en les hazer merçedes, perdonadores de ynjurias; porque a estos tales canonizava su çeguedad por santos y onravan sus ueços sin entender que las ánimas ardían en los [yn]fiernos, y creyan que estavan en el çielo. Y lo mismo era de algunos otros horejones o de otra naçión por algunas causas que en su jentilidad hallavan, los llamavan tanbién santos. Y llaman ellos a esta manera de canonizar \"ylla\", que quiere dezir \"cuerpo del que fue bueno en la vida\"; o en otro entendimiento \"yllapa\" sinifica trueno o relánpago: y así llaman los yndios a los tiros de artillería \"yllapa\" por el estruendo que haze.","zh":"这个宝座下面摆着太阳像——他们讲这尊像何等富丽、做得何等精巧，我不敢断言——还摆上月亮像和其他用木头、石头雕成的神像。读者可以相信，我们十分确信：无论在耶路撒冷、罗马、波斯，还是在世界上任何地方，没有哪个国家、哪个国王曾在一处聚集过这样多的金银和宝石，像库斯科这个广场上举行这类节庆时那样；因为那时要把他们已故的国王即诸印加的像抬出来，每一尊都带着它所有的金银器用和排场——我是说那些生前善良勇敢、怜恤印第安人、慷慨施恩、宽恕冒犯的；因为他们盲目，把这样的人封为圣者，尊崇他们的遗骨，不明白他们的灵魂正在地狱里焚烧，还相信他们在天上。别的一些大耳贵族或别族的人，因他们的异教信仰中认可的某些缘由，也是如此，也被称为圣者。他们把这种封圣叫作伊利亚，意思是“生前为善之人的身体”；换一种意思，伊利亚帕是雷或闪电：所以印第安人把火炮的射击叫作伊利亚帕，因为它轰然作响。","tr":"p"},"c30-2":{"src":"c","ch":30,"pg":"p. 92","es":"Pues juntos el Ynga y el Gran Çaçerdo[te] con los cortesanos del Cuzco y mucha jente que venía de las comarcas, teniendo sus dioses puestos en tálamo les mochavan, ques hazerles reverençia, lo que ellos usavan ofreçiéndoles muchos dones de ydolos de oro pequeños y ovejas de oro y figura de mugeres, todo pequeño y otras muchas joyas. Y estavan en esta fiesta de Hatun Layme quinze o veynte días, en los quales se hazían sus grandes taquis e borracheras y otras fiestas a su usança; lo qual pasado davan fin al sacrefiçio, metiendo los bultos de los ydolos en los tenplos y los de los Yngas muertos en sus casas.","zh":"印加和大祭司同库斯科的朝臣以及从各地来的许多人聚在一起，把他们的神摆在高台上，向它们叩拜，就是向它们致敬，这是他们的做法；还献上许多礼物：小金偶像、金羊和女人的像，都是小的，以及许多别的珠宝。哈通赖米节要过十五天或二十天，其间举行盛大的塔基和酒会，以及按他们习俗的其他庆祝；这些过去以后，献祭就结束了，把神像送回神庙，把已故诸印加的像送回各自的宅邸。","tr":"p"},"c30-3":{"src":"c","ch":30,"pg":"p. 93","es":"El çaçerdote mayo
