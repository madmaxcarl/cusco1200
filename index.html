eron. Y el orden y fábula que deste principio cuentan es la siguiente.","zh":"这样的人在许多地方、许多族群中横行，人人都想征服自己的邻居。就在这时，离库斯科谷六里格、一个名叫帕卡里坦博的地方，有四个男人和四个姐妹，性情凶悍、心怀不轨，却志向高远。他们比别人更有本事，看出那一带本地人胆小怯懦，凡是带着几分权威或强力向他们提出的事，他们都轻易相信，于是心想可以凭强力和欺骗做许多地方的主人。八兄妹——四男四女——便聚在一起，商量用什么办法对他们住地以外的人施行暴政，并决定用暴力来干这件事。他们知道这些本地人大都愚昧，别人说什么就轻易相信什么，尤其是用几分严厉、苛刻和权威说出来的话，他们无从反驳，也不敢抗拒，因为他们天性胆怯；为了让人敬畏，这几个人便编造了关于自己出身的一些故事，说他们是造物主维拉科查·帕查亚查奇克的子女，是从几扇窗里出来统治别人的。他们性情凶悍，便让人相信他们、畏惧他们、把他们看作超乎常人，甚至当作神来崇拜。他们就这样推行了自己想要的宗教。关于这个开端，他们所讲的经过和故事如下。","tr":"p"},"s11-1":{"src":"s","ch":11,"pg":"pp. 117–118","es":"Cuentan y afirman generalmente todos los naturales indios desta tierra que los ingas cápa[c]s procedieron desta manera. Seis leguas del Cuzco al susudueste, por el camino que los ingas hicieron, está un asiento llamado Pacaritambo, que quiere decir “casa de producción”, en el cual es un cerro llamado Tambotoco, que significa “casa de ventanas”. Y esto es cierto: en este cerro son tres ventanas, la una llamada Maras-toco y la otra Sútic-toco, y la que está en medio destas dos se llama Cápac-toco, que quiere decir “ventana rica”, porque dicen questaba guarnecida de oro y otras riquezas. De la ventana Maras-toco salieron sin generación de padres una nación de indios llamados Maras, y agora hay dellos en el Cuzco. De la ventana Sútic-toco salieron unos indios llamados Tambos, que poblaron a la redonda del mesmo cerro, y en el Cuzco agora hay deste linaje. De la ventana mayor, Cápac-toco, salieron cuatro hombres y cuatro mujeres, que se llamaron hermanos. A éstos no se les conoció padre ni madre más del que dícen, que salieron y fueron producidos de la dicha ventana por mandado del Ticci Viracocha, y ellos mesmos decían de sí quel Viracocha los había criado para ser señores. Y así tomaron, por esta causa, este nombre inga, que es lo mesmo que decir “señor”. Y porque salieron de la ventana Cápac-toco, tomaron por sobrenombre cápac, que quiere decir “rico”, aunque después usaron deste término para denotar con él al señor príncipe de muchos.","zh":"这片土地的印第安本地人普遍都这样讲、这样肯定：诸卡帕克印加是这样来的。库斯科西南偏南六里格，沿着诸印加修的那条路，有个地方叫帕卡里坦博，意思是“产生之屋”；那里有一座山叫坦博托科，意思是“窗之屋”。这一点确实不假：这座山上有三扇窗，一扇叫马拉斯托科，另一扇叫苏蒂克托科，两扇中间的一扇叫卡帕克托科，意思是“富窗”，因为据说那扇窗用黄金和别的宝物装饰过。从马拉斯托科窗里，没有父母生养，出来了一族印第安人，叫马拉斯人，现在库斯科还有他们的人。从苏蒂克托科窗里，出来一些叫坦博人的印第安人，他们住在那座山的周围，现在库斯科也还有这一系的人。从最大的那扇卡帕克托科窗里，出来四男四女，彼此称兄妹。人们不知道他们有父有母，只照他们自己的说法：他们是奉蒂西维拉科查之命，从那扇窗里出来、被产生出来的；他们自己也说，维拉科查造了他们，是要他们做领主的。他们因此取了“印加”这个称号，意思就是“领主”。又因为他们是从卡帕克托科窗出来的，就取“卡帕克”为别号，意思是“富”；不过后来他们用这个词来指众人之上的领主、君王。","tr":"p"},"s11-10":{"src":"s","ch":11,"pg":"p. 119","es":"Sútic-toco Aillo, que es la generación que salió de la una de las ventanas, llamada Sútic-toco, como arriba es dicho; hay déstos en el Cuzco agora algunos, y las cabezas que los conservan son Don Francisco Auca Micho Auri Sútic y Don Alonso Gualpa;","zh":"苏蒂克托科·艾柳，就是上面所说从其中一扇叫苏蒂克托科的窗里出来的那一族；现在库斯科还有他们的一些人，维系这一族的首领是堂弗朗西斯科·奥卡·米乔·奥里·苏蒂克和堂阿隆索·瓦尔帕；","tr":"p"},"s11-11":{"src":"s","ch":11,"pg":"pp. 119–120","es":"Maras Aillo; éstos son los que dicen salieron de la ventana Maras-toco; hay déstos algunos en el Cuzco, mas los principales son Don Alonso Llama Oca y Don Gonzalo Ampura Llama Oca;","zh":"马拉斯·艾柳；这些人据说是从马拉斯托科窗出来的；库斯科有他们的一些人，主要的是堂阿隆索·利亚马·奥卡和堂贡萨洛·安普拉·利亚马·奥卡；","tr":"p"},"s11-12":{"src":"s","ch":11,"pg":"p. 120","es":"Cuicusa Aillo; hay déstos algunos en el Cuzco, y la cabeza es Cristóbal Acllari;","zh":"奎库萨·艾柳；库斯科有他们的一些人，首领是克里斯托瓦尔·阿克利亚里；","tr":"p"},"s11-13":{"src":"s","ch":11,"pg":"p. 120","es":"Masca Aillo; hay deste linaje en el Cuzco Juan Quispi;","zh":"马斯卡·艾柳；库斯科有这一系的胡安·基斯皮；","tr":"p"},"s11-14":{"src":"s","ch":11,"pg":"p. 120","es":"Oro Aillo; hay deste linaje hoy Don Pedro Yúcay.","zh":"奥罗·艾柳；今天有这一系的堂佩德罗·尤凯。","tr":"p"},"s11-15":{"src":"s","ch":11,"pg":"p. 120","es":"Digo que de todos estos linajes se han conservado de tal manera que no se ha perdido la memoria dellos, y puesto que hay más de los dichos, pongo solas cabezas, que son protectores y principales del linaje, que son en quien se van conservando. Y cada uno déstos tienen cargo y obligación de amparar a los demás y saber las cosas y hechos de sus pasados. Y aunque digo que éstos agora viven en el Cuzco, la verdad es que están en un barrio de la dicha ciudad que llaman los indios Cayocache y nosotros le llamamos Belem, por la advocación de la iglesia de aquella pa[rr]oquia, que se dice Nuestra Señora de Belem.","zh":"我要说明，所有这些世系都保存得很好，对它们的记忆没有失传；每一系的人都不止上面所列的这些，我只列出首领，他们是世系的保护人和头人，世系就靠他们延续下去。他们每人都负有责任和义务，照看其余的人，并熟知先人的事迹。我虽然说他们现在住在库斯科，其实他们住在该城的一个街区，印第安人叫卡亚乌卡奇，我们叫伯利恒，这是因为那个教区教堂供奉的是伯利恒圣母。","tr":"p"},"s11-16":{"src":"s","ch":11,"pg":"p. 120","es":"Tornando, pues, a nuestro principio, todas estas cuadrillas arriba nombradas se movieron con Mango Cápac y los demás hermanos a buscar tierras y tiranizar a los que mal no les hacían ni les daba[n] ocasión de guerra, ni con otro derecho ni título más del dicho. Y para llevar orden de guerra, tomaron por caudillos a Mango Cápac y a Mama Guaco, y con este prosupuesto partieron las compañas dichas del cerro de Tambotoco a poner en efeto su designo.","zh":"言归正传。上面列举的这些队伍，都同曼科·卡帕克和他的兄妹们一起动身，去寻找土地，去压迫那些并没有伤害他们、也没有给他们任何开战理由的人，除了上面所说的，再没有别的权利或名义。为了让队伍有作战的秩序，他们推举曼科·卡帕克和玛玛·瓦科为首领。就这样，上述人马从坦博托科山出发，去实现他们的图谋。","tr":"p"},"s11-2":{"src":"s","ch":11,"pg":"p. 118","es":"Los nombres de los ocho hermanos son éstos: el mayor de los hombres y de más autoridad se llamó Mango Cápac, el segundo Áyar Auca, el tercero Áyar Cache, el cuarto Áyar Ucho; de las mujeres, la más anciana se llamó Mama Ocllo, la segunda Mama Guaco, la tercera Mama Ipacura, o, como otros dicen, Mama Cura, la cuarta Mama Raua.","zh":"八兄妹的名字如下：男子中最年长、最有威望的叫曼科·卡帕克，第二个叫阿亚尔·奥卡，第三个叫阿亚尔·卡切，第四个叫阿亚尔·乌丘；女子中最年长的叫玛玛·奥克略，第二个叫玛玛·瓦科，第三个叫玛玛·伊帕库拉，也有人说叫玛玛·库拉，第四个叫玛玛拉瓦。","tr":"p"},"s11-3":{"src":"s","ch":11,"pg":"pp. 118–119","es":"Estos ocho hermanos llamados ingas dijeron: “Pues somos nacidos fuertes y sabios, y con las gentes que aquí juntáremos seremos poderosos, salgamos deste asiento y vamos a buscar tierras fértiles, y donde las halláremos, subjetemos las gentes que allí estuvieren, y tomémosles las tierras, y hagamos guerra a todos los que no nos recibieren por señores”. Esto dicen que dijo Mama Guaco, una de las mujeres, la cual era feroz y cruel, y también Mango Cápac, su hermano, asimesmo cruel y atroz. Y concertado esto entre los ocho, empezaron a mover las gentes que en aquellas comarcas del cerro había, puniéndoles por premio que los harían ricos y les darían las tierras y haciendas de los que conquistasen y subjetasen. A lo cual por el interés se movieron diez parcialidades o aillos, que quiere decir entre estos bárbaros “linaje” o “bando”, los nombres de los cuales son éstos que se siguen:","zh":"这八个称作印加的兄妹说：“我们生来强壮聪明，再加上在这里聚集起来的人，就会强大起来，我们离开这个地方，去寻找肥沃的土地，找到以后，就征服那里的人，夺取他们的土地，凡是不接受我们做领主的，我们就同他们打仗。”据说这话是女子中的玛玛·瓦科说的，她凶狠残忍；她的兄弟曼科·卡帕克也这样说，他同样残忍凶暴。八人商定以后，便开始鼓动那座山周围一带的人，许诺事成之后让他们发财，把所征服的人的土地和财产分给他们。为了这份好处，有十个部，或称亲族共同体，跟着动了起来；亲族共同体在这些野蛮人中间的意思是“世系”或“一派”。它们的名称如下：","tr":"p"},"s11-4":{"src":"s","ch":11,"pg":"p. 119","es":"Chauin Cuzco Aillo, del linaje de Áyar Cache; hay hoy deste bando en el Cuzco algunos, las cabezas de los cuales se llaman Martín Chucumbi y Don Diego Guaman Páucar;","zh":"查温·库斯科·艾柳，出自阿亚尔·卡切的世系；今天库斯科还有这一派的一些人，他们的首领叫马丁·丘昆比和堂迭戈·瓦曼·保卡尔；","tr":"p"},"s11-5":{"src":"s","ch":11,"pg":"p. 119","es":"Arairaca Aillo Cuzco-callan; hay agora deste aillo Juan Pizarro Yupangui, Don Francisco: Qui[s]pi, Alonso Tarma Yupangui, del linaje de Áyar Uchu;","zh":"阿赖拉卡·艾柳·库斯科卡扬；现在这个亲族共同体有胡安·皮萨罗·尤潘基、堂弗朗西斯科·基斯皮、阿隆索·塔尔马·尤潘基，出自阿亚尔·乌丘的世系；","tr":"p"},"s11-6":{"src":"s","ch":11,"pg":"p. 119","es":"Tarpúntay Aillo; hay agora deste aillo en el Cuzco;","zh":"塔尔蓬泰·艾柳；现在这个亲族共同体在库斯科还有人；","tr":"p"},"s11-7":{"src":"s","ch":11,"pg":"p. 119","es":"Guacaitaqui Aillo; de los cuales agora viven [en] el Cuzco algunos;","zh":"瓦凯塔基·艾柳；现在库斯科还住着他们的一些人；","tr":"p"},"s11-8":{"src":"s","ch":11,"pg":"p. 119","es":"Sáñoc Aillo; déstos hay en el Cuzco.","zh":"萨尼奥克·艾柳；库斯科还有他们的人。","tr":"p"},"s11-9":{"src":"s","ch":11,"pg":"p. 119","es":"Estos cinco bandos son Hanancuzcos, que quiere decir el bando de lo alto del Cuzco.","zh":"这五派是哈南库斯科，意思是库斯科上部的一派。","tr":"p"},"s12-2":{"src":"s","ch":12,"pg":"pp. 121–122","es":"Y caminando todos juntos, llegaron a un asiento llamado Guanacancha, cuatro leguas del valle del Cuzco, donde estuvieron algún tiempo sembrando y buscando tierra fértil. En este pueblo Mango Cápac hobo ayuntamiento con su hermana Mama Ocllo, la cual quedó preñada de Mango Cápac. Y no pareciéndoles este sitio para sustentarse, por ser estéril, pasaron a otro pueblo llamado Tamboquiro, adonde Mama Ocllo parió un hijo, que llamaron Cinchi Roca. Y hechas las fiestas del nacimiento del infante, partieron a buscar tierra fértil, y fueron a otro cercano pueblo llamado Pallata, que es casi una mesma cosa con Tamboquiro, y aquí estuvieron algunos años.","zh":"他们一起走着，来到一个叫瓦纳坎查的地方，离库斯科谷四里格，在那里待了一些时候，一边耕种，一边寻找肥沃的土地。在这个村子里，曼科·卡帕克与他的姐妹玛玛·奥克略同房，她怀了曼科·卡帕克的孩子。他们觉得这个地方贫瘠，养活不了自己，就迁到另一个叫坦博基罗的村子，玛玛·奥克略在那里生了一个儿子，取名辛奇·罗卡。为这个婴儿的出生举行了庆典以后，他们又出发寻找肥沃的土地，到了附近另一个叫帕利亚塔的村子，那里和坦博基罗几乎是一个地方，他们在这里住了好几年。","tr":"p"},"s12-3":{"src":"s","ch":12,"pg":"pp. 122–123","es":"Y no contentándose de la tierra, vinieron a otro pueblo llamado Haisquisrro, un cuarto de legua del pueblo pasado. Y aquí entraron en acuerdo sobre lo que debían hacer para su viaje y para apartar de sí uno de los cuatro hermanos ingas llamado Áyar Cache. El cual, como era feroz y fuerte y diestrísimo de la honda, venía haciendo grandes travesuras y crueldades, así en los pueblos por donde pasaban como en los compañeros. Y temían los otros hermanos que por la mala compañía y travesuras de Áyar Cache se les deshiciesen las compañas de gentes que llevaban y quedasen solos. Y como Manco Cápac era prudente, acordó, con el parecer de los demás, de apartar de sí con engaño a su hermano Áyar Cache. Y para esto llamaron a Áyar Cache y le dijeron: “Hermano, sabed que en Capactoco se nos olvidaron los vasos de oro, llamados topacusi, y ciertas semillas, y el napa, que es nuestra principal insignia de señores. (Es napa un carnero de los desta tierra, blanco, que llevaba una gualdrapa colorada y encima unas orejeras de oro y en el pecho un pretal de veneras coloradas, que llevaban los ricos ingas cuando salían fuera de casa, llevando delante de todo en un palo una como manga de cruz de pluma, a que llaman sunturpáucar). Conviene al bien de todos que volváis allá y lo traigáis”. Y como Áyar Cache rehusase la vuelta, levantóse en pie su hermana Mama Guaco, y con feroces palabras reprehendiéndole dijo: “¡Cómo tal cobardía ha de parecer en un tan fuerte mozo como tú! ¡Dispónte a la jornada y no dudes ir a Tambotoco y hacer lo que se te manda!” Áyar Cache, corrido destas palabras, obedeció y partióse a lo hacer. Diéronle por compañero a uno de los que con ellos venían, llamado Tambochácay, al cual encargaron secreto, que, como pudiese, allá en Tambotoco diese orden cómo muriese Áyar Cache y no tornase en su compañía. Y con este despacho llegaron ambos a Tambotoco. Y apenas fueron allá, cuando Áyar Cache entró en la ventana o cueva Capactoco a sacar las cosas por que le habían enviado. Y siendo dentro, Tambochácay, con suma presteza, puso una peña a la puerta de la ventana, y sentóse encima, para que Áyar Cache quedase dentro y muriese. Y cuando Áyar Cache tornó a la puerta y la halló cerrada, entendió la traición quel traidor de Tambochácay le había hecho, y determinó salir, si pudiera, para se vengar dél. Y por abrir puso tanta fuerza y dió tales voces, que hizo temblar el monte; mas no pudiendo abrir y teniendo por cierta su muerte, dijo a voces altas contra Tambochácay: “¡Tú, traidor, que tanto mal me has hecho, piensas llevar las nuevas de mi mortal carcelería? ¡Pues no te subcederá así, que por tu traición quedarás ahí fuera, hecho piedra!” Y así fué hecho, y hasta hoy la muestran a un lado de la ventana Capactoco. Volviendo, pues, a los siete hermanos que habían quedado en Haisquisrro, sabida la muerte de Áyar Cache pesóles mucho de lo que habían hecho, porque, como era valiente, sintían mucho verse sin él para cuando tuviesen guerra con algunos. Y así hicieron llanto por él. —Era tan diestro este Áyar Cache de la honda y tan fuerte, que de cada pedrada derribaba un monte y hacía una quebrada. Y así dicen que las quebradas que agora hay por las partes que anduvieron, las hizo Áyar Cache a pedradas.","zh":"他们对这里的土地还不满意，又来到另一个叫海斯基斯罗的村子，离前一个村子四分之一里格。他们在这里商议，一是此后的行程该怎么办，二是怎样把四兄弟中叫阿亚尔·卡切的那一个从身边除掉。阿亚尔·卡切凶猛有力，又极善用投石索，一路上无论在经过的村子里还是对同伴，都干下了许多胡闹和残暴的事。其他兄弟怕阿亚尔·卡切这样恶劣、这样胡闹，会让带来的人马散掉，只剩下他们自己。曼科·卡帕克为人精明，便同其余几人商定，用计把他的兄弟阿亚尔·卡切从身边支开。为此他们把阿亚尔·卡切叫来，对他说：“兄弟，要知道，我们在卡帕克托科忘了几样东西：叫托帕库西的金杯、一些种子，还有纳帕，那是我们作为领主的主要徽号。”（纳帕是这片土地上的一种羊，白色，身披红色的鞍褥，上面有金耳饰，胸前有一条红贝壳缀成的胸带；富有的印加们出门时带着它，走在最前面的是用一根杆子挑着的、像十字架幡那样的羽饰，他们称之为孙图尔保卡尔。）“为了大家好，你应当回去把这些东西取来。”阿亚尔·卡切不肯回去，他的姐妹玛玛·瓦科便站起来，言辞激烈地斥责他说：“像你这样强壮的年轻人，怎么能露出这样的胆怯！准备上路吧，别犹豫，去坦博托科，照吩咐你的去做！”阿亚尔·卡切被这番话羞辱，只好服从，动身去办。他们派了同行者中一个叫坦博查凯的人给他作伴，暗中嘱咐他：到了坦博托科，要想办法让阿亚尔·卡切死在那里，不要让他回到他们中间来。两人领了这个差使，到了坦博托科。刚到那里，阿亚尔·卡切就钻进卡帕克托科窗、也就是那个洞里，去取他被派来取的东西。他一进去，坦博查凯就飞快地用一块岩石堵住窗口，自己坐在上面，好让阿亚尔·卡切困在里面死去。阿亚尔·卡切回到洞口，发现被堵住了，明白了坦博查凯这个叛徒对他的背叛，便决心要是能出去，就向他报仇。他为了推开石头，用了极大的力气，喊声震得山都摇动；但他推不开，知道自己必死，就向坦博查凯高声喊道：“你这叛徒，害我害得这样苦，你以为能把我被囚死的消息带回去吗？休想！你背叛了我，就要留在外面，变成石头！”事情果然如此，直到今天，人们还在卡帕克托科窗的一侧指给人看这块石头。再说留在海斯基斯罗的七兄妹，他们得知阿亚尔·卡切死了，对自己所做的事很是懊悔，因为他勇猛，他们想到以后同人打仗时没有他，心里很难过。于是为他举哀。——这个阿亚尔·卡切投石极准，力气又大，每投一石就打倒一座山，打出一道沟。所以据说他们走过的地方现在那些山沟，都是阿亚尔·卡切用石头打出来的。","tr":"p"},"s12-4":{"src":"s","ch":12,"pg":"pp. 123–124","es":"Partieron deste pueblo los siete ingas con sus compañas y llegaron a un pueblo llamado Quirirmanta, al pie de un cerro que después llamaron Guanacauri. Y en este pueblo consultaron cómo dividirían entre sí los oficios de su viaje, para que entrellos hubiese distinción. Y acordaron que Mango Cápac, pues tenía generación de su hermana, que se casase con ella y engendrase para conservación de su linaje, y que éste fuese cabeza de todos, y que Áyar Ucho quedase por guaca para su religión, y que Áyar Auca, desde donde le mandasen, fuese a tomar posesión de la tierra donde hubiesen de poblar.","zh":"七个印加带着人马离开这个村子，来到一个叫基里尔曼塔的村子，在一座山脚下，这座山后来叫瓦纳考里。他们在这个村子里商量，怎样分派一路上的职司，好让彼此有所分别。他们商定：曼科·卡帕克既然已经同他的姐妹有了孩子，就同她结为夫妻，生儿育女，延续他们的世系，并由他做众人之首；阿亚尔·乌丘留下来作圣地，供他们的宗教之用；阿亚尔·奥卡则要从他们指定的地方出发，去占据他们将来定居的土地。","tr":"p"},"s12-5":{"src":"s","ch":12,"pg":"pp. 124–125","es":"Y partiendo de aquí, llegaron al cerro que está dos leguas, poco más o menos, del asiento del Cuzco, y subidos a la cumbre, vieron en ella el arco iris del cielo, al cual los naturales llaman guanacauri. Y teniéndolo por buena señal, dijo Mango Cápac: “¡Tened aquello por señal que no será el mundo más destruído por agua! ¡Lleguemos allá, y desde allí escogeremos dónde habemos de fundar nuestro pueblo!” Y echando antes suertes, vieron que le[s] señalaba buen suceso hacerlo así y desde allí explorar la tierra que de allí se señorease. Antes que llegasen a lo alto donde el arco estaba, vieron una guaca, ques oratorio de bulto de persona, junto al arco. Y determinando entrellos ir a prendella [y] quitalla de allí, ofrecióse a ello Áyar Ucho, porque decían que les convenía mucho. Llegado Áyar Ucho a la estatua o guaca, con grande ánimo se asentó sobrella, preguntándole qué hacía allí. A las cuales palabras la guaca volvió la cabeza por quien le hablaba, mas como lo tenía oprimido con el peso, no le pudo ver. Áyar Ucho luego queriéndose desviar, no pudo, porque se halló pegadas las plantas de los pies a las espaldas de la guaca. Y los seis hermanos, entendiendo que estaba preso, acudieron a él por favorecerle. Mas Áyar Ucho, viéndose así transformarse, y que los hermanos no eran a librarle parte, les dijo: “¡Hermanos, mala obra me habéis hecho, que por vosotros vine adonde quedaré para siempre apartado de vuestra compañía! ¡Id, id, hermanos felices, que yo os anuncio que seréis grandes señores! Por tanto, hermanos, yo os ruego que en pago de mi voluntad [que] de agradaros siempre tuve, que en todas vuestras fiestas y ceremonias os acordéis de honrarme y venerarme, y que sea yo el primero a quien ofrendéis, pues quedo aquí por vosotros, y cuando hiciéredes guarachico (que es armar a los hijos caballeros), a mí como a su padre, que acá por todos queda, me adoréis.” Y Mango Cápac respondió que sí harían, pues aquélla era su voluntad y se lo mandaba. Y Áyar Ucho les prometió, por aquello, que les daría dones y valor de nobleza y caballería, y con estas últimas palabras quedó convertido en piedra. Y constituyéronlo por guaca de los ingas y pusiéronle nombre Áyar Ucho Guanacauri. Y así siempre fué, hasta los tiempos de los españoles, la más sol[emn]e guaca y de más ofrendas de todas las del reino, y allí se iban [a] armar caballeros los ingas hasta habrá como veinte años, poco más o menos, que los cristianos les quitaron esta cerimonia, y fué santamente hecho, porque allí hacían muchas idolatrías y abusos en ofensa y deservicio de Dios Nuestro Señor.","zh":"他们从这里出发，来到离库斯科所在地大约两里格的那座山，登上山顶，看见山顶上有天上的彩虹，本地人把彩虹叫作guanacauri。曼科·卡帕克认为这是好兆头，说：“你们要把那个看作世界不会再被水毁灭的征兆！我们到那里去，从那里选定在哪里建我们的村子！”他们先抽签占卜，看出这样做、从那里察看那里所能俯瞰的土地，会有好结果。在他们登上彩虹所在的高处之前，看见彩虹旁边有一处圣地，那是一座有人形像的祈祷所。他们商定要去把它捉住、从那里搬走，阿亚尔·乌丘自告奋勇，因为他们说这对他们大有好处。阿亚尔·乌丘到了那座石像、也就是那处圣地跟前，壮着胆子坐到它身上，问它在那里做什么。听到这话，那圣地把头转向说话的人，可是阿亚尔·乌丘的重量压着它，它看不见他。阿亚尔·乌丘随即想离开，却离不开了，因为他发现自己的脚掌粘在了那圣地的背上。六个兄妹知道他被困住了，赶来帮他。可是阿亚尔·乌丘见自己正在变形，兄妹们救不了他，就对他们说：“兄弟们，你们害了我，我是为了你们才来到这里的，从此我要永远留在这里，离开你们了！去吧，去吧，幸运的兄弟们，我向你们预言，你们将成为伟大的领主！所以，兄弟们，我求你们，为报答我一向想让你们高兴的心意，在你们所有的节庆和仪式上，都要记得尊崇我、敬奉我，我要第一个受你们的供奉，因为我是为你们留在这里的；你们为儿子们行瓦拉奇科——就是给儿子们授骑士身份——的时候，要把我当作他们的父亲来崇拜，因为我替大家留在这里。”曼科·卡帕克回答说一定照办，既然这是他的心愿，又是他的吩咐。阿亚尔·乌丘便许诺，作为回报，他会赐给他们各种恩赐，赐给他们贵族和骑士的荣誉；说完这最后几句话，他就变成了石头。他们便把他立为诸印加的圣地，取名阿亚尔·乌丘·瓦纳考里。从此直到西班牙人来的时候，它一直是全国最隆重、受供奉最多的圣地；诸印加一直到那里去受骑士之礼，直到大约二十年前，基督徒才禁止了他们的这种仪式，这件事做得很圣洁，因为他们在那里行了许多偶像崇拜和恶习，冒犯、亵渎我们的主上帝。","tr":"p"},"s13-1":{"src":"s","ch":13,"pg":"p. 126","es":"Tristes los seis hermanos por la dejada de Áyar Ucho, y también por la muerte de Áyar Cache —y aun por esto siempre después hasta hoy temen los del linaje de los ingas llegar a Tambotoco, porque dicen que se quedarían allá como Áyar Cache—, bajaron al pie del cerro, adonde comenzaron a entrar en el valle del Cuzco, y llegaron a un sitio llamado Matagua, adonde asentaron y hicieron chozas para estar algún tiempo. Aquí armaron caballero al hijo de Mango Cápac y de Mama Ocllo, llamado Cinchi Roca, y le horadaron las orejas, al cual acto llaman guarachico, ques la insignia de su caballería y nobleza, como privilegio o solar conocido entre nosotros. Por esto se regocijaron mucho, bebiendo muchos días arreo y llorando a vueltas la dejada de su hermano Áyar Ucho. Y allí inventaron el llorar los muertos imitando el crocitar de las palomas. Entonces hicieron las danzas llamadas cápac raimis, ques fiesta de los señores ricos o reales, que hacen con unas vestiduras largas de púrpura, y las cerimonias que llaman quicochico, ques cuando viene a la mujer su flor o mes la primera vez, y del guarachico, que es cuando horadan las orejas a los ingas, y del rutuchico, que es cuando trasquilan al inga la primera vez, y del ayúscay, ques cuando nace el infante, que beben cuatro o cinco días arreo.","zh":"六兄妹为阿亚尔·乌丘的离去、也为阿亚尔·卡切的死而悲伤——也正因为这个缘故，此后直到今天，印加世系的人一直害怕去坦博托科，说去了就会像阿亚尔·卡切一样留在那里——他们下到山脚，开始进入库斯科谷，来到一个叫马塔瓜的地方，在那里住下，搭起茅屋，打算待些时候。他们在这里为曼科·卡帕克和玛玛·奥克略的儿子辛奇·罗卡授骑士身份，给他穿了耳朵；这个仪式叫作瓦拉奇科，是他们骑士身份和贵族身份的标志，就像我们这里的特权或有名的家门一样。他们为此大为欢庆，接连喝了许多天酒，同时又哭他们的兄弟阿亚尔·乌丘的离去。他们在那里发明了模仿鸽子咕咕叫声来哭死者的做法。那时他们还创制了叫作卡帕克·赖米的舞蹈，这是富有的或王族的领主们的节庆，跳舞时穿紫红色长袍；又创制了几种仪式：quicochico，是女子初次来月经的时候；瓦拉奇科，是给诸印加穿耳的时候；rutuchico，是第一次给印加剪发的时候；ayúscay，是婴儿出生的时候，要接连喝四五天酒。","tr":"p"},"s13-2":{"src":"s","ch":13,"pg":"pp. 126–127","es":"Después desto estuvieron en Matagua dos años, intentando pasar el valle arriba a buscar buena y fértil tierra. Mama Guaco, que fortísima y diestra era, tomó dos varas de oro y tirólas hacia el norte. La una llegó como dos tiros de arcabuz, a un barbecho llamado Colcabamba, y no hincó bien, porque era tierra suelta y no bancal, y por esto conocieron que la tierra no era fértil. Y la otra llegó más adelante, cerca del Cuzco, y hincó bien en el territorio que llaman Guanaipata, de donde conocieron ser tierra fértil. Otros dicen questa prueba hizo Mango Cápac con la estaca de oro que traía consigo, y que así conocieron la fertilidad de la tierra, cuando, hincándola una vez en un territorio llamado Guanaipata, dos tiros de arcabuz del Cuzco, por el migajón de la tierra ser graso y denso, aferró de manera que con mucha fuerza no la podía arrancar.","zh":"此后他们在马塔瓜住了两年，想沿山谷往上走，去寻找肥沃的好土地。玛玛·瓦科极其强壮，身手矫健，她拿起两根金棍，向北投去。一根落在约两火绳枪射程远一块叫科尔卡班巴的休耕地上，没有插牢，因为那里土质松散，不是成块的好土，他们由此知道那块地不肥沃。另一根落得更远，靠近库斯科，在叫瓦奈帕塔的地方插得很牢，他们由此知道那是肥沃的土地。另有人说，这次试验是曼科·卡帕克用他随身带的那根金棍做的，他们是这样知道土地肥沃的：他把金棍插进离库斯科两火绳枪射程、叫瓦奈帕塔的一块地里，那里的泥土油腻而密实，金棍咬得极牢，用了很大力气也拔不出来。","tr":"p"},"s13-3":{"src":"s","ch":13,"pg":"p. 127","es":"Sea de una o de otra manera, que en esto concuerdan todos que venían buscando la tierra experimentándola con un palo o estaca y oliéndola hasta que llegaron a ésta de Guanaipata, que les satisfizo. Y conocida su fertilidad, porque sembrándola perpetuamente siempre acude de una manera, y más da mientras más la siembran, y antes se esquilma no sembrándola, determinaron usurpar para sí aquellas tierras y comarca por fuerza, a pesar de sus dueños y naturales [de] aquel asiento; y para tratar el cómo lo harían, tornáronse a Matagua.","zh":"不管是哪一种说法，大家都同意这一点：他们一路寻找土地，用一根棍子或木桩去试，还闻土的气味，直到来到瓦奈帕塔这块地，才满意了。他们知道了这里的肥沃——这块地年年耕种，收成始终一样，种得越多出得越多，不种反而会贫瘠——便决定不顾那个地方的主人和本地人的意愿，用武力把那些土地和那一带据为己有；为了商量怎么做，他们又回到马塔瓜。","tr":"p"},"s13-4":{"src":"s","ch":13,"pg":"pp. 127–128","es":"Desde el cual asiento Mango Cápac vido un mojón de piedra que estaba cerca del sitio donde agora está el monesterio de Santo Domingo del Cuzco, y mostrándosele a su hermano Áyar Auca, le dijo: “¡Hermano!, ¿ya te acuerdas cómo está entre nosotros concertado que tú vayas a tomar posesión de la tierra donde habemos de poblar? ¡Y pues agora, mira aquella piedra!” Y mostrábale el mojón dicho: “¡Vé allá volando (porque dicen le habían nacido unas alas), y sentándote allí toma posesión en el mesmo asiento donde parece aquel mojón, porque nosotros iremos luego a poblar y vivir!” Áyar Auca, oídas las palabras de su hermano, levantóse sobre sus alas y fué al dicho lugar que Mango Cápac le mandaba, y sentándose allí, luego se convirtió en piedra y quedó hecho mojón de posesión, que en la lengua antigua deste valle se llama cozco, de donde le quedó el nombre del Cuzco al tal sitio hasta hoy. De aquí tienen los ingas un proverbio que dice: Áyar Auca cuzco guanca, como si dijese “Áyar Auca mojón de piedra mármol”. Otros dicen quel nombre del Cuzco le puso Mango Cápac porque en el lugar donde enterró su hermano Áyar Cache hizo llanto; por lo cual y por la fertilidad del sitio le dió este nombre, que en el antiguo lenguaje de aquel tiempo significa triste y fértil. Mas lo verisímil es lo primero, porque Áyar Cache no fué enterrado en el Cuzco, antes murió en Capactoco, como se dijo arriba; y esto se averigua generalmente entre ingas y naturales.","zh":"曼科·卡帕克从这个地方望见一块界石，就在如今库斯科圣多明我修道院所在之处附近；他把它指给他的兄弟阿亚尔·奥卡看，对他说：“兄弟！你还记得我们之间商定由你去占据我们将来定居的土地吗？那么现在，看那块石头！”他把那块界石指给他看：“飞到那里去（据说他长出了翅膀），坐在那里，就在那块界石所在的地方占据它，我们随后就去定居生活！”阿亚尔·奥卡听了兄弟的话，展翅飞到曼科·卡帕克吩咐他去的那个地方，一坐下，就变成了石头，成了占据土地的界石；这种界石在这个山谷的古语里叫cozco，那个地方从此就叫库斯科，直到今天。因此诸印加有一句谚语：Áyar Auca cuzco guanca，好比说“阿亚尔·奥卡，大理石界石”。另有人说，库斯科这个名字是曼科·卡帕克取的，因为他在埋葬他兄弟阿亚尔·卡切的地方举了哀；他因为这个缘故，又因为那地方肥沃，给它取了这个名字，在那时的古语里意思是“悲伤”和“肥沃”。但前一种说法更可信，因为阿亚尔·卡切并没有葬在库斯科，而是如上所说死在了卡帕克托科；这一点在诸印加和本地人中间普遍可以查明。","tr":"p"},"s13-5":{"src":"s","ch":13,"pg":"pp. 128–129","es":"Quedando, pues, ya de los cuatro hermanos ingas sólo Mango Cápac y las cuatro mujeres, determináronse luego de partir a Guanaipata y adonde había ido Áyar Auca a tomar posesión, y para lo hacer dió primero a su hijo Cinchi Roca mujer llamada Mama Coca, de los aillos del pueblo de Saño, hija de un cinchi llamado Siticguaman, de la cual tuvo después un hijo llamado Sapaca, e instituyó el sacrificio llamado capa cocha, que es sacrificar dos niños, macho y hembra, al ídolo Guanacauri, para cuando los ingas se fuesen [a] armar caballeros. Y esto así dispuesto, mandó a las compañas le siguiesen, y marchó para donde Áyar Auca estaba.","zh":"四个印加兄弟中，这时只剩下曼科·卡帕克和四个女子，他们决定马上动身去瓦奈帕塔，去阿亚尔·奥卡去占据的那个地方；为此，他先给儿子辛奇·罗卡娶了一个妻子，叫玛玛·科卡，出自萨尼奥村的亲族共同体，是一个叫西蒂克瓦曼的军事首领的女儿；辛奇·罗卡后来同她生了一个儿子，叫萨帕卡。曼科·卡帕克又设立了叫卡帕克·科查的献祭，就是把一男一女两个孩子献给瓦纳考里神像，供诸印加去受骑士之礼时用。这样安排好以后，他命令人马跟随他，向阿亚尔·奥卡所在的地方进发。","tr":"p"},"s13-6":{"src":"s","ch":13,"pg":"pp. 129–130","es":"Y llegando a las tierras de Guanaipata, que es cerca de donde agora es el Arco de la Plata, camino de los Charcas, halló allí poblados una nación de indios naturales llamados guallas, que arriba se dijo; y Mango Cápac y Mama Guaco comenzaron a poblar y tomarles las tierras y aguas contra su voluntad de los guallas. Y sobre esto les hacían muchos males y fuerzas, y como los guallas por esto se pusiesen en defensa por sus vidas y tierras, Mama Guaco y Mango Cápac hicieron en ellos muchas crueldades. Y cuentan que Mama Guaco era tan feroz, que matando un indio gualla le hizo pedazos y le sacó el asadura y tomó el corazón y bofes en la boca, y con un haibinto —que es una piedra atada en una soga, con que ella peleaba— en las manos, se fué contra los guallas con diabólica determinación. Y como los guallas viesen aquel horrendo e inhumano expetáculo, temiendo que dellos hiciesen lo mesmo, huyeron, ca simples y tímidos eran, y así desampar[ar]on su natural. Y Mama Guaco, visto la crueldad que habían hecho, y temiendo que por ello fuesen infamados de tiranos, parecióles no dejar ninguno de los guallas, creyendo que así se incubriría. Y así mataron a cuantos pudieron haber a las manos, y a las mujeres preñadas sacaban las criaturas de los vientres, por que no quedase memoria de aquellos miserables guallas.","zh":"他到了瓦奈帕塔的土地，那地方靠近现在的银拱门，在通往查尔卡斯的路上；他发现那里住着一族本地印第安人，叫瓦利亚，上文已经说过。曼科·卡帕克和玛玛·瓦科开始在那里定居，违背瓦利亚人的意愿夺取他们的土地和水源。他们为此对瓦利亚人百般为害、横施暴力；瓦利亚人因此起来保卫自己的性命和土地，玛玛·瓦科和曼科·卡帕克就对他们大肆残杀。据说玛玛·瓦科凶残到这种地步：她杀了一个瓦利亚印第安人，把他剁成碎块，掏出内脏，把心和肺叼在嘴里，手里拿着一个haibinto——那是一块拴在绳子上的石头，她用它打仗——带着魔鬼般的决心向瓦利亚人冲去。瓦利亚人看到这可怕而残忍的景象，害怕自己也遭同样的下场，便逃走了，因为他们老实胆小；他们就这样抛弃了自己的故土。玛玛·瓦科看到他们做下的残暴之事，害怕因此背上暴君的恶名，他们觉得一个瓦利亚人也不能留下，以为这样就能掩盖过去。于是，凡是能抓到的，他们都杀了；对怀孕的妇女，他们把胎儿从腹中剖出来，好让那些可怜的瓦利亚人不留一点痕迹。","tr":"p"},"s13-7":{"src":"s","ch":13,"pg":"p. 130","es":"Hecho esto, pasó Mango Cápac adelante, y llegando como una milla del Cuzco al sueste, salióles al encuentro un cinchi llamado Copalimaita, de quien arriba dijimos que, aunque advenedizo, se había hecho natural por consintimiento de los naturales del valle, y se había incorporado en la nación de Sauaséray Panaca, naturales del sitio de Santo Domingo del Cuzco. Y como éstos vieron questos extranjeros entraban tiranizándoles sus tierras y habían visto las crueldades hechas en los guallas, habían tomado por su cinchi a Copalimaita. El cual, como dicho es, les salió a resistir, diciéndoles que no entrasen en sus tierras y de aquellos naturales. Y fué esta resistencia que hizo a Mango Cápac y a sus campañas tal, que forzó las espaldas. Y así se volvieron a Guanaipata, tierra que habían usurpado a los guallas. Y de la sementera que habían hecho, hallaron gran fertilidad de mieses, y por esto llamaron por este nombre a aquellas tierras, que quiere decir “cosa preciosa”.","zh":"做完这些事，曼科·卡帕克继续前进，在库斯科东南约一英里的地方，一个叫科帕利迈塔的军事首领出来迎击他们。上文说过，这个人虽是外来者，却经山谷本地人同意成了本地人，并入了萨瓦西赖·帕纳卡一族，他们是库斯科圣多明我修道院所在之地的本地人。这些人看到这伙外乡人闯进来压迫他们、夺他们的土地，又看到了对瓦利亚人所施的残暴，便推举科帕利迈塔为他们的军事首领。如上所说，他出来抵抗，告诉他们不许进入他的土地和那些本地人的土地。他的抵抗打得曼科·卡帕克和他的人马掉头败退。他们于是回到瓦奈帕塔，那是他们从瓦利亚人手里夺来的土地。他们在那里种下的庄稼长得极好，因此就给那片土地取了这个名字，意思是“珍贵之物”。","tr":"p"},"s13-8":{"src":"s","ch":13,"pg":"pp. 130–131","es":"Y dende algunos meses tornaron a insistir y entrar en las poblaciones de los naturales y tiranizarles sus tierras. Y así acometieron al pueblo de los sauaseras, y tuvieron tanta presteza en el acometimiento, que prendieron a Copalimaita, matando muchos de los sauaseras, con grandes crueldades. Copalimaita, viéndose preso y temiendo la muerte, se fué de desesperado y dejó sus haciendas, por que le soltasen. El cual nunca más pareció, y Mama Guaco y Mango Cápac usurparon sus casas, haciendas y gentes. Y desta manera Mango Cápac y Mama Guaco y Cinchi Roca y Mango Sapaca poblaron aquel sitio dentre los dos ríos, y hicieron la Casa del Sol, a que llamaron Indicancha, y todo aquel sitio questá desde Santo Domingo hasta la junta de los ríos dividieron en cuatro vecindades o solares, a quellos llaman cancha. A la una llamaron Quinti cancha, a la segunda Chumbi cancha, a la tercera Sairi cancha, a la cuarta Yarámbuy cancha. Y repartiéronlas entre sí, y así poblaron la cidad, que por el mojón de Áyar Auca se llamó Cozco.","zh":"几个月后，他们又执意进犯本地人的村落，要夺他们的土地。于是他们袭击了萨瓦西赖人的村子，出击极其迅速，捉住了科帕利迈塔，以极其残暴的手段杀了许多萨瓦西赖人。科帕利迈塔见自己被俘，怕被处死，绝望之下逃走了，丢下自己的产业，只求他们放了他。此后再也没有人见过他，玛玛·瓦科和曼科·卡帕克便霸占了他的房屋、产业和人口。就这样，曼科·卡帕克、玛玛·瓦科、辛奇·罗卡和曼科·萨帕卡在两条河之间的那块地方定居下来，建了太阳殿，他们称之为因迪坎查；从圣多明我修道院直到两河交汇处的整片地方，他们分成四个街坊或宅地，他们称之为坎查。第一个叫金蒂坎查，第二个叫春比坎查，第三个叫赛里坎查，第四个叫亚兰布伊坎查。他们把这四块地分给自己人，就这样在城里定居下来；这座城因阿亚尔·奥卡的界石而叫库斯科。","tr":"p"},"s14-1":{"src":"s","ch":14,"pg":"pp. 131–132","es":"Dicho es que una de las naciones naturales deste valle del Cuzco fueron y son los alcabizas. Éstos, a la sazón que Mango Cápac pobló en Indicancha y se apoderó de los bienes de Sauasera y de los guallas, estaban poblados como medio tiro de arcabuz de Indicancha hasta la parte donde es agora Santa Clara. Y como Mango Cápac quisiese entablar sus fuerzas, para que no pudiese ser impedida su tiránica intención procuraba de allegar gente a sí, suelta y holgazana, haciéndoles franquezas de lo ajeno. Y para sustentarlos, tomaba las tierras a todos sin distinción. Y como hubiese tomado las de los guallas y de los sauaseras, quiso también tomar las de los alcabizas. Y puesto caso que los alcabizas le habían dado algunas, el Mango Cápac quiso e intentó tomárselas todas o casi todas. Y como los alcabizas vieron que se les entraban hasta las casas, dijeron: “¡Éstos son hombres belicosos y sin razón! ¡Nos toman las tierras! ¡Vamos y amojonemos las que nos quedan!” Y así lo hicieron. Pero Mama Guaco dijo a Mango Cápac: “¡Tomemos todas las aguas a los alcabizas, y así serán forzados a nos dar las tierras que quisiéremos!” Y así fué hecho, que les tomaron las aguas. Y sobre esto vinieron a reñir, y como los de Mango Cápac eran más y más diestros, forzaron a los alcabizas a que les dejasen las tierras quellos quisieron, y les hicieron que los sirviesen como a señores, aunque los alcabizas nunca de su voluntad sirvieron a Mango Cápac ni le tuvieron por señor, antes siempre andaban diciendo a los de Mango Cápac, a voces altas: “¡Fuera, fuera de nuestra tierra!” Por lo cual Mango Cápac procuraba más deshacellos y oprimillos tiránicamente.","zh":"上文说过，这个库斯科谷的本地族群之一，过去是、现在也是阿尔卡维萨人。曼科·卡帕克在因迪坎查定居、占有萨瓦西赖人和瓦利亚人的财产的时候，阿尔卡维萨人住在离因迪坎查约半火绳枪射程的地方，一直到现在圣克拉拉修女院所在的那一带。曼科·卡帕克想巩固自己的势力，为了让他的暴虐图谋不受阻碍，便设法招揽游手好闲的散漫之徒，拿别人的东西慷慨地分给他们。为了养活这些人，他不加区分地夺取所有人的土地。他夺了瓦利亚人和萨瓦西赖人的土地以后，又想夺阿尔卡维萨人的土地。阿尔卡维萨人虽然已经给了他一些，曼科·卡帕克却想把他们的土地全部或几乎全部夺走，并且动手了。阿尔卡维萨人见他们一直侵占到家门口，便说：“这些人好战，不讲道理！他们夺我们的土地！我们去把剩下的地划上界石！”他们就这样做了。可是玛玛·瓦科对曼科·卡帕克说：“我们把阿尔卡维萨人的水全部夺过来，他们就只好把我们想要的土地交给我们了！”他们就这样做了，夺了他们的水。双方为此争斗起来；曼科·卡帕克的人更多、也更善战，便逼着阿尔卡维萨人把他们想要的土地让出来，还强迫阿尔卡维萨人把他们当领主来服侍。然而阿尔卡维萨人从来不是心甘情愿服侍曼科·卡帕克，也从不把他当领主，反而一直冲着曼科·卡帕克的人高喊：“滚出去，滚出我们的土地！”因此曼科·卡帕克更想打垮他们，以暴政手段压制他们。","tr":"p"},"s14-2":{"src":"s","ch":14,"pg":"p. 132","es":"Demás déstos había otras parcialidades, como arriba dijimos, naturales del valle del Cuzco, a los cuales Mango Cápac y Mama Guaco destruyeron totalmente, y sobre todos a uno que vivía junto a Hindicancha, en la cuadra más cercana, que se llamaba Humanamean, que vivía entre Indicancha y Cayocache, adonde también vivía otro cinchi natural llamado Culunchima. Y Mango Cápac se metió en las casas y haciendas de todos los naturales, especialmente de los alcabizas, y prendió a su cinchi en cárcel perpetua, y a los demás desterró a Cayocache y les forzó a que le tributasen. Pero siempre los unos y los otros procuraban libertarse de la tiranía, como de los alcabizas diremos adelante.","zh":"除了这些人，如上所说，还有库斯科谷其他一些本地的部，曼科·卡帕克和玛玛·瓦科把他们彻底毁灭了；首当其冲的是一个住在因迪坎查旁边、最近那个街坊的人，名叫乌马纳梅安，他住在因迪坎查和卡亚乌卡奇之间；那里还住着另一个本地军事首领，名叫库伦奇马。曼科·卡帕克侵占了所有本地人的房屋和产业，尤其是阿尔卡维萨人的，把他们的军事首领终身监禁，把其余的人流放到卡亚乌卡奇，强迫他们向他纳贡。可是这些人和那些人始终都想从暴政下挣脱出来，关于阿尔卡维萨人，我们后面还要讲到。","tr":"p"},"s14-3":{"src":"s","ch":14,"pg":"pp. 132–133","es":"Acabado de destruir estos naturales, y tiranizados sus bienes y personas, Mango Cápac era ya muy viejo, y viéndose cerca de la muerte, para dejar a su hijo Cinchi Roca por su señor, y seguro, temeroso que por el mal quél había hecho podría ser que su hijo y sucesores no se conservarían en lo que él había tiranizado y los venideros tiranizasen, ordenó que los diez aillos que con él habían venido de Tambotoco y los demás de su linaje hiciesen entre sí una guarnición a manera de guarda, los cuales siempre asistiesen junto a la persona de su hijo y los demás descendientes dellos para custodia suya, y quéstos eligiesen el sucesor, cuando fuese nombrado por el padre o sucediese por muerte del padre. Ca no se confiaba de que los naturales le nombrasen ni eligiesen, como aquél que sabía el mal y fuerza que les había hecho. Y así, estando Manco Cápac a la muerte, dejó el pájaro indi encerrado, y el topayauri, que es cetro, y el napa y sunturpáucar, insignias de príncipe, aunque tirano, a su hijo Cinchi Roca, para que quedase en su lugar, y esto sin consintimiento ni elección de algunos naturales.","zh":"这些本地人被毁灭殆尽，他们的财产和人身都落入暴政之下以后，曼科·卡帕克已经很老了；他自觉死期将近，想让儿子辛奇·罗卡稳稳当当地继他做领主，又怕自己作恶太多，儿子和后继者可能保不住他用暴政夺来的东西，后人反倒会被别人压迫，于是下令：同他一起从坦博托科来的十个亲族共同体和他自己世系的其他人，在他们中间组成一支卫队，始终守在他儿子以及他们后代的身边，护卫他们；并由他们来推举继承人，不论继承人是由父亲指定，还是在父亲死后继位。因为他不相信本地人会指定或推举他的儿子，他知道自己对他们作了多少恶、用了多少暴力。于是，曼科·卡帕克临死时，把关着的因迪鸟、作为权杖的托帕亚乌里，以及纳帕和孙图尔保卡尔这些王者的徽号——尽管他是暴君——留给儿子辛奇·罗卡，让他继承自己的位置；这件事没有经过任何本地人的同意或推举。","tr":"p"},"s14-4":{"src":"s","ch":14,"pg":"p. 133","es":"Y así murió Mango Cápac, según afirman los de su aillo y linaje, de ciento y cuarenta y cuatro años, los cuales fueron destribuídos desta manera: Cuando salió de Pacaritambo o Tambotoco era de treinta [y] seis años. Desde allí hasta llegar al valle del Cuzco, en las paradas que hizo en los pueblos que anduvo buscando tierras fértiles, tardó ocho años, porque en una parte se detenía un año y en otras dos, y en otras más y menos, hasta llegar al Cuzco, adonde vivió lo restante de toda la edad, que fueron cient años, los cuales fué cápac, que entrellos significa “sumo” o “monarca rico”.","zh":"据他的亲族共同体和世系的人肯定，曼科·卡帕克死时一百四十四岁，这些年是这样分的：他从帕卡里坦博或坦博托科出来时三十六岁。从那里到库斯科谷，一路在各村停留，寻找肥沃的土地，用了八年，因为他在一处停一年，在别处停两年，还有的地方多些或少些，直到来到库斯科；他在库斯科度过了余生，共一百年，这一百年里他一直是卡帕克，这个词在他们中间的意思是“至尊”或“富有的君主”。","tr":"p"},"s14-5":{"src":"s","ch":14,"pg":"pp. 133–134","es":"Y dicen que era hombre de buena estatura, seco, campestre, cruel, aunque franco, y que en muriendo se convirtió en piedra de altor de una vara de medir, y estuvo en Indicancha guardado con mucha veneración hasta el año de mil y quinientos y cincuenta y nueve, en el cual tiempo, siendo corregidor en el Cuzco el licenciado Polo Ondegardo, lo descubrió y sacó de donde estaba adorado y venerado de todos los ingas en el pueblo de Bimbilla, cerca del Cuzco.","zh":"据说他身材匀称，瘦削，粗朴，残忍，但慷慨；他一死就变成了一块一瓦拉高的石头，一直在因迪坎查受到极大的尊崇和保护，直到一千五百五十九年；那一年，库斯科的市政长官波洛·翁德加多硕士在库斯科附近的宾比利亚村发现了它，把它从诸印加崇拜敬奉它的地方取了出来。","tr":"p"},"s14-6":{"src":"s","ch":14,"pg":"pp. 134–135","es":"Deste Mango Cápac quedaron los diez aillos nombrados arriba. Déste empezaron los ídolos guauquis, que era un ídolo o demonio que cada inga elegía para su compañía y le daba oráculo y respuesta; déste fué ídolo gua[u]qui el pájaro hindi, que arriba se dijo. Este Mango Cápac ordenó, para conservación de su memoria, lo siguiente: Que su hijo mayor, y de su mujer legítima, que era su hermana, sucediese en el estado, y si hubiese hijo segundo, a éste diese cargo que tuviese cuidado de amparar a todos los demás hijos y parientes, y quellos le reconociesen por cabeza para sus necesidades y se apellidasen de su nombre, y él tuviese cargo de los favorecer y sustentar, y para esto les dejó hacienda. A esta parcialidad o bando o linaje llamó aillo, ques lo mesmo que linaje. Y si faltase hijo segundo, y aunque lo hubiese, si era incapaz de gobierno, lo encargasen al pariente más cercano y de más habilidad. Y para que dél tomasen los venideros ejemplo, hizo el primero aillo y llamóle Chima Panaca Aillo, que quiere decir linaje que desciende de Chima; porque el primero a quien dejó encomendado su linaje o aillo se llamó Chima, y panaca quiere decir descender. Y es de notar que los deste aillo siempre adoraron la estatua de Mango Cápac, y no las demás estatuas de los ingas, y los aillos de los demás ingas adoraron siempre aquella estatua y las demás. El cuerpo déste no se supo qué se hiciese dél más de la estatua dicha. A la cual llevaban a las guerras, pensando que les daba las victorias que alcanzaban; y la llevaban a Guanacauri cuando hacían los guarachicos a los ingas. Y Guaina Cápac la llevó consigo a los Quitos y Cayambis, y después la tornaron al Cuzco cuando trajeron el cuerpo de Guaina Cápac muerto. Hay deste linaje agora en el Cuzco algunos que conservan la memoria y hechos de Mango Cápac. Las principales cabezas son éstos: Don Diego Checo, Don Juan Guargua Chima. Son Hurincuzcos. Murió Mango Cápac año de seiscientos y sesenta y cinco años de la natividad de Cristo Nuestro Señor, reinando en España Loiba, godo, imperando Constantino cuarto. Vivió en Hindicancha, Casa del Sol.","zh":"这个曼科·卡帕克身后留下了上面列举的十个亲族共同体。瓦奥基神像是从他开始的；那是每个印加各自挑选来随身陪伴的神像或魔鬼，为他发神谕、作答复。上文所说的因迪鸟就是他的瓦奥基神像。这个曼科·卡帕克为了保存对自己的记忆，作了如下规定：由他的长子、即他的正妻也就是他的姐妹所生的长子继承王位；如果有次子，就把照看其余所有儿子和亲属的责任交给他，其余的人在有所需要时尊他为首，以他的名字为姓，他则负责扶助供养他们，为此给他们留下了产业。他把这样的一部、一派或一个世系称为亲族共同体，意思就是世系。如果没有次子，或者虽有次子而不能理事，就把这件事交给最亲近、最能干的亲属。为了给后人立个榜样，他建立了第一个亲族共同体，叫作奇马·帕纳卡·艾柳，意思是“奇马传下来的世系”；因为他托付给他的世系、即亲族共同体的第一个人叫奇马，而帕纳卡的意思是“传下来”。值得注意的是，这个亲族共同体的人一直只崇拜曼科·卡帕克的像，不崇拜其他印加的像，而其他印加的亲族共同体则一直崇拜这尊像和其余的像。至于他的遗体后来怎样了，除了上面说的那座像，人们一无所知。他们打仗时把这座像带去，以为他们取得的胜利是它赐的；给诸印加行瓦拉奇科时，也把它带到瓦纳考里。瓦伊纳·卡帕克曾把它带到基多人和卡扬比人那里，后来他们把瓦伊纳·卡帕克的遗体运回库斯科时，又把它带了回来。现在库斯科有这一系的一些人，保存着对曼科·卡帕克及其事迹的记忆。主要的首领是堂迭戈·切科和堂胡安·瓦尔瓜·奇马。他们是乌林库斯科。曼科·卡帕克死于我主基督诞生后六百六十五年，那时西班牙在位的是哥特人洛伊瓦，东罗马皇帝是君士坦丁四世。他住在因迪坎查太阳殿。","tr":"p"},"s15-1":{"src":"s","ch":15,"pg":"pp. 135–136","es":"Dicho es cómo Mango Cápac, primero inga, que tiranizó los naturales y pobladores del valle del Cuzco, no subjetó sino a los guallas, alcabizas, sauaseras, Culunchima, Copalimaita y los demás arriba dichos, que todos estaban en el circuito que agora es la ciudad del Cuzco. A este Mango Cápac sucedió su hijo Cinchi Roca, y de Mama Ocllo, su madre y tía, por nombramiento del padre y por custodia de los aillos, que entonces todos vivían juntos, y no por elección de los naturales, porque todos estaban a la sazón huídos, presos, heridos y desterrados, y final eran todos sus mortales enemigos por causa de su padre Mango Cápac, que tantas crueldades, robos y muertes en ellos había hecho. No fué Cinchi Roca hombre de guerra, y así no se cuenta dél cosa señalada en armas, ni salió del asiento del Cuzco por sí ni por capitanes suyos. No aumentó algo a lo que su padre le dejó tiranizado; sólo se sustentó con sus aillos, teniendo opresos a los que su padre dejó desbaratados. Éste tuvo por mujer a Mama Coca, del pueblo de Saño, en la cual hobo un hijo llamado Lloqui Yupangui, que quiere decir izquierdo, porque lo fué. Dejó su aillo, llamado Raura Panaca Aillo; son del bando de Hurincuzco. Hay [a]gora deste aillo algunos, y los principales se llaman Don Alonso Puscon y Don Diego Quispe. Éstos tienen cargo de saber y sustentar las cosas y memorias de Cinchi Roca. El cual vivió en Hindicancha, Casa del Sol; fué toda su edad ciento y veinte y siete años; sucedió de ciento y ocho años, fué cápac diez y nueve años. Murió en el año de seiscientos y setenta y cinco años de la natividad de Nuestro Señor Jesucristo, siendo rey de España Bamba y emperador León cuarto, papa Donus. Éste dejó un ídolo de piedra, figura de pescado, llamado Guanachiri Amaro, que fué en su vida su ídolo guáoqui. El cual ídolo, con el cuerpo de Cinchi Roca, halló e[l] licenciado Polo, siendo corregidor del Cuzco, en el pueblo de Bimbilla, entre unas barretas de cobre, y el ídolo tenía su servicio de criados y tierras de sembrar.","zh":"上文说过，第一位印加曼科·卡帕克压迫了库斯科谷的本地人和居民，但他所征服的只有瓦利亚人、阿尔卡维萨人、萨瓦西赖人、库伦奇马、科帕利迈塔以及上面说过的其他人，他们都住在如今库斯科城的范围之内。继承这个曼科·卡帕克的是他的儿子辛奇·罗卡，母亲是玛玛·奥克略，她既是他的母亲又是他的姑母；他的继位是由于父亲的指定和各亲族共同体的护持——当时他们全都住在一起——而不是由于本地人的推举，因为那时本地人都已逃散、被俘、受伤或被流放，总之由于他父亲曼科·卡帕克对他们施加了那么多残暴、抢劫和杀戮，他们全都是他的死敌。辛奇·罗卡不是能打仗的人，所以没有他在武功上有什么建树的记载，他既没有亲自、也没有派手下的统领离开过库斯科这块地方。他父亲用暴政给他留下的东西，他没有增加分毫；他只是靠自己的亲族共同体维持下去，压制着他父亲打垮的那些人。他娶了萨尼奥村的玛玛·科卡为妻，同她生了一个儿子，叫略克·尤潘基，意思是“左撇子”，因为他确实是左撇子。辛奇·罗卡留下了他的亲族共同体，叫劳拉·帕纳卡·艾柳，属于乌林库斯科一派。现在这个亲族共同体还有一些人，主要的人叫堂阿隆索·普斯孔和堂迭戈·基斯佩。他们负责知晓和保存辛奇·罗卡的事迹和记忆。辛奇·罗卡住在因迪坎查太阳殿；他一共活了一百二十七岁，一百零八岁继位，作卡帕克十九年。他死于我主耶稣基督诞生后六百七十五年，当时西班牙国王是万巴，东罗马皇帝是利奥四世，教宗是多努斯。他留下一尊鱼形的石像，叫瓦纳奇里·阿马罗，那是他生前的瓦奥基神像。波洛硕士任库斯科市政长官时，在宾比利亚村的一些铜条中间，找到了这尊神像和辛奇·罗卡的遗体；这尊神像还有自己的仆役和耕地。","tr":"p"},"s16-1":{"src":"s","ch":16,"pg":"pp. 136–137","es":"Muerto Cinchi Roca, ocupó el ingazgo Lloqui Yupangui, hijo de Cinchi Roca y de Mama Coca, su mujer. Y es de notar que, aunque Mango Cápac había mandado quel primer hijo sucediese, éste quebrantó el mandato de su abuelo, porque teniendo otro mayor hermano llamado Mango Sapaca, como es dicho, no consintió que sucediese al estado, y no declaran los indios si fué nombrado por el padre, por donde pienso yo que no fué nombrado por el padre sino Mango Sapaca, como mayor, pues tampoco lo fué por los naturales, ni aprobado por ellos. Y siendo esto así, fué la tiranía hecha contra naturales e infidelidad contra consanguíneos, con favor de los aillos legionarios, con cuyo favor acometían lo que querían, y salían con ello. Así que Lloqui Yupangui vivió en Hindicancha; no salió del asiento del Cuzco por guerra, ni hizo cosa señalada, más de vivir como su padre, comunicándose con algunas provincias llamadas Guaro, Guámay Samo, Pachachulla Viracocha, los ayarmacas de Tambocunca y los quilliscaches.","zh":"辛奇·罗卡死后，略克·尤潘基占据了印加之位，他是辛奇·罗卡和其妻玛玛·科卡的儿子。值得注意的是，曼科·卡帕克虽然规定由长子继位，略克·尤潘基却违背了祖父的规定，因为他另有一个哥哥，如前所说，叫曼科·萨帕卡，他却不让哥哥继承王位；印第安人也没有说明他是否经父亲指定，因此我认为父亲指定的不是他，而是作为长子的曼科·萨帕卡，何况他也不是本地人推举的，也没有得到他们的认可。既然如此，这就是对本地人的暴政和对同胞骨肉的背信，依靠的是那些亲族共同体组成的卫军的支持，凭着他们的支持，他们想干什么就干什么，而且得逞。总之，略克·尤潘基住在因迪坎查；他没有因为打仗离开过库斯科这块地方，也没做过什么值得一提的事，只是像他父亲那样过日子，同一些省份往来，这些省份叫瓦罗、瓦迈·萨莫、帕查丘利亚·维拉科查，还有坦博昆卡的阿亚尔马卡人和基利斯卡切人。","tr":"p"},"s16-2":{"src":"s","ch":16,"pg":"p. 137","es":"Estando un día Lloqui Yupangui en gran tristeza y aflicción, dicen que se le apareció el Sol en figura de persona y le consoló diciéndole: “¡No tengas pena, Lloqui Yupangui, que de ti descenderán grandes señores!”, y que tuviese por cierto que tendría generación de hijo varón. Porque Lloqui Yupangui era muy viejo y no tenía hijo, ni pensaba tenello. Oído lo cual, y publicado por el pueblo lo quel Sol había anunciado a Lloqui Yupangui, determinaron sus parientes buscalle mujer. Mas su hermano Mango Sapaca, entendiendo la complexión del hermano, procurábale mujer conforme a ella; y hallándola en un pueblo nombrado Oma, dos leguas del Cuzco, pidióla a sus deudos, y otorgada, la trajo al Cuzco. Con la cual se casó Lloqui Yupangui. Llamábase esta mujer Mama Caua. En la cual Lloqui Yupangui hubo un hijo llamado Maita Cápac.","zh":"据说有一天，略克·尤潘基正在极度悲伤苦恼之中，太阳化作人形向他显现，安慰他说：“别难过，略克·尤潘基，你的后代中会出伟大的领主！”还叫他确信自己会有一个儿子。因为略克·尤潘基已经很老了，没有儿子，也不指望再有。大家听说了这件事，太阳向略克·尤潘基预言的话也在村里传开了，他的亲属们便决定给他找个妻子。他的哥哥曼科·萨帕卡知道弟弟的体质，就为他物色合适的女子；他在离库斯科两里格、一个叫奥马的村子里找到了一个，向她的亲属求亲，亲属答应以后，便把她带到库斯科。略克·尤潘基就同她结了婚。这个女子叫玛玛·卡瓦。略克·尤潘基同她生了一个儿子，叫迈塔·卡帕克。","tr":"p"},"s16-3":{"src":"s","ch":16,"pg":"pp. 137–138","es":"Este Lloqui no hizo cosa alguna señalada digna de memoria. Éste traía consigo un ídolo, su goáoqui, llamado Apo Maita. El aillo déste se llamó Auaini Panaca Aillo, porquel primero a quien fué encomendado este linaje se llamó así: Auaini. Vivió y murió en Hindicancha. Fué toda su edad ciento y treinta y dos años; sucedió de veinte y un años, fué cápac ciento y once años. Murió en el año de setecientos y ochenta y seis años, siendo rey de España Alfonso el Casto y sumo pontífice León cuarto. Son vivos deste aillo algunos, que viven en el Cuzco. Los principales dellos se llaman Putízoc Tito Aucailli, Tito Rimache, Don Felipe Tito Conde Maita, Don Agustín Conde Maita, Juan Baptista Quispe Conde Maita. Son Hurincuzcos. Halló la figura desde inga el licenciado Polo cuando los demás dichos.","zh":"这个略克没有做过任何值得纪念的事。他随身带着一尊神像，就是他的瓦奥基，叫阿波迈塔。他的亲族共同体叫阿瓦伊尼·帕纳卡·艾柳，因为第一个受托照管这个世系的人名叫阿瓦伊尼。他住在因迪坎查，也死在那里。他一共活了一百三十二岁，二十一岁继位，作卡帕克一百一十一年。他死于七百八十六年，当时西班牙国王是贞洁者阿方索，教宗是利奥四世。这个亲族共同体还有一些人活着，住在库斯科。主要的人叫普蒂索克·提托·奥凯利、提托·里马切、堂费利佩·提托·孔德·迈塔、堂阿古斯丁·孔德·迈塔、胡安·包蒂斯塔·基斯佩·孔德·迈塔。他们是乌林库斯科。波洛硕士在找到上面所说其他几位的同时，找到了这位印加的像。","tr":"p"},"s17-1":{"src":"s","ch":17,"pg":"pp. 138–139","es":"Maita Cápac, cuarto inga, hijo de Lloqui Yupangui y de su mujer Mama Caua, es entre estos indios como entre nosotros Hércules, en su nacimiento y hechos, porque cuentan dél cosas extrañas. Cuanto a lo primero, dicen estos indios de su linaje y todos los demás en general que su padre, cuando lo engendró, era tan viejo y sin virtud natural, que todos le tenían por inútil del todo para generación, y así tuvieron por cosa de maravilla que engendrase. Lo segundo, afirman todos que de a tres meses que su madre se hizo preñada, lo parió, y nació con dientes y rebusto, y que iba creciendo tanto, que de un año tenía tanto cuerpo y fuerzas como otro de ocho y aún más, y que siendo de dos años peleaba con los muchachos muy grandes y los descalabraba y hacía mucho mal. Esto todo parece que se puede contar con las demás fábulas, pero yo scribo lo que los naturales tienen de sí y de sus mayores, y esto tienen por tan verdad, que se mataran con quien otra cosa les dijese.","zh":"第四位印加迈塔·卡帕克，是略克·尤潘基和他的妻子玛玛·卡瓦的儿子；在这些印第安人中间，他就像我们中间的赫拉克勒斯，无论出生还是事迹都是如此，因为他们讲了他许多奇异的事。首先，他这一世系的印第安人以及其他所有人普遍都说，他父亲生他的时候已经老得没有了生育能力，大家都认为他根本不能生育了，所以把他生了儿子看作奇事。其次，大家都肯定，他母亲怀孕三个月就生下了他，他生下来就有牙齿，身体健壮，长得飞快，一岁时的身材力气就像别人八岁甚至更大的孩子，两岁时就同很大的孩子打架，把他们打得头破血流，伤害很重。这一切似乎都可以算作神话，但我写的是本地人所掌握的关于他们自己和他们祖先的事，他们把这些看得千真万确，谁要是对他们说别的，他们会跟他拼命。","tr":"p"},"s17-2":{"src":"s","ch":17,"pg":"p. 139","es":"Dicen deste Maita que, siendo de muy tierna edad, andando jugando con ciertos mozos de los alcabizas y culunchimas, naturales del Cuzco, los lastimaba a muchos dellos y algunos mataba. Y un día, sobre beber o tomar agua de una fuente, quebró la pierna a un hijo del cinchi de los alcabizas y persiguió a los demás, hasta los encerrar en sus casas, adonde los alcabizas vivían sin hacer mal a los ingas.","zh":"据说这个迈塔年纪很小的时候，同库斯科本地人阿尔卡维萨人和库伦奇马人的一些少年一起玩耍，打伤了他们中的许多人，还打死了一些。有一天，为了在一处泉水喝水或取水，他打断了阿尔卡维萨人的军事首领的一个儿子的腿，又追打其余的人，一直把他们赶回家里关起来；阿尔卡维萨人本来住在自己家里，并没有伤害诸印加。","tr":"p"},"s17-3":{"src":"s","ch":17,"pg":"pp. 139–140","es":"Mas los alcabizas, no pudiendo sufrir las travesuras de Maita Cápac, que con favor de Lloqui Yupangui y de los aillos que le guardaban les hacía, determinaron de volver por su libertad y aventurar las vidas por ello. Y así, escogieron diez indios determinados, que fuesen a la Casa del Sol, donde vivían Lloqui Yupangui y Maita Cápac, su hijo, y entraron con determinación de matallos. Y a esta sazón Maita Cápac estaba en el patio de la casa jugando a las bolas con otros muchachos. El cual, como viese entrar sus enemigos con armas en su casa, arrebató una bola de las con que jugaba y con ella dió a uno y lo mató, y luego a otro, y arremetiendo tras los otros, los hizo huir. Y aunque se le escaparon, fué con muchas heridas; y desta manera llegaron a sus cinchis Culunchima y Alcabiza.","zh":"但阿尔卡维萨人忍受不了迈塔·卡帕克仗着略克·尤潘基和护卫他的那些亲族共同体的支持对他们干的胡闹之事，决心夺回自由，为此不惜拼命。于是他们挑选了十个敢死的印第安人，到太阳殿去，略克·尤潘基和他的儿子迈塔·卡帕克就住在那里；他们闯了进去，决心杀死父子二人。这时迈塔·卡帕克正在殿里的院子中同别的孩子玩球。他看见敌人拿着武器闯进他的家，就抓起一个正在玩的球，打中其中一个人，把他打死了，接着又打死一个，然后冲向其余的人，把他们打跑了。那些人虽然逃脱了，却带着许多伤；他们就这样回到了他们的军事首领库伦奇马和阿尔卡维萨那里。","tr":"p"},"s17-4":{"src":"s","ch":17,"pg":"p. 140","es":"Por los cuales considerado el mal que Maita Cápac había hecho a sus naturales, siendo aún niño, temieron que, cuando mayor, los destruiría del todo, y por esto determinaron morir por su libertad. Y así, juntáronse todos los naturales del valle del Cuzco que habían quedado de la destruición de Mango Cápac, para hacer guerra a los ingas. Esto puso a Lloqui Yupangui gran temor, y se tuvo por perdido, y reprehendiendo a su hijo Maita Cápac, le dijo: “¡Hijo! ¿Por qué has sido tan dañador contra los naturales desta tierra? ¿Quieres que al cabo de mi vejez muera yo a manos de nuestros enemigos?” Y como los aillos que en guarnición con él estaban vivían de rapiñas, holgábanse más con bullicios y robos que con quietud, y por esto, respondiendo por Maita Cápac, dijeron a Lloqui Yupangui que callase y dejase hacer a Maita Cápac, su hijo. Y así Lloqui Yupangui no trató más en reprehensiones contra su hijo. Los alcabizas y culunchimas apercibieron su gente, y Maita Cápac ordenó sus aillos. Entre los unos y los otros se dieron batalla, y aunque anduvo rato en peso, sin reconocerse de ninguna de las partes ventaja, al cabo, al fin de haber peleado gran pieza cada bando por verse vencedores, fueron los alcabizas y culunchimas desbaratados por los de Maita Cápac.","zh":"这两人考虑到迈塔·卡帕克还是个孩子就对他们的人作了这么多恶，担心他长大以后会把他们彻底毁灭，于是决心为自由而死。库斯科谷中曼科·卡帕克毁灭之后剩下的本地人全都聚集起来，要同诸印加开战。这使略克·尤潘基大为恐惧，自以为完了；他责备他的儿子迈塔·卡帕克说：“儿啊！你为什么要这样伤害这片土地的本地人？你想让我到了晚年死在我们的敌人手里吗？”护卫他的那些亲族共同体本来就靠劫掠为生，喜欢骚乱和抢劫胜过安宁，于是他们替迈塔·卡帕克说话，叫略克·尤潘基闭嘴，让他的儿子迈塔·卡帕克放手去干。略克·尤潘基也就不再责备他的儿子了。阿尔卡维萨人和库伦奇马人准备好了他们的人马，迈塔·卡帕克也排好了他的亲族共同体。双方交战，相持了一阵，哪一方都看不出占上风；最后，双方各自为了取胜苦战了很久，阿尔卡维萨人和库伦奇马人被迈塔·卡帕克的人打败了。","tr":"p"},"s17-5":{"src":"s","ch":17,"pg":"pp. 140–141","es":"Mas no por esto los alcabizas desmayaron luego, antes con más coraje se tornaron a rehacer, y acometieron a batir por tres partes la Casa del Sol. Maita Cápac, que desto no sabía y estaba ya retirado a su morada, salió a la plaza, adonde trabó una porfiada cuestión con sus enemigos, y en fin los desbarató y venció; y hizo guarachico y armóse caballero.","zh":"但阿尔卡维萨人并没有因此马上泄气，反而更加愤怒地重整旗鼓，从三面攻打太阳殿。迈塔·卡帕克不知道这件事，已经回到自己的住处；他出来到广场上，同敌人展开了一场激战，终于打垮并战胜了他们；他还为自己行了瓦拉奇科，授了骑士身份。","tr":"p"},"s17-6":{"src":"s","ch":17,"pg":"p. 141","es":"Mas no por esto los alcabizas desistieron de su intento, que era librarse y vengarse, antes de nuevo llamaron a batalla a Maita Cápac, el cual la aceptó. Y al tiempo que en ella andaba, dicen que granizó tanto sobre los alcabizas, que fué parte para que fuesen tercera vez vencidos y del todo deshechos los alcabizas. Y a su cinchi metió Maita Cápac en prisión perpetua, hasta que murió.","zh":"但阿尔卡维萨人并没有因此放弃他们的目的，那就是自救和复仇；他们又一次向迈塔·卡帕克挑战，他应战了。据说正在交战的时候，阿尔卡维萨人头上下了一场极大的冰雹，这使阿尔卡维萨人第三次被打败，彻底溃散。迈塔·卡帕克把他们的军事首领终身监禁，直到死去。","tr":"p"},"s17-7":{"src":"s","ch":17,"pg":"p. 141","es":"Casó Maita Cápac con Mama Tacucáray, natural del pueblo de Tacucáray, y en ella hubo un hijo llamado Cápac Yupangui, legítimo, fuera de otros cuatro llamados Tarco Guaman, Apo Conde Maita, Queco Aucailli, Roca Yupangui.","zh":"迈塔·卡帕克娶了塔库卡赖村的玛玛·塔库卡赖为妻，同她生了一个合法的儿子，叫卡帕克·尤潘基；此外还有另外四个儿子，叫塔尔科·瓦曼、阿波·孔德·迈塔、克科·奥凯利、罗卡·尤潘基。","tr":"p"},"s17-8":{"src":"s","ch":17,"pg":"p. 141","es":"Fué este Maita Cápac valiente y el que empezó a valer por armas desde de Mama Guaco y Mango Cápac. Cuentan déste que como el pájaro indi, que Mango Cápac había traído de Tambotoco, lo hubiesen heredado los sucesores suyos, y antecesores deste Maita Cápac, siempre lo [ha]bían tenido cerrado en una petaca o cajón de paja, que no la osaban abrir, tanto era el miedo que le tenían, mas Maita Cápac, como más atrevido que todos, deseoso de ver qué era aquello que tanto guardó sus pasados, abrió la petaca y vido el pájaro indi y habló con él; ca dicen que daba oráculos. Y de aquella confabulación quedó Maita Cápac muy sabio y avisado en lo que había de hacer y de lo que le había de suceder.","zh":"这个迈塔·卡帕克很勇敢，自玛玛·瓦科和曼科·卡帕克以后，是他开始凭武力显赫起来的。据说曼科·卡帕克从坦博托科带来的因迪鸟，由他的继承者、也就是这位迈塔·卡帕克的前几代继承下来，他们一直把它关在一个小草筐或草箱里，不敢打开，就是这样怕它；可是迈塔·卡帕克比谁都大胆，想看看他的先人这样珍藏的是什么东西，便打开筐子，看见了因迪鸟，还同它说了话，因为据说它会发神谕。从那次谈话以后，迈塔·卡帕克变得十分聪明，知道自己该做什么，也知道自己将来会遇到什么事。","tr":"p"},"s17-9":{"src":"s","ch":17,"pg":"pp. 141–142","es":"Y con todo esto no salió del valle del Cuzco, aunque algunas naciones le vinieron a visitar de fuera. Vivió en Indicancha, Casa del Sol. Dejó un linaje llamado Usca Maita Panaca Aillo, y dél hay agora vivos en el Cuzco algunos, las cabezas de los cuales se llaman Don Juan Tambo Usca Maita, Don Baltasar Quizo Maita. Viven en el Cuzco. Son del bando de los Hurincuzcos. Murió Maita Cápac siendo de edad de ciento y doce años; murió en el año de ochocientos y noventa y seis del nacimiento de Nuestro Señor Jesucristo. También halló el cuerpo déste y su ídolo guáoqui el licenciado Polo cuando los demás.","zh":"尽管如此，他也没有离开过库斯科谷，虽然有些族群从外面来拜访过他。他住在因迪坎查太阳殿。他留下一个世系，叫乌斯卡·迈塔·帕纳卡·艾柳，现在库斯科还有其中一些人活着，首领叫堂胡安·坦博·乌斯卡·迈塔和堂巴尔塔萨·基索·迈塔。他们住在库斯科。他们属于乌林库斯科一派。迈塔·卡帕克死时一百一十二岁；他死于我主耶稣基督诞生后八百九十六年。波洛硕士在找到其他几位的同时，也找到了他的遗体和他的瓦奥基神像。","tr":"p"},"s18-1":{"src":"s","ch":18,"pg":"p. 142","es":"Al tiempo que Maita Cápac murió, nombró por su sucesor a Cápac Yupangui, su hijo y de su mujer Mama Ta[c]ucáray. El cual Cápac Yupangui, luego que entró en la sucesión del ingazgo, hizo jurar a sus hermanos que ellos querían que fuese cápac, y así, de temor, porque era soberbio y cruel, lo juraron. Y al principio vivió en gran quietud en Hindicancha. Mas es de notar que aunque Cápac Yupangui sucedió a su padre, no era el mayor de sus hijos, antes lo era Conde Maita, otro hermano suyo, el cual era feo de rostro, y por esto el padre lo desheredó del ingazgo y nombró al Cápac Yupangui por sucesor del ingazgo y a Apo Conde Maita por sumo sacerdote. Y por esta razón Cápac Yupangui, no teniéndose por legítimo señor, aun conforme a su tiranía, hizo jurar a sus hermanos que lo jurasen.","zh":"迈塔·卡帕克临死时，指定他和妻子玛玛·塔库卡赖的儿子卡帕克·尤潘基为继承人。卡帕克·尤潘基一继承印加之位，就让他的兄弟们发誓说愿意让他作卡帕克；他们因为害怕而发了誓，因为他傲慢残忍。起初他在因迪坎查过得很安宁。但值得注意的是，卡帕克·尤潘基虽然继承了父亲，却不是长子；长子是他的另一个兄弟孔德·迈塔，此人相貌丑陋，父亲因此剥夺了他继承印加之位的权利，指定卡帕克·尤潘基为印加之位的继承人，又任命阿波·孔德·迈塔为大祭司。正因如此，卡帕克·尤潘基自知即便按他们那套暴政的规矩，自己也不是合法的领主，所以才让兄弟们向他宣誓效忠。","tr":"p"},"s18-2":{"src":"s","ch":18,"pg":"pp. 142–143","es":"Éste se dice que fué el primero que salió a conquistar fuera del valle del Cuzco, porque subjetó por fuerza los pueblos de Cuyumarca y Ancasmarca, cuatro leguas del Cuzco. Y de temor, un rico indio cinchi, de los ayarmacas, le envió una hija suya presentada, que se llamaba Curihílpay. Otros dicen quésta era natural del Cuzco. La cual recibió por mujer, y en ella hubo un hijo llamado Inga Roca Inga, sin otros cinco hijos que tuvo en diversas mujeres. Llamábanse los hijos, el uno Apo Calla, el segundo Humpiri, el tercero Apo Saca, el cuarto Apo Chimachaui, el quinto Uchuncunascallarando. El Apo Saca tuvo un hijo llamado Apo Maita, muy valiente y famosísimo capitán, que hizo cosas muy señaladas en guerra en tiempo de Inga Roca Inga y de Viracocha Inga, en compañía de Uicaquírao, otro capitán estimado. Y sin éstos, tuvo Cápac Yupangui otro hijo llamado Apo Urco Guaranca. Este Cápac Yupangui vivió ciento y cuatro años; fué cápac ochenta y nueve años, sucedió de quince años, murió año de novecientos y ochenta y cinco años de la natividad de nuestro redentor Jesucristo. El aillo y linaje déste se llamó y agora se llama Apo Maita Panaca Aillo. Son al presente vivos algunos deste linaje, mas los principales cabezas dél son cuatro, nombrados Don Cristóbal Cusigualpa, Don Antonio Pízuy, Don Francisco Cocazaca, Don Alonso Rupaca. Son del bando de los Hurincuzcos; están en el Cuzco y sus arrabales. El cuerpo déste también descubrió el licenciado Polo, y a su ídolo guáoqui, y escondiólo con los demás, por excusar las idolatrías y cerimonias gentílicas suyas.","zh":"据说他是第一个出兵到库斯科谷以外去征服的，因为他用武力征服了离库斯科四里格的库尤马尔卡和安卡斯马尔卡两村。阿亚尔马卡人中一个富有的印第安军事首领出于害怕，把自己的一个女儿献给了他，她名叫库里希尔派。另有人说她是库斯科本地人。卡帕克·尤潘基娶了她，同她生了一个儿子，叫印加·罗卡·印加，此外他还同几个女子生了另外五个儿子。这几个儿子，一个叫阿波·卡利亚，第二个叫温皮里，第三个叫阿波·萨卡，第四个叫阿波·奇马查维，第五个叫乌春库纳斯卡利亚兰多。阿波·萨卡有一个儿子叫阿波迈塔，是一个极其勇敢、极其有名的统领，在印加·罗卡·印加和维拉科查·印加的时代，同另一位受人尊敬的统领维卡基劳一起，在战争中立下了极其卓著的功绩。除了这些人，卡帕克·尤潘基还有一个儿子，叫阿波·乌尔科·瓦兰卡。这位卡帕克·尤潘基活了一百零四岁；作卡帕克八十九年，十五岁继位，死于我们的救主耶稣基督诞生后九百八十五年。他的亲族共同体、即他的世系，过去叫、现在也叫阿波迈塔·帕纳卡·艾柳。这个世系现在还有一些人活着，但主要的首领有四个，名叫堂克里斯托瓦尔·库西瓦尔帕、堂安东尼奥·皮苏伊、堂弗朗西斯科·科卡萨卡、堂阿隆索·鲁帕卡。他们属于乌林库斯科一派；住在库斯科城里和城郊。波洛硕士也发现了他的遗体和他的瓦奥基神像，把它们同其他的一起藏了起来，免得他们再搞偶像崇拜和异教仪式。","tr":"p"},"s19-1":{"src":"s","ch":19,"pg":"p. 144","es":"Muerto Cápac Yupangui, sucedió en su lugar, por su nombramiento y de los aillos custodias, Inga Roca Inga, su hijo y de su mujer Curihílpay. Este Inga Roca, aunque al principio de su ingazgo mostró bríos y valor, porque conquistó con gran violencia y crueldad a los pueblos llamados Muina y Pinaua, cuatro leguas poco más del Cuzco al susueste, y mató a sus cinchis Muina Pongo y Uamantopa, aunque Uamantopa dicen dél que se huyó y nunca más pareció. Lo cual hizo con el favor de Apo Maita, su sobrino y nieto de Cápac Yupangui. Y asimismo conquistó a Caitomarca, cuatro leguas del Cuzco, y descubrió y encañó las aguas de Hurinchacan y las de Hananchacan, ques como decir las “aguas de arriba” y las “aguas de abajo” del Cuzco, con que hasta el día de hoy se riegan las sementeras del Cuzco; y así las tienen y poseen sus hijos y descendientes agora.","zh":"卡帕克·尤潘基死后，由于他的指定和护卫的亲族共同体的拥立，他和妻子库里希尔派的儿子印加·罗卡·印加继承了他的位置。这个印加·罗卡在位之初表现出了勇气和胆量，他以极大的暴力和残忍征服了库斯科东南偏南四里格多、名叫穆伊纳和皮纳瓦的两村，杀了那里的军事首领穆伊纳·蓬戈和瓦曼图帕克，不过据说瓦曼图帕克逃走了，再也没有出现。他是靠他的侄子、卡帕克·尤潘基之孙阿波迈塔的帮助做到这一点的。他还征服了离库斯科四里格的凯托马尔卡，找到并开渠引来了乌林查坎和哈南查坎的水，好比说库斯科的“上面的水”和“下面的水”，直到今天库斯科的庄稼还靠这些水灌溉；现在由他的子孙后代占有、使用这些水。","tr":"p"},"s19-2":{"src":"s","ch":19,"pg":"pp. 144–145","es":"Mas dióse luego a placeres y a banquetes y recogióse a vivir en ocio, y amó tanto a sus hijos, que se olvidaba por ellos del pueblo, y aun de su persona. Éste casó con una principal mujer llamada Mama Mícay, del pueblo de Pataguaillacan, hija del cinchi del dicho pueblo llamado Soma Inga. Por lo cual sucedieron después las guerras de entre Tócay Cápac y los Cuzcos, como luego se dirá. En esta mujer hubo Inga Roca Inga un hijo llamado Tito Cusi Gualpa, y por otro nombre Yáguar Guaca, y demás deste hijo legítimo y mayor tuvo Inga Roca otros cuatro hijos famosos, nombrados el uno Inga Páucar Inga, el segundo Guaman Taisi Inga, el tercero Uicaquírao Inga; éste fué fuerte y gran guerrero y fué compañero en las armas con Apo Maita, los cuales dos capitanes fueron los que a Viracocha Inga y a Inga Yupangui les dieron grandes vitorias y les ganaron muchas provincias y fueron el principio del gran poder que después tuvieron los ingas.","zh":"但他随即沉溺于享乐和宴饮，退居闲逸，而且溺爱他的儿子们，为了他们，把村子乃至自己都忘了。他娶了一个显贵的女子，叫玛玛·米凯，是帕塔瓦伊利亚坎村人，该村军事首领索马·印加的女儿。后来托凯·卡帕克和库斯科人之间的战争就是因此而起的，下面就要讲到。印加·罗卡·印加同这个女子生了一个儿子，叫提托·库西·瓦尔帕，又名亚瓦尔·瓦卡克；除了这个合法的长子，印加·罗卡还有另外四个有名的儿子，一个叫印加·保卡尔·印加，第二个叫瓦曼·泰西·印加，第三个叫维卡基劳·印加；维卡基劳强壮有力，是个了不起的武将，同阿波迈塔是战友，正是这两位统领为维拉科查·印加和印加·尤潘基赢得了大胜，为他们夺取了许多省份，成了诸印加后来强大势力的开端。","tr":"p"},"s19-3":{"src":"s","ch":19,"pg":"p. 145","es":"Y porque lo que sucedió a Inga Roca con los ayarmacas se contará en la vida de su hijo, aquí no diremos más de que este inga, viendo que los ingas sus antesucesores siempre habían vivido en lo bajo del Cuzco, y por esto se llamaban Hurincuzcos, mandó que de allí adelante los que dél viniesen hiciesen otra parcialidad y bando, que se llamasen Hanancuzcos, que quiere decir los Cuzcos de la banda de arriba. Y así, deste inga empezó la banda de los Hanancuzcos, porque luego él y los sucesores suyos dejaron la morada de la Casa del Sol y hicieron casas fuera della, hacia lo alto de la población en que vivieron. Y es de notar que cada inga hacía particular palacio en que vivir, no queriendo vivir el hijo en las casas que había vivido su padre, antes las dejaban en el estado que eran al fallecimiento del padre, con criados, deudos y aillo y sus heredades, para que los tales se sustentasen y los edificios se reparasen. Y los ingas y aillos deste Inga Roca eran y agora son Hanancuzcos, aunque después, en tiempo de Pachacuti, fueron estos aillos reformados, y por esto dicen algunos que entonces fueron hechos estos dos bandos tan celebrados en estas partes.","zh":"印加·罗卡与阿亚尔马卡人之间发生的事，将在他儿子的传记里讲述，这里只说一点：这位印加看到他以前的诸印加一直住在库斯科的低处，因此被称为乌林库斯科，便下令从此以后他的后代另立一部一派，称为哈南库斯科，意思是上半边的库斯科人。于是，哈南库斯科一派就从这位印加开始，因为他本人和他的后继者随即离开了太阳殿的住所，在殿外、朝着他们所住的这个聚落的高处另建房屋。值得注意的是，每一个印加都各建一座宫殿居住，儿子不愿住在父亲住过的房子里，而是把它们保持在父亲去世时的样子，连同仆役、亲属、亲族共同体以及他的田产，好让这些人有所供养，让房屋得到修缮。这位印加·罗卡的印加子孙和亲族共同体过去是、现在也是哈南库斯科；不过后来到帕查库蒂的时代，这些亲族共同体经过了改组，因此有人说，在这些地方如此有名的这两派是那时才形成的。","tr":"p"},"s19-4":{"src":"s","ch":19,"pg":"pp. 145–146","es":"Nombró Inga Roca Inga por cabeza de su linaje a su hijo Uicaquírao, y así se llamó y agora también se llama su parcialidad Uicaquírao Panaca Aillo. Deste linaje hay en el Cuzco algunos que viven hoy, los principales de los cuales, que los amparan y conservan este aillo, son los siguientes: Don Francisco Guaman Rimache Hachacoma, Don Antonio Guama Maita. Son Hanancuzcos. Vivió ciento y veinte y tres años; sucedió de veinte años, fué cápac ciento y tres años, murió el año de mil y ochenta y ocho años del nacimiento del Señor. El cuerpo déste halló el licenciado Polo en un pueblo llamado Rarapa, con mucha autoridad y veneración, según sus ritos.","zh":"印加·罗卡·印加指定他的儿子维卡基劳为他的世系之首，所以他的一部过去叫、现在也叫维卡基劳·帕纳卡·艾柳。这个世系今天在库斯科还有一些人活着，照管并维系这个亲族共同体的主要人物如下：堂弗朗西斯科·瓦曼·里马切·阿查科马、堂安东尼奥·瓦马·迈塔。他们是哈南库斯科。印加·罗卡活了一百二十三岁；二十岁继位，作卡帕克一百零三年，死于我主诞生后一千零八十八年。波洛硕士在一个叫拉拉帕的村子里找到了他的遗体，按照他们的礼仪，受到极大的尊重和敬奉。","tr":"p"},"s20-1":{"src":"s","ch":20,"pg":"pp. 146–148","es":"Tito Cusi Gualpa Inga, hijo mayor de Inga Roca Inga y de Mama Mícay, su mujer, hobo en su niñez extraña suerte, por lo cual cuentan estos naturales su vida desde su infancia, y a vueltas della se cuentan algunas cosas de su padre y de otros forasteros de Cuzco, desta manera. Ya es dicho cómo Inga Roca Inga casó, en sus ritos, con Mama Mícay; pues es de saber que los del pueblo de Guaillacan habían prometido de dar a Mama Mícay, que su natural y muy hermosa era, por mujer a Tócay Cápac, cinchi de los ayarmacas, indios vecinos de su comarca. Y como los ayarmacas vieron que les habían quebrado la palabra, agraviáronse dello y declaráronse por sus enemigos, haciéndoles guerras. Y los de Guail[l]acan, por el contrario, defendiéndose y ofendiendo a los ayarmacas, hacíanse de ambas partes crueldades, muertos y robos a grandísimo daño de los unos y de los otros. Y mientras estas cosas pasaban entre estos dos pueblos, parió Mama Mícay a Tito Cusi Gualpa. Y después de su nacimiento aún duraron las guerras algunos años, y considerando éstos y aquéllos que se iban consumiendo, acordaron de venir a medios para evitar más daños. Y los ayarmacas, que superiores les eran, entonces pidieron a los de Guaillacan que les entregasen en sus manos al niño Tito Cusi Gualpa, para hacer dél a su voluntad, y quellos dejarían las armas, y, si no lo hacían, prometían de no desistir de su propósito, que era darles mortal guerra hasta los acabar del todo. Los de Guaillacan, por este temor, y sintiéndose inferiores para resistir, aceptaron el partido, aunque eran tíos y deudos del niño, y para poner en efeto el concierto, ordenaron de engañar a Inga Roca Inga, por esta orden. Estaba en el pueblo de Paulo un hermano de Inga Roca y tío de Tito Cusi Gualpa, el cual se llamaba Inga Páucar. Éste fué o envió sus mensajeros a rogar a Inga Roca tuviese por bien de le enviar a su sobrino Tito Cusi Gualpa a su pueblo de Paulo, porque, mientras era niño, le querría regalar y dalle a conocer sus deudos de parte de su madre y sus heredades, y le querrían hacer su heredero, en vida, de sus haciendas. Confiado destas palabras, Inga Roca Inga les concedió que llevasen su hijo a Paulo o al pueblo de Micaocancha. Y luego que tuvieron en su pueblo los guaillacanes al niño, hicieron grandes fiestas a Tito Cusi Gualpa, que de ocho años era entonces, poco más o menos, en guarda del cual su padre había enviado del Cuzco algunos ingas. Y acabadas las fiestas, acordaron los guaillacanes de avisar a los ayarmacas que, mientras ellos estuviesen ocupados en arar ciertas tierras, o como ello dicen chácaras, viniesen sobre el pueblo y se llevasen el muchacho a su tierra y hic[ies]en dél a su voluntad, como tenían concertado. Los ayarmacas avisados, bajaron al tiempo y lugar sabido, y hallando el pueblo solo hurtaron al niño Tito Cusi Gualpa.","zh":"提托·库西·瓦尔帕·印加是印加·罗卡·印加和其妻玛玛·米凯的长子，幼年遭遇奇特，因此这些本地人从他的幼年讲起他的生平，同时也讲到他父亲和库斯科以外的一些外乡人的事，经过如下。上文已经说过，印加·罗卡·印加按他们的礼俗娶了玛玛·米凯；要知道，瓦伊利亚坎村的人原先已经答应把玛玛·米凯——她是他们村的人，长得非常美——嫁给他们那一带的邻人、阿亚尔马卡人的军事首领托凯·卡帕克。阿亚尔马卡人见他们背弃了诺言，深感受辱，便宣布与他们为敌，向他们开战。瓦伊利亚坎人则一面自卫，一面攻击阿亚尔马卡人，双方互相残杀、劫掠，造成极大的伤亡，彼此都损失惨重。正当这两个村子之间发生这些事的时候，玛玛·米凯生下了提托·库西·瓦尔帕。他出生后战争又持续了好几年，双方都觉得自己日渐消耗，便商定讲和，以免更多损失。阿亚尔马卡人占着上风，这时便要求瓦伊利亚坎人把孩子提托·库西·瓦尔帕交到他们手里，任由他们处置，他们就放下武器；否则，他们发誓决不罢休，就是要同他们打一场你死我活的仗，直到把他们彻底消灭。瓦伊利亚坎人出于这种恐惧，又自觉力量不足以抵抗，虽然他们是孩子的舅舅和亲属，还是接受了这个条件；为了履行约定，他们定下计策欺骗印加·罗卡·印加，办法如下。在保罗村有印加·罗卡的一个兄弟，也就是提托·库西·瓦尔帕的叔父，名叫印加·保卡尔。这个人亲自去、或者派他的信使去请求印加·罗卡，希望他把侄子提托·库西·瓦尔帕送到他的保罗村来，说是趁孩子还小，想疼爱他，让他认识母亲一方的亲属和他们的田产，还想在生前就让他做自己产业的继承人。印加·罗卡·印加相信了这番话，答应他们把儿子带到保罗村或米考坎查村去。瓦伊利亚坎人一把孩子弄到自己村里，就为提托·库西·瓦尔帕大摆宴庆，那时他约八岁；他父亲从库斯科派了一些印加去护卫他。宴庆结束以后，瓦伊利亚坎人商定通知阿亚尔马卡人：趁他们忙着耕种某些土地——他们叫作chácaras——的时候，前来袭击村子，把孩子带回他们的地方，按约定任意处置。阿亚尔马卡人得到通知，在约定的时间和地点下山来，发现村里空无一人，就把孩子提托·库西·瓦尔帕偷走了。","tr":"p"},"s20-2":{"src":"s","ch":20,"pg":"p. 148","es":"Otros dicen questa traición fué desta manera: que como el tío del muchacho le regalase y diese muchas cosas, sus primos, hijos de Inga Páucar, tuvieron invidia, y por esto trataron con Tócay Cápac que se le entregarían en las manos, y que por este aviso vino Tócay Cápac, y saliendo Inga Páucar a entregar a su sobrino Tito Cusi Gualpa cierta heredad y un hato de ganado, fué por el dicho avisado Tócay Cápac, enemigo de Inga Roca, y dió en los que llevaban el mochacho. El que lo llevaba huyó, y el niño fué preso y llevado por Tócay Cápac.","zh":"另有人说，这次背叛是这样发生的：孩子的叔父疼爱他，给了他许多东西，他的堂兄弟们、也就是印加·保卡尔的儿子们嫉妒起来，因此同托凯·卡帕克商定把他交到他手里；托凯·卡帕克得了这个消息就来了；印加·保卡尔出去，要把一块田产和一群牲畜交给侄子提托·库西·瓦尔帕，这时，得到通知的托凯·卡帕克——印加·罗卡的敌人——袭击了护送孩子的人。护送孩子的人逃走了，孩子被托凯·卡帕克捉住带走了。","tr":"p"},"s21-1":{"src":"s","ch":21,"pg":"pp. 148–149","es":"Como los ayarmacas y su cinchi Tócay Cápac hurtaron al hijo de Inga Roca, marcharon con él. Y los guaillacanes de Paulopampa, tomando por su cinchi a Inga Páucar, fueron con sus armas tras ellos y alcanzáronlos en el pueblo Amaro, casa de los ayarmacas. Y entre los unos y los otros hubo recuentro, los unos por cobrar el niño, los otros por defender la presa. Y como los de Paulo, según dicen, no peleaban más de por demostración, para tener alguna disculpa con Inga Roca, en fin los ayarmacas vencieron y los guaillacanes se tornaron corridos y descalabrados. Y dicen que en este recuentro, y cuando hurtaron el mochacho, murieron todos los orejones que habían venido en su guarda del Cuzco. Y los ayarmacas llevaron el niño hurtado al pueblo cabecera de su provincia, llamado Aguairocancha.","zh":"阿亚尔马卡人和他们的军事首领托凯·卡帕克偷走了印加·罗卡的儿子以后，带着他上了路。保罗潘帕的瓦伊利亚坎人推举印加·保卡尔为他们的军事首领，带着武器在后面追赶，在阿亚尔马卡人的地方阿马罗村追上了他们。双方交了手，一方要夺回孩子，一方要守住猎物。据说保罗村的人打仗只是做做样子，好在印加·罗卡面前有个交代，所以最后阿亚尔马卡人赢了，瓦伊利亚坎人头破血流、羞愧而归。据说在这次交手中，以及孩子被偷走的时候，从库斯科来护卫他的大耳贵族全都死了。阿亚尔马卡人把偷来的孩子带到他们省的首邑，名叫阿瓦伊罗坎查。","tr":"p"},"s21-2":{"src":"s","ch":21,"pg":"pp. 149–150","es":"Dicen muchos que en este hurto no se halló Tócay Cápac, sino quél envió a los ayarmacas, los cuales, luego que llegaron al pueblo Aguairocancha, le presentaron el niño Tito Cusi Gualpa, diciendo: “¡Ves aquí, Tócay Cápac, la presa que te traemos!”. Y el cinchi dello recibió gran contento, y preguntando a voces altas si era aquél el hijo de Mama Mícay, la que había de ser su mujer, Tito Cusi Gualpa, aunque niño, respondió con atrevimiento quél era el hijo de Mama Mícay, su madre, y de Inga Roca Inga, su padre. Tócay, indignado, acabadas de oír estas palabras, mandó a los que lo traían preso que lo llevasen a matar. El mochacho, que tal sentencia oyó dar sobre sí, recibió tanta pesadumbre y coraje, que empezando a llorar de miedo de la muerte, reventó por los ojos lágrimas de sangre, y con una indignación más que de la edad que era, a manera de maldición dijo contra Tócay y ayarmacas: “¡Dígoos cierto que si vosotros me matáredes, que vendrá tal maldición sobre vosotros y vuestros descendientes, que os acabéis todos, sin quedar memoria de vuestra nación!”. Y como considerasen los ayarmacas y Tócay atentamente estas maldiciones del niño y juntamente las lágrimas de sangre, dijeron que aquello debía ser gran mister[i]o, pues un niño tan tierno decía tan pesadas palabras, y había hecho tal impresión en él el miedo que llorase sangre; quedaron suspensos adevinándole que había de ser aquél gran hombre, y revocaron la sentencia de muerte y llamáronle Yáguar Guaca, que quiere decir “lloro de sangre”, por lo que le había sucedido. Mas aunque por entonces no le quisieron matar por sus manos, ordenaron que le diesen tal vida quél se viniese a morir de hambre. Mas antes desto le dijeron todos juntos al niño que volviese el rostro al Cuzco y llorase sobre él, para que sobre los moradores del Cuzco se convirtiesen aquellas maldiciones que les había echado; y así lo hizo.","zh":"许多人说托凯·卡帕克并没有参加这次偷窃，而是他派了阿亚尔马卡人去；他们一到阿瓦伊罗坎查村，就把孩子提托·库西·瓦尔帕献给他，说：“托凯·卡帕克，看哪，这是我们给你带来的猎物！”这位军事首领大为高兴，高声问这是不是那个本该做他妻子的玛玛·米凯的儿子；提托·库西·瓦尔帕虽然还是个孩子，却大胆地回答说，他是他母亲玛玛·米凯和他父亲印加·罗卡·印加的儿子。托凯听完这话大怒，命令押他来的人把他带去杀掉。孩子听到对自己下了这样的判决，又悲痛又愤怒，因为怕死哭了起来，从眼中迸出了血泪，并以超出他年龄的愤慨，像诅咒一样对托凯和阿亚尔马卡人说：“我明白告诉你们，如果你们杀了我，就会有一个诅咒降到你们和你们的子孙身上，让你们统统灭绝，你们这一族连一点痕迹都不留！”阿亚尔马卡人和托凯仔细想了想孩子的这些诅咒，又想到那血泪，便说这一定是一个大奥秘，因为这样幼小的孩子竟说出这样沉重的话，恐惧在他身上留下的印象竟使他哭出血来；他们惊疑不定，猜想他将来会成为一个大人物，便撤销了死刑判决，因为他遇到的这件事，给他取名为亚瓦尔·瓦卡克，意思是“血泪”。但他们那时虽然不愿亲手杀他，却下令让他过那样一种日子，好让他自己饿死。在这之前，他们一齐叫孩子转过脸朝着库斯科哭，好让他向他们发出的那些诅咒转落到库斯科的居民头上；孩子就照做了。","tr":"p"},"s21-3":{"src":"s","ch":21,"pg":"p. 150","es":"Hecho lo cual, lo entregaron a los más valientes indios que allí había, y les mandaron llevarlo a ciertas estancias de ganados suyos, que allí lo tuviesen en guarda, dándole la comida muy tasada, de manera que se fuese consumiendo de hambre, hasta que se muriese, adonde estuvo un año, sin salir de allí, y así no se sabía en el Cuzco, ni en otras partes fuera de allí, si era muerto o vivo. En este tiempo Inga Roca, como no sabía certidumbre de su hijo, no quiso hacer guerra a los ayarmacas, porque, si era vivo, no se le matasen, y así no hizo más de apercebir su gente de guerra y estarse quedo, inquiriendo por todas las vías posibles de su hijo.","zh":"这样做了以后，他们把他交给那里最勇敢的几个印第安人，命令他们把他带到他们的一些牧场去，在那里看守他，给他极少的食物，让他一点一点饿死；他在那里待了一年，一步也没有出来，所以无论在库斯科还是在那里以外的其他地方，都没有人知道他是死是活。这期间，印加·罗卡因为不确知儿子的下落，不愿同阿亚尔马卡人开战，怕儿子如果还活着会被他们杀掉，所以只是把他的军队准备好，按兵不动，千方百计打听儿子的消息。","tr":"p"},"s22-1":{"src":"s","ch":22,"pg":"p. 151","es":"Como el mozo Yáguar Guaca hobiese un año questaba entre los pastores sin salir de aquellos hatos que por término de cárcel tenía, nadie sabía dél, porquél no salía de allí y era muy guardado de los pastores y otras guardas. Y aconteció que en aquel pueblo estaba una mujer llamada Chimbo Orma, natural del pueblo de Anta, tres leguas del Cuzco. Ésta era manceba del cinchi Tócay Cápac, y por esta causa tenía licencia de andar y entrar en todas las partes que quisiese. Y ésta, entrando una vez adonde estaba Yáguar Guaca, vióle y admiróse de verle, que lindo y agraciado mozo era. Lo cual le dió ocasión que le preguntase por su padre y vida; y el mozo le dió cuenta de todo lo que le preguntó y de su suceso y prisión y hambre. Y como la mujer entendió cúyo hijo era, movida de compasión lo consoló, diciéndole quella procuraría pasar por allí muchas veces y quél procurase de continuar aquel paso, para encontrarse con ella, y así le trairía siempre algún mantenimiento con que se sustentase. Y ella demás desto propuso de lo librar.","zh":"少年亚瓦尔·瓦卡克在牧人中间待了一年，一直没有离开那些当作牢狱的畜群牧场，谁也不知道他的消息，因为他从不出来，又被牧人和其他看守严加看管。碰巧那个村子里有一个女子，名叫钦博·奥尔玛，是离库斯科三里格的安塔村人。她是军事首领托凯·卡帕克的姘妇，因此可以随意走动，想进哪里就进哪里。有一次她走进亚瓦尔·瓦卡克待的地方，看见了他，见他是个英俊可爱的少年，大为惊异。她因此问起他的父亲和他的身世；少年把她问的一切，以及自己的遭遇、被囚和挨饿的情形都告诉了她。这个女子知道了他是谁的儿子，动了恻隐之心，安慰他，说她会设法常从这里经过，叫他也设法常到这条路上来同她见面，这样她就能经常给他带点吃的维持生命。此外她还打定主意要救他出去。","tr":"p"},"s22-2":{"src":"s","ch":22,"pg":"pp. 151–153","es":"Y desta manera le sustentó algún tiempo con mucho recato, por que no la viesen las guardas. Y habiendo la mujer ya consigo trazado el modo como libertar a Yáguar G[u]aca, se lo dijo; y él se lo agradeció y rogó que lo hiciese. Ella, que hija era de un cinchi de Anta, dió parte a su padre y hermanos y otros deudos del caso, y persuadióles que lo librasen. Y ellos vinieron en ello para cierto día, y con la orden que la Chimbo Orma dió, libraron su padre y parientes a Yágua[r] Guaca, poniéndose detrás de un cerro, cierto día que Yáguar Guaca para este efeto había ordenado un juego con los otros niños, de ir corriendo a quien más presto subiese un cerro. Arriba al cual como Yáguar Guaca llegase, los de Anta, que allí estaban escondidos y le tomaron en los brazos, empezaron a caminar a priesa a su pueblo de Anta. Y como los mochachos le viesen así llevar, dieron dello aviso a los hombres valientes que l[e] guardaban, y éstos siguieron tras los de Antas. Y alcanzándolos en la laguna de Guaipon, allí trabaron una batalla muy reñida, y al cabo los ayarmacas llevaron lo peor, porque fueron casi todos heridos y muertos. Y los de Anta prosiguieron su camino hasta su pueblo, adonde hicieron muchos regalos y servicios al mozo Yáguar Guaca, que habían librado de la prisión mortal en que Tócay Cápac lo tenía. En este pueblo de Anta lo tuvieron un año, sirviéndole con gran amor y regalo tan secreto, que su padre Inga Roca no supo en todo este tiempo del mozo libertado. Al cabo, en fin deste tiempo, concertaron de inviar los de Anta sus mensajeros a Inga Roca a le rogar le[s] mostrase su hijo primogénito que le había de suceder, porque lo querían conocer y servir. Fueron los mensajeros a Inga Roca, y expuesta su embajada, les fué respondido que dél no sabía parte más de que los ayarmacas le habían hurtado. Y como se lo preguntasen otra y otra vez, Inga Roca se levantó de su trono y instancia interrogó a los mensajeros le dijesen algo de su hijo, que no sin causa le preguntaban tantas veces por él. Y los mensajeros, viéndose interrogar tan hincadamente de Inga Roca, le dijeron lo que pasaba, y cómo su hijo estaba libre en Anta, servido y regalado de su cinchi, que lo había librado. Y el Inga Roca se lo agradeció, y prometió mercedes y les despidió, quedando muy obligado a su pueblo y cinche. Hizo por esto muchas fiestas y regocijóse mucho Inga Roca Inga.","zh":"她就这样小心翼翼地接济了他一段时间，不让看守看见。这个女子心里想好了解救亚瓦尔·瓦卡克的办法以后，就告诉了他；他向她道谢，请她去做。她是安塔一个军事首领的女儿，便把这件事告诉了她的父亲、兄弟和其他亲属，劝他们去救他。他们答应了，约定了日子；她的父亲和亲属们按照钦博·奥尔玛的安排，埋伏在一座山后，救出了亚瓦尔·瓦卡克：那一天，亚瓦尔·瓦卡克为此同别的孩子约好玩一个游戏，比赛谁最先跑上一座山。亚瓦尔·瓦卡克一跑到山上，藏在那里的安塔人就把他抱起来，急忙向他们的安塔村赶去。孩子们看见他被人这样带走，就去报告看守他的那些勇士，他们便在后面追赶安塔人。他们在瓦伊蓬湖追上了，在那里打了一场十分激烈的仗，最后阿亚尔马卡人吃了亏，因为他们几乎全都伤亡了。安塔人继续赶路，回到他们的村子，对少年亚瓦尔·瓦卡克百般疼爱、殷勤侍奉，是他们把他从托凯·卡帕克关押他的死牢中救了出来。安塔人把他在这个村子里留了一年，以极大的爱心和厚待侍奉他，而且极其隐秘，以致他父亲印加·罗卡在这整段时间里都不知道少年已被救出。这段时间结束时，安塔人商定派信使去见印加·罗卡，请他把要继承他的长子给他们看看，因为他们想认识他、侍奉他。信使到了印加·罗卡那里，说明来意，得到的回答是：他对儿子的情况一无所知，只知道阿亚尔马卡人把他偷走了。信使一再询问，印加·罗卡便从他的宝座上站起来，恳切地追问信使，要他们告诉他一些儿子的消息，因为他们这样一再问起他，决非无缘无故。信使们见印加·罗卡追问得这样紧，就把经过告诉了他，说他的儿子已经获救，在安塔，受着那里的军事首领的侍奉和厚待，是那位首领救了他。印加·罗卡向他们道谢，许诺给予赏赐，打发他们回去，觉得自己大大受惠于他们的村子和军事首领。印加·罗卡·印加为此举行了许多庆典，非常高兴。","tr":"p"},"s22-3":{"src":"s","ch":22,"pg":"p. 153","es":"Y no teniendo del todo por cierto lo que aquéllos antes le habían dicho, envió tras ellos un pobre, que, en son de pedir limosna, inquiriese en el pueblo de Anta si aquello era verdad. Fué el pobre, y supo ser cierto libertado su hijo, y tornó con la nueva a Inga Roca; y por ello hicieron nuevas alegrías en el Cuzco. Y luego Inga Roca envió muchos principales del Cuzco con presentes de oro, plata y ropa a los de Anta, rogándoles lo recibiesen y le enviasen su hijo. Los de Anta respondieron quellos no habían menester sus presentes, que se los tornasen, ca más estimaban tener a Yáguar Guaca consigo y servirle, y a su padre también, porque tenían mucho amor al mozo; y que si el Inga Roca quería a su hijo, había de ser con condición que los orejones del Cuzco de allí adelante los habían de llamar parientes, y otros. Sabido esto por Inga Roca, fué al pueblo de Anta y concedió a los de Anta y su cinche lo que pedían; y desde entonces se llaman los Antas parientes de los Cuzcos, por esta causa.","zh":"他对他们先前所说的话还不完全相信，便在他们之后派了一个穷人去，以乞讨为名，在安塔村查问那是不是真的。穷人去了，得知他的儿子确实已被救出，就带着这个消息回到印加·罗卡那里；库斯科为此又欢庆了一番。印加·罗卡随即派了许多库斯科的头人，带着金、银和衣物作礼物，去见安塔人，请他们收下礼物，把他的儿子送回来。安塔人回答说，他们不需要他的礼物，请他拿回去，因为他们更看重的是让亚瓦尔·瓦卡克留在身边侍奉他，也侍奉他的父亲，因为他们非常爱这个少年；如果印加·罗卡要他的儿子，就得有一个条件：从今以后，库斯科的大耳贵族要称他们为亲属，还有别的一些条件。印加·罗卡得知以后，亲自去了安塔村，答应了安塔人和他们的军事首领的要求；从那时起，安塔人就因为这个缘故被称为库斯科人的亲属。","tr":"p"},"s22-4":{"src":"s","ch":22,"pg":"pp. 153–154","es":"Inga Roca trajo su hijo Yáguar Guaca Inga Yupangui al Cuzco, y luego nombró por sucesor del ingazgo [a] Yáguar Guaca, y los orejones y aillos lo recibieron por tal en custodia. Y dende a dos años murió Inga Roca, y quedó sólo Yáguar Guaca Inga Yupangui, que antes había sido nombrado Tito Cusi Gualpa. Y antes que Inga Roca muriese, hizo amistades con Tócay Cápac por medio de Mama Chiquia, hija de Tócay Cápac, que casó con Yáguar Guaca, y Inga Roca dió otra su hija, llamada Curi Occlo, por mujer a Tócay Cápac.","zh":"印加·罗卡把他的儿子亚瓦尔·瓦卡克·印加·尤潘基带回库斯科，随即指定亚瓦尔·瓦卡克为印加之位的继承人，大耳贵族和各亲族共同体接受他为继承人，护卫着他。两年后印加·罗卡去世，只剩下亚瓦尔·瓦卡克·印加·尤潘基，他先前名叫提托·库西·瓦尔帕。印加·罗卡死前，通过托凯·卡帕克的女儿玛玛·奇基亚同托凯·卡帕克结好，她嫁给了亚瓦尔·瓦卡克；印加·罗卡又把他自己的另一个女儿，名叫库里·奥克略，嫁给托凯·卡帕克为妻。","tr":"p"},"s23-1":{"src":"s","ch":23,"pg":"p. 154","es":"Como Yáguar Guaca se vido libre y que mandaba solo, acordándose de la traición que con él habían usado los guaillacanes en lo vender y entregar a sus enemigos los ayarmacas, propuso de hacer en ellos ejemplar castigo. Y como los guaillacanes lo entendieron, humilláronse ante Yáguar Guaca [y] pidiéronle perdón de su maldad que contra él habían cometido. Yáguar Guaca, tiniendo consideración a queran sus deudos, los perdonó. Y luego hizo gente contra Mohina y Pinagua, cuatro leguas del Cuzco, y nombró por su capitán general a Uicaquírao, su hermano, el cual conquistó los dichos pueblos. Hizo en ellos grandes crueldades, no por más ocasión de porque no le venían a obedecerle de su voluntad. Ya en este tiempo sería como de veinte y tres años. Después de haber descansado en el Cuzco algunos años, fué por fuerza de armas a subjetar y conquistar al pueblo de Mollaca, cerca del Cuzco.","zh":"亚瓦尔·瓦卡克见自己已经自由，又独自掌权，想起瓦伊利亚坎人出卖他、把他交给他的敌人阿亚尔马卡人的背叛之举，便打算对他们施以惩戒，以儆效尤。瓦伊利亚坎人知道了，便在亚瓦尔·瓦卡克面前低头认罪，请求他宽恕他们对他犯下的罪行。亚瓦尔·瓦卡克念及他们是自己的亲属，宽恕了他们。随后他召集人马攻打离库斯科四里格的穆伊纳和皮纳瓦，任命他的兄弟维卡基劳为总统领；维卡基劳征服了这两个村子。他对那里的人极其残暴，没有别的缘故，只因为他们不主动来归顺他。那时他大约二十三岁。他在库斯科休整了几年以后，又用武力去征服离库斯科不远的莫利亚卡村。","tr":"p"},"s23-3":{"src":"s","ch":23,"pg":"p. 155","es":"Y de aquí fué a conquistar a Pillauya, tres leguas del Cuzco, en el valle de Písac, y luego al pueblo de Choica, en aquella cercanía, y el pueblo de Yuco. Y después desto oprimió por fuerza y con crueldades a los del pueblo de Chillíncay y Taocamarca y los cabiñas, y los hizo dar tributo. De manera queste Inga Yáguar Guaca conquistó diez pueblos por sí y por sus hijos y capitanes, aunque algunos atribuyeron las conquistas déste a su hijo Viracocha Inga.","zh":"他从这里去征服离库斯科三里格、在皮萨克谷的皮利亚乌亚，接着征服附近的乔伊卡村和尤科村。此后他又用武力、以残暴手段压服了奇林凯村和陶卡马尔卡村的人以及卡比尼亚人，迫使他们纳贡。这样，这位印加亚瓦尔·瓦卡克亲自以及通过他的儿子们和统领们征服了十个村子，不过也有人把他的征服归于他的儿子维拉科查·印加。","tr":"p"},"s23-4":{"src":"s","ch":23,"pg":"pp. 155–156","es":"Éste fué gentil hombre y de muy hermoso rostro. Vivió ciento y quince años; sucedió a su padre de diez y nueve años, fué cápac noventa y seis años, murió en el año de la Natividad del Señor. Dejó su aillo, llamado Aucailli Panaca, del cual viven algunos hoy en el Cuzco, y los que son más principales, que los sustentan, son Don Juan Concha Yupangui, Don Martín Tito Yupangui, Don Gonzalo Páucar Aucailli. Son Hanancuzcos. Este cuerpo no se ha descubierto; créese que lo tienen los del pueblo Paulo, con su ídolo guáoqui.","zh":"他是个仪表堂堂的人，容貌十分俊美。他活了一百一十五岁；十九岁继承父位，作卡帕克九十六年，死于主诞生后……年（抄本缺年份）。他留下了他的亲族共同体，叫奥凯利·帕纳卡，今天库斯科还有其中一些人活着，维系这一系的最主要的人是堂胡安·孔查·尤潘基、堂马丁·提托·尤潘基、堂贡萨洛·保卡尔·奥凯利。他们是哈南库斯科。他的遗体没有被发现；人们相信是保罗村的人连同他的瓦奥基神像一起藏着。","tr":"p"},"s24-1":{"src":"s","ch":24,"pg":"pp. 156–157","es":"Como los guaillacanes, según es dicho, mataron a Páhuac Gualpa Maita, que había de suceder a su padre Yáguar Guaca, fué nombrado para la sucesión Viracocha Inga, llamado cuando niño Hatun Topa Inga, hijo menor de los legítimos de Yáguar Guaca y de Mam
