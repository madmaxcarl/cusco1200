a Chicya. Éste fué casado con Mama Rondocaya, natural del pueblo de Anta. A este Hatun Topa Inga, estando una vez en Urcos, pueblo questá poco más de cinco leguas del Cuzco al susueste, adonde estaba la suntuosa guaca del Ticci Viracocha, le pareció de noche el Viracocha. Y por la mañana juntando sus orejones, y entrellos a un Gualpa Rimache, su gobernador, le dijo cómo aquella noche le había aparecido el Viracocha y le había anunciado grandes buenas venturas a él y a sus descendientes. Por lo cual gratulándole Gualpa Rimache, le saludó llamándole: “¡Oh Viracocha Inga!”. Y seguiendo los demás, celebraron este nombre Viracocha; y con él se quedó todo el tiempo de su vida. Y otros dicen que tomó este nombre porque, cuando le armaron caballero y le abrieron las orejas, tomó por padrino de su caballería a Ticci Viracocha. Sea como quiera que haya sido, que es todo, es cierto que cuando niño, antes que sucediese a su padre, fué nombrado Hatun Topa Inga, y después por lo restante de la vida se llamó Viracocha Inga.","zh":"如上所说，瓦伊利亚坎人杀了本该继承他父亲亚瓦尔·瓦卡克的帕瓦克·瓦尔帕·迈塔，于是被指定为继承人的是维拉科查·印加，他幼时名叫哈通·图帕克·印加，是亚瓦尔·瓦卡克和玛玛·奇基亚所生合法儿子中最小的一个。他娶了安塔村的玛玛·龙多卡亚。有一次，这位哈通·图帕克·印加在乌尔科斯——一个在库斯科东南偏南五里格多的村子，那里有蒂西维拉科查的华丽圣地——夜里维拉科查向他显现。早晨他召集他的大耳贵族，其中有一个叫瓦尔帕·里马切的，是他的总管，他告诉他们那天夜里维拉科查向他显现，向他和他的子孙预示了极大的好运。瓦尔帕·里马切因此向他道贺，向他致敬，称他为：“啊，维拉科查·印加！”其余的人也跟着这样叫，颂扬维拉科查这个名字；他一生都保留了这个名字。又有人说，他取这个名字，是因为人们为他授骑士身份、给他穿耳的时候，他请蒂西维拉科查做他授骑士身份的教父。不管是怎么回事——反正就是这些——可以肯定的是：他小时候、在继承父亲之前，名叫哈通·图帕克·印加，后来的余生则叫维拉科查·印加。","tr":"p"},"s24-2":{"src":"s","ch":24,"pg":"pp. 157–158","es":"Luego quel Viracocha le apareció en Urcos, vino al Cuzco, y concebió en sí de empezar a conquistar y tiranizar los alderredores del Cuzco. Porque es de saber que, aunque su padre y abuelo habían conquistado y robado los pueblos que son dichos, como no atendían a más que robar y derramar sangre, no ponían guarniciones en los pueblos que subjetaban, y así, en viendo la suya, o por muerte del inga que los había vencido, luego tornaban a procurar su libertad, y para ello tomaban las armas y se alzaban. Y así, ésta es la causa que decimos muchas veces que un pueblo fué subjetado por diferentes ingas, como de Mohina y Pinagua, que, aunque fueron desterrados y subjetados por Inga Roca, también los oprimió Yáguar Guaca, y consiguiente, Viracocha y su hijo Inga Yupangui. Y era tanto lo que cada pueblo pugnaba por su libertad con sus cinchis, y sin ellos, quéste procuraba subjetar a aquél y el otro al otro, especialmente en el tiempo de los ingas, que aun dentro del mesmo Cuzco los de un arrabal, llamado Carmenga, traían guerra con los de otro arrabal, llamado Cayocache. Y así se ha de entender, que, puesto que los siete ingas predecesores de Viracocha Inga, aunque por el poder que tenían de los aillos tenían temorizados a los del Cuzco y algunos de los muy cercanos del Cuzco, no les duraba más el servirlos de cuanto les tenían la lanza encima, porque al momento que podían se acogían a las armas, apellidando libertad; la cual, aunque con gran riesgo y muertes, sustentaron, aun los de dentro del Cuzco, hasta el tiempo del Viracocha Inga.","zh":"维拉科查在乌尔科斯向他显现以后，他回到库斯科，心里打算开始征服和压迫库斯科周围的地方。因为要知道，他的父亲和祖父虽然征服并劫掠过上面说到的那些村子，但他们一心只顾抢劫和流血，在所征服的村子里不设驻军，所以那些村子一见有机会，或者一到打败他们的那个印加死了，就又设法夺回自由，为此拿起武器起来反抗。所以我们常说某个村子被不同的印加征服过，原因就在这里，比如穆伊纳和皮纳瓦，虽然被印加·罗卡流放、征服过，亚瓦尔·瓦卡克也压服过他们，接着维拉科查和他的儿子印加·尤潘基又压服过他们。每个村子都同自己的军事首领一起、或者没有军事首领也一样，拼命争取自由，这个想征服那个，那个又想征服另一个，尤其是在诸印加的时代，甚至就在库斯科城里，一个叫卡尔门加的城郊的人同另一个叫卡亚乌卡奇的城郊的人打仗。所以应当明白：维拉科查·印加之前的七个印加，虽然凭借各亲族共同体的力量，使库斯科城里的人和库斯科附近的一些人害怕他们，但这些人服侍他们，只是在他们拿长矛顶着自己的时候；一有机会，他们就拿起武器，呼喊着要自由。他们冒着极大的危险、付出许多人命，一直维持着这种自由，甚至库斯科城里的人也是如此，直到维拉科查·印加的时代。","tr":"p"},"s24-3":{"src":"s","ch":24,"pg":"p. 158","es":"El cual, propuniendo de subjetar todo lo que pudiese por fuerza y crueldades, eligió por sus capitanes a dos valientes indios orejones, llamados el uno Apo Maita y el otro Uicaquírao, de linaje de Inga Roca Inga. Con los cuales, que crueles e impíos eran, empezó a subjetar ante todas cosas los moradores del Cuzco que no eran orejones ingas, haciendo en ellos grandes muertes y crueldades. Y en este tiempo ya muchos pueblos y provincias andaban revueltos en armas, los de los alderredores del Cuzco para defenderse de los orejones ingas del Cuzco, que los habían puestos a seguir la guerra para tiranizarlos, y otros para procurar lo mesmo que los ingas, que era subjetarlos a ellos, si las fuerzas les bastasen. Y así, elig[i]endo unos cinchis, andaban en una confusión y behetría de tal arte, que, disminuyéndose unos a otros, vinieron a quedar cada pueblezuelo particular pobre de gente y sin ayuda de otros. La cual ocasión siendo conocido por Viracocha Inga, le dió ánimo a emprender el principio de la tiranía fuera del Cuzco.","zh":"他打算用武力和残暴征服一切能征服的地方，便挑选了两个勇猛的大耳贵族印第安人做他的统领，一个叫阿波迈塔，另一个叫维卡基劳，都是印加·罗卡·印加一系的人。这两人残忍不仁，维拉科查同他们一道，首先征服库斯科城里那些不是大耳贵族印加的居民，对他们大肆杀戮，极其残暴。这时已经有许多村子和省份陷入战乱：库斯科周围的人要抵御库斯科的大耳贵族印加，这些印加逼着他们一直打下去，要压迫他们；另一些人则想干诸印加想干的同样的事，即在力量足够时征服他们。于是，他们各自推举一些军事首领，陷入那样一种混乱和无主状态，互相削弱，以至于每个小村子都人丁稀少，得不到别人的援助。维拉科查·印加看准了这个时机，便有了胆量，开始在库斯科以外施行暴政。","tr":"p"},"s24-4":{"src":"s","ch":24,"pg":"pp. 158–159","es":"Y antes de venir a tratar de los pueblos que sujetó Viracocha Inga, digamos los hijos que tuvo. De Mama Rondocaya, su mujer legítima, tuvo cuatro hijos varones: el primero y mayor Inga Roca Inga, el segundo Topa Yupangui, el tercero Inga Yupangui, el cuarto Cápac Yupangui. Y en otra india hermosa, llamada Curi Chulpa, de nación Ayauilla, del valle del Cuzco, hubo dos hijos varones: el uno llamado Inga Urcon y el otro Inga Zoczo, aunque los descendientes de Inga Urcon dicen que era legítimo, mas todos los demás dicen que fué bastardo.","zh":"在讲维拉科查·印加征服了哪些村子之前，先说说他有哪些儿子。他的正妻玛玛·龙多卡亚给他生了四个儿子：长子印加·罗卡·印加，次子图帕克·尤潘基，第三个印加·尤潘基，第四个卡帕克·尤潘基。他又同另一个美貌的印第安女子，名叫库里·丘尔帕，是库斯科谷的阿亚维利亚族人，生了两个儿子：一个叫印加·乌尔科，另一个叫印加·索克索；不过印加·乌尔科的后代说他是合法的，但其余所有的人都说他是私生子。","tr":"p"},"s25-1":{"src":"s","ch":25,"pg":"p. 159","es":"Como Viracocha hobiese nombrado por sus capitanes [a] Apo Maita y Uicaquíra[o] y hecho reseña de su gente, mandólos que saliesen a conquistar fuera del sitio del Cuzco. Y así fueron al pueblo de Pacaicacha, en el valle de Písac, tres leguas y media del Cuzco. Y porque luego no le vinieron a obedecer, asoló el pueblo, matando a los moradores y a su cinche, llamado Acamaqui. Y luego fué sobre los pueblos de Mohina y Pinagua, Casacancha y Rondocancha, cinco leguas pequeñas del Cuzco, que ya se habían puesto en libertad, aunque Yáguar Guaca los había destruído. Y los asoló, y mató a los más de los naturales y a sus cinches, que también en este tiempo se llamaban Muina Pongo y Guaman Topa. Hízoseles esta guerra y crueldades porque decían que eran libres y no le habían de servir ni ser sus vasallos.","zh":"维拉科查任命阿波迈塔和维卡基劳为他的统领，检阅了他的人马以后，就命令他们到库斯科这块地方以外去征服。于是他们来到离库斯科三里格半、在皮萨克谷的帕凯卡查村。因为那里的人没有马上来归顺他，他就把村子夷为平地，杀了居民和他们名叫阿卡马基的军事首领。接着他又攻打离库斯科五小里格的穆伊纳、皮纳瓦、卡萨坎查和龙多坎查几个村子，这些村子虽然被亚瓦尔·瓦卡克毁灭过，这时已经重获自由。他把这些村子夷为平地，杀了大部分本地人和他们的军事首领，这时他们的首领也叫穆伊纳·蓬戈和瓦曼图帕克。对他们发动这场战争、施加这些残暴，是因为他们说自己是自由的，不愿服侍他，也不愿做他的臣属。","tr":"p"},"s25-2":{"src":"s","ch":25,"pg":"pp. 159–160","es":"En este tiempo ya Inga Roca, su hijo mayor, era hombre y daba muestras de hombre brioso. Y por esto Inga Viracocha le hizo su capitán general y le dió por compañeros [a] Apo Maita y Uicaquíra[o], los cuales traían consigo a Inga Yupangui, del cual asimesmo se tenía buena esperanza, por el valor que mostraba en su florida adolescencia. Y así, con estos capitanes prosiguió su conquista y destruyó al pueblo Guaiparmarca y a los ayarmacas, y mató a su cinche, llamado Tócay Cápac, y a Chíguay Cápac, que tenían sus asientos cerca del Cuzco. Y sujetaron al pueblo de Mollaca, y arruinaron al pueblo Caito, cuatro leguas del Cuzco, y mataron a su cinche, llamado Cápac Chani. Asolaron a los pueblos llamados Socma y Chiraques, y mataron a sus cinches, llamados Poma Lloque e Illacumbe, que eran cinches belicosísimos en aquel tiempo y que resistían valerosísimamente a los ingas pasados, para que no saliesen del Cuzco a saltear. Conquistó asimesmo a Calca y a Caquea Xaquixaguana, tres leguas del Cuzco, y al pueblo de Collocte y Cámal. Subjetó los pueblos que hay desde el Cuzco hasta Quiquixana, y sus alderredores, y los papres, y otros pueblos en su contorno, todos en siete y ocho leguas a lo más a la redonda del Cuzco. En las cuales conquistas hizo grandísimas crueldades, robos, muertes, destruiciones de pueblos, quemándolos y asolándolos por los caminos, sin dejar memoria de algunos dellos.","zh":"这时，他的长子印加·罗卡已经成人，显出勇猛的样子。因此印加·维拉科查任命他为总统领，让阿波迈塔和维卡基劳做他的同伴；他们还带着印加·尤潘基，人们对他也寄予厚望，因为他在青春年少时就显出了勇气。于是，印加·维拉科查同这些统领继续他的征服，毁灭了瓦伊帕尔马尔卡村和阿亚尔马卡人，杀了他们的军事首领托凯·卡帕克和奇瓦伊·卡帕克，这两人的居地都在库斯科附近。他们征服了莫利亚卡村，摧毁了离库斯科四里格的凯托村，杀了那里名叫卡帕克·查尼的军事首领。他们把叫索克马和奇拉克斯的村子夷为平地，杀了那里名叫波马·略克和伊利亚昆贝的军事首领，这两人是当时极其好战的军事首领，曾经极其英勇地抵抗以前的诸印加，不让他们出库斯科来劫掠。他又征服了离库斯科三里格的卡尔卡和卡基亚·哈基哈瓦纳，以及科约克特村和卡马尔村。他征服了从库斯科到基基哈纳一路上的村子及其周围，还有帕普雷斯人和他们周围的其他村子，都在库斯科周围最多七八里格以内。他在这些征服中干下了极其残暴的事，抢劫、杀戮、毁灭村庄，一路上焚烧、夷平村子，有些村子连一点痕迹都没有留下。","tr":"p"},"s25-3":{"src":"s","ch":25,"pg":"pp. 160–161","es":"Y como ya fuese muy viejo, nombró por sucesor del ingazgo a Inga Urco[n], su hijo bastardo, porque quiso mucho a su madre, sin guardar la regla de su orden en el suceder. Y este Inga Urco[n] era valiente y soberbio y despreciador de los demás, por lo cual vino a caer en indignación de la gente de guerra, especialmente de los hijos legítimos, y de Inga Roca, que era el mayor, y de los valientes capitanes Apo Maita y Uicaquírao. Los cuales por esto dieron orden cómo éste no sucediese al ingazgo, sino quellos elig[i]esen a uno de los otros hermanos, el más bien acondicionado, y que los tratase y honrase bien, como ellos merecían. Y así, pusieron secretamente los ojos en el tercero de los legítimos, llamado Cusi, que después fué llamado Inga Yupangui, porque entendían dél que era llano y afable, y daba fuera desto muestras de ánimo y de altos pensamientos. Y esto procuraba el Apo Maita con más calor que los demás, por tener quien le favoreciese contra la furia del inga Viracocha, a quien Apo Maita temía que le matase, porque él, Apo Maita, había tenido acceso con una mujer llamada Cacchon Chicya, mujer de Inga Viracocha. Era que Apo Maita había tratado a su intención y a la devoción de Cusi a Uicaquírao, su compañero, y andando procurando cómo lo entablarían, sucedió que los chancas de Andaguaillas, treinta leguas del Cuzco, vinieron sobre el Cuzco, como en la vida del Inga Yupangui se dirá. Por temor de los cuales, Inga Viracocha se huyó del Cuzco y se fué a un pueblo llamado Caquia Xaquixaguana, adonde se encerró por miedo de los chancas, y allí, al cabo de algunos años, murió desheredado de la ciudad del Cuzco, porque su hijo Cusi la poseyó mucho tiempo en vida del padre. Así que Viracocha Inga fué el que hasta él más conquistó fuera del Cuzco, y que podemos decir que tiranizó de nuevo aun el propio Cuzco, como arriba es dicho.","zh":"他年纪已经很老了，便指定他的私生子印加·乌尔科为印加之位的继承人，因为他非常宠爱印加·乌尔科的母亲，没有遵守他们的继承规矩。这个印加·乌尔科勇猛而傲慢，看不起别人，因此招致军人们的愤恨，尤其是那些合法的儿子，以及其中最年长的印加·罗卡，还有勇猛的统领阿波迈塔和维卡基劳。他们因此设法不让他继承印加之位，而由他们从其他兄弟中挑选一个性情最好、能善待他们、按他们应得的那样尊重他们的人。于是他们暗中看中了合法儿子中的第三个，名叫库西，就是后来称为印加·尤潘基的那一位，因为他们知道他为人坦率和蔼，此外还显出勇气和远大志向。阿波迈塔对此比别人更热心，因为他想找一个人保护自己免遭印加·维拉科查的怒火；阿波迈塔怕印加·维拉科查杀他，因为他，阿波迈塔，曾同印加·维拉科查的一个妻子、名叫卡乔恩·奇基亚的女子私通。原来阿波迈塔已经按自己的心意说动了他的同伴维卡基劳，让他也倾心于库西；正当他们设法安排这件事的时候，发生了一件事：离库斯科三十里格的安达瓦伊拉斯的昌卡人来进攻库斯科，这将在印加·尤潘基的传记里讲述。印加·维拉科查因为害怕他们，逃出库斯科，到一个叫卡基亚·哈基哈瓦纳的村子去，因为害怕昌卡人而躲在那里；若干年后他死在那里，失去了库斯科城的继承权，因为他的儿子库西在他父亲在世时就长期占有了这座城。所以，维拉科查·印加是到他为止在库斯科以外征服最多的人，我们可以说，他甚至对库斯科本城也重新施行了暴政，如上所说。","tr":"p"},"s25-4":{"src":"s","ch":25,"pg":"p. 161","es":"Éste vivió ciento y diez y nueve años, sucedió de diez y ocho años, fué cápac ciento y un año, murió en el año de ... del nacimiento del Señor. Nombró al aillo que dejó para conservación de su linaje Zoczo Panaca Aillo, del cual hay agora algunos vivos en el Cuzco, cuyas cabezas principales son éstos: Amaro Tito, Don Francisco Chalco Yupangui, Don Francisco Andi Gualpa. Son Hanancuzcos.","zh":"他活了一百一十九岁，十八岁继位，作卡帕克一百零一年，死于主诞生后……年（抄本缺年份）。他为保存自己的世系留下的亲族共同体，取名为索克索·帕纳卡·艾柳，现在库斯科还有其中一些人活着，主要的首领是这几位：阿马罗·提托、堂弗朗西斯科·查尔科·尤潘基、堂弗朗西斯科·安迪·瓦尔帕。他们是哈南库斯科。","tr":"p"},"s25-5":{"src":"s","ch":25,"pg":"pp. 161–162","es":"Este inga fué industrioso y inventor de ropas y labores polidas, a que llaman en su lengua Uiracochatocapo, ques como entre nosotros el brocado. Fué rico, porque robó mucho, y hizo vasijas de oro y plata. Y éste fué sepultado en Caquia Xaquixaguana; y Gonzalo Pizarro, teniendo noticia que con él había tesoro, lo buscó, y sacó el cuerpo, [y] con él mucha suma de tesoro, y quemó el cuerpo; y las cenizas tornaron a quitar los naturales y las escondieron en una tinajuela, la cual con su ídolo guáoqui, llamado Inga Amaro, descubrió el licenciado Polo siendo corregidor del Cuzco.","zh":"这位印加心灵手巧，发明了衣料和精美的织纹，他们的语言称之为Uiracochatocapo，好比我们这里的锦缎。他很富有，因为他抢了很多东西，还制作了金银器皿。他葬在卡基亚·哈基哈瓦纳；贡萨洛·皮萨罗得知他的墓里有财宝，便去搜寻，挖出了遗体，连同一大笔财宝，还把遗体烧了；本地人又把骨灰拿了回来，藏在一个小坛子里；波洛硕士任库斯科市政长官时，发现了这个小坛子和他那尊叫印加·阿马罗的瓦奥基神像。","tr":"p"},"s26-1":{"src":"s","ch":26,"pg":"p. 162","es":"Dicho es en la vida de Inga Viracocha cómo tuvo cuatro hijos legítimos, de los cuales el tercero se llamó Cusi, y por sobrenombre Inga Yupangui Inga, al cual procuraron Apo Maita y Uicaquírao, capitanes famosos, y los demás hijos del Viracocha legítimos, alzar por inga contra la voluntad del padre, por sus fines, y que, andando para ponello en efeto, les dió el tiempo ocasión, la cual ellos no pudieron con la venida de los chancas sobre el Cuzco, lo cual sucedió desta manera.","zh":"在印加·维拉科查的传记里已经说过，他有四个合法的儿子，其中第三个叫库西，别号印加·尤潘基·印加；著名的统领阿波迈塔和维卡基劳，以及维拉科查的其他合法儿子，出于自己的目的，想违背父亲的意愿拥立他为印加；他们正设法实现这件事的时候，时势给了他们机会，那就是昌卡人来进攻库斯科——这是他们自己办不到的。事情经过如下。","tr":"p"},"s26-2":{"src":"s","ch":26,"pg":"pp. 162–163","es":"Treinta leguas del Cuzco al poniente es una provincia llamada Andaguail[l]as, cuyos naturales se llaman chancas. En esta provincia hobo dos cinches ladrones y crueles tiranos, llamados Uscobilca y Ancouilca, que, viniendo robando con ciertas compañas de ladrones desde los términos de Guamanga, habían venido asentar al valle de Andaguaillas y allí habían hecho dos parcialidades. Uscouilca, que era el mayor y más principal, ca hermanos eran, instituyó la una y llamóla Hananchancas, ques decir “los chancas de arriba”, y Ancouilca hizo la otra parcialidad y nombróla Hurinchanca, que suena “los chancas de abajo”. Éstos, después que murieron, los embalsamaron, y porque eran en la vida temidos por sus crueldades, hicieron, los que de sus compañas quedaron, la estatua de Uscouilca, y traíanla consigo en las guerras y robando. Por lo cual, aunque llevaban consigo otros cinches, siempre se atribuían los hechos a la estatua de Uscouilca, por sobrenombre llamado Ancoallo.","zh":"离库斯科以西三十里格，有一个省叫安达瓦伊拉斯，那里的本地人叫昌卡人。这个省出过两个军事首领，都是强盗和残忍的暴君，名叫乌斯科维尔卡和安科维尔卡；他们带着几帮强盗，从瓦曼加境内一路抢劫而来，在安达瓦伊拉斯谷定居下来，在那里分成两部。乌斯科维尔卡年长、地位也最高——两人是兄弟——他建立了其中一部，取名哈南昌卡，意思是“上面的昌卡人”；安科维尔卡建立了另一部，取名乌林昌卡，意思是“下面的昌卡人”。两人死后，被制成了干尸；又因为他们生前以残暴令人畏惧，他们部众中留下来的人便造了乌斯科维尔卡的像，打仗、抢劫时都带着它。因此，虽然他们还带着别的军事首领，所做的事却总是归功于乌斯科维尔卡的像，乌斯科维尔卡的别号叫安科亚略。","tr":"p"},"s26-3":{"src":"s","ch":26,"pg":"p. 163","es":"Y las gentes y compañas que de Uscouilca restaban, en el tiempo del ingazgo de Inga Viracocha habían multiplicado numerosísimamente, y, pareciéndoles que eran tan poderosos que en la tierra nadie les podía igualar, determinaron de salir de Andaguail[l]as a robar y conquistar el Cuzco. Y para lo hacer, eligieron dos cinches, llamados el uno Astoiguaraca y el otro Tomaiguaraca, el uno de la parcialidad de Hananchanca y el otro de Hurinchanca, para que los caudillasen en su empresa y jornada. Eran estos chancas y cinches soberbios e insolentes, y partiendo de Andaguaillas marcharon la vuelta del Cuzco y asentaron en un sitio llamado Ichopampa, cinco leguas del Cuzco al poniente, adonde estuvieron algunos días, atemorizando la comarca y dando orden para entrar en el Cuzco.","zh":"乌斯科维尔卡留下的人众部伍，到印加·维拉科查执掌印加之位的时候，已经繁衍得极其众多，他们自以为强大到天下无人能敌，便决定离开安达瓦伊拉斯，去劫掠、征服库斯科。为此他们推举了两个军事首领，一个叫阿斯托伊瓦拉卡，另一个叫托迈瓦拉卡，一个出自哈南昌卡一部，另一个出自乌林昌卡一部，让他们率领这次远征。这些昌卡人和他们的军事首领骄横无礼，从安达瓦伊拉斯出发，朝着库斯科进军，在离库斯科以西五里格、一个叫伊乔潘帕的地方扎营，在那里待了几天，威吓周围一带，并部署进入库斯科。","tr":"p"},"s26-4":{"src":"s","ch":26,"pg":"pp. 164–165","es":"Lo cual, como lo publicasen, puso tanto terror en los orejones cuzcos, que hicieron dudar al inga Viracocha, que dentro estaba e ya era muy viejo y cansado. Y no teniendo por segura la estancia del Cuzco, llamó Inga Viracocha a consejo sus hijos y capitanes, de los cuales Apo Maita y Uicaquírao le dijeron: “¡Inga Viracocha! Entendido habemos lo que ante nosotros has propuesto sobre el acuerdo que debes tomar en esta cuyuntura. Y después de bien mirado, nos parece que como tú seas tan viejo y quebrantado de los muchos trabajos que has padecido en las guerras pasadas, no es bien que agora tomes un trabajo tan grande, peligroso y dudoso de vitoria, como el que al presente delante los ojos se te ofrece, sino quel más sano consejo que para tu seguridad puedes tomar es que, pues no hay otro remedio más breve, dejes, señor, el Cuzco y te vayas al pueblo de Chita y de allí a Caquia Xaquixaguana, que es fuerte sitio, desde donde podrás tratar de medios con los chancas”. Lo cual dicen que éstos consejaron al Inga Viracocha por echallo del Cuzco y tener ocasión buena, sin estorbo, de poner en efeto su designo, que era alzar por inga a Cusi Inga Yupangui. De cualquiera manera que haya sido esto, es cierto quel consejo fué aceptado por Inga Viracocha, y se determinó de partir del Cuzco para Chita, como se lo habían dado por parecer. Y como Cusi Inga Yupangui vido su padre determinado de dejar el Cuzco, dicen que le dijo: “¿Cómo, padre, ha cabido en vuestro corazón aceptar un consejo tan infame de dejar el Cuzco, cidad del Sol y del Viracocha, cuyo nombre vos tomastes, cuya promesa vos tenéis que seréis gran señor, vos y vuestros descendientes?”. Y esto dijo, aunque mozo, con ánimo osado de hombre de mucha honra. Y que le respondió el padre que era mozo, y como tal hablaba aquellas razones i[n]consideradas y que se fuesen de allí estas palabras. Replicó Inga Yupangui que se fuese él adonde tenía acordado, quél no pensaba salir del Cuzco ni desamparar la ciudad del Sol. Todo lo cual dicen que debió ser tramado por los dichos capitanes de Inga Viracocha, Apo Maita y Uicaquírao, por desvelar a los que de la quedada del Inga Yupangui podían concebir sospecho. Así, quel Viracocha salió del Cuzco y se fué a Chita, llevando consigo a Inga Urcon y a Inga Zoczo, sus dos hijos bastardos, quedándose en el Cuzco su hijo Inga Yupangui con ánimo de morir o defender el Cuzco; y con él quedaron siete, que fueron: Inga Roca, su hermano legítimo y mayor, Apo Maita, Uicaquírao, Quillisca[che] Urco Guaranca, Chima Chaui Pata Yupangui, Viracocha Inga Páucar y Mircoimana, ayo de Inga Yupangui.","zh":"他们把这个消息张扬开来，使库斯科的大耳贵族大为恐惧，连城里的印加维拉科查也拿不定主意了，他已经年老力衰。印加·维拉科查觉得留在库斯科不安全，便召集他的儿子们和统领们商议，其中阿波迈塔和维卡基劳对他说：“印加·维拉科查！你当着我们提出在这个关头应当作何决定，我们已经明白了。仔细考虑以后，我们认为，你年纪这样大，又被以往历次战争的劳苦拖垮了，现在不宜去担当眼前摆在你面前的这样一桩艰巨、危险、胜负难料的事；为了你的安全，你能采取的最稳妥的办法——既然没有更快的补救办法——就是，主上，离开库斯科，到奇塔村去，再从那里到卡基亚·哈基哈瓦纳，那是个险要的地方，你可以在那里同昌卡人谈判。”据说他们这样劝印加·维拉科查，是为了把他赶出库斯科，好得到一个不受阻挠的好机会，来实现他们的图谋，也就是拥立库西·印加·尤潘基为印加。不管实情如何，可以肯定的是，印加·维拉科查接受了这个建议，决定照他们的意见离开库斯科去奇塔。库西·印加·尤潘基见父亲决意离开库斯科，据说对他说：“父亲，您心里怎么能接受这样一个可耻的主意，离开库斯科这座太阳和维拉科查之城呢？您取的就是维拉科查的名字，他还向您许诺过，您和您的子孙都将成为伟大的领主！”他说这话时虽然年轻，却有一个极重荣誉的人那样的胆气。据说父亲回答他：他年轻，所以才说出这些欠考虑的话，叫他住口。印加·尤潘基回答说，父亲尽可以去他已经决定去的地方，他自己却不打算离开库斯科，也不打算抛弃这座太阳之城。据说这一切大概都是上面说的印加·维拉科查的统领阿波迈塔和维卡基劳策划的，为的是让那些可能对印加·尤潘基留下来起疑心的人放下戒心。于是，维拉科查离开库斯科去了奇塔，带着他的两个私生子印加·乌尔科和印加·索克索；他的儿子印加·尤潘基留在库斯科，抱着不死就守住库斯科的决心；同他一起留下的有七个人，他们是：他的合法的兄长印加·罗卡、阿波迈塔、维卡基劳、基利斯·卡切·乌尔科·瓦兰加、奇马·查维·帕塔·尤潘基、维拉科查·印加·保卡尔，以及印加·尤潘基的师傅米尔科伊马纳。","tr":"p"},"s27-1":{"src":"s","ch":27,"pg":"pp. 164–166","es":"A la sazón quel Inga Viracocha dejaba el Cuzco, Astoiguaraca y Tomaiguaraca partieron de Ichopampa, haciendo primero sus sacrificios y soplando los livianos de un animal, a quellos llaman calpa. La cual no entendieron bien, por lo que después les sucedió. Y viniendo la vuelta del Cuzco, llegaron a un pueblo llamado Conchacalla, adonde prendieron a un indio, del cual supieron lo que en el Cuzco había, y éste se ofreció de llevallos al Cuzco secretamente; y así, los llevó hasta la mitad del camino. Mas el indio guiya, considerando la maldad que hacía, se les huyó y fué a dar aviso al Cuzco de cómo venían los chancas determinados. Y la nueva deste indio, que era Quilliscache del Cuzco, hizo apresurar su partida o huída a Viracocha a Chita, adonde los chancas le enviaron sus mensajeros a le requerir se les rindiese, amenazándole con la guerra si no venía en ello. Otros dicen que no fueron como mensajeros, sino disfrezados, por exploradores; y que siendo conescidos del Viracocha Inga, les dijo que ya los conocía que eran espías de los chancas; que no los quería matar; que se fuesen y dijesen a los suyos que si algo le querían, allí estaba. Y así se fueron, y al saltar de una acequia cayeron y murieron algunos dellos. De que a los chancas pesó mucho y dijeron que aquello había mandado hacer Inga Viracocha y fueron muertos por Quequo Maita, capitán del Viracocha Inga.","zh":"就在印加·维拉科查离开库斯科的时候，阿斯托伊瓦拉卡和托迈瓦拉卡从伊乔潘帕出发；出发前他们先举行献祭，向一头牲畜的肺吹气，他们称之为calpa。他们没有读懂这次占卜，从后来他们的遭遇可以看出这一点。他们朝着库斯科进发，来到一个叫孔查卡利亚的村子，在那里抓到一个印第安人，从他那里得知了库斯科的情况，这个人还自告奋勇，要偷偷领他们去库斯科；他就这样领着他们走了一半路。可是这个带路的印第安人想到自己干的是坏事，便从他们那里逃走，去库斯科报信，说昌卡人决意打来了。这个印第安人是库斯科的基利斯卡切人，他带来的消息使维拉科查加快了动身、或者说逃往奇塔；昌卡人派了信使到奇塔去见他，要求他向他们投降，威胁说他若不答应就开战。另有人说，他们不是作为信使去的，而是乔装成探子去的；维拉科查·印加认出了他们，对他们说，他早知道他们是昌卡人的奸细；他不想杀他们；叫他们回去告诉自己人，他们若想找他，他就在这里。他们于是走了，在跳过一条水渠时，有几个人跌下去死了。昌卡人为此十分恼怒，说这是印加·维拉科查叫人干的，说他们是被维拉科查·印加的统领克科·迈塔杀死的。","tr":"p"},"s27-2":{"src":"s","ch":27,"pg":"pp. 166–167","es":"Mientras esto pasaba con los mensajeros de los chancas y los chancas se venían acercando al Cuzco, Inga Yupangui hacía grandes ayunos al Viracocha y al Sol, rogándoles mirasen por su cidad. Y estando un día en Susurpuquio en gran aflicción, pensando el modo que tendría para contra sus enemigos, le apareció en el aire una persona como Sol, consolándole y animándole a la batalla. Y le mostró un espejo, en que le señaló las provincias que había de subjetar; y quél había de ser el mayor de todos sus pasados; y que no dudase, tornase al pueblo, porque vencería a los chancas que venían sobre el Cuzco. Con estas palabras y visión se animó Inga Yupangui, y tomando el espejo, que después siempre trajo consigo en las guerras y en la paz, se volvió al pueblo y empezó a animar los que allí habían quedado y a algunos que iban veniendo de fuera, que estaban a la mira y no se osaban declarar por ninguna de las partes, temiendo la furia del vencedor si cayesen en la parte vencida. Mas Inga Yupangui, aunque mozo de veinte o veinte y dos años, proveía en todo, como quien pensaba pelear por la vida.","zh":"正当昌卡人的信使发生这些事、昌卡人日益逼近库斯科的时候，印加·尤潘基向维拉科查和太阳大举斋戒，祈求他们照看他的城。有一天，他在苏苏尔普基奥，正万分苦恼，思索用什么办法对付敌人，空中出现了一个像太阳一样的人，安慰他，鼓励他去作战。那人给他看一面镜子，在镜子里向他指出他将要征服的省份；说他将成为他所有先人中最伟大的一个；叫他不要犹豫，回到村里去，因为他将战胜来进攻库斯科的昌卡人。印加·尤潘基受到这番话和这个异象的鼓舞，拿起那面镜子——此后无论战时平时他都一直带着它——回到村里，开始鼓舞留在那里的人，以及一些陆续从外面来的人；这些人在旁观望，不敢表明站在哪一边，怕万一站到败的一方，会遭到胜利者的怒火。但印加·尤潘基虽然只是一个二十或二十二岁的青年，却事事安排妥当，像一个为性命而战的人。","tr":"p"},"s27-3":{"src":"s","ch":27,"pg":"p. 167","es":"Y mientras Inga Yupangui entendía en esto, los chancas habían caminado y llegado a un asiento llamado Cusibamba, muy cerca del Cuzco, que en medio deste sitio y del Cuzco no hay más que sólo una loma, no muy grande. Y en este sitio sí tornó a encontrar el Quilliscache, diciendo quél había ido a espiar y que se holgaba que fuesen. Andaba este prevaricador de unos en otros, por tenellos a todos graciosos para consigo, para aprovecharse del favor de cualquiera que venciese. Y moviendo de aquí los chancas para entrar en el Cuzco de rendón, pensando de no hallar defensa, el Quilliscache, doliéndole la perdición de la patria, descabullóse de entre los chancas y fué al Cuzco, que cerca era, y dió arma diciendo: “¡Arma, arma, Inga Yupangui, que los chancas viene[n] furiosos!”","zh":"正当印加·尤潘基忙着这些事的时候，昌卡人已经行进到离库斯科很近、一个叫库西班巴的地方，这里同库斯科之间只隔着一道不大的山梁。那个基利斯卡切人在这里又找上了他们，说他是去打探消息的，很高兴他们来了。这个两面三刀的人在两边之间来回走动，想讨好所有的人，好借胜利者——不管是谁——的恩宠得利。昌卡人从这里出发，想径直闯入库斯科，以为不会遇到抵抗；那个基利斯卡切人却为故土即将沦丧而痛心，从昌卡人中间溜了出来，跑到近在咫尺的库斯科，发出警报说：“警报，警报，印加·尤潘基，昌卡人凶猛地杀过来了！”","tr":"p"},"s27-4":{"src":"s","ch":27,"pg":"pp. 167–169","es":"A las cuales voces Inga Yupangui, que no estaba descuidado, acudió, y ordenando sus gentes, halló muy pocos que quisiesen salir con él a resitir los enemigos, ca todos de temor se iban por los cerros a estar a la mira. Mas con los que le quisieron seguir, que pocos eran, y principalmente con los siete cinches hermanos y capitanes arriba nombrados, hizo un escuadroncillo y a paso tirado salió del pueblo del Cuzco a recebir a los enemigos que furiosos y sin orden venían. Así se fueron acercando los unos a los otros, los chancas acometiendo la cidad por cuatro partes. E Inga Yupangui envió el socorro que le fué posible a todas ellas, y él con sus amigos enderezó hacia donde venía la estatua y estandarte de Uscouilca, y con ella Astoiguaraca y Tomaiguaraca. Y entrellos se mezcló una sangrienta batalla, los unos por entrar la cidad y los otros por les defender la entrada. Y los que entraron por un barrio del Cuzco llamado Chocoscachona fueron valerosamente rebatidos por los de aquel barrio, adonde cuentan que una mujer llamada Chañan Curicoca peleó varonilmente, y tanto hizo por las manos contra los chancas que por allí habían acometido, que los hizo retirar. Lo cual fué causa que todos los que lo vieron desmayaron. E Inga Yupangui fué tan presto y diestro en el acometer, que, turbados con su presteza y destreza los que traían la estatua de Uscouilca y porque vieron bajar de los cerros de los lados mucha suma de gente, la cual dicen que enviaba el Viracocha su criador para su ayuda, empezaron a huir los chancas, dejando la estatua de Uscouilca, y aun dicen que la de Ancouilca. Y acometiendo por otras dos partes Inga Roca y Apo Maita y Uicaquírao, hicieron mucho estrago de los chancas. Los cuales, viendo que su salvación estaba en los pies, volv[i]eron las espaldas con más presteza que la furia que los había traído al Cuzco. Siguieron el alcance los cuzcos, matando y hiriendo más de dos leguas, adonde los dejaron, y los chancas se volvieron a Ichopampa y los orejones al Cuzco, con gran vitoria y ricos de los despojos que de aquel vencimiento les quedaron en las manos. Alegres los cuzcos con esta vitoria, que tan sin pensar ni esperanza habían habido, honraron con muchos epítetos a Inga Yupangi, especialmente llamando Pacchacuti, que quiere decir “volvedor de la tierra”, queriendo decir que la tierra y haciendas que tenían por perdidas por la venida de los chancas, él se la había libertado y asegurado. Y de allí adelante se llamó Pachacuti Inga Yupangui.","zh":"印加·尤潘基听到这喊声，他本来也没有掉以轻心，便赶来部署他的人马，却发现愿意同他出去抵抗敌人的人极少，因为大家都吓得跑到山上去观望了。但他同那些愿意跟随他的人——人数很少——主要是同上面提到的那七个军事首领兄弟和统领，组成一支小小的队伍，快步出了库斯科村，去迎击那些乱哄哄、凶猛地冲过来的敌人。双方渐渐逼近，昌卡人从四面进攻城市。印加·尤潘基向各处派出了他所能派的援兵，他自己带着朋友们直奔乌斯科维尔卡的像和旗帜所在的地方，阿斯托伊瓦拉卡和托迈瓦拉卡就同这座像在一起。双方展开一场血战，一方要攻进城，一方要守住城门。从库斯科一个叫乔科斯卡乔纳的街区攻进来的人，被那个街区的人英勇地打退了；据说那里有一个叫查年·库里科卡的女子，像男子一样作战，在那里亲手同进攻的昌卡人厮杀，把他们打退了。这使得所有看见的人都泄了气。印加·尤潘基冲杀得又快又猛，抬着乌斯科维尔卡像的那些人被他的迅猛搅乱了，又看见两边山上下来大批人马——据说那是他们的造物主维拉科查派来援助他的——昌卡人便开始逃跑，丢下了乌斯科维尔卡的像，据说还丢下了安科维尔卡的像。印加·罗卡、阿波迈塔和维卡基劳从另外两面进攻，把昌卡人杀得大败。昌卡人见只有逃命才能得救，便掉头逃跑，逃得比冲来库斯科时还要快。库斯科人乘胜追击，一路杀伤，追了两里格多才停下；昌卡人退回伊乔潘帕，大耳贵族们回到库斯科，大获全胜，手里满是这一仗缴获的战利品。库斯科人因为这次出乎意料、毫无指望的胜利而欢欣鼓舞，给印加·尤潘基加了许多尊号，特别是称他为帕查库蒂，意思是“翻转大地的人”，意思是说，他们因昌卡人的到来已经认为失去了的土地和产业，是他为他们解救保全下来的。从此以后他就叫帕查库蒂·印加·尤潘基。","tr":"p"},"s27-5":{"src":"s","ch":27,"pg":"pp. 169–170","es":"El cual, luego que se vió victorioso, no quiso gozar de triunfo, aunque muchos se lo persuadían, antes quiso dar a su padre la gloria del vencimiento tan señalado. Y así, juntó los despojos más preciosos, y con un principal orejón llamado Quilliscache Urco Guaranga se los envió a su padre, que en Chita estaba, y con él le envió a rogar gozase de aquel triunfo y pisase aquellos despojos de sus enemigos, ca este uso tenían en señal de triunfo. Llegado que fué Quilliscache Urco Guaranga ante Viracocha Inga, hizo poner ante sus pies aquellos despojos de los chancas y con gran reverencia dijo: “¡Inga Viracocha! Tu hijo Pachacuti Inga Yupangui, a quien el Sol ha dado tan gran victoria venciendo a los poderosos chancas, te envía a saludar conmigo y dice que como bueno y humilde hijo quiere que tú triunfes de su victoria y que pises estos despojos de tus enemigos, quél por sus manos venció”. Inga Viracocha no los quiso pisar, mas dijo que su hijo Inga Urcon los pisase, pues había de sucederle en el ingazgo. Corrido desto el mensajero, se levantó, y con furiosas palabras dijo quél no venía a que cobardes triunfasen de los hechos de Pachacuti, y que, pues él no quería recebir aquel servicio de un tan valiente hijo suyo, que mejor sería que gozase de la gloria quien lo había trabajado. Y con esto se tornó al Cuzco y dijo a Pachacuti lo que con su padre le había pasado.","zh":"他一见自己胜利了，虽然许多人劝他享受凯旋，他却不肯，而是想把这场辉煌胜利的荣耀让给他的父亲。于是他收集了最珍贵的战利品，派一个叫基利斯·卡切·乌尔科·瓦兰加的大耳贵族头人送到在奇塔的父亲那里，并请父亲享受这次凯旋，践踏这些敌人的战利品，因为这是他们表示凯旋的习俗。基利斯·卡切·乌尔科·瓦兰加来到维拉科查·印加面前，叫人把昌卡人的那些战利品放在他脚前，十分恭敬地说：“印加·维拉科查！你的儿子帕查库蒂·印加·尤潘基，太阳让他战胜了强大的昌卡人，赐给他这样大的胜利，他派我来向你致意，说他作为一个好儿子、谦卑的儿子，希望由你来享受他的胜利，践踏这些他亲手战胜的你的敌人的战利品。”印加·维拉科查不肯践踏，却说让他的儿子印加·乌尔科去践踏，因为印加·乌尔科将继承他的印加之位。信使为此深感羞辱，站起身来，言辞激烈地说，他来不是为了让懦夫拿帕查库蒂的功业来凯旋的；既然他不愿接受这样一个勇敢的儿子的这番孝敬，那么最好还是让出力的人去享受这份荣耀。说完他就回到库斯科，把他同帕查库蒂的父亲之间发生的事告诉了帕查库蒂。","tr":"p"},"s28-1":{"src":"s","ch":28,"pg":"p. 170","es":"Entre tanto que Pachacuti Inga Yupangui envió a su padre los despojos, los chancas tuvieron lugar de rehacerse de gente y armas en el asiento de Ichopampa, de donde la vez primera salieron para el Cuzco. Y empezaron los cinches Tomaiguaraca y Astoiguaraca a bravear, publicando que habían de tornar sobre el Cuzco y que no habían de dejar cosa sin destruir. Estas nuevas llegaron a Pachacuti Inga Yupangui, de que recibió coraje, y aprestando su gente, caminó con ella en busca de los chancas. Los cuales, sabido que iban los cuzcos, se apercibieron para le salir al encuentro, mas no se dieron tanta priesa que la diligencia de Pachacuti Inga Yupangui no los tomase en el mesmo sitio de Ichopampa.","zh":"就在帕查库蒂·印加·尤潘基把战利品送给他父亲的这段时间里，昌卡人得以在伊乔潘帕——他们第一次就是从这里出发去库斯科的——重新补充人马和武器。军事首领托迈瓦拉卡和阿斯托伊瓦拉卡开始扬言，说他们要再打库斯科，要把一切都毁掉。这些消息传到帕查库蒂·印加·尤潘基那里，他大为愤怒，整顿人马，带着他们去找昌卡人。昌卡人得知库斯科人来了，便准备出去迎战，但他们动作不够快，帕查库蒂·印加·尤潘基神速而至，就在伊乔潘帕原地截住了他们。","tr":"p"},"s28-3":{"src":"s","ch":28,"pg":"p. 171","es":"Con esta respuesta sintieron los chancas cuán poco les aprovechaban sus fieros, y aprestaron las armas, porque vieron a Pachacuti, que venía tras la respuesta que enviaba. Y así, allegándose los unos a los otros en Ichopampa, embistieron, y mezclándose unos con otros, puñaban los chancas con sus lanzas largas, los ingas con hondas, porras, hachas y flechas, cada cual por defender su persona y ofender la de su contrario. Y andando en peso la batalla sin conocerse ventaja de ninguna de las partes, Pachacuti encaminó hacia donde peleaba Astoiguaraca, y embistiendo con él le dió un hachazo de que le cortó la cabeza, habiendo ya muerto a Tomaiguaraca. Y luego hizo poner las cabezas destos dos capitanes chancas en las puntas de unas lanzas, y levantólas en alto, para que fuesen vistas de los suyos. Los cuales, luego que las vieron, desconfiando de victoria por verse sin caudillo, saliéronse de la batalla y todos procuraron huir. Mas Inga Yupangui y los suyos siguieron el alcance, hiriendo y matando hasta que no hallaron en qué se ocupar.","zh":"听到这个答复，昌卡人感到他们的恐吓毫无用处，便准备好武器，因为他们看见帕查库蒂紧跟在他送出的答复后面来了。于是双方在伊乔潘帕逼近，交起手来，混战在一起，昌卡人用长矛刺击，印加人用投石索、棍棒、斧头和弓箭，各自保护自己、攻击对方。战斗相持不下，看不出哪一方占上风，这时帕查库蒂冲向阿斯托伊瓦拉卡作战的地方，同他交手，一斧砍下了他的头，此前他已经杀了托迈瓦拉卡。随后他叫人把这两个昌卡统领的头挑在长矛尖上，高高举起，让他们的人看见。昌卡人一看见，失去首领，对胜利不再抱指望，便退出战斗，全都设法逃命。印加·尤潘基和他的人乘胜追击，一路杀伤，直到再也找不到人可杀。","tr":"p"},"s28-4":{"src":"s","ch":28,"pg":"pp. 171–172","es":"Habida esta victoria tan grande, tantos y tan ricos despojos, Pachacuti Inga Yupangui propuso de ir adonde estaba su padre a darle cuenta del suceso y victorias, y a dalle cuenta y obediencia, para que triunfase de la victoria suya. Y así, cargando de todos los despojos y prisioneros de los chancas, fué y visitó a su padre, unos dicen que en un pueblo llamado Caquia Xaquixaguana, cuatro leguas del Cuzco, otros que en Marco, tres leguas del Cuzco. Y allí donde lo halló le hizo gran acatamiento y se dieron presentes, a quellos llaman mochanaco. Y después de haber Pachacuti Inga dado razón a su padre de todo, mandó traer los despojos de los enemigos ante sus pies y rogó al padre que los pisase y triunfase de aquella victoria. Mas Viracocha Inga, como tenía puesto su intento en dejar por sucesor a Inga Urcon, quisiera que aquella honra que a él se le ofrecía la gozara Inga Urcon, y así, no quiso aceptar el triunfo para sí. Mas por no descontentar a Inga Yupangui, que le había puesto en tan sublime punto, dijo que pisaría los despojos y presos, y así lo hizo. Y en lo de ir a triunfar al Cuzco, excusóse con decir que era viejo, y por eso quería excusar aquel trabajo, que se quería estar descansado en Caquia Xaquixaguana.","zh":"取得了这样大的胜利、这样多这样丰富的战利品以后，帕查库蒂·印加·尤潘基打算到他父亲那里去，向他报告经过和胜利，向他表示服从，让他享受这次胜利的凯旋。于是他带着昌卡人的全部战利品和俘虏去拜见父亲，有人说是在离库斯科四里格、一个叫卡基亚·哈基哈瓦纳的村子，也有人说是在离库斯科三里格的马尔科。他在那里找到父亲，向他行了大礼，双方互赠礼物，他们称之为mochanaco。帕查库蒂·印加把一切向父亲禀报以后，叫人把敌人的战利品放到父亲脚前，请父亲践踏它们，享受这次胜利的凯旋。可是维拉科查·印加一心要让印加·乌尔科做继承人，希望献给他的这份荣耀由印加·乌尔科来享受，所以不肯自己接受凯旋。但为了不让把他抬到如此崇高地位的印加·尤潘基不高兴，他说他会践踏战利品和俘虏，并且这样做了。至于到库斯科去举行凯旋，他推托说自己老了，所以想免去这份劳累，愿意在卡基亚·哈基哈瓦纳安享清闲。","tr":"p"},"s28-5":{"src":"s","ch":28,"pg":"pp. 172–173","es":"Y con esta respuesta, Inga Yupangui se partió para el Cuzco con gran aparato de gente y riquezas, y vino con él Inga Urcon en son de le acompañar, y en el camino se trabó una pendencia en la retaguardia entre los de Inga Urcon y los de Inga Yupangui. Otros dicen que fué celada que Inga Urcon había puesto a su hermano Inga Yupangui, y que pelearon. En fin, Inga Yupangui, no haciendo caso dello, prosiguió su camino y llegó al Cuzco con mucho aplauso y triunfo. Y luego, como quien pensaba tomar por su autoridad toda la tierra y quitar la estimación a su padre, como luego lo hizo, empezó a distribuir los despojos y hacer muchas mercedes con dádivas y palabras. Y con la fama destas grandezas acudieron al Cuzco de muchas partes, y muchos de los que estaban en Caquia Xaquixaguana con Inga Viracocha lo dejaron y se vinieron al Cuzco al nuevo inga.","zh":"得到这个答复，印加·尤潘基带着盛大的人马和财宝动身回库斯科，印加·乌尔科也以陪同为名同他一起走；路上，在后卫中，印加·乌尔科的人同印加·尤潘基的人发生了争斗。另有人说，这是印加·乌尔科为他的兄弟印加·尤潘基设下的埋伏，双方打了起来。总之，印加·尤潘基没有理会这件事，继续赶路，在一片欢呼和凯旋中到了库斯科。随后，他就像一个打算凭自己的权威夺取整个地方、剥夺他父亲威望的人那样——不久他就这样做了——开始分配战利品，用馈赠和言语施予许多恩惠。这些豪举的名声传开，许多地方的人都赶到库斯科来，在卡基亚·哈基哈瓦纳跟着印加·维拉科查的人也有许多离开了他，来到库斯科投奔新的印加。","tr":"p"},"s29-1":{"src":"s","ch":29,"pg":"p. 173","es":"Como Inga Yupangui Inga se vió tan pujante y que le acudía mucha gente, determinó de no aguardar a que su padre lo nombrase por sucesor, o a lo menos a que muriese, antes luego se alzó con el pueblo del Cuzco, propuniendo de acometer a lo de fuera. Y para lo hacer, hizo que hiciesen un gran sacrificio al Sol en Indicancha, Casa del Sol, y luego fueron a preguntar a la estatua del Sol quién sería inga. Y el oráculo del demonio que allí tenían, y por ventura algún indio que habían hecho esconder para que respondiese, dió por respuesta quél tenía señalado a Pachacuti Inga Yupangui para que fuese inga. Con esta respuesta tornaron todos los que habían ido a hacer el sacrificio, y se prostraron ante Pachacuti Inga Yupangui, llamándose Çapa inga índip churin, que quiere decir “solo señor, hijo del sol”.","zh":"印加·尤潘基·印加见自己势力强盛，又有许多人来投奔，便决定不等父亲指定他为继承人，至少不等父亲去世，而是马上占据库斯科村，打算再去攻取外面的地方。为此，他叫人在因迪坎查太阳殿向太阳举行一次盛大的献祭，然后他们去问太阳像谁将做印加。他们在那里供奉的魔鬼神谕——也许是他们事先叫一个印第安人藏起来作答的——回答说，太阳已经选定帕查库蒂·印加·尤潘基做印加。去献祭的人带着这个答复回来，全都拜倒在帕查库蒂·印加·尤潘基面前，称他为Çapa ingaíndip churin，意思是“唯一的领主，太阳之子”。","tr":"p"},"s29-2":{"src":"s","ch":29,"pg":"pp. 173–174","es":"Y luego hicieron una muy rica borla de oro y esmeraldas, para ponérsela; y otro día llevaron a Pachacuti Inga Yupangui a la Casa del Sol; y cuando llegaron a la estatua del Sol, que de oro y del tamaño de un hombre era, halláronle con la borla en la mano, como que la ofrecía de su voluntad. Y haciendo primero Inga Yupangui sus sacrificios como ellos acostumbraban, llegóse a la estatua del Sol; y el sumo sacerdote del Sol, llamado en su lenguaje índip apon, que quiere decir el “gobernador de las cosas del Sol”, con muchas ceremonias y gran reverencia tomó la borla de la mano de la estatua y con mucha pompa se la puso en la frente al Pachacuti Inga Yupangui. Y luego todos le nombraron Índip churin Inga Pachacuti, que suena “hijo del sol, señor, vuelta de la tierra”, y de allí adelante se nombró Pachacuti Cápac, demás de su primero nombre, que es Inga Yupangui. Y luego Pachacuti Inga Yupangui dió muchos dones y hizo muchas fiestas y libraba como solo inga, sin elección de su padre ni pueblos, mas de por aquellos que se le habían allegado por el interese de las dádivas que hacía.","zh":"随后他们做了一顶非常华贵的金和绿宝石的王穗，要给他戴上；第二天，他们把帕查库蒂·印加·尤潘基领到太阳殿；他们来到太阳像跟前——那是一座金像，有一人大小——发现它手里拿着王穗，好像是自愿献出来的。印加·尤潘基先按照他们的习俗献了祭，然后走近太阳像；太阳的大祭司，他们的语言叫índip apon，意思是“太阳事务的总管”，以许多仪式、极其恭敬地从太阳像手里取下王穗，隆重地把它戴在帕查库蒂·印加·尤潘基的额前。随即大家都称他为Índip churin Inga Pachacuti，意思是“太阳之子、领主、大地的翻转”；从此以后，除了他的本名印加·尤潘基，他又称为帕查库蒂·卡帕克。随后帕查库蒂·印加·尤潘基赐了许多礼物，举行了许多庆典，以唯一的印加的身份发号施令，既没有经过他父亲的推选，也没有经过各村的推选，只有那些贪图他的馈赠而依附他的人拥立他。","tr":"p"},"s30-1":{"src":"s","ch":30,"pg":"pp. 174–175","es":"Luego [que] fueron acabadas las fiestas, trazó el pueblo por mejor orden que solía tener, y hizo las calles principales que tenía cuando los españoles entraron en el Cuzco, y repartió los solares para casas de comunidad y públicas y particulares, haciéndolas edificar de cantería muy polida. Y eslo tanto, que a los que la hemos visto y sabemos que no tienen instrumentos de hierro ni acero para las labrar nos pone admiración ver la igualdad y primor della y las junturas y betumen con que lo ligan. El cual es tan tan delgado, que ninguna parte se echa de ver si hay mezcla o no; y con todo es tan fuerte liga, que plomo no traba más que ella. Y la piedra tosca es aún mucho más de ver el modo de su trabazón y compostura. Y porque en esto sola la vista satisface a los curiosos, no quiero gastar tiempo en pintarlo más prolijamente.","zh":"庆典一结束，他便把村子规划得比从前更有条理，修建了西班牙人进入库斯科时所见的那几条主要街道，划分宅地，分给公共的、官方的和私人的房屋，命人用打磨得极其精致的石料建造。精致到这种地步：我们这些见过它、又知道他们没有铁器钢器来加工石料的人，看到石块的平整精美，看到接缝和用来黏合的灰泥，无不惊叹。这种灰泥薄得在哪儿都看不出有没有掺东西；可是黏合得极其牢固，铅也不过如此。至于毛石，砌合拼接的方式更是值得一看。这些东西只有亲眼看过，好奇的人才能满足，所以我不想再花工夫细细描摹。","tr":"p"},"s30-2":{"src":"s","ch":30,"pg":"p. 175","es":"Demás desto, Pachacuti Inga Yupangui, considerando las pocas tierras que había al derredor del Cuzco para sementeras, suplió con arte lo que negó naturaleza en este asiento; y fué que en las laderas cercanas al pueblo, y en otras partes también, hizo unos escalones muy largos de a dos mil y a más y menos pasos, y de ancho de a veinte y treinta, y más y menos, de cantería, por las frentes de piedra; y llenólos de tierra que mucha della era traída de lejos. A estos escalones llamamos nosotros acá andenes, y los indios los llaman sucres. Y en éstos mandó que sembrasen; con lo cual aumentó en grandísima cuantidad las sementeras y mantenimientos para las compañas y guarniciones del pueblo.","zh":"此外，帕查库蒂·印加·尤潘基考虑到库斯科周围可耕的土地很少，便在这个地方用人工弥补了自然所吝惜的东西：在村子附近的山坡上，以及别的地方，他修了一些极长的台阶，长的有两千步，也有多些少些的，宽二十步、三十步，也有多些少些的，正面用石头砌成；里面填上土，很多土是从远处运来的。这些台阶我们这里叫作梯田，印第安人叫sucres。他命人在上面耕种；这样一来，供给部众和村中驻军的耕地和粮食大大增加了。","tr":"p"},"s30-3":{"src":"s","ch":30,"pg":"pp. 175–176","es":"Y para que el tiempo del sembrar y del coger se supiese precisamente y nunca se perdiese, hizo poner en un monte alto, al levante del Cuzco, cuatro palos, apartados el uno del otro como dos varas de medir, y en las cabezas dellos unos agujeros, por donde entrase el sol a manera de reloj o astrolabio. Y considerando adónde hería el sol por aquellos agujeros al tiempo del barbechar y sembrar, hizo sus señales en el suelo, y puso otros palos en la parte que corresponde al poniente del Cuzco para el tiempo del coger las mieses. Y como tuvo certificados estos palos preciosamente, puso para perpetuidad en su lugar unas colunas de piedra de la medida y agujeros de los palos, y a la redonda mandó enlosar el suelo, y en las losas hizo hacer ciertas rayas niveladas conforme a las mudanzas del sol que entraba por los agujeros de las colunas, de manera que todo era un artificio de reloj anual, por donde se gobernaban para el sembrar y coger. Y diputó personas que tuviesen cuenta con estos relojes y notificasen al pueblo los tiempos y sus diferencias que aquellos relojes señalasen.","zh":"为了准确地知道播种和收获的时节，永远不致错过，他命人在库斯科以东的一座高山上竖起四根木杆，彼此相距约两瓦拉，杆顶开孔，让阳光从孔中射入，就像日晷或星盘一样。他观察犁地、播种的时候阳光从这些孔中照到哪里，便在地上做了标记；又在库斯科以西相应的地方竖起另一些木杆，用来定收割庄稼的时节。他把这些木杆的位置确定得十分精确以后，为了永久保存，就在原处换上了石柱，大小和孔都同木杆一样，并命人在周围铺上石板，在石板上刻了一些水平的线，与从石柱孔中射入的阳光的变化相对应，这样整个就成了一个年历日晷的装置，他们就靠它来安排播种和收获。他还派了专人掌管这些日晷，把日晷所显示的时节及其变化通告给村里的人。","tr":"p"},"s30-4":{"src":"s","ch":30,"pg":"p. 176","es":"Tras esto, como era curioso de saber cosas antiguas, y para perpetuar su nombre, fué personalmente al cerro de Tambotoco o Pacaritambo, que todo es una cosa, y entró en la cueva de donde tienen por cierto que salió Mango Cápac y los hermanos que con él vinieron la primera vez al Cuzco, según queda dicho. Y después de lo haber todo muy bien visto y considerado, hizo veneración a aquel lugar con fiestas y sacrificios. Hizo puertas de oro a la ventana Capactoco y mandó que de allí adelante aquel lugar fuese muy venerado y acatado de todos. Y para esto instituyólo por adoratorio y guaca, donde fuesen a pedir oráculos y a sacrificar.","zh":"此后，他因为好探究古事，又想使自己的名声永传，便亲自去了坦博托科山，也就是帕卡里坦博，这两个名字说的是同一个地方；他进了那个洞，他们确信曼科·卡帕克和同他一起第一次来到库斯科的兄妹就是从那里出来的，如前所述。他把一切都仔细看过、考虑过以后，就举行庆典和献祭来崇奉那个地方。他给卡帕克托科窗装上了金门，下令从此以后所有的人都要极其崇敬那个地方。为此他把它立为祈祷所和圣地，让人们去那里求神谕、献祭。","tr":"p"},"s30-5":{"src":"s","ch":30,"pg":"p. 176","es":"Y hecho esto, tornóse al Cuzco, adonde ordenó el año de doce meses, cuasi como el nuestro; digo cuasi, porque tiene alguna diferencia, aunque poca, como en su lugar diré.","zh":"做完这些，他回到库斯科，在那里制定了十二个月的年，差不多同我们的一样；我说差不多，是因为有些差别，虽然很小，这将在适当的地方讲到。","tr":"p"},"s30-6":{"src":"s","ch":30,"pg":"pp. 176–177","es":"Luego hizo ayuntamiento general en los más antiguos y sabios del Cuzco y de otras partes, y con mucha diligencia escudriñó y averiguó las historias de las antigüedades desta tierra, principalmente de los ingas, sus mayores, y mandólo pintar, y mandó que se conservasen por la orden que dije cuando hablé del modo que hube en el examen desta historia.","zh":"随后他召集库斯科和其他地方最年长、最有学问的人开大会，极其用心地探究、查明这片土地的古代历史，主要是他的先人诸印加的历史，命人画下来，并下令按照我讲到我如何考查这部历史时所说的那种办法保存起来。","tr":"p"},"s31-1":{"src":"s","ch":31,"pg":"pp. 177–178","es":"Ornado el pueblo del Cuzco con edificios, calles y las demás cosas dichas, advirtió Pachacuti Inga Yupangui cómo después de Mango Cápac ninguno de sus pasados ingas había aumentado nada en la Casa del Sol. Y por esto él determinó de la enguarnecer en edificio[s] y oráculos, para espantar las gentes ignorantes y traellas embaídas y abobadas tras sí, para con ellas acometer la conquista de toda la tierra quél pensaba tiranizar, como lo empezó e hizo gran parte dello. Y para esto desenterró los cuerpos de los siete ingas pasados desde Mango Cápac hasta Yáguar Guácac Inga, que todos estaban en la Casa del Sol, y guarneciólos de oro, poniéndoles máscaras, armaduras de cabezas a que llaman chucos, patenas, brazaletes, cetros a que llaman yauris o chambis y otros ornatos de oro. Y después los puso por orden de su antigüedad en un escaño ricamente obrado de oro, y luego mandó hacer grandes fiestas y representaciones de la vida de cada inga. Turaron estas fiestas, a que llamaron purucaya, más de cuatro meses. Y hizo grandes y suntuosos sacrificios a cada cuerpo de inga al cabo de la representación de sus hechos y vida. Con lo cual les dió tanta autoridad, que los hizo adorar y tener por dioses de todos los forasteros que venían a vellos. Los cuales, como lo[s] veían con tanta majestad, luego se humillaban, y puestas las manos los adoraban, o, como ellos dicen, mochaban. Y tenían gran respeto y veneración, y así estuvieron hasta que vinieron los españoles a esta tierra del Pirú.","zh":"库斯科村有了上面说的那些建筑、街道和其他设施以后，帕查库蒂·印加·尤潘基注意到，自曼科·卡帕克以后，他的先人诸印加没有一个给太阳殿增添过任何东西。因此他决定用建筑和神谕来装点它，以震慑无知的人，迷惑他们，使他们晕头转向地追随自己，好率领他们去征服他打算施行暴政的整片土地——他开始这样做了，而且做成了很大一部分。为此，他把从曼科·卡帕克到亚瓦尔·瓦卡克·印加这七位先代印加的遗体挖了出来——这些遗体都在太阳殿里——用黄金装饰起来，给他们戴上面具、他们称为chucos的头盔、金片、手镯、他们称为yauris或chambis的权杖，以及其他金饰。然后他把他们按辈分先后排放在一条用黄金精工制作的长凳上，随即命人举行盛大的庆典，演出每一位印加的生平。这些庆典称为普鲁卡亚，持续了四个多月。在演完每一位印加的事迹和生平以后，他都向那位印加的遗体举行盛大隆重的献祭。他以此给了这些遗体极大的威望，使所有来瞻仰的外乡人都崇拜它们，把它们当作神。这些外乡人看见它们如此威严，便立刻俯首，合掌敬拜，或者照他们的说法，叩拜它们。他们对这些遗体极其尊敬崇拜，一直到西班牙人来到秘鲁这片土地为止。","tr":"p"},"s31-2":{"src":"s","ch":31,"pg":"p. 178","es":"Y demás destos cuerpos hizo dos ídolos de oro. Y al unó llamó Viracocha Pachayachachi, que representase su criador que ellos dicen, y púsole a la diestra del ídolo del Sol. Y al otro llamó Chuquiilla, que representase el relámpago, y púsole a la siniestra del bulto del Sol, al cual ídolo veneraban sumamente todos. El cual ídolo tomó Inga Yupangui por ídolo guáoqui, porque decía que se habían topado y hablado en un despoblado y que le había dado una culebra con dos cabezas para que trajese siempre consigo, diciendo que mientras la trajese no le sucedería cosa siniestra en sus negocios. A estos ídolos dotó de renta de tierras, ganados y servicios, especialmente de unas mujeres que vivían en la mesma Casa de[l] Sol a manera de monjas. Las cuales todas entraban doncellas, y pocas quedaban que no parían del inga. A lo menos era tan vicioso en esto, que se dice que con todas las que le daba gusto tenía acceso, y por esto tuvo tantos hijos como dél se dice.","zh":"除了这些遗体，他还造了两尊金神像。一尊他称为维拉科查·帕查亚查奇克，代表他们所说的造物主，放在太阳像的右边。另一尊他称为丘基伊利亚，代表闪电，放在太阳像的左边，所有的人都极其崇敬这尊神像。印加·尤潘基把这尊神像取作自己的瓦奥基神像，因为他说他们曾在一片荒野里相遇交谈，它给了他一条双头蛇，叫他永远带在身边，说只要带着它，他的事情就不会遇到不吉利的事。他给这些神像捐赠了土地、牲畜和仆役作为供养，特别是一些住在太阳殿里、像修女一样的女子。她们进去时都是处女，但很少有人不给印加生孩子。至少他在这方面荒淫到这种程度：据说凡是他看中的，他都同她们发生关系，所以他有人们所说的那么多儿子。","tr":"p"},"s31-4":{"src":"s","ch":31,"pg":"pp. 178–179","es":"Y dicen que sobre todo hizo una gruesa maroma de lana de muchas colores y chapeada de oro, con dos borlas coloradas al cabo. Tenía de largo, según dicen, ciento y cincuenta brazas, poco más o menos. Ésta servía para sus fiestas públicas, que eran cuatro al año las principales, llamadas la una raimi o cápac raimi, que era de los caballeros, cuando se hacían abrir las orejas, a que llaman guarachico; la otra se llamaba sítuay, que era a la manera de nuestros regocijos de Sant Juan, que se levantaban todos a media noche con lumbres y se iban a bañar, y decían que con aquello quedaban limpios de toda enfermedad; la tercera se decía indi raimi, que era la fiesta del Sol; la cuarta era aimóray. En estas fiestas sacaban la maroma de la Casa o despensa del Sol, y todos principales indios, muy lucidamente vestidos, se asían a ella por orden; y así, desde la Casa del Sol venían cantando hasta la Plaza, la cual cercaban toda con la maroma, que se llamaba móroy Urco.","zh":"据说最重要的是，他做了一根用多种颜色的羊毛编成的粗大绳索，上面镶着金片，末端有两个红色的穗子。据说它长约一百五十寻。这根绳索用于他们的公共节庆，一年中主要的节庆有四个：一个叫raimi或卡帕克·赖米，是骑士们的节庆，那时他们让人给自己穿耳，称为瓦拉奇科；另一个叫sítuay，类似我们圣约翰节的欢庆，人们半夜都起来，举着火把去沐浴，说这样就能除尽一切疾病；第三个叫indi raimi，是太阳的节庆；第四个是aimóray。在这些节庆上，他们把绳索从太阳殿、也就是太阳的库房里取出来，所有的印第安头人都穿着十分华丽的衣服，按次序抓着它；就这样，他们从太阳殿一路唱着来到广场，用绳索把整个广场围起来；这根绳索叫móroy Urco。","tr":"p"},"s32-1":{"src":"s","ch":32,"pg":"pp. 179–180","es":"Después que Pachacuti hizo lo que se ha dicho en la cidad, miró la población del pueblo y la gente que en él había. Y viendo que no había bastantes tierras de sembrar para que se pudiesen sustentar, salió fuera del pueblo cuatro leguas en redonda dél, y considerados los sitios, valles y poblaciones, despobló todos los pueblos questaban dos leguas en torno del pueblo. Y las tierras de los pueblos que despobló aplicólas para el Cuzco y para sus moradores, y los que despobló echólos a otras partes. Con lo cual contentó mucho a los ciudadanos del Cuzco, porque les daba aquello que les costaba poco, y así hacía amigos con hacienda ajena; y tomó para su recámara el valle de Tambo, sin ser suyo.","zh":"帕查库蒂在城里做了上面所说的这些事以后，察看了村子的人口和其中的人。他看到没有足够的耕地养活他们，便出了村子，到周围四里格的范围内去，察看了各处地方、山谷和村落以后，把村子周围两里格以内的村落全部迁空。被迁空的村落的土地，他划归库斯科及其居民，被迁走的人则被他赶到别处去。这使库斯科的市民大为满意，因为他给了他们得来不费力的东西，就这样拿别人的产业结交朋友；他还把坦博谷据为自己的私产，那本来不是他的。","tr":"p"},"s32-2":{"src":"s","ch":32,"pg":"p. 180","es":"Las nuevas de la ampliación deste pueblo corrían por todas partes, y llegando a oídos del Inga Viracocha, questaba retirado en Caquia Xaquixaguana, movióse a ir ver al Cuzco. Y así fué por él su hijo Inga Yupangui, y lo llevó con mucho regocijo al Cuzco. Y fué a la Casa del Sol y mochó, y a Guanac[a]uri, y mostráronle todo lo demás que en la cidad se había aumentado y renovado. Y visto, se tornó a volver a su estancia de Caquia Xaquixaguana, adonde estuvo hasta que murió, que nunca más tornó al Cuzco ni vió a su hijo Pachacuti Inga Yupangui.","zh":"这个村子扩建的消息传遍各地，传到了隐居在卡基亚·哈基哈瓦纳的印加·维拉科查耳中，他动了念头，想去看看库斯科。于是他的儿子印加·尤潘基去接他，欢天喜地地把他带到库斯科。他到太阳殿去叩拜，又到瓦纳考里去；人们把城里增建、翻新的其余一切都指给他看。看过以后，他又回到卡基亚·哈基哈瓦纳他的庄园，一直住到去世，再也没有回过库斯科，也再没有见过他的儿子帕查库蒂·印加·尤潘基。","tr":"p"},"s33-1":{"src":"s","ch":33,"pg":"pp. 180–181","es":"Como Pachacuti Inga Yupangui se vido tan poderoso con las compañas que se le habían allegado por las larguezas que con todos hacía, propuso subjetar con ellas todas las tierras que pudiese. Y para esto hizo reseña de todas sus gentes que en el Cuzco estaban y aderezólos de armas y pertrechos necesarios a la guerra. Y estando las cosas en este estado, supo que su hermano Inga Urco[n] estaba cuatro leguas del Cuzco, en el valle que llaman de Yúcay, y que tenía alguna gente junta; y temiéndose que fuese contra él, fué con su gente allá. Y yendo con él Inga Roca, su hermano, del cual se dice que fué grande nigromántico, y llegando Inga Yupanqui al pueblo llamado Paca, en el dicho valle de Yúcay, salió contra él Inga Urcon, su hermano, con gente de guerra, y trabóse entre ellos batalla. En la cual Inga Roca dió una pedrada en la garganta a Inga Urcon, tan grande que dió con Inga Urcon en el río, sobre la barranca del cual peleaban. E Inga Urcon, esforzándose, dejóse ir, huyendo nadando por el agua [a]bajo, con su hacha de armas en la mano, y desta manera fué hasta una peña llamada Chupellusca, una legua abajo de Tambo, adonde le alcanzaron sus hermanos y le acabaron de matar.","zh":"帕查库蒂·印加·尤潘基见自己因为对所有人慷慨大方而聚集起许多人马，势力如此强大，便打算用他们去征服一切能征服的土地。为此他检阅了在库斯科的全部人马，给他们配备了打仗所需的武器和军需。正当事情到了这一步，他得知他的兄弟印加·乌尔科在离库斯科四里格、一个叫尤凯的山谷里，聚集了一些人马；他怕印加·乌尔科是冲着自己来的，便带着他的人马到那里去。他的兄弟印加·罗卡同他一起去，据说此人是个大巫师。印加·尤潘基来到尤凯谷中一个叫帕卡的村子，他的兄弟印加·乌尔科带着兵马出来迎击他，两人之间打了一仗。在这一仗中，印加·罗卡用投石击中印加·乌尔科的喉咙，力量之大，把印加·乌尔科打落到河里——他们是在河岸上交战的。印加·乌尔科挣扎着，任凭河水把自己冲走，手里拿着战斧，顺流泅水逃走，就这样一直到了坦博下游一里格、一块叫丘佩柳斯卡的岩石那里，他的兄弟们在那里追上了他，把他杀死了。","tr":"p"},"s33-2":{"src":"s","ch":33,"pg":"p. 181","es":"Y desde aquí Inga Yupangui e Inga Roca, con su gente, fueron a Caquia Xaquixaguana a ver al padre, mas nunca los quiso ver ni hablar, por el enojo que tenía contra ellos por la muerte de Inga Urcon. Mas Inga Roca entró donde estaba Inga Viracocha y le dijo: “¡Padre! No hay razón para que toméis tanta pesadumbre por la muerte de Inga Urcon, porque yo lo maté en defensa de mi persona, porque Inga Urco[n] me iba a matar a mí. No os pese tanto de la muerte de uno, pues tenéis tantos hijos, y no tratéis ya más dello, que mi hermano Inga Yupangui ha de ser inga, e yo le tengo de favorecer y serle como padre”. Viendo Inga Viracocha la determinación del hijo Inga Roca, no le osó replicar ni contradecir, y despidióle con decirle que, pues así lo quería, que hiciese su voluntad en todo. Y con esto se tornaron al Cuzco Inga Yupangui e Inga Roca, y entraron en [la] cidad, triunfando de las victorias pasadas y désta.","zh":"印加·尤潘基和印加·罗卡带着他们的人马从这里到卡基亚·哈基哈瓦纳去看父亲，可是父亲因为印加·乌尔科的死而对他们怀恨，始终不肯见他们，也不肯同他们说话。但印加·罗卡走进印加·维拉科查所在的地方，对他说：“父亲！您没有理由为印加·乌尔科的死这样伤心，因为是我杀了他，那是为了自卫，因为印加·乌尔科要杀我。您有这么多儿子，不要为死了一个这样难过，这件事也不要再提了，因为我的兄弟印加·尤潘基要做印加，我要扶助他，做他的父亲一样。”印加·维拉科查看到儿子印加·罗卡如此决绝，不敢回答，也不敢反对，便打发他走，对他说：既然他要这样，那就一切照他的意思办吧。于是印加·尤潘基和印加·罗卡回到库斯科，以从前的胜利和这次的胜利举行凯旋，进了城。","tr":"p"},"s33-3":{"src":"s","ch":33,"pg":"pp. 181–182","es":"El triunfo era desta manera: Llevaban la gente de guerra en orden por sus escuadras, lo más bien aderezados que les era posible, con muchas danzas y cantares, y los captivos presos, los ojos en el suelo, vestidos con unas ropas largas con muchas borlas; y entraban por las calles del pueblo, que para esto estaban muy bien aderezadas. Iban representando las victorias y batallas de que triunfa[ba]n. Y en llegando a la Casa del Sol echaban en el suelo los despojos y prisioneros, y el inga pasaba sobrellos, pisándolos y diciendo: “A mis enemigos piso”. Y estaban los presos callando, sin alzar los ojos. Y este orden guardaban en todos los triunfos. E Inga Viracocha, al cabo de poco tiempo, murió de enojo por la muerte de Inga Urcon, privado y despojado de toda honra y hacienda, y sepultaron su cuerpo en Caquia Xaquixaguana.","zh":"凯旋是这样举行的：军人按各队列队，尽可能装扮得整齐漂亮，载歌载舞；俘虏们被押着，眼睛看着地面，穿着缀有许多穗子的长袍；他们穿过村子的街道，街道为此装饰得十分漂亮。他们一路演示所庆祝的那些胜利和战役。到了太阳殿，他们把战利品和俘虏扔在地上，印加从上面走过，踩着他们说：“我践踏我的敌人。”俘虏们默不作声，不敢抬眼。所有的凯旋都遵循这种程序。印加·维拉科查不久就因为印加·乌尔科的死含恨而死，一切尊荣和财产都被剥夺殆尽；人们把他的遗体葬在卡基亚·哈基哈瓦纳。","tr":"p"},"s34-1":{"src":"s","ch":34,"pg":"pp. 182–183","es":"Cerca del valle del Cuzco está una nación de indios llamados ayarmacas, los cuales tenían un cinche soberbio y rico llamado Tócay Cápac. Éste ni los ayarmacas no quisieron venir a reverenciar al Inga, antes procuraban alistar las armas para contra los cuzcos, si quisiesen ir contra él. Lo cual sabido por Inga Yupangui, hizo ayuntamiento de sus gentes y aillos, y hizo las parcialidades que después llamaron Hanancuzcos y Hurincuzcos, y conformólos en un cuerpo, para que juntos nadie pudiese ni fuese parte contra ellos. Y esto hecho, entraron en consejo sobre lo que debían hacer. Y acordaron que todos se juntasen y saliesen a conquistar a todas las naciones del reino, y que a los que de su voluntad no se les diesen y sirviesen, los destruyesen totalmente; y que ante todas cosas fuesen contra Tócay Cápac, cinche de los ayarmacas, que era poderoso y no había venido a hacer reconocimiento al Cuzco. Y así, junta la gente de guerra, fueron contra los ayarmacas y su cinche, y diéronse batalla los unos a los otros en Guanancancha. Y los venció Inga Yupangui y asoló a los pueblos y mató cuasi a todos los ayarmacas y trajo preso al Cuzco a Tócay Cápac, al cual tuvo en prisión hasta que murió.","zh":"库斯科谷附近有一族印第安人，叫阿亚尔马卡人，他们有一个傲慢而富有的军事首领，叫托凯·卡帕克。这个人和阿亚尔马卡人都不肯来向印加致敬，反而设法准备武器，以防库斯科人来攻打他。印加·尤潘基得知以后，召集了他的人马和各亲族共同体，设立了后来称为哈南库斯科和乌林库斯科的两部，把它们合为一体，使它们联合起来，谁也不能、也无力对抗他们。做了这件事以后，他们开会商议应当怎么办。他们商定：大家联合起来，出去征服王国中所有的族群，凡是不主动归顺、服侍他们的，就把他们彻底毁灭；首先要去攻打阿亚尔马卡人的军事首领托凯·卡帕克，因为他势力强大，又没有来库斯科表示臣服。于是，集合起军队，他们去攻打阿亚尔马卡人和他们的军事首领，双方在瓦南坎查交战。印加·尤潘基战胜了他们，夷平了他们的村落，几乎杀光了阿亚尔马卡人，把托凯·卡帕克俘虏到库斯科，把他关押到死。","tr":"p"},"s34-2":{"src":"s","ch":34,"pg":"pp. 183–184","es":"Después desto Inga Yupangui tomó por mujer a Mama Añaguarqui, natural de Choco, y para holgarse y regocijarse más, apartado de negocios, fuése al pueblo de los Cuyos, cabeza de la provincia de Cuyosuyo. Y estando un día en un gran regocijo, un ollero, criado de un cinche, sin saber por qué, dió con una piedra o, como otros dicen, con un jarro, a que ellos llaman ulti, en la cabeza a Inga Yupangui y lo descalabró. Y preso el delincuente, que era extranjero de aquella nación, diéronle tormento para que dijese quién se lo había mandado, y confesó que todos los cinches de Cuyosuyo, que eran Cuyo Cápac y Ayanquilalama y Apu Cunaraqui, los cuales estaban de concierto para lo matar y alzar. Aunque en efeto era falso, porque él lo había levantado por el temor del tormento, o porque, como otros dicen, era de nación enemiga de los cuyos, y por les hacer mal lo dijo. Mas el Inga, como oyó lo quel ollero dijo, mandó luego Pachacuti matar a todos los cinches, con grandes crueldades. Y después de muertos, dió sobre la comunidad, que no dejó hombre a vida, sino algunos niños y viejas; y así quedó aquella nación destruída y los pueblos asolados hasta hoy.","zh":"此后，印加·尤潘基娶了乔科人玛玛·阿尼亚瓦尔基为妻；为了更好地游乐消遣、摆脱政务，他到库约人的村子去，那是库约苏尤省的首邑。有一天，正当他在大肆欢庆的时候，一个陶工，是某个军事首领的仆人，不知为了什么，用一块石头——也有人说是用一个他们叫ulti的罐子——砸在印加·尤潘基头上，把他打得头破血流。犯人被捉住了，他是那个族群的外乡人；他们对他用刑，要他招出是谁指使的，他招认说是库约苏尤的所有军事首领，即库约·卡帕克、阿扬基拉拉马和阿普·库纳拉基，他们串通好了要杀死印加、起来造反。其实这是假的，是他害怕受刑而诬陷的，或者如另一些人所说，他属于库约人的一个敌对族群，为了害他们才这样说。但印加听了陶工的话，帕查库蒂立即下令以极其残酷的手段杀死所有的军事首领。杀了他们以后，他又袭击了平民，一个男人也没有留下活口，只留下一些孩子和老妇；就这样，那个族群被毁灭了，村落至今仍是一片废墟。","tr":"p"},"s8-1":{"src":"s","ch":8,"pg":"p. 110","es":"Conviene sumamente notar que de todo lo que pasó desde la segunda creación que el Viracocha hizo, no saben estos indios bárbaros dar más razón de lo que arriba queda dicho, hasta los tiempos de los ingas. Pero averíguase que, aunque la tierra era poblada y llena de habitadores antes de los ingas, no se gobernaba con policía, ni tenían señores naturales elegidos por común consentimiento que los gobernase y rigiese y a quien los comunes respetasen, obedeciesen y contribuyesen algún pecho. Antes, todas las poblaciones, que incultas y disgregadas eran, vivían en general libertad, siendo cada uno solamente señor de su casa y sementera. Y en cada pueblo hacían dos parcialidades. A la una llamaban Hanansaya, que es decir la banda de arriba, y a la otra Hurinsaya, que es la banda de abajo; el cual uso conservan hasta hoy. Y esta división no sirvía más de para contarse unos a otros por su contento, aunque después acá sirvía y sirve para más fructo, como en su lugar se dirá.","zh":"必须特别指出：自维拉科查所做的第二次创造以来发生的一切，这些野蛮的印第安人除了上文已经说过的，再说不出更多来历，直到诸印加的时代。不过可以查明，在诸印加以前，这片土地虽然有人居住、到处是居民，却不是按政治秩序治理的，也没有经众人共同同意选出的天然领主来治理统辖他们，让平民尊敬、服从并向其缴纳某种赋税。相反，所有的村落都粗陋而分散，生活在普遍的自由之中，每个人只是自己房屋和田地的主人。每个村子分成两部：一部叫哈南萨亚，意思是上面的一半；另一部叫乌林萨亚，即下面的一半；这种习俗他们一直保持到今天。这种划分起初只用来彼此随意计数，后来却有了、现在也仍有更大的用处，这将在适当的地方说明。","tr":"p"},"s8-2":{"src":"s","ch":8,"pg":"pp. 110–112","es":"Y como entre ellos naciesen disensiones, procuraron cierto modo de milicia para su defensa, desta manera. Cuando los de algún pueblo sabían que algunos de otras partes venían a les hacer guerra, procuraban uno dellos natural, y aun extranjero, de su patria, que fuese valiente hombre de guerra. Y muchas veces el tal hombre se ofrecía de su voluntad a los amparar y militar por ellos contra sus enemigos. Y a este tal seguían y obedecían, y cumplían sus mandamientos durante la guerra. La cual acabada, quedaba privado como antes y como los demás del pueblo; ni antes ni después le daban tributo ni manera de pecho alguno. A éste llamaron los de aquel tiempo, y aún llaman los de agora, cinche, que es lo mesmo que “valiente”. Nombrábanle por este término cinchicona, que quiere decir “agora valiente”, como quien dice: “agora, mientras dura la guerra, serás nuestro valiente, y después no”, o en otro significado, que diga “valientes”, porque cona es adverbio de tiempo y también significa pluralidad. Y en cualquier significado viene bien al propósito destos capitanes temporales, que fueron en los tiempos de behetrías y libertad general, de manera que desde el diluvio general, de que éstos dan noticia, hasta el tiempo que empezaron los ingas, que fueron tres mill y quinientos y diez y nueve años, todos los naturales destos reinos vivieron en behetrías sin reconocer señor natural ni elegido, procurando conservarse, como dicho es, en una simple libertad, viviendo en chozas y en unas cuevas y humildes casillas. Y este nombre de cinches, que les servía de cabezas para sola la guerra, duró en toda la tierra hasta el tiempo de Topa Inga Yupangui, décimo inga, el cual instituyó los curacas y otros dominadores por la orden que en la vida del mesmo Topa Inga se dirá difusamente. Y aun en este tiempo tienen este uso y costumbre de gobernarse en las provincias de Chile y en otras partes de las montañas del Pirú, al levante de Quito y Chachapoyas, que no obedecen más señores de cuanto tura la guerra, y éste a quien obedecen no es señaladamente siempre uno, sino al que conocen ser más valiente, ardid y venturoso en las guerras. Mas advierta el letor que, puesto que toda la tierra era behetría en cuanto al dominio de los señores, había señaladamente naciones naturales de cada provincia donde era su propria y particular naturaleza, como se averigua de los naturales del valle del Cuzco y otras partes, como de cada cosa diremos en su lugar.","zh":"由于他们之间起了纷争，便想出某种兵制来自卫，办法如下。某个村子的人一旦得知别处有人要来攻打，就设法找一个本村人，甚至是外乡人，要勇敢善战的。这样的人也常常自愿出来保护他们，替他们对敌作战。人们便跟随他、服从他，在战争期间执行他的命令。战争一结束，他就同从前一样、同村里其他人一样，回为平民；无论战前战后，人们都不向他缴纳贡赋或任何赋税。当时的人称这样的人为军事首领，现在的人也还这样称呼，意思就是“勇者”。人们用cinchicona一词称呼他，意思是“现在的勇者”，好比说：“现在，战争还在打的时候，你是我们的勇者，以后就不是了。”或者取另一个意思，即“勇者们”，因为cona是时间副词，也表示复数。不论取哪个意思，都正合这些临时统领的情形，他们出现在无主之民、普遍自由的时代。所以，从这些人所说的大洪水起，到诸印加开始的时候，共三千五百一十九年，这些王国的本地人全都生活在无主状态中，不承认任何天然的或推选的领主，如前所说，只求在单纯的自由中保全自己，住在茅屋、山洞和简陋的小房子里。“军事首领”这个名称只用于战时的头领，它在全境一直沿用到第十位印加图帕克·印加·尤潘基的时代；他设立了库拉卡和其他管辖者，办法将在这位图帕克·印加的传记中详述。即使到今天，智利各省以及秘鲁山区的其他地方，在基多和查查波亚斯以东，人们仍保持这种自治的习俗：只在战争期间服从领主，所服从的也不一定总是同一人，而是他们认为在战争中最勇敢、最机智、最有运气的人。但读者要注意：就领主的统治而言，全境虽都处于无主状态，各省却明明各有本地的族群，各有自己特定的故土，这从库斯科谷及其他地方的本地人那里可以查明，每件事我们都会在适当的地方讲到。","tr":"p"},"s9-1":{"src":"s","ch":9,"pg":"p. 112","es":"Dicho he cómo, aunque las poblaciones destas tierras se conservaron y vivieron antiguamente en behetrías, también tenían conocidas y propias patrias y naturalezas, y como quiera que de muchas dellas hay noticia, dejarse ha para su lugar, tomando el presente fundamento de los naturales pobladores del valle donde al presente está la ciudad del Cuzco, porque de aquí habemos de tomar el origen de la tiranía de los ingas, los cuales siempre tuvieron su silla en el valle del Cuzco.","zh":"我已经说过，这些地方的村落古时虽然是无主之民，各自保全、各自生活，却也有各自公认的故土和族属。其中许多都有记载可查，留待适当的地方再讲；现在先从如今库斯科城所在的这个山谷的本地居民讲起，因为诸印加暴政的起源要从这里讲起，他们始终把王座设在库斯科谷。","tr":"p"},"s9-2":{"src":"s","ch":9,"pg":"pp. 112–113","es":"Ante todas cosas es de saber quel valle de Cuzco está en trece grados y un cuarto de latitud de la equinoccial a la parte del polo del sur. En este valle, por ser fértil para sementeras, poblaron antiquísimamente tres naciones o parcialidades, llamadas la una Sauaseras, la segunda Antasayas, la tercera Guallas. Poblaron cerca los unos de los otros, aunque distintamente, por las tierras de sementera, que era lo que en aquellos tiempos, y aun agora, principalmente procuran y estiman. Y estos naturales deste dicho valle vivieron aquí en quietud cultivando sus labranzas muchos siglos.","zh":"首先要知道，库斯科谷位于赤道以南十三又四分之一度。这个山谷土地肥沃，宜于耕种，极古之时便有三个族群（或称三部）在此定居：一族叫萨瓦西赖，第二族叫安塔萨亚克，第三族叫瓦利亚。他们住得彼此相近，但界限分明，各占耕地；耕地是当时、乃至现在他们最为追求和看重的东西。这个山谷的这些本地人在这里安安静静地种地，过了许多世纪。","tr":"p"},"s9-3":{"src":"s","ch":9,"pg":"p. 113","es":"Y algunos tiempos antes de los ingas se averigua que tres cinches extranjeros deste valle, llamados el uno Alcabiza y el segundo Copalimaita y el tercero Culumchima, juntaron ciertas compañas y vinieron al valle del Cuzco, adonde por consentimiento de los naturales dél asentaron y poblaron y se hicieron hermanos y compañeros de los naturales antiquísimos ya dichos. Y así vivieron muchos tiempos en concordia estos seis bandos, tres naturales y tres advenedizos, en conformidad. Y cuentan que los advenedizos salieron de donde los ingas, como después diremos, y se llaman sus parientes. Y éste es punto sustancial para lo de adelante.","zh":"可以查明，在诸印加之前若干时候，有三名来自山谷以外的军事首领，一个叫阿尔卡维萨，第二个叫科帕利迈塔，第三个叫库伦奇马，聚集了一些部众，来到库斯科谷，经谷中本地人同意，在此落户定居，同上面所说的那些极古的本地人结为兄弟和伙伴。于是这六派，三派本地人、三派外来者，和睦相处了很长时间。据说这些外来者是从诸印加出来的地方出来的，这一点我们以后再讲，他们也自称是诸印加的亲属。这是后文的一个要点。","tr":"p"},"s9-4":{"src":"s","ch":9,"pg":"pp. 113–114","es":"Mas antes de entrar en el cuerpo de la historia de los ingas quiero advertir, o, hablando más propriamente, responder a una dificultad que se podría ofrecer a los que no han estado en estas partes. Podrían algunos decir que no tienen por cierta esta historia, hecha por la relación que estos bárbaros dan, porque, no tiniendo letras, no pueden tener en la memoria tantas particularidades como aquí se cuentan, de tanta antigüedad. A esto se responde que, para suplir la falta de letras, tenían estos bárbaros una curiosidad muy buena y cierta, y era que unos a otros, padres a hijos, se iban refiriendo las cosas antiguas pasadas hasta sus tiempos, repitiéndoselas muchas veces, como quien lee lección en cátedra, haciéndoles repetir las tales lecciones historiales a los oyentes, hasta que se les quedasen en la memoria fijas. Y así, cada uno a sus descendientes iba comunicando sus anales por esta orden dicha, para conservar sus historias y hazañas y antigüedades y los números de las gentes, pueblos y provincias, días, meses y años, batallas, muertes, destruiciones, fortalezas y cinches. Y finalmente las cosas más notables, que consisten en número y cuerpo, notábanlas, y agora las notan, en unos cordeles a que llaman quipo, que es lo mesmo que decir racional o contador. En el cual quipo dan ciertos ñudos, como ellos saben, por los cuales y por las diferencias de las colores distinguen y anotan cada cosa como con letras. Es cosa de admiración ver las menudencias que conservan en aquestos cordelejos, de los cuales hay maestros, como entre nosotros del escrebir.","zh":"不过，在进入诸印加历史的正文之前，我想先提醒一件事，说得更确切些，是回答一个疑问，没到过这些地方的人可能会提出来。有人或许会说，这部历史是根据这些野蛮人的叙述写成的，不足为信，因为他们没有文字，不可能记住这里所讲的这么多年代久远的细节。对此的回答是：为了弥补没有文字的缺憾，这些野蛮人有一种很好、很可靠的讲究，就是一代传一代、父传子，把从前的旧事一直讲到他们自己的时代，反复讲述，如同在讲席上授课，让听的人复述这些历史课业，直到牢牢记住为止。就这样，每人都按这个办法把自己的编年传给子孙，以保存他们的历史、功业和古事，以及人口、村落和省份的数目，日、月、年，战役、死亡、毁灭、要塞和军事首领。最后，那些由数目和实物构成的最重要的事情，他们记在一种叫基普的绳子上，从前如此，现在也如此；基普的意思就是“会计”或“计数者”。他们在基普上打出一定的结，怎么打他们自己知道，凭这些结和颜色的差别来区分、记录每一件事，就像用文字一样。他们在这些小绳子上保存了那么多细节，实在令人惊叹；这门技艺有专门的师傅，就像我们这里有教书写的师傅一样。","tr":"p"},"s9-5":{"src":"s","ch":9,"pg":"pp. 114–115","es":"Y demás desto había, y aún agora hay, particulares historiadores destas naciones, que era oficio que se heredaba de padre a hijo. Al[l]egóse a esto la grandísima diligencia del Pachacuti Inga Yupangui, noveno inga, el cual hizo llamamiento general de todos los viejos historiadores de todas las provincias quél sujetó, y aun de otras muchas más de todos estos reinos, y túvolos en la ciudad del Cuzco mucho tiempo, examinándolos sobre las antigüedades, origen y cosas notables de sus pasados destos reinos. Y después que tuvo bien averiguado todo lo más notable de las antigüedades de sus historias, hízolo todo pintar por su orden en tablones grandes, y deputó en las Casas del Sol una gran sala adonde las tales tablas, que guarnecidas de oro estaban, estuviesen como [en] nuestras librerías, y constituyó doctores que supiesen entenderlas y declararlas. Y no podían entrar donde estas tablas estaban sino el inga o los historiadores, sin expresa licencia del inga.","zh":"此外，这些族群还有、现在也还有专门的史官，这是父子相传的职务。再加上第九位印加帕查库蒂·印加·尤潘基极其用心：他把所征服各省、乃至这些王国其他许多省份的老史官统统召集起来，让他们在库斯科城待了很长时间，考问这些王国先人的古事、起源和大事。他把历史古事中最重要的部分都查明以后，叫人把一切按次序画在大木板上，又在太阳殿里专辟一间大厅，存放这些镶金的画板，就像我们的藏书室一样，还设立了能看懂、能讲解这些画板的博学之士。没有印加的明确许可，除了印加本人和史官，谁也不能进入存放画板的地方。","tr":"p"},"s9-6":{"src":"s","ch":9,"pg":"pp. 115–116","es":"Y desta manera se vino [a] averiguar todo lo de sus pasados y a quedar tan manual a toda suerte de gentes, quel día de hoy los indios menudos y los mayores generalmente lo saben, aunque en algunas cosas tengan varias opiniones, por particulares intereses. Y así, examinando de toda condición de estados de los más prudentes y ancianos, de quien se tiene más crédito, saqué y recopilé la presente historia, refiriendo las declaraciones y dichos de unos a sus enemigos, digo del bando contrario, porque se acaudillan por bandos, y pidiendo a cada uno memorial por sí de su linaje y del de su contrario. Y estos memoriales, que todos están en mi poder, refiriéndolos y corrigiéndolos con sus contrarios, y últimamente ratificándolos en presencia de todos los bandos y aillos en público, con juramento, por autoridad de juez y con lenguas expertas generales y muy curiosos y fieles intérpretes, también juramentados, se ha afinado lo que aquí va scripto. Hase hecho tanta diligencia porque cosa que es fundamento del hecho verdadero de tan gran negocio como es el averiguar la tiranía de los crueles ingas desta tierra, para que todas naciones del mundo entiendan el jurídico y más que legítimo título quel rey de Castilla tiene a estas Indias y a otras tierras a ellas vecinas, especialmente a estos reinos del Pirú, y como todas las historias y hechos pasados consista la averiguación dellos en probanza, y en este caso se haya hecho tan curiosa y fielmente por mandado e industria del excelentísimo virrey Don Francisco de Toledo, nadie tiene que dudar, sino que está bastantísimamente averiguado y verificado todo lo deste volumen, sin quedar lugar a réplica o contradición. He querido hacer esta digresión, porque, escrib[i]endo esta historia, oí a muchos las dudas que arriba propuse, y parecióme satisfacer de una vez a todas.","zh":"就这样，他们先人的一切都查明了，而且各色人等都熟知，今天无论小民还是头面人物普遍都知道，只是在某些事情上因各自的利害而说法不一。于是，我向各阶层中最明智、最年长、最可信的人询问，整理汇编成这部历史；我把一方的陈述和说法拿去同他们的对头——我是说对立的一派——对证，因为他们是按派系结党的；我又让每一方各自交一份书面陈述，讲自己的世系，也讲对方的世系。这些陈述现在都在我手里，我把它们拿去与对方对质、改正，最后在所有派系和亲族共同体面前公开核实，当众宣誓，由法官主持，有精通通用语的通译和极其细心可靠的翻译在场，他们也都宣过誓；这里写下的内容就是这样定稿的。之所以下这么大的功夫，是因为这件事是一桩大事的真实依据，即查明这片土地上残暴的诸印加的暴政，好让世界各国都明白，卡斯蒂利亚国王对这些印度群岛及其邻近的其他土地，尤其是对秘鲁这些王国，拥有合乎法理、而且再正当不过的权利；既然一切历史和往事的查明都在于举证，而此事又是奉最尊贵的总督弗朗西斯科·德·托莱多之命、在他亲自督办下如此细致忠实地做成的，那么谁也不必怀疑，本书所载的一切都已查明核实，确凿无疑，没有留下反驳或异议的余地。我之所以插进这段题外话，是因为我写这部历史时，听到许多人提出上面所说的疑问，我觉得最好一次全部答复。","tr":"p"},"sfee-1":{"src":"s","ch":"fee","pg":"p. 283","es":"En la ciudad del Cuzco, a veinte y nueve días del mes de hebrero de mill y quinientos y setenta y dos años, antel muy excelente señor Don Francisco de Toledo, mayordomo de Su Majestad y su visorrey, gobernador y capitán general destos reinos e provincias del Pirú y presidente de la Real Audiencia y Chancillería que reside en la Ciudad de los Reyes, e por ante mí, Álvaro Ruiz de Navamuel, su secretario y de la gobernación y visita general destos reinos, el capitán Pedro Sarmiento de Gamboa presentó una petición del tenor sigu[i]ente:","zh":"一千五百七十二年二月二十九日，于库斯科城，在陛下内廷总管、秘鲁诸王国和诸省总督、行政长官兼军事统帅、驻诸王之城皇家检审庭兼大法院院长、极尊贵的弗朗西斯科·德·托莱多大人面前，并在我——其秘书兼诸王国政务与全境巡察秘书阿尔瓦罗·鲁伊斯·德·纳瓦穆埃尔——面前，佩德罗·萨米恩托·德·甘博亚上尉呈上一份申请书，全文如下：","tr":"p"},"sfee-10":{"src":"s","ch":"fee","pg":"p. 285","es":"Aillu de Cápac Yupangui: Don Francisco Copca Maita, de setenta y un años, Don Juan Quispi Maita, de treinta años, Don Juan Apo Maita, de treinta años.","zh":"卡帕克·尤潘基的亲族共同体：堂弗朗西斯科·科普卡·迈塔，七十一岁；堂胡安·基斯皮·迈塔，三十岁；堂胡安·阿波迈塔，三十岁。","tr":"p"},"sfee-11":{"src":"s","ch":"fee","pg":"p. 286","es":"Aillu de Inga Roca: Don Pedro Hachacona, de cincuenta y tres años, Don Diego Maita, de cuarenta años.","zh":"印加·罗卡的亲族共同体：堂佩德罗·阿查科纳，五十三岁；堂迭戈·迈塔，四十岁。","tr":"p"},"sfee-12":{"src":"s","ch":"fee","pg":"p. 286","es":"Aillu de Yáguar G[u]ácac: Juan Yupangui, de sesenta años, Martín Rimache, de veinte y seis años.","zh":"亚瓦尔·瓦卡克的亲族共同体：胡安·尤潘基，六十岁；马丁·里马切，二十六岁。","tr":"p"},"sfee-13":{"src":"s","ch":"fee","pg":"p. 286","es":"Aillu de Uiracocha: Don Francisco Andiguallpa, de ochenta y nueve años, Martín Quechgua Çucçu, de sesenta y cuatro años, Don Francisco Challco Yupangui, de cuarenta y cinco años.","zh":"维拉科查的亲族共同体：堂弗朗西斯科·安迪瓦尔帕，八十九岁；马丁·克奇瓦·苏克苏，六十四岁；堂弗朗西斯科·查尔科·尤潘基，四十五岁。","tr":"p"},"sfee-14":{"src":"s","ch":"fee","pg":"p. 286","es":"Aillu de Pachacuti: Don Diego Cayo, de sesenta y ocho años, Don Juan Guallpa Yupangui, de sesenta y cinco años, Don Domingo Páscac, de noventa años, Don Juan Quispi Cusi, de cuarenta y cinco años, Don Francisco Chauca Rimache, de cuarenta años, Don Francisco Cota Yupangui, de cuarenta años, Don Gonzalo Guacangui, de setenta años, Don Francisco Quicgua, de sesenta y ocho años.","zh":"帕查库蒂的亲族共同体：堂迭戈·卡约，六十八岁；堂胡安·瓦尔帕·尤潘基，六十五岁；堂多明戈·帕斯卡克，九十岁；堂胡安·基斯皮·库西，四十五岁；堂弗朗西斯科·乔卡·里马切，四十岁；堂弗朗西斯科·科塔·尤潘基，四十岁；堂贡萨洛·瓦坎基，七十岁；堂弗朗西斯科·基克瓦，六十八岁。","tr":"p"},"sfee-15":{"src":"s","ch":"fee","pg":"p. 286","es":"A[i]llu de Topa Inga: Don Cristóbal Písac Topa, de cincuenta años, Don Andrés Topa Yupangui, de cuarenta años, Don García Pillco Topa, de cuarenta años, Don Juan Cozco, de cuarenta años.","zh":"图帕克·印加的亲族共同体：堂克里斯托瓦尔·皮萨克·图帕克，五十岁；堂安德烈斯·图帕克·尤潘基，四十岁；堂加西亚·皮尔科·图帕克，四十岁；堂胡安·科斯科，四十岁。","tr":"p"},"sfee-16":{"src":"s","ch":"fee","pg":"pp. 286–287","es":"Aillu de Guaina Cápac: Don Francisco Saire, de veinte y ocho años, Don Francisco Ninan Coro, de veinte y cuatro años, Don García Rímac Tupa, de treinta y cuatro años.","zh":"瓦伊纳·卡帕克的亲族共同体：堂弗朗西斯科·赛雷，二十八岁；堂弗朗西斯科·尼南·科罗，二十四岁；堂加西亚·里马克·图帕克，三十四岁。","tr":"p"},"sfee-17":{"src":"s","ch":"fee","pg":"p. 287","es":"Aillu de Guáscar: Don Alonso Tito Atauchi, de cuarenta años.","zh":"瓦斯卡尔的亲族共同体：堂阿隆索·提托·阿陶奇，四十岁。","tr":"p"},"sfee-18":{"src":"s","ch":"fee","pg":"p. 287","es":"Y demás destos aillus: Don García Páucar Çucçu, de treinta y cuatro años, Don Carlos Ayallilla, de cincuenta años, Don Juan Apanca, de ochenta años, Don García Apu Rinti, de setenta años, Don Diego Viracocha Inga, de treinta y cuatro años, Don Gonzalo Topa, de treinta años.","zh":"这些亲族共同体以外，还有：堂加西亚·保卡尔·苏克苏，三十四岁；堂卡洛斯·阿亚利利亚，五十岁；堂胡安·阿潘卡，八十岁；堂加西亚·阿普·林蒂，七十岁；堂迭戈·维拉科查·印加，三十四岁；堂贡萨洛·图帕克，三十岁。","tr":"p"},"sfee-19":{"src":"s","ch":"fee","pg":"pp. 287–289","es":"Y estando así juntos en presencia de Su Excelencia, el dicho señor alcalde de corte, por lengua de Gonzalo Gómez Jiménez, intérprete de Su Excelencia, en la lengua general de los indios les dijo: Que quiriendo Su Excelencia averiguar y poner en scripto y crónica el origen de los ingas sus antepasados y descendencia dellos, y los hechos que cada uno dellos hizo en su tiempo, y en qué partes fué obedecido cada uno y cuál dellos fué el primero que salió del Cuzco a señorear otras tierras, y cómo Topa Inga Yupangui, y después dél Guaina Cápac y Guáscar, su hijo y nieto, por fuerza de armas se enseñorearon de todo el Pirú. Y para poderlo hacer con más verificación, mandó que se hiciese información y otras averiguaciones en esta ciudad y en otras partes, y que de la dicha información y averiguaciones el capitán Pedro Sarmiento, a quien lo cometió, sacase la verdadera historia y crónica, y que agora el dicho Pedro Sarmiento lo ha hecho y presentado ante Su Excelencia, para averiguar si está verdaderamente scripta y conforme a los dichos y declaraciones que algunos indios de los dichos aillos dijeron en la dicha información, y porque Su Excelencia está informado que los aillos y descendientes de cada uno de los doce ingas han conservado entre sí la memoria de los hechos de sus pasados y son los que mejor podrían entender si la dicha crónica está verdadera o defetuosa, los ha hecho juntar aquí, para que en su presencia se lea y dé a entender, y ellos entre sí pratiquen sobre lo que se les leyere y declarare por la dicha lengua, y vean si es conforme a la verdad quellos saben; y para que con más obligación la digan de lo que supieren, mandó que se les tomase juramento. E los dichos indios dijeron que han entendido para qué han sido llamados, y lo que se les ha propuesto; y juraron por la dicha lengua, por Dios Nuestro Señor y por una señal de cruz, que dirán verdad acerca de lo que supieren de la dicha historia. Y hecho el dicho juramento, se les comenzó a leer en suma y sustancia, y se les leyó y acabó de leer y declarar el dicho día y otro sigu[i]ente, desde la fábula que los dichos indios dicen de su creación hasta el fin de lo que es historia de los ingas. Y como se iba leyendo, se les iba declarando por la dicha lengua cada capítulo por sí; sobre lo cual y sobre cada uno de los dichos capítulos los dichos indios iban platicando y confiriendo entre sí, como lo diclaró la dicha lengua. Y todos juntos se conformaron y dijeron por el dicho intérprete que la dicha historia estaba buena y verdadera y conforme a lo que ellos sabían y habían oído decir a sus padres y pasados, quellos lo habían oído decir a los suyos —porque, como ellos no tenían escriptura como los españoles, no tenían cómo conservar entre sí estas antigüedades si no era diciéndolo de lengua en lengua y de edad en edad y de unos a otros—, y que a los dichos sus padres y pasados oyeron decir que Pachacuti Inga Yupangui, noveno inga, había averiguado la historia de los otros ingas que habían sido antes dél, y pintádola en unos tablones, de donde también lo habían aprendido los dichos sus padres y pasados y díchoselo a ellos. Y solamente enmendaron algunos nombres de algunas personas y lugares y otras cosas livianas, las cuales el dicho señor alcalde de corte mandó que se pusiesen como lo decían los dichos indios, y así se pusieron. Y con las dichas enmiendas todos los dichos indios de una conformidad dijeron que la dicha historia está buena y verdadera, conforme a lo que ellos saben e oyeron decir a los dichos sus pasados; porque lo han conferido y tratado entre sí y averiguádola desdel principio ha[s]ta el fin, y que creían que ninguna otra historia que se haya hecho será tan cierta y verdadera como ésta, porque nunca se ha hecho tan diligente examinación, ni se les ha preguntado a ellos nada, que son los que pueden saber la verdad. Y el dicho señor alcalde de corte lo firmó, y ansimismo la dicha lengua. El doctor Loarte, Gonzalo Gómez Jiménez. Ante mí, Álvaro Ruiz de Navamuel.","zh":"他们这样聚在一起，在大人面前，上述王室法庭法官阁下通过大人的通译贡萨洛·戈麦斯·希门尼斯，用印第安人的通用语对他们说：大人想要查明并以文字、编年史的形式写下他们的祖先诸印加的起源和世系，每一位所作的事迹，各人在哪些地方受人服从，其中谁最先走出库斯科去统治别的土地，以及图帕克·印加·尤潘基、他之后的他的儿子瓦伊纳·卡帕克和孙子瓦斯卡尔如何以武力成为整个秘鲁的主人。为了做得更加确凿可靠，大人下令在本城和其他地方进行调查和其他查证，并命受托此事的佩德罗·萨米恩托上尉根据上述调查和查证整理出真实的历史和编年史；现在佩德罗·萨米恩托已经完成，呈交大人，需要查明它是否写得真实，是否与上述亲族共同体的一些印第安人在上述调查中所作的陈述和供词相符；又因为大人得知，十二位印加各自的亲族共同体和后裔在他们中间保存着对先人事迹的记忆，他们最能判断这部编年史是真实的还是有缺失的，所以把他们召集到这里，好在他们面前宣读、讲解，让他们就所读的、经通译讲解的内容彼此商议，看看是否与他们所知道的事实相符；为了让他们更有义务说出所知道的情况，大人下令让他们宣誓。上述印第安人说，他们明白了为什么被召来，也明白了向他们提出的事情；他们通过通译，以我主上帝和十字架的标记起誓，就他们所知道的有关这部历史的情况说实话。宣誓以后，开始向他们宣读要旨和大意；在当天和第二天宣读、讲解完毕，从印第安人所说的他们被创造的神话，一直到诸印加历史的结尾。一边宣读，通译一边逐章向他们讲解；对此，以及对每一章，印第安人都彼此商议、讨论，通译也是这样说明的。他们全体一致通过上述翻译说，这部历史写得好，是真实的，与他们所知道的、从他们的父辈和先人那里听来的相符，而他们的父辈先人又是从自己的先人那里听来的——因为他们没有西班牙人那样的文字，除了一张嘴传一张嘴、一代传一代、一人传一人以外，没有别的办法在他们中间保存这些古事——他们还说，他们听父辈和先人说过，第九位印加帕查库蒂·印加·尤潘基曾经查明在他以前的其他诸印加的历史，把它画在一些大木板上，他们的父辈和先人也是从那里学来，再讲给他们听的。他们只修改了一些人名、地名和其他细小的地方，上述王室法庭法官阁下下令按印第安人的说法改正，于是就照改了。有了这些修改，全体印第安人一致说，这部历史写得好，是真实的，与他们所知道的、从他们的先人那里听来的相符；因为他们彼此商议讨论过，从头到尾查证过，他们相信，已经写成的任何其他历史都不会像这一部这样确实可靠，因为从来没有做过这样认真的考查，也从来没有人问过他们，而他们才是能够知道真相的人。上述王室法庭法官阁下签了名，通译也签了名。洛阿尔特博士，贡萨洛·戈麦斯·希门尼斯。在我面前，阿尔瓦罗·鲁伊斯·德·纳瓦穆埃尔。","tr":"p"},"sfee-20":{"src":"s","ch":"fee","pg":"pp. 289–290","es":"E después de lo susodicho, en la dicha ciudad del Cuzco, a dos días del mes de marzo del dicho año, habiendo visto Su Excelencia la dicha declaración de los dichos indios e autos que sobre ello se hicieron, dijo que mandaba y mandó que con las enmiendas que los dichos indios dijeron que se debían hacer, se envíe la dicha historia a Su Majestad, sinada y autorizada de mí, el dicho secretario. Y puso escripto, y firmada del dicho doctor Grabiel de Loarte, que se halló presente a la verificación que della se hizo con los dichos indios, y firmólo. Don Francisco de Toledo. Ante mí, Álvaro Ruiz de Navamuel.","zh":"上述事项之后，同年三月二日，在上述库斯科城，大人看了上述印第安人的陈述和就此所作的文书以后，说：他下令并已下令，将这部历史按照印第安人所说应作的修改改好，由我这个秘书签署、认证以后，呈送陛下。并书写下来，由当时在场参加同印第安人核验的加布里埃尔·德·洛阿尔特博士签名；大人也签了名。弗朗西斯科·德·托莱多。在我面前，阿尔瓦罗·鲁伊斯·德·纳瓦穆埃尔。","tr":"p"},"sfee-3":{"src":"s","ch":"fee","pg":"pp. 283–284","es":"El Capitán Pedro Sarmiento, Cosmógrafo general destos reinos del Pirú, digo: Que por mando de Vuestra Excelencia yo he sacado y reducido a historia la corónica general del origen y descendencia de los ingas y de los hechos particulares que cada uno hizo en su tiempo y en la parte, y cómo fué obedecido cada uno dellos, y de la tiranía con que desde Topa Inga Yupangui, deceno inga, oprimieron y subjetaron estos reinos del Pirú, hasta que por orden del Emperador, de gloriosa memoria, vino a los conquistar Don Francisco Pizarro. La cual historia yo he sacado de las informaciones y otras averiguaciones que por mando de Vuestra Excelencia se han hecho en el valle de Xauxa y en la ciudad de Guamanga y en otras partes por donde Vuestra Excelencia ha venido visitando, y principalmente en esta ciudad del Cuzco, donde los ingas tuvieron su continua habitación y hay más noticia de sus hechos, y donde concurrieron los mitimaes de todas las provincias que los dichos ingas trujeron, y quedó la verdadera memoria, con sus aillos. Y porque la dicha historia tenga más auturidad, la presento ante Vuestra Excelencia y suplico la mande ver y corregir e interponer en ella su auturidad, para que, dondequie
