ra que pareciere, se le dé entera fee y crédito. PEDRO SARMIENTO DE GAMBOA.","zh":"秘鲁诸王国总宇宙志官佩德罗·萨米恩托上尉呈称：遵阁下之命，我已把诸印加的起源和世系、每一位印加在其时代和所在之处所作的具体事迹、各人如何受人服从，以及自第十位印加图帕克·印加·尤潘基以来他们用以压迫、征服秘鲁诸王国的暴政，直到弗朗西斯科·皮萨罗奉荣耀的先皇之命前来征服这些王国为止的通史，整理成书。这部历史，是我从阁下所命在豪哈谷、瓦曼加城以及阁下巡察所经的其他地方所做的调查和其他查证中整理出来的，主要是在这座库斯科城，诸印加一直住在这里，关于他们的事迹这里的消息最多，诸印加从各省迁来的移民都汇集在这里，真实的记忆连同他们的亲族共同体都留在这里。为使这部历史更有权威，我将它呈交阁下，恳请阁下下令审阅、订正，并赋予它阁下的权威，使它无论在何处出示，都能得到完全的信任。佩德罗·萨米恩托·德·甘博亚。","tr":"p"},"sfee-4":{"src":"s","ch":"fee","pg":"pp. 284–285","es":"E vista por Su Excelencia, dijo que para que se entienda si la dicha historia es conforme a las dichas informaciones e averiguaciones que se han hecho con los indios e otras personas desta ciudad y otras partes, mandaba e mandó quel doctor Loarte, alcalde de corte de Su Majestad, haga parecer ante sí los indios más principales y de mejor entendimiento de los doce aillos y descendencias de los doce ingas, y otras personas que le pareciere, y a todos, estando juntos por ante mí, el presente secretario, les haga leer la dicha historia y que se les declare por intérprete y lengua de los dichos indios, para que todos juntos vean y platiquen entre sí si es conforme a la verdad quellos saben. Y si hay alguna cosa que corregir y enmendar, y lo que pareciere questá en contrario a lo que ellos saben, se enmiende y corrija. Y así lo proveyó y firmólo. Don Francisco de Toledo. Ante mí, Álvaro Ruiz de Navamuel.","zh":"大人阅后说：为了弄清这部历史是否与在本城及其他地方向印第安人和其他人所做的上述调查和查证相符，他下令并已下令：由陛下的王室法庭法官洛阿尔特博士召来十二个亲族共同体、即十二位印加的后裔中最主要、最明白事理的印第安人，以及他认为合适的其他人，让他们全体聚在一起，在我这个秘书面前，向他们宣读这部历史，并由这些印第安人的翻译和通译向他们讲解，好让他们一起看看、彼此商议，是否与他们所知道的事实相符。如果有什么需要订正修改之处，以及看来与他们所知道的相反之处，就加以修改订正。他作此裁定，并签了名。弗朗西斯科·德·托莱多。在我面前，阿尔瓦罗·鲁伊斯·德·纳瓦穆埃尔。","tr":"p"},"sfee-5":{"src":"s","ch":"fee","pg":"p. 285","es":"E después de lo susodicho, este dicho día, mes y año, el ilustre señor doctor Grabiel de Loarte, en cumplimiento de lo proveído y mandado por Su Excelencia, en presencia de mí, el dicho secretario, hizo parecer ante sí a los indios, que dijeron ser de los nombres y edades y de los aillos sigu[i]entes:","zh":"上述事项之后，同年同月同日，加布里埃尔·德·洛阿尔特博士阁下为执行大人的裁定和命令，在我这个秘书面前，召来以下印第安人，他们自述的姓名、年龄和所属亲族共同体如下：","tr":"p"},"sfee-6":{"src":"s","ch":"fee","pg":"p. 285","es":"Aillo de Mango Cápac: Sebastián Ílluc, de treinta años, Francisco Páucar Chima, de treinta años.","zh":"曼科·卡帕克的亲族共同体：塞巴斯蒂安·伊柳克，三十岁；弗朗西斯科·保卡尔·奇马，三十岁。","tr":"p"},"sfee-7":{"src":"s","ch":"fee","pg":"p. 285","es":"Aillu de Cinche Roca: Diego Cayo Guallpa, de setenta años, Don Alonso Puzcon, de cuarenta años.","zh":"辛奇·罗卡的亲族共同体：迭戈·卡约·瓦尔帕，七十岁；堂阿隆索·普斯孔，四十岁。","tr":"p"},"sfee-8":{"src":"s","ch":"fee","pg":"p. 285","es":"Aillu de Lluque Yupangui: Hernando Guallpa, de sesenta años, Don García Ancuy, de cuarenta y cinco años, Miguel Rimache Maita, de treinta años.","zh":"略克·尤潘基的亲族共同体：埃尔南多·瓦尔帕，六十岁；堂加西亚·安库伊，四十五岁；米格尔·里马切·迈塔，三十岁。","tr":"p"},"sfee-9":{"src":"s","ch":"fee","pg":"p. 285","es":"Aillu de Maita Cápac: Don Juan Tambo Usca Maita, de sesenta años, Don Felipe Usca Maita, de setenta años, Francisco Usca Maita, de treinta años.","zh":"迈塔·卡帕克的亲族共同体：堂胡安·坦博·乌斯卡·迈塔，六十岁；堂费利佩·乌斯卡·迈塔，七十岁；弗朗西斯科·乌斯卡·迈塔，三十岁。","tr":"p"},"t1-1":{"src":"t","ch":1,"pg":"pp. 182–183","es":"En la ciudad del cuzco a quatro dias del mes de Henero de mill y quinientos y setenta y dos años el muy excelente señor don francisco de toledo mayordomo de su magestad su visorrey gouernador y capitan general destos rreynos y prouincias del peru y tierra firme presidente de la audiencia rreal que rreside en la ciudad de los rreyes &. dixo que por quanto demás de los hechos que estan prouados sobre la tirania con que los yngas subjetaron esta tierra su excelencia esta ynformado que los primeros yndios que subjetaron tiranicamente en tiempo que heran behetrias e no tenian señores sino zinches fueron yndios que auia donde agora esta poblada esta dicha ciudad y en lo que esta muy comarcano y subjeto a ella los quales aunque por fuerza sufrieron su señorio nunca de su voluntad los rreconocieron por señores antes siempre les hizieron contradicion y procuraron su libertad y porque de la dezendencia destos yndios hay a el presente diez ayllos y conuiene a el seruicio de su magestad que se auerigue esto y lo que sobrello passo por ende mandaua y mando al dotor grauiel de loarte alcalde de corte de su magestad que con yndios de los dichos ayllos de los mas viejos e ancianos y de autoridad y que mejor puedan sauer del caso haga la dicha aueriguacion ante aluaro rruiz de nauamuel secretario de su excelencia y de la gouernacion y visita general destos rreynos tomando por lengua a gonzalo gomez ximenez ynterprete y examinando los testigos por las preguntas siguientes.","zh":"1572年1月4日，于库斯科城。陛下内廷总管、秘鲁与陆地省诸王国及诸省的总督、行政长官兼军事统帅、驻诸王之城的皇家检审庭庭长，至尊的堂弗朗西斯科·德·托莱多大人等，宣称如下：印加人以暴政征服此地，已有多项事实证明；此外，阁下又获悉，印加人在此地尚为“无主之民”、没有领主而只有军事首领的时候，最早以暴政手段征服的，正是原住在如今本城所在之地，以及紧邻本城、隶属本城一带的印第安人。这些人虽然被迫忍受印加的统治，却从未心甘情愿地承认印加为领主，反而始终与之对抗，力求自由。又因这些印第安人的后裔目前共有十个亲族共同体，查明此事及相关经过有益于陛下的事务，阁下特此命令陛下的王室法庭法官加布里埃尔·德·洛阿尔特博士：从上述亲族共同体中挑选最年长、最有威望、最可能知情的印第安人，当着阁下及政务与全境巡察秘书阿尔瓦罗·鲁伊斯·德·纳瓦穆埃尔的面进行调查，以贡萨洛·戈麦斯·希门尼斯为通译，按以下问题询问证人。","tr":"p"},"t1-10":{"src":"t","ch":1,"pg":"p. 184","es":"—la qual dicha ynformacion y aueriguacion se haga con numero de testigos juntos por ser el mejor medio que en esta tierra se a tenido para sauer y aueriguar verdad y hecha el dicho alcalde de corte ponga en ella y en los traslados que se sacaren su autoridad y decreto judicial y ansi lo proueyo y firmolo Don Francisco de Toledo ante mi Alvaro Ruiz de Nauamuel.","zh":"上述调查与查证，应让若干证人一同作证，因为这是此地向来查明真相的最好办法。查毕，上述王室法庭法官应在调查录及由此抄出的各份副本上加具其权威与司法裁定。阁下如此裁定，并签名：堂弗朗西斯科·德·托莱多。在我面前：阿尔瓦罗·鲁伊斯·德·纳瓦穆埃尔。","tr":"p"},"t1-2":{"src":"t","ch":1,"pg":"p. 183","es":"—Primeramente se les a de preguntar como se llaman y la edad y calidad que tienen y de que aillos son y donde viuieron sus antepasados en tiempos antiguos.","zh":"【第一问】首先，问他们叫什么名字，年龄、身份如何，属于哪个亲族共同体，祖先古时住在哪里。","tr":"p"},"t1-4":{"src":"t","ch":1,"pg":"p. 183","es":"—si es uerdad quel primero ynga que se llamaua mango capac tiranicamente y por fuerça de armas subjeto y quito sus tierras a los yndios questauan poblados en el sitio desta ciudad del cuzco matandolos y haciendoles guerras y malos tratamientos y lo mismo hizieron los demas yngas hasta el quarto que los ácauo de subjetar que fue maita capac.","zh":"【第三问】名叫曼科·卡帕克的第一位印加，是否确实以暴政手段、凭武力征服了住在本库斯科城所在之地的印第安人，夺走他们的土地，杀害他们，对他们开战、加以虐待；其余诸印加是否也同样如此，直到第四位、最终把他们完全征服的迈塔·卡帕克。","tr":"p"},"t1-5":{"src":"t","ch":1,"pg":"p. 183","es":"—si es uerdad queste maita capac quarto ynga por fuerça de armas los subjeto y tiraniço vsurpandoles sus tierras y desterrando dellas a sus antepassados y matando mucha gente los hizo tributarios y los desterro a donde agora estan desterrados desde aquel tiempo junto a la ciudad del cuzco poco mas de vn tiro de arcabuz.","zh":"【第四问】这位第四位印加迈塔·卡帕克，是否确实凭武力征服他们、对他们施行暴政，霸占他们的土地，把他们的祖先逐出这些土地，杀了许多人，使他们成为纳贡者，并把他们流放到自那时起一直被流放至今的地方——就在库斯科城旁，相距一火绳枪射程多一点。","tr":"p"},"t1-6":{"src":"t","ch":1,"pg":"p. 183","es":"—si es verdad que despues sus antepassados que fueron de los dichos ayllos se quisieron libertar desta tirania como gente opresa y que contra voluntad le siruian y quantas veces yntentaron libertarse.","zh":"【第五问】他们的祖先，即上述亲族共同体的人，后来是否确实作为受压迫、违心为印加服役的人，想要摆脱这一暴政；他们曾多少次试图争取自由。","tr":"p"},"t1-9":{"src":"t","ch":1,"pg":"p. 184","es":"—yten si sauen que todo lo susodicho es publico y notorio entrellos y lo tienen por cossa muy cierta y aueriguada.","zh":"【第八问】又，他们是否知道，以上所有事项在他们之中众所周知，被视为确凿查明之事。","tr":"p"},"t2-1":{"src":"t","ch":2,"pg":"p. 184","es":"E para hazer la dicha ynformacion e aueriguacion en la dicha ciudad del cuzco a veinte y seis dias del mes de henero del dicho año fue tomado y rreciuido juramento en forma de derecho por dios nuestro señor y por vna señal de cruz de gonzalo gomez ximenez lengua e ynterprete de su excelencia de la lengua de los yndios so cargo del qual prometio de declarar e ynterpretar la uerdad de lo que se preguntare a los yndios que para ynfformacion de lo contenido en las dichas preguntas arriba dichas fueren tomados por testigos y que si ansi lo hiciere dios le ayude y si no se lo demande y firmolo Gonzalo Gomez Ximenez.—Aluaro Ruiz de Nauamuel.","zh":"为进行上述调查与查证，同年1月26日，于上述库斯科城，阁下的印第安语通译贡萨洛·戈麦斯·希门尼斯以我主上帝和十字记号依法宣誓。他据此誓言承诺：为查明上述各问所涉事项而被传为证人的印第安人，凡向他们询问之事，他都将如实转述和翻译；若如此行事，愿上帝佑助，否则愿上帝追究。签名：贡萨洛·戈麦斯·希门尼斯。——阿尔瓦罗·鲁伊斯·德·纳瓦穆埃尔。","tr":"p"},"t3-1":{"src":"t","ch":3,"pg":"p. 185","es":"I—a la primera pregunta que les fue hecha y declarada por la dicha lengua dixeron llamarse de los nombres y tener las hedades y qualidades y ser de los aillos siguientes [al margen: ayllo de sauasiray] vn yndio que dixo llamarse martin maita sauasiray de sesenta y cinco años. —otro yndio que dixo llamarse juan chalcomayta y de hedad de treynta años. —otro que dixo llamarse lucas huybamaita de quarenta y cinco años. —otro que dixo llamarse alonso carrasco sucso de hedad de treinta e vn años. —otro que dixo llamarse francisco vilcas de hedad de diez y ocho o veinte años.","zh":"【答第一问】对向他们提出、并经上述通译解释的第一问，他们说出了各自的姓名、年龄、身份，以及所属的亲族共同体，如下：［页边：萨瓦西赖亲族共同体］一名印第安人，自称马丁·迈塔·萨瓦西赖，65岁。——另一名印第安人，自称胡安·查尔科迈塔，30岁。——另一人，自称卢卡斯·维巴迈塔，45岁。——另一人，自称阿隆索·卡拉斯科·苏克索，31岁。——另一人，自称弗朗西斯科·比尔卡斯，18或20岁。","tr":"p"},"t3-10":{"src":"t","ch":3,"pg":"pp. 188–189","es":"IIII—a la quarta pregunta dixeron los dichos alcabizas que a los dichos sus padres y antepasados oyeron quel dicho maytacapac quarto ynga por fuerça de armas los subjeto y tiranizo tomandoles sus tierras e desterrando dellas a sus antepasados e mato mucha gente dellos y prendio a [A]pomaita y a cusco chima queran cinches de los dichos alcavizas e los tuuo presos en vna carcel que llamauan sanzaguazi donde se daua mucho tormento a los que en ella entrauan y les matauan la qual enemistad tomo el dicho maytacapac con los dichos alcabizas por le auer defendido sus antepassados las dichas sus tierras e quentendiendo el ynga questos eran yndios que se le rresistian y que podian venir a ser mas quel los matauan y acabauan como dicho tienen y los hazia tributar y que le rrespetasen por fuerça y que como yndios themerosos de las crueldades quel dicho ynga les hacia cumplian lo quel dicho ynga les mandaua contra su voluntad y les desterro donde agora estan estos dichos testigos del ayllo de los dichos alcauizas y ayarucho ques vn tiro de arcabuz poco mas o menos del asiento que auian tomado y los otros yndios de los dichos dos ayllos dixeron que lo mismo que an dicho los dichos alcabizas les dixeron e lo oyeron dezir a sus antepasados y que en aquel tiempo los yndios de sus ayllos viendo las crueldades y muertes quel dicho maytacapac hazia en los dichos alcabizas aunquel dicho maytacapac y su gente se les yuan entrando en sus tierras y tomandoles sus aguas no osauan rresistirlo de miedo porque veian que demas de lo susodicho a las mugeres de los dichos alcabizas las abrian por la barriga y las sacauan las criaturas muertas del cuerpo y que ansi contra su voluntad y por la fuerça que les hazian les dexauan entrar en las dichas sus tierras y todos dixeron que nunca rreconozieron ni tuuieron a el dicho maytacapac por señor y questo es lo que sauen desta pregunta por lo auer oydo dezir como dicho tienen a los dichos sus padres.","zh":"【答第四问】上述阿尔卡维萨人说：他们听父辈和祖先说，上述第四位印加迈塔·卡帕克凭武力征服他们、对他们施行暴政，夺走他们的土地，把他们的祖先逐出这些土地，杀了他们许多人，还抓了阿尔卡维萨人的两位军事首领阿波迈塔和库斯科·伊奇马，把他们关在一座叫桑萨瓦西的监狱里——进去的人要受许多折磨，并被杀死。迈塔·卡帕克之所以与阿尔卡维萨人结仇，是因为他们的祖先保卫自己的土地，不让他夺取；这位印加认为，这些印第安人在反抗他，而且可能变得比他更强，所以就像他们所说的那样，杀死、消灭他们，强迫他们纳贡，强迫他们尊敬他。他们作为惧怕这位印加种种残暴的印第安人，违心地执行他的命令。他把他们流放到如今这些阿尔卡维萨和阿亚尔·乌丘亲族共同体的证人所住的地方，离他们原先占据的居地大约一火绳枪射程。另外两个亲族共同体的印第安人说，阿尔卡维萨人所说的这些，他们的祖先也对他们讲过，他们也是从祖先那里听来的。他们说，当时他们这两个亲族共同体的印第安人，看到迈塔·卡帕克对阿尔卡维萨人的残暴和杀戮，虽然迈塔·卡帕克和他的人也在不断侵入他们的土地、夺取他们的水源，却因为害怕而不敢反抗。因为他们看到，除了上面所说的种种之外，阿尔卡维萨人的妇女被剖开肚子，从体内取出死去的胎儿。所以，他们违心地、在对方的强力之下，听任对方进入自己的土地。他们全都说，从未承认迈塔·卡帕克，也从未奉他为领主。关于这一问，他们所知就是这些，如前所说，都是从父辈那里听来的。","tr":"p"},"t3-11":{"src":"t","ch":3,"pg":"pp. 189–190","es":"—a la quinta pregunta dixeron todos juntos y cada vno dellos que oyeron dezir a los dichos sus antepasados que en tiempo del dicho mango capac e despues del en tiempo de otros yngas siempre sus pasados procurauan de libertarse desta tirania por estar tan opressos como los tenian y que avnque lo tratauan entre si no osauan hazerlo por que no los acauasen de matar y porquel dicho mayta capac y sus subzesores siempre tenian mucha guarda y espias sobre todos ellos y que siempre desearon vengarse de los dichos yngas y de las muertes que en ellos auian hecho e que quando los españoles entraron en esta tierra se holgaron y gualparoca que era de la decendencia de los alcabizas hermano del dicho juan pizarro yndio hizo sacar de sus guacas e depositos y escondrijos que tenian el oro y plata que pudieron para dar a los españoles por que los ayudasen contra los yngas de quien tanto mal auian rreciuido y los libertasen dellos y les hiziesen boluer las tierras que heran de sus antepasados y el dicho juan pizarro yupangui dixo quel auia lleuado el dicho oro y plata con otros muchos yndios juntamente con la contribucion general que se hizo para los españoles despues de preso atabalipa pero que lo lleuo por mandado del dicho capitan para el dicho effeto y lo dio a el marques don francisco piçarro lo qual vinieron a entender los yngas decendientes de guaynacapac y que estauan muy mal con ellos y que si los españoles no tomaran y señorearan esta tierra entienden que los acabaran de matar a todos por esta traycion y que aun hasta agora los decendientes de los dichos yngas les tienen mala voluntad porquestos testigos les dizen que les tienen tomadas sus tierras contra su voluntad y que son aduenedizos y sus antepassados y ellos son naturales deste sitio y valle del cuzco y questo osan dezir porque ay españoles porque antes no lo osaran dezir.","zh":"【答第五问】他们全体并逐一说：他们听上述祖先说，在曼科·卡帕克的时代，以及他之后其他印加的时代，他们的先人一直想摆脱这一暴政，因为他们受压迫太深。虽然私下商议过，却不敢行动，怕被斩尽杀绝，也因为迈塔·卡帕克和他的继承者对他们所有人一直严加看守、遍布耳目。他们一直想向这些印加报仇，报族人被杀之仇。西班牙人进入这片土地时，他们很高兴。阿尔卡维萨后裔瓦尔帕罗卡——上述印第安人胡安·皮萨罗的兄弟——让人从他们的圣地、仓库和藏匿处尽可能多地取出金银，送给西班牙人，好让西班牙人帮他们对付给他们带来如此多灾祸的印加人，使他们摆脱印加，并把原属他们祖先的土地还给他们。上述胡安·皮萨罗·尤潘基说，阿塔瓦尔帕被俘以后，为西班牙人进行过一次总征收，他和其他许多印第安人一起，随这次总征收把上述金银送了过去；但他是奉上述那位首领之命、为上述目的送去的，并把它交给了弗朗西斯科·皮萨罗侯爵。瓦伊纳·卡帕克的后裔诸印加得知此事，对他们非常怨恨。他们认为，要不是西班牙人占领并统治了这片土地，那些印加会因为这次背叛把他们全部杀光。直到如今，上述诸印加的后裔仍对他们怀恨在心，因为这些证人对他们说：你们违背我们的意愿占着我们的土地，你们是外来者，而我们和我们的祖先才是这个地方、这片库斯科谷地的本地人。他们说，他们现在敢这样说，是因为有西班牙人在；以前他们是不敢说的。","tr":"p"},"t3-12":{"src":"t","ch":3,"pg":"p. 190","es":"—a la sesta pregunta dixeron todos juntos y cada vno dellos que dizen lo que dicho tienen y que a los dichos sus pasados oyeron dezir que los mismos antepasados nunca de su voluntad tuuieron ni rreconocieron a ninguno de los yngas por señores sino por miedo y contra su voluntad por las grandes crueldades y muertes que contra ellos y los demas hacian los obedezian y los dichos juan pizarro y sebastian yupangui y don francisco quyspi y don diego yupangui y don pedro leon piaucary dixeron quellos conocieron a guaynacapac e a guascar ynga su hijo y que nunca los rreconocieron por señores de su voluntad sino de miedo que les tenian porque no los matasen e todos sus antepasados les avian tributado y obedecido contra su voluntad como dicho tienen.","zh":"【答第六问】他们全体并逐一说：他们坚持前面所说的。他们听先人说，那些祖先从未心甘情愿地奉任何一位印加为领主，或承认他们为领主，只是因为印加对他们和其他人大肆残暴、杀戮，才出于恐惧、违背意愿服从他们。上述胡安·皮萨罗、塞巴斯蒂安·尤潘基、堂弗朗西斯科·基斯皮、堂迭戈·尤潘基和堂佩德罗·莱昂·皮奥卡里说，他们本人见过瓦伊纳·卡帕克和他的儿子瓦斯卡尔·印加，但从未心甘情愿地奉他们为领主，只是怕被杀而畏惧他们；他们所有的祖先，正如他们所说，都是违心地向这些印加纳贡、服从他们的。","tr":"p"},"t3-13":{"src":"t","ch":3,"pg":"pp. 190–191","es":"—a la septima pregunta dixeron que los dichos sus antepasados oyeron dezir que nunca ellos ni los que antes dellos auian sido eligieron a los dichos yngas por yngas y señores syno que con las fuerzas que tenian se sustentauan en su tirania por las grandes muertes y crueldades que hacian e con los miedos que les ponian y haziendo a los yndios les obedeciesen como tienen dicho y declarado y que ansi lo tienen por cossa cierta y aueriguada entrellos y que todo lo que tienen dicho y declarado es lo que sauen y oyeron dezir a los dichos sus padres y passados y los antiguos de los dichos testigos dizen que lo vieron y entendieron en sus tiempos y los dichos sus padres y pasados tambien se lo dixeron a todos para que tuuiesen memoria dello y ellos lo dixesen a sus hijos y sienpre va de hedad en hedad para que no se oluide entrellos e todos dixeron que no sauian escriuir lo qual todos dixeron y declararon por la dicha lengua que dixo que lo questaua escripto era y es lo que los dichos yndios y cada vno dellos auia declarado de lo que les auia sido preguntado y fyrmolo Gonçalo Gomez Ximenez.—El dotor Loarte. Ante mi Alvaro Ruiz de Nauamuel.","zh":"【答第七问】他们说，他们听上述祖先说：无论祖先本人，还是更早的先人，都从未推举上述诸印加为印加和领主；那些印加是凭借自身的力量，靠大肆杀戮和残暴、靠让人恐惧、靠强迫印第安人服从，来维持其暴政的，正如他们所说所述。他们在自己人中间把这视为确凿查明之事。他们所说所述的一切，都是他们所知道的，是从父辈和先人那里听来的；而证人中的年长者说，他们在自己那个时代亲眼见过、亲身了解过这些事。他们的父辈和先人也把这些告诉所有人，好让大家记住，再讲给自己的子女，就这样一代一代传下去，不让他们之中的人遗忘。他们全都说自己不会写字。以上全部内容，他们经由上述通译陈述并申明；通译说，所记录的内容，过去和现在都确实是上述印第安人每一位就所问事项所作的陈述。签名：贡萨洛·戈麦斯·希门尼斯。——洛阿尔特博士。在我面前：阿尔瓦罗·鲁伊斯·德·纳瓦穆埃尔。","tr":"p"},"t3-2":{"src":"t","ch":3,"pg":"p. 185","es":"—los quales dixeron que heran del aillo de sauasiray y queste sauasiray fue vn yndio cinche que vino de sutictoco que sera siete leguas de la ciudad del cuzco y queste sauasiray vino por cinche de otros yndios que consigo traya y descubrio vn sitio en el asiento donde agora esta la ciudad del cuzco que se decia en tiempos antiguos quinticancha y chumbicancha ques donde agora esta fundado el monesterio de santo domingo que despues pachacuti ynga le puso por nombre a aquel asiento curicancha e que en el sitio desta ciudad del cuzco quando vino a poblar en ella el dicho sauasiray no auia otra gente ninguna sino en cercania della hazia donde sale el sol a la ladera de la cuesta los yndios guallas y ansi hizo el dicho asiento donde dicho tienen y fue el primero yndio que alli poblo y que lo que dicho tienen lo sauen porque ansi lo dixeron sus padres e antepassados y quellos lo auian oydo dezir a los suios y se lo yuan diziendo para quentendiesen el ayllo y decendencia que tenian por la horden que auia hecho los dichos ayllos pachacuti ynga yupangui porque de antes no los auia.","zh":"这些人说，他们属于萨瓦西赖亲族共同体。这个萨瓦西赖是一名印第安军事首领，来自苏蒂克托科，距库斯科城约七里格。萨瓦西赖作为他带来的一批印第安人的军事首领来到这里，在如今库斯科城所在之处找到一块地方。这里古时叫金蒂坎查和春比坎查，就是如今圣多明我修道院所在之地；后来帕查库蒂·印加给这块居地取名科里坎查。萨瓦西赖来本城所在之地定居时，这里没有任何别的人，只有附近日出方向的山坡上住着瓦利亚印第安人。于是他就在上面说的地方安下居地，是第一个在那里定居的印第安人。他们说，以上所述，是父辈和祖先这样告诉他们的；父辈和祖先又是从自己的先人那里听来，一代代讲下去，好让他们知道，按照帕查库蒂·印加·尤潘基为这些亲族共同体定下的次序，自己属于哪个亲族共同体、出自哪一支后裔，因为在此之前并没有这些亲族共同体。","tr":"p"},"t3-3":{"src":"t","ch":3,"pg":"pp. 185–186","es":"[al margen: ayllo antasayac] —otro yndio que dixo llamarse don pedro aulayllo de hedad de ochenta años. —otro que dixo llamarse alonso guacrao de hedad de quarenta años. —otro que dixo llamarse juan auca puri de treynta e vn años. —otro yndio que dixo llamarse juan vscamanco y de hedad de treynta e vn años. —otro yndio que dixo llamarse matheo vllancay de hedad de veinte y tres años.","zh":"［页边：安塔萨亚克亲族共同体］——另一名印第安人，自称堂佩德罗·奥莱略，80岁。——另一人，自称阿隆索·瓜克劳，40岁。——另一人，自称胡安·奥卡·普里，31岁。——另一名印第安人，自称胡安·乌斯卡曼科，31岁。——另一名印第安人，自称马特奥·乌扬凯，23岁。","tr":"p"},"t3-4":{"src":"t","ch":3,"pg":"p. 186","es":"—todos los quales dixeron son de la decendencia de quizco cinche e del ayllo de antasayac y que a sus padres y antepasados oyeron dezir quel dicho quizco auia venido a el sitio donde agora esta fundada esta ciudad como cinche de los yndios que traya consigo y hizo su asiento en la parte donde esta el monesterio de monjas de santa clara y de alli hacia arriba hasta las cassas de paulo ynga e puso por nombre a el lugar cuzco e que ansi mismo les dixeron los dichos sus padres e antepassados, questaua quando vino el dicho quizco en el dicho asiento de quinticancha estaua el dicho sauasiray y los yndios que auia traido consigo, y que hazia las dichas laderas deste cuzco hazia donde sale el sol estauan poblados antes quel dicho sauasiray y el dicho quizco vyniesen, vnos yndios que se llamauan guallas y esto sauen desta pregunta.","zh":"这些人都说，他们是军事首领基斯科的后裔，属于安塔萨亚克亲族共同体。他们听父辈和祖先说，基斯科作为他带来的一批印第安人的军事首领，来到如今本城建城之处，在如今圣克拉拉修女院所在的那一片，从那里往上直到保罗·印加的宅邸一带，安下居地，并给这个地方取名“库斯科”。父辈和祖先同样告诉他们：基斯科来的时候，萨瓦西赖和他带来的印第安人已经住在金蒂坎查那块居地上；而在萨瓦西赖和基斯科到来之前，库斯科日出方向的那些山坡上，已经住着一些叫瓦利亚的印第安人。关于这一问，他们所知就是这些。","tr":"p"},"t3-5":{"src":"t","ch":3,"pg":"p. 186","es":"[al margen: ayllo de arayucho] —otro yndio que dixo llamarse juan pizarro yupangui y de hedad de setenta e nueue años. —otro yndio que dixo llamarse sebastion yupangui y ques de hedad de ochenta y cinco años. —otro yndio que dixo llamarse don francisco quispi y de hedad de ochenta años. —otro que dixo llamarse don diego yupangui y ques de hedad de nouenta y quatro años.","zh":"［页边：阿亚尔·乌丘亲族共同体］——另一名印第安人，自称胡安·皮萨罗·尤潘基，79岁。——另一名印第安人，自称塞巴斯蒂安·尤潘基，85岁。——另一名印第安人，自称堂弗朗西斯科·基斯皮，80岁。——另一人，自称堂迭戈·尤潘基，94岁。","tr":"p"},"t3-6":{"src":"t","ch":3,"pg":"pp. 186–187","es":"—que todos los dichos quatro yndios dixeron ser de la decendencia de ayarucho y que oyeron decir a sus padres y pasados quel dicho ayarucho auia hecho asiento en el sitio donde agora esta esta ciudad donde dezian pucamarca y alli esta la cassa de doña ysauel de bobadilla y agora se llaman del ayllo que los yngas pusieron por nombre alcabizas porque ansi se lo dixeron sus antepasados y quel dicho arayucho vino a el dicho asiento y hallo en el dicho sitio donde agora esta fundada esta ciudad armadas algunas chozas de sauasiray y de quizco y los yndios guallas que dizen los dos ayllos arriba rreferidos y los vnos y los otros se unieron a conformar y declarar lo que todos tienen dicho y declarado porque dixeron que ansi lo avian oydo dezir a sus antepassados.","zh":"上述四名印第安人都说，他们是阿亚尔·乌丘的后裔。他们听父辈和先人说，阿亚尔·乌丘在如今本城所在、当时叫普卡马卡的地方安下居地，伊莎贝尔·德·博瓦迪利亚夫人的宅子如今就在那里；他们现在属于印加人命名为“阿尔卡维萨”的那个亲族共同体，这是他们的祖先告诉他们的。阿亚尔·乌丘来到这块居地时，在如今本城建城之处，发现已经搭起了一些茅屋，属于萨瓦西赖、基斯科和瓦利亚印第安人，也就是上面两个亲族共同体所说的那些人。双方一致认同并申明了大家所说所述的内容，因为他们说，这些都是从祖先那里听来的。","tr":"p"},"t3-7":{"src":"t","ch":3,"pg":"p. 187","es":"II—a la segunda pregunta dixeron los yndios de los dos primeros ayllos de sauasiray y quizco que son de los dichos ayllos desdel tiempo que no auia señores entrellos sino cinches a quien tuuieron por sus capitanes e que por esto se llaman de su aillo porque tomaron el nombre e ayllo de su capitan e queste nombre de aillos les puso pachacuti ynga yupangui y topaynga yupangui porque antes destos yngas viuia cada vno con lo que tenia sin tener a quien obedezer ni rrespetar ni ellos rrespetauan a nadie.","zh":"【答第二问】前两个亲族共同体，即萨瓦西赖和基斯科的印第安人说：从他们之中还没有领主、只有军事首领的时候起，他们就属于上述亲族共同体；他们奉这些军事首领为统领，所以以统领的名字作为自己亲族共同体的名字。而这些亲族共同体的名号，是帕查库蒂·印加·尤潘基和图帕克·印加·尤潘基给他们定的；在这两位印加之前，人人各守其所有，没有要服从或尊敬的人，他们也不尊敬任何人。","tr":"p"},"t3-8":{"src":"t","ch":3,"pg":"p. 187","es":"—e los del dicho tercero ayllo de ayarucho que por otro nombre se llaman alcauizas dixeron que tuuieron por su cinche apomayta despues de auerse conuertido en piedra ayarucho y cusco ychima despues que poblo Arayucho (sic) y quel dicho ayarucho no tuuo guerras con los que en esta ciudad auian poblado e todos los yndios de los dichos tres ayllos dixeron que lo que tienen dicho y declarado es lo que sauen desta pregunta porque ansi lo oyeron dezir a sus padres y passados para el effeto que dicho tienen antes desto y quentonces no auia ningun señor a quien respetar generalmente los vnos ni los otros como a ynga sino que cada vno viuia en su sitio como queria con su parentela.","zh":"第三个亲族共同体，即阿亚尔·乌丘——又名阿尔卡维萨——的人说：阿亚尔·乌丘化为石头以后，他们奉阿波迈塔为军事首领；阿亚尔·乌丘定居以后，又奉库斯科·伊奇马为军事首领；阿亚尔·乌丘同此前已在本城定居的人没有发生过战争。上述三个亲族共同体的印第安人都说，他们就此问所说所述，就是他们所知道的，因为这是他们从父辈和先人那里听来的，用意如前所述；他们还说，当时各方都没有一位像对印加那样普遍尊奉的领主，人人各住各处，随心所欲，与自己的亲属一起生活。","tr":"p"},"t3-9":{"src":"t","ch":3,"pg":"pp. 187–188","es":"III—a la tercera pregunta dixeron todos juntos y cada vno dellos que a los dichos sus padres y antepassados oyeron dezir que el primero ynga que se llamo mango capac entro con mañas donde los dichos tres ayllos estauan y tenian sus asientos halagandolos con palabras y con gente que yua trayendo de otras partes e metiendola de noche se les yua entrando por fuerça en las tierras que tenian y que diziendole los dichos yndios que no se les entrase en sus tierras les rrespondia que callasen que todos eran hermanos y como los dichos yndios lo yuan rresistiendo el dicho mango capac y su gente los comenzo a matar de noche secretamente y a traycion e auia pendencias entrellos sobre sus tierras y el dicho mango capac y su gente se les entravan en ellas e cada dia yua trayendo gente e yuan hurtando a los yndios del ayllo de alcabizas para matallos como los matauan de noche porque les rresistian sus tierras pero que ninguno de los dichos tres ayllos le rreconocieron ni tuuieron por señor ni le rrespetaron e que de la misma manera se les yuan entrando despues de muerto el dicho mango capac los demas yngas sus subcesores hasta mayta capac y que mamaguaco en tiempo del dicho mango capac vino a el asiento de sauasiray mamaguaco la qual comenzo a hazer grandes crueldades con vn ayuinto en que tenia vn pedazo de oro atado con que mataua los yndios y quel dicho sauasiray viendo las dichas crueldades y la ferozidad y valentía que hazia esta muger se fue huiendo a los desiertos y questo es lo que oyeron dezir de lo contenido en esta pregunta.","zh":"【答第三问】他们全体并逐一说：他们听父辈和祖先说，名叫曼科·卡帕克的第一位印加，用诡计进入了上述三个亲族共同体各有居地的地方。他一面用好话笼络他们，一面不断从别处带人来，趁夜把人安插进来，强行一点一点侵入他们的土地。上述印第安人对他说，不要侵入他们的土地，他就回答说，让他们住口，大家都是兄弟。上述印第安人不断抵抗，曼科·卡帕克和他的人就开始趁夜秘密地、背信弃义地杀害他们。双方为土地起了纷争；曼科·卡帕克和他的人侵入他们的土地，每天都带人来，还掳走阿尔卡维萨亲族共同体的印第安人去杀掉——因为这些人保卫自己的土地，他们就趁夜杀害他们。但上述三个亲族共同体，没有一个承认他、奉他为领主或尊敬他。曼科·卡帕克死后，他的继承者诸印加，直到迈塔·卡帕克，也同样不断侵入他们的土地。他们又说，在曼科·卡帕克的时代，玛玛·瓦科来到萨瓦西赖的居地。这个玛玛·瓦科开始大肆行凶，用一件绑着一块金子的ayuinto杀害印第安人。萨瓦西赖看到这个女人的残暴、凶悍与勇猛，就逃往荒野。关于这一问的内容，他们所听说的就是这些。","tr":"p"},"t4-1":{"src":"t","ch":4,"pg":"p. 191","es":"—e despues de lo susodicho en la dicha ciudad del cuzco a treynta e vn dias del mes de henero de mill y quinientos y setenta e dos años el dicho señor dotor grauiel de loarte alcalde de corte por su magestad hizo parecer ante si a quinze yndios de los quales auiendo dicho que son xpianos fue tomado y reciuido juramento en forma de derecho por la dicha lengua por dios nuestro señor e por vna señal de cruz que hizieron con los dedos de sus manos so cargo del qual prometieron de dezir verdad y siendo tomados sus dichos e depusiciones de todos juntos y siendo preguntados por la dicha lengua lo que sauen del casso para que fueron tomados por testigos dixeron y declararon lo siguiente.","zh":"随后，1572年1月31日，于上述库斯科城，陛下的王室法庭法官加布里埃尔·德·洛阿尔特博士传唤十五名印第安人到庭。他们自称是基督徒，于是经由上述通译，以我主上帝和他们用手指画出的十字记号依法宣誓，并据此誓言承诺说实话。随即一并录取他们全体的证词与陈述，并经由上述通译询问他们就被传作证之事所知情况。他们陈述并申明如下。","tr":"p"},"t4-2":{"src":"t","ch":4,"pg":"pp. 191–192","es":"—a la primera pregunta que les fue hecha y declarada por la dicha lengua dixeron llamarse de los nombres y tener las hedades y calidades y ser de los ayllos siguientes. —don balthasar caua de hedad de quarenta y cinco años curaca principal del pueblo de viloe en el valle de gualla de la encomienda de la menor del ynga. —otro yndio que dixo llamarse sebastian say de hedad de treynta e quatro años. —otro yndio que dixo llamarse don alonso say de hedad de quarenta y cinco años. —otro que dixo llamarse pedro cay y de hedad de treynta y dos años. —balthasar maquia de cinquenta y dos años. —otro yndio que dixo llamarse don luis viba de hedad de mas de setenta años. —sebastian thun de hedad de treynta e quatro años. —luis maquia de hedad de setenta y tres años. —otro yndio que dixo llamarse balthasar guambo de hedad de sesenta años. —otro que dixo llamarse alonso aymarac de hedad de quarenta y cinco años. —otro que dixo llamarse juan marin y ser de hedad de quarenta e vn años. —otro yndio que dixo llamarse garcia tilanti de hedad de cinquenta y cinco años. —otro que dixo llamarse gaspar pacra del pueblo de pisa de hedad de treynta e quatro años. —otro que dixo llamarse anton manchi de hedad de sesenta años. —otro yndio que dixo llamarse anton vira de hedad de setenta años.","zh":"【答第一问】对向他们提出、并经上述通译解释的第一问，他们说出了各自的姓名、年龄、身份，以及所属的亲族共同体，如下：——堂巴尔塔萨·卡瓦，45岁，瓦利亚谷比洛埃村的主库拉卡，该村属印加幼女名下的委托监护地。——另一名印第安人，自称塞巴斯蒂安·赛，34岁。——另一名印第安人，自称堂阿隆索·赛，45岁。——另一人，自称佩德罗·凯，32岁。——巴尔塔萨·马基亚，52岁。——另一名印第安人，自称堂路易斯·比巴，70多岁。——塞巴斯蒂安·通，34岁。——路易斯·马基亚，73岁。——另一名印第安人，自称巴尔塔萨·瓜姆博，60岁。——另一人，自称阿隆索·艾马拉克，45岁。——另一人，自称胡安·马林，41岁。——另一名印第安人，自称加西亚·蒂兰蒂，55岁。——另一人，自称加斯帕尔·帕克拉，皮萨村人，34岁。——另一人，自称安东·曼奇，60岁。——另一名印第安人，自称安东·比拉，70岁。","tr":"p"},"t4-3":{"src":"t","ch":4,"pg":"pp. 192–193","es":"—todos los quales tres curacas e yndios que de suso van declarados dixeron por la dicha lengua que son de la decendencia y origen de los yndios guallas del pueblo de pachatusan que es a las espaldas de san blas en esta ciudad hacia adonde sale el sol por la acera de los andenes que salen de san blas hacia las salinas y que an oydo dezir a sus padres y antepasados y a muchos yndios viejos que los dichos yndios guallas de donde ellos decienden estauan poblados en el dicho sitio antes que viniese ningun ynga a el sitio donde agora esta la ciudad del cuzco cerca del qual ellos biuian e que no tenian ningun señor a quien rrespetar ni obedecer sino que se gouernauan ellos entre si saluo vn yndio que se llamaua apoquiauo que era valiente entrellos y que los dichos yndios guallas auia mucho tiempo que estauan en el dicho sitio antes que viniesen los dichos yngas a rresidir a este sitio del cuzco e questo es lo que sauen y oyeron dezir a los que dicho tienen los quales se lo dixeron para que tuuiesen memoria de donde decendian adonde estuuieron y biuieron al principio sus pasados e que lo dixesen a sus hijos y ansi lo van diciendo los vnos a los otros de generacion en generacion e questo es lo que rresponden y oyeron decir en lo que toca a la primera y segunda pregunta.","zh":"【答第一、二问】以上列名的这三位库拉卡和各位印第安人，经由上述通译说：他们是帕查图桑村瓦利亚印第安人的后裔和支脉。帕查图桑在本城圣布拉斯的背后，朝日出方向，沿着从圣布拉斯通往盐田的梯田一线。他们听父辈、祖先和许多印第安老人说，他们所出自的瓦利亚印第安人，早在任何印加来到如今库斯科城所在之地以前，就已经住在上述地方，就在离城不远处。他们没有任何要尊敬或服从的领主，而是彼此自治，只有一个名叫阿波基亚沃的印第安人在他们之中以勇武著称。上述瓦利亚印第安人在诸印加来库斯科这里居住之前，就已经在那个地方住了很久。这些是他们所知道的，是从上面说的那些人那里听来的；那些人告诉他们，是为了让他们记住自己出自何处、先人起初在哪里居住生活，并讲给自己的子女；他们就这样一代一代彼此传述下去。以上就是他们对第一问和第二问的回答和所听说的内容。","tr":"p"},"t4-4":{"src":"t","ch":4,"pg":"p. 193","es":"—a la tercera pregunta dixeron todos juntos y cada vno dellos que lo que oyeron decir a sus padres y pasados de lo en ella contenido es que mango capac despues de auer muchos años que los dichos yndios guallas estauan poblados donde dicho tienen vino de tambotoco y poblo en este sitio del cuzco y dende a poco tiempo fue metiendo dos vezes gente y con ella comenzo a matar muchos de los yndios guallas y de otros yndios que auian venido antes del dicho mango capac a poblar en el dicho sitio del cuzco y que de miedo de las crueldades y muertes que el y su gente hacían se fueron huiendo con su cinche apocaua a buscar nueuas tierras donde poblar y poblaron donde agora estan que seran veinte leguas desta ciudad y que alli se quedaron y que llamaron al vn pueblo donde agora estan Guallas como ellos se llamauan de antes y que el dicho mango capac les tomo sus tierras y lo mismo hizieron los demas yngas y el dicho mango capac con los demas yndios que auian venido a poblar en el dicho sitio y questo es lo que sauen de lo contenido en la dicha tercera y quarta pregunta porque lo oyeron dezir como dicho tienen.","zh":"【答第三、四问】他们全体并逐一说，关于其中所问之事，他们从父辈和先人那里听说的是：在上述瓦利亚印第安人已在他们所说的地方住了多年之后，曼科·卡帕克从坦博托科来到库斯科这里定居。不久，他先后两次带人进来，用这些人开始杀害许多瓦利亚印第安人，以及在曼科·卡帕克之前来到库斯科这里定居的其他印第安人。瓦利亚人害怕他和他的人的残暴和杀戮，就跟着他们的军事首领阿波卡瓦出逃，去寻找新的土地定居，最后在如今所住的地方住下，离本城约二十里格。他们留在了那里，并把那里的一个村子叫作“瓦利亚”，和他们原先的名字一样。上述曼科·卡帕克夺走了他们的土地；其余诸印加，以及曼科·卡帕克和那些来这里定居的其他印第安人，也都这样做了。关于上述第三问和第四问的内容，他们所知就是这些，如前所说，都是听来的。","tr":"p"},"t4-5":{"src":"t","ch":4,"pg":"pp. 193–194","es":"—a la quinta pregunta dixeron todos juntos y cada vno dellos que a los que dicho y declarado tienen oyeron dezir que sus antepassados tributaron siempre de mala voluntad a los dichos yngas y a los que despues dellos ouo que si osaran y tuvieran gente se levantarian contra ellos por auelles tomado sus tierras y muerto los yndios dellos como dicho tienen porque estauan como gente medrosa y tiranizada de los dichos yngas y con grande miedo de uer las crueldades que hacian y que nunca de su uoluntad tuvieron a los dichos yngas ni a ninguno dellos por señores sino que como dicho tienen de miedo los obedecian y ellos se sustentauan siempre en su tirania por fuerça de armas poniendoles miedo y haciendoles tributar por fuerza e contra su voluntad y que nunca de su voluntad los tuuieron por señores ni jamas los rreconocieron por tales e siempre desearon boluerse a sus tierras e no osauan de miedo y que nunca eligieron por yngas ni señores a los dichos yngas sino quellos se sustentauan en su señorio por fuerza y contra su uoluntad y que despues que se huieron del dicho sitio donde a el principio estauan sus antepasados ni de antes nunca tuuieron señores ni fueron subjetos a nadie hasta que topa ynga yupangui los torno a subjetar en aquella parte a donde se fueron a uiuir por fuerça de armas y por las crueldades que hacian e que a los que no le obedecian les mataua y questo es lo que sauen y oyeron decir de lo contenido en la dicha pregunta e de las demas del dicho interrogatorio y se trata por cossa muy cierta y aueriguada entrellos y no sauen ni an oydo ni entendido otra cossa en contrario ni entienden que la ay e que para los effetos que tienen dicho lo oyeron decir a los dichos sus padres y passados y ellos lo uan diziendo agora a sus hijos para que tengan memoria dello y que visto que algunos de la dezendencia de los yngas les tienen a el presente sus tierras en el dicho sitio del cuzco donde estauan los yndios de cuia decendencia vienen an pretendido pedirselas muchas vezes y questa es la uerdad para el juramento que hizieron y no firmaron porque dixeron que no sauian scriuir y lo firmo la dicha lengua que dixo que lo questaua escripto es lo que los dichos testigos an declarado so cargo del juramento que tiene hecho y fyrmado El dotor Loarte.—Gonzalo Gomes Ximenez. Ante mi Alvaro Ruiz de Nauamuel.","zh":"【答第五问及其余各问】他们全体并逐一说：他们听前面所说的那些人说，他们的祖先一直不情愿地向上述诸印加以及后来的印加纳贡；要是敢、要是有人手，他们早就起来反抗了，因为正如他们所说，印加夺了他们的土地、杀了他们的人；他们像受惊吓、受暴政压制的人一样，看到印加的残暴，非常害怕。他们从未心甘情愿地奉上述诸印加中的任何一位为领主，正如他们所说，只是出于恐惧服从；那些印加始终凭武力维持其暴政，使他们恐惧，强迫他们违心纳贡。他们从未心甘情愿地奉这些印加为领主，也从未承认他们是领主；他们一直想回到自己的土地，却因为害怕而不敢。他们从未推举上述诸印加为印加或领主，那些印加是凭强力、违背他们的意愿维持统治的。他们的祖先从起初居住的地方逃走以后，以及在此之前，都从未有过领主，也没有臣服于任何人，直到图帕克·印加·尤潘基凭武力、凭印加施行的残暴，在他们迁去居住的那个地方再次征服了他们，不服从他的人就被他杀掉。关于这一问以及询问单中其他各问的内容，他们所知道和听说的就是这些；这在他们之中被视为确凿查明之事，他们没有知道、听说或了解到任何相反的情况，也不认为有相反的情况。他们是为了前面所说的用意，从父辈和先人那里听来的，现在也讲给自己的子女，好让他们记住。鉴于印加的某些后裔目前占着他们在库斯科这里的土地——也就是他们所出自的那些印第安人原先所在之处——他们已经多次设法要回这些土地。以上为他们依所立誓言所说的实情。他们没有签名，因为他们说自己不会写字；上述通译签了名，并说所记录的就是上述证人依其誓言所作的陈述。签名：洛阿尔特博士。——贡萨洛·戈麦斯·希门尼斯。在我面前：阿尔瓦罗·鲁伊斯·德·纳瓦穆埃尔。","tr":"p"},"t5-1":{"src":"t","ch":5,"pg":"p. 194","es":"—e despues de lo susodicho en la dicha ciudad del cuzco a veinte y siete dias del mes de hebrero de mill y quinientos y setenta y dos años el dicho señor alcalde de corte auiendo visto esta ynformacion dixo que ponia e ynterponia e puso e ynterpuso en ella su auturidad e decreto judicial para que ualga y haga fe en juicio y fuera del y que se den dellas los treslados que su excelencia mandare se saquen y firmolo El Doctor Loarte ante mi Alvaro Ruiz de Navamuel.","zh":"随后，1572年2月27日，于上述库斯科城，上述王室法庭法官审阅本调查录后宣称：他在其中加具其权威与司法裁定，使之在诉讼内外均具效力与公信，并按总督阁下的命令，从中抄出所需副本。签名：洛阿尔特博士。在我面前：阿尔瓦罗·鲁伊斯·德·纳瓦穆埃尔。","tr":"p"},"t5-2":{"src":"t","ch":5,"pg":"pp. 194–195","es":"E yo el dicho Alvaro Ruiz de Navamuel secretario del muy excelente señor don francisco de toledo visorrey gouernador y capitan general destos Reinos e de la gobernacion y visita general dellos fize sacar este treslado de la prouanza original que queda en mi poder con la qual se corrigio e concerto y el dicho señor alcalde de corte que aqui firmo dixo que ponia e ynterpuso en ella su autoridad e decreto judicial e fize aqui mi signo (hay un signo) en testimonio de verdad.—Aluaro Ruiz de Navamuel.","zh":"我，上述阿尔瓦罗·鲁伊斯·德·纳瓦穆埃尔，作为至尊的总督、行政长官兼军事统帅堂弗朗西斯科·德·托莱多大人的秘书，并任本诸王国政务与全境巡察秘书，令人从留存于我处的原始证明文书抄出本副本，并已与原件校对一致。在此签名的上述王室法庭法官宣称，他在其中加具其权威与司法裁定。我在此画上我的公证花押（此处有花押），以证属实。——阿尔瓦罗·鲁伊斯·德·纳瓦穆埃尔。","tr":"p"}}};

const SN={walla:'瓦利亚人',sahua:'萨瓦西赖',quizco:'基斯科',alca:'阿尔卡维萨',cache:'阿亚尔·卡切',ucho:'阿亚尔·乌丘',huaco:'玛玛·瓦科',manco:'曼科',sinchi:'辛奇·罗卡',lloque:'略克',mayta:'迈塔',capac:'卡帕克',roca:'印加·罗卡',yahuar:'亚瓦尔',vira:'维拉科查',pacha:'印加·尤潘基',topa:'图帕克',god:'维拉科查神',sano:'萨尼奥',elders:'长老',boy:'少年',apomayta:'阿波迈塔',usco:'乌斯科维尔卡',juan:'胡安',cieza:'西萨',betanzos:'贝坦索斯',angelina:'安赫利娜',toledo:'托莱多',sarmiento:'萨米恩托',loarte:'洛阿尔特',copali:'科帕利迈塔',auca:'阿亚尔·奥卡',tocay:'托凯·卡帕克',chimbo:'钦博·奥尔玛',curicoca:'库里科卡',urco:'印加·乌尔科',polo:'波洛'};
const PAL=['#5fd3e6','#ef6fcf','#f39a4a','#e9e36a','#a993ff','#72e3a9','#ff8080','#7fb6ff'];
const SRC={

  c:{n:'西萨',f:'西萨《秘鲁纪事第二部》',pair:'西萨第二部_坎图本_西汉对照'},
  s:{n:'萨米恩托',f:'萨米恩托《印加史》',pair:'萨米恩托_1947_西汉对照'},
  t:{n:'1572年调查录',f:'《1572年库斯科调查录》',pair:'1572年库斯科调查录_西汉对照'}

const SRCORD=['b','c','s','t'];
const SHAPE={
  b:'<circle class="sh" r="5.5"/>',
  c:'<rect class="sh" x="-4.8" y="-4.8" width="9.6" height="9.6"/>',

};
const icon=k=>`<svg viewBox="-7.5 -7.5 15 15" aria-hidden="true">${SHAPE[k]}</svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=n=>Math.round(n*10)/10;

function srcKey(s){
  if(s.b)return'b';if(s.c)return'c';if(s.s)return's';if(s.t)return't';
  const o=s.o||'';if(/萨米恩托/.test(o))return's';if(/贝坦索斯/.test(o))return'b';if(/西萨/.test(o))return'c';if(/调查录/.test(o))return't';return'o';
}
function srcText(s){
  if(s.b) return `贝坦索斯《印加史综述》第一部第${s.b[0]}章，${s.b[1]}（Martín Rubio 1987年本）`;
  if(s.c) return `西萨《秘鲁纪事第二部》第${s.c[0]}章，${s.c[1]}（坎图1985年本）`;
  if(s.s) return `萨米恩托《印加史》第${s.s[0]}章（Rosenblat 1947年本）`;
  if(s.t) return `《1572年库斯科调查录》，Levillier 1940, t. II, ${s.t}`;
  return s.o;
}
EV.forEach(ev=>{
  const ks=[];ev.Q.forEach(b=>{if(!ks.includes(b.src))ks.push(b.src)});
  if(ev.s){const k=srcKey(ev.s);if(!ks.includes(k))ks.push(k)}
  ev.src=ks;ev.inst=[];ev.rels=REL.filter(r=>r.ev.includes(ev.id));
});

/* ---------- layout ---------- */
const SLOT=78,PAD=30,MINERA=168,LEFT=200,CURVE=46,CLEAR=60,LH=46,LAM=44,K=2*Math.PI/LAM,GAPMIN=26,TAIL=CURVE+18,X0=46;
function textW(s,fs){let w=0;for(const ch of s)w+=/[⺀-鿿＀-￯]/.test(ch)?fs:(ch==='·'?fs*.5:fs*.56);return w}
let W,H,RY,XEND,UP,DN;
const LOOPS=[];
function layout(){
  let x=LEFT;
  ERAS.forEach((era,i)=>{
    const evs=EV.filter(e=>e.e===i),inner=evs.length*SLOT,w=Math.max(MINERA,inner+PAD*2);
    era.x0=x;era.pw=w;const off=x+(w-inner)/2;
    evs.forEach((ev,j)=>ev.px=off+SLOT*(j+.5));
    x+=w;
  });
  XEND=x;W=XEND+170;
  PEOPLE.forEach(p=>{
    p.sn=SN[p.id]||p.n;p.tw=textW(p.sn,12)+18;const lead=CURVE+10+p.tw+12;
    p.evs=EV.filter(e=>e.l.includes(p.id));p.loops=[];let cur=null;
    for(const ev of p.evs){
      if(cur&&(ev.e-cur.le<=1||ev.px-lead-(cur.x1+TAIL)<GAPMIN)){cur.evs.push(ev);cur.x1=ev.px;cur.le=ev.e;}
      else{cur={p,evs:[ev],x0:ev.px,x1:ev.px,le:ev.e};p.loops.push(cur);LOOPS.push(cur);}
    }
    p.loops.forEach((L,k)=>{
      L.s=L.x0-lead;
      L.open=k===p.loops.length-1&&!!L.evs[L.evs.length-1].open;
      L.t=L.open?W-30:L.x1+TAIL;
    });
    p.open=p.loops.some(L=>L.open);
  });
  const lv={};
  [-1,1].forEach(side=>{
    const ls=LOOPS.filter(L=>L.p.side===side).sort((a,b)=>a.s-b.s),ends=[];
    ls.forEach(L=>{let k=ends.findIndex(e=>e+18<L.s);if(k<0){k=ends.length;ends.push(0)}ends[k]=L.t;L.lv=k;});
    lv[side]=Math.max(1,ends.length);
  });
  UP=lv[-1];DN=lv[1];
  RY=104+CLEAR+(UP-1)*LH;
  H=RY+CLEAR+(DN-1)*LH+84;
  LOOPS.forEach(L=>{L.y=RY+L.p.side*(CLEAR+L.lv*LH)});
}
const N=()=>PEOPLE.length;
const ph=i=>2*Math.PI*i/N();
const am=i=>6.2-(i%3)*1.4;
const ys=(i,x)=>RY+am(i)*Math.sin(K*x+ph(i));
function rope(i,xa,xb){
  if(xb<=xa+.5)return'';
  const A=am(i),P=ph(i);
  let n=Math.floor((K*xa+P)/Math.PI)+1,x=(n*Math.PI-P)/K;
  if(x>=xb)return`L${f(xb)},${f(ys(i,xb))}`;
  let s=`L${f(x)},${f(RY)}`,first=true;
  for(;;){
    const nx=x+Math.PI/K;if(nx>xb)break;
    if(first){const sg=n%2===0?1:-1;s+=`Q${f((x+nx)/2)},${f(RY+2*A*sg)} ${f(nx)},${f(RY)}`;first=false}
    else s+=`T${f(nx)},${f(RY)}`;
    x=nx;n++;
  }
  return s+`L${f(xb)},${f(ys(i,xb))}`;
}
function loopD(L,i){
  const y0=ys(i,L.s);let d=`C${f(L.s+CURVE*.5)},${f(y0)} ${f(L.s+CURVE*.5)},${f(L.y)} ${f(L.s+CURVE)},${f(L.y)}`;
  if(L.open)return d+`L${f(L.t)},${f(L.y)}`;
  const y1=ys(i,L.t);
  return d+`L${f(L.t-CURVE)},${f(L.y)}C${f(L.t-CURVE*.5)},${f(L.y)} ${f(L.t-CURVE*.5)},${f(y1)} ${f(L.t)},${f(y1)}`;
}

/* ---------- state ---------- */
const state={sel:null,persons:[],lens:null,view:'home',back:null,ctx:true};
const EL={};   // ev id -> {k:[], lab, tie, mt:[]}
const TH={};   // person id -> {th, tags:[], hits:[], mth:[], row}
let SEQ=EV.slice();

function gc(p){return G[p.g].c}
function pc(p){const k=state.persons.indexOf(p.id);return k<0?gc(p):PAL[k%PAL.length]}
function isLit(ev){
  if(state.persons.length&&!ev.l.some(id=>state.persons.includes(id)))return false;
  const L=state.lens;if(!L)return true;
  if(L.type==='motif')return ev.m.includes(L.id);
  if(L.type==='src')return ev.src.includes(L.id);
  if(L.type==='rel')return RELI[L.id].ev.includes(ev.id);
  return true;
}

/* ---------- build ---------- */
function build(){
  layout();
  const canvas=document.getElementById('canvas');canvas.style.width=W+'px';
  document.getElementById('eras').innerHTML=ERAS.map(e=>`<div class="era" style="left:${e.x0}px;width:${e.pw}px"><div class="en"><b>${esc(e.n)}</b><span>${esc(e.s)}</span></div></div>`).join('');
  const svg=document.getElementById('braid');
  svg.setAttribute('width',W);svg.setAttribute('height',H);svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let s='';
  // era bands
  ERAS.forEach((e,i)=>{if(i%2)s+=`<rect class="band" x="${e.x0}" y="0" width="${e.pw}" height="${H}"/>`;s+=`<line class="eline" x1="${e.x0}" x2="${e.x0}" y1="0" y2="${H}"/>`});
  s+=`<path class="rope-body" d="M${X0},${RY}L${XEND},${RY}"/>`;
  // threads
  s+='<g id="threads">';
  PEOPLE.forEach(p=>{
    const i=p.i;let d=`M${X0},${f(ys(i,X0))}`,cx=X0,open=false;
    p.loops.forEach(L=>{d+=rope(i,cx,L.s)+loopD(L,i);if(L.open){open=true}else cx=L.t});
    if(!open){d+=rope(i,cx,XEND);const ty=RY+(i-N()/2)*1.15,tx=XEND+38+(i%4)*5;d+=`C${XEND+14},${f(ys(i,XEND))} ${XEND+18},${f(ty)} ${tx},${f(ty)}`;}
    s+=`<path class="th" data-p="${p.id}" style="--c:${gc(p)}" d="${d}"/>`;
  });
  s+='</g>';
  // bindings at both ends of the main cord
  s+=`<rect class="bind" x="${X0-4}" y="${RY-11}" width="12" height="22" rx="3"/><circle cx="${X0-16}" cy="${RY}" r="9" fill="none" stroke="#6b5a48" stroke-width="3"/>`;
  s+=`<rect class="bind" x="${XEND-2}" y="${RY-12}" width="16" height="24" rx="3"/>`;
  // frayed ends
  LOOPS.filter(L=>L.open).forEach(L=>{
    const x=L.t,y=L.y,c=gc(L.p);
    s+=`<g class="fray" data-p="${L.p.id}">`;
    [-7,-2.5,2.5,7].forEach((dy,j)=>{s+=`<path class="th fr" data-p="${L.p.id}" style="--c:${c}" d="M${x},${y}C${x+8},${y} ${x+10},${y+dy} ${x+20+j%2*4},${y+dy*1.4}"/>`});
    s+=`<text x="${x-6}" y="${y+(L.p.side<0?-10:19)}" text-anchor="end">未完</text></g>`;
  });
  // hit paths + tags
  LOOPS.forEach(L=>{
    const p=L.p,i=p.i;
    s+=`<path class="hit" data-p="${p.id}" d="M${f(L.s)},${f(ys(i,L.s))}${loopD(L,i)}"><title>${esc(p.n)}</title></path>`;
    const tx=L.s+CURVE+8;
    s+=`<g class="tag" data-p="${p.id}" style="--c:${gc(p)}" role="button" tabindex="0" aria-label="只看${esc(p.n)}"><rect x="${f(tx)}" y="${f(L.y-8.5)}" width="${f(p.tw)}" height="17" rx="8.5"/><text x="${f(tx+p.tw/2)}" y="${f(L.y+.5)}">${esc(p.sn)}</text></g>`;
    // long loops: tie the name on again every so often, so a thread can be told apart far from where it left the cord
    const flatEnd=L.open?L.t-40:L.t-CURVE,hw=p.tw/2,free=x=>!L.evs.some(ev=>Math.abs(ev.px-x)<hw+26);
    let last=tx+p.tw/2,x=last+720;
    while(x<flatEnd-hw-20){
      let at=null;for(let d=0;d<=240&&at===null;d+=8){if(x+d<flatEnd-hw-20&&free(x+d))at=x+d;else if(free(x-d)&&x-d>last+p.tw+60)at=x-d}
      if(at===null){x+=240;continue}
      s+=`<g class="tag rep" data-p="${p.id}" style="--c:${gc(p)}"><rect x="${f(at-hw)}" y="${f(L.y-8.5)}" width="${f(p.tw)}" height="17" rx="8.5"/><text x="${f(at)}" y="${f(L.y+.5)}">${esc(p.sn)}</text></g>`;
      last=at;x=at+720;
    }
  });
  // ties
  s+='<g id="ties">';
  EV.forEach(ev=>{
    LOOPS.forEach(L=>{if(L.evs.includes(ev))ev.inst.push({p:L.p,y:L.y,side:L.p.side})});
    const up=ev.inst.filter(n=>n.side<0).sort((a,b)=>a.y-b.y),dn=ev.inst.filter(n=>n.side>0).sort((a,b)=>b.y-a.y);
    if(up.length){ev.ay=up[0].y;ev.ad=-1}else{ev.ay=dn[0].y;ev.ad=1}
    if(ev.inst.length>1){const ys_=ev.inst.map(n=>n.y);s+=`<line class="tie" data-ev="${ev.id}" x1="${f(ev.px)}" x2="${f(ev.px)}" y1="${Math.min(...ys_)}" y2="${Math.max(...ys_)}"/>`}
  });
  s+='</g><g id="arcs" pointer-events="none"></g><g id="knots">';
  EV.forEach(ev=>{
    const n=ev.src.length;
    ev.inst.forEach(ins=>{
      let sh='';ev.src.forEach((k,j)=>{sh+=`<g transform="translate(${f((j-(n-1)/2)*11.5)},0)">${SHAPE[k]}</g>`});
      s+=`<g class="k" data-ev="${ev.id}" data-p="${ins.p.id}" style="--c:${gc(ins.p)}" transform="translate(${f(ev.px)},${ins.y})" tabindex="0" role="button" aria-label="${esc(ev.h)}"><rect class="hz" x="${-8-n*6}" y="-12" width="${16+n*12}" height="24"/>${sh}</g>`;
    });
    const ly=ev.ad<0?ev.ay-14:ev.ay+23;
    s+=`<text class="lab" data-ev="${ev.id}" x="${f(ev.px)}" y="${ly}">${esc(ev.t)}</text>`;
  });
  s+='</g>';
  svg.innerHTML=s;
  // index elements
  EV.forEach(ev=>EL[ev.id]={k:[],lab:null,tie:null,mt:[]});
  PEOPLE.forEach(p=>TH[p.id]={th:[],tags:[],mth:[],row:null});
  svg.querySelectorAll('.k').forEach(g=>EL[g.dataset.ev].k.push(g));
  svg.querySelectorAll('.lab').forEach(t=>EL[t.dataset.ev].lab=t);
  svg.querySelectorAll('.tie').forEach(t=>EL[t.dataset.ev].tie=t);
  svg.querySelectorAll('.th').forEach(t=>TH[t.dataset.p].th.push(t));
  svg.querySelectorAll('.tag').forEach(t=>TH[t.dataset.p].tags.push(t));

  buildMini();buildSide();buildBar();
  document.getElementById('stats').textContent=`${PEOPLE.length} 人 · ${EV.length} 件事 · ${Object.keys(U).length} 段原文`;
  wire();
}

function buildMini(){
  const m=document.getElementById('msvg');m.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let s='';
  ERAS.forEach((e,i)=>{if(i%2)s+=`<rect class="mband" x="${e.x0}" y="0" width="${e.pw}" height="${H}"/>`});
  s+=`<path class="mrope" d="M${X0},${RY}L${XEND},${RY}"/>`;
  LOOPS.forEach(L=>{s+=`<path class="mth" data-p="${L.p.id}" style="stroke:${gc(L.p)}" d="M${f(L.s)},${f(ys(L.p.i,L.s))}${loopD(L,L.p.i)}"/>`});
  EV.forEach(ev=>{s+=`<line class="mtick" data-ev="${ev.id}" x1="${f(ev.px)}" x2="${f(ev.px)}" y1="${ev.ay-26}" y2="${ev.ay+26}"/>`});
  m.innerHTML=s;
  m.querySelectorAll('.mth').forEach(t=>TH[t.dataset.p].mth.push(t));
  m.querySelectorAll('.mtick').forEach(t=>EL[t.dataset.ev].mt.push(t));
}

function buildSide(){
  const side=document.getElementById('side');
  let s='';
  GROUPS.forEach(g=>{
    s+=`<div class="gh"><i style="background:${g.c}"></i>${esc(g.n)}</div>`;
    PEOPLE.filter(p=>p.g===g.id).forEach(p=>{
      s+=`<button class="pr" data-p="${p.id}" style="--gc:${g.c}" aria-pressed="false"><i class="sw"></i><span class="pn">${esc(p.n)}${p.a?`<span class="pa">${esc(p.a)}</span>`:''}</span><span class="pc">${p.evs.length}</span></button>`;
    });

function buildBar(){
  const bar=document.getElementById('bar');
  let s=`<button class="chip who-btn" id="whoBtn">人物</button><span class="lbl">出处</span>`;
  SRCORD.forEach(k=>{s+=`<button class="chip" data-lens="src:${k}" aria-pressed="false">${icon(k)}${SRC[k].n}<span class="n">${EV.filter(e=>e.src.includes(k)).length}</span></button>`});
  s+=`<span class="sep"></span><span class="lbl">母题</span>`;
  MOTIFS.forEach(m=>{s+=`<button class="chip" data-lens="motif:${m.id}" aria-pressed="false">${esc(m.n)}<span class="n">${EV.filter(e=>e.m.includes(m.id)).length}</span></button>`});
  s+=`<span class="status" id="status" hidden><span id="statusTxt"></span><button class="pill-btn" id="clearBtn">全部复原</button></span>`;

/* ---------- refresh ---------- */
function refresh(){
  const pf=state.persons.length>0,lf=!!state.lens;
  document.body.classList.toggle('pf',pf);
  document.body.classList.toggle('lf',lf);
  document.body.classList.toggle('filt',pf||lf);
  PEOPLE.forEach(p=>{
    const on=state.persons.includes(p.id),c=pc(p),T=TH[p.id];
    T.th.forEach(t=>{t.classList.toggle('on',on);t.style.setProperty('--c',c)});
    T.tags.forEach(t=>{t.classList.toggle('on',on||!pf);t.style.setProperty('--c',c)});
    T.mth.forEach(t=>{t.classList.toggle('on',on||(!pf&&lf));t.style.stroke=c});
    T.row.classList.toggle('on',on);T.row.setAttribute('aria-pressed',on);T.row.style.setProperty('--hc',c);
    if(on){const svg=T.th[0].parentNode;T.th.forEach(t=>t.parentNode===svg&&svg.appendChild(t))}
  });
  SEQ=EV.filter(isLit);
  EV.forEach(ev=>{
    const lit=isLit(ev),sel=state.sel===ev.id,E=EL[ev.id];
    E.k.forEach(g=>{g.classList.toggle('lit',lit);g.classList.toggle('sel',sel);g.style.setProperty('--c',pc(PI[g.dataset.p]))});
    E.lab.classList.toggle('lit',lit);E.lab.classList.toggle('sel',sel);
    if(E.tie){E.tie.classList.toggle('lit',lit);E.tie.classList.toggle('sel',sel)}
    E.mt.forEach(t=>{t.classList.toggle('lit',lit);t.classList.toggle('sel',sel)});
  });
  document.querySelectorAll('[data-lens]').forEach(b=>{const [t,id]=b.dataset.lens.split(':');b.setAttribute('aria-pressed',!!(state.lens&&state.lens.type===t&&state.lens.id===id))});
  const st=document.getElementById('status');st.hidden=!(pf||lf);
  if(pf||lf)document.getElementById('statusTxt').textContent=`亮着 ${SEQ.length} 件`;
  drawArcs();renderPanel();
}

function drawArcs(){
  const pairs=[],seen=new Set();
  const add=(a,b)=>{const k=[a.id,b.id].sort().join('|');if(a!==b&&!seen.has(k)){seen.add(k);pairs.push([a,b])}};
  if(state.lens&&state.lens.type==='rel'){
    const ids=RELI[state.lens.id].ev.map(id=>EVI[id]).sort((a,b)=>a.px-b.px);
    for(let i=0;i<ids.length-1;i++)add(ids[i],ids[i+1]);
  }else if(state.sel){
    const ev=EVI[state.sel];ev.rels.forEach(r=>r.ev.forEach(id=>add(ev,EVI[id])));
  }
  const pt=ev=>[ev.px,ev.ad<0?ev.ay-30:ev.ay+34];
  let s='';
  pairs.forEach(([a,b])=>{
    const [x1,y1]=pt(a),[x2,y2]=pt(b),dx=Math.abs(x2-x1),down=a.ad>0&&b.ad>0;
    let apex=down?Math.max(y1,y2)+24+Math.min(150,dx*.06):Math.min(y1,y2)-24-Math.min(150,dx*.06);
    apex=Math.max(14,Math.min(H-14,apex));
    const cy=2*apex-(y1+y2)/2;
    s+=`<path class="arc" d="M${f(x1)},${f(y1)}Q${f((x1+x2)/2)},${f(cy)} ${f(x2)},${f(y2)}"/><circle class="arcdot" cx="${f(x1)}" cy="${f(y1)}" r="2"/><circle class="arcdot" cx="${f(x2)}" cy="${f(y2)}" r="2"/>`;
  });
  document.getElementById('arcs').innerHTML=s;
}

/* ---------- panel ---------- */
const eraW=e=>`${ERAS[e].s} · ${ERAS[e].w}`;
function pchips(ids){return ids.map(id=>{const p=PI[id];return`<button class="pchip${state.persons.includes(id)?' on':''}" data-toggle="${id}" style="--c:${pc(p)}"><i></i>${esc(p.n)}</button>`}).join('')}
function srcIcons(ev){return`<span class="ls">${ev.src.filter(k=>SHAPE[k]&&k!=='o').map(icon).join('')}</span>`}
function listItem(ev,dotsFor){
  const ids=dotsFor?ev.l.filter(id=>dotsFor.includes(id)):ev.l;
  return`<button class="li${state.sel===ev.id?' cur':''}" data-go="${ev.id}"><span class="dots">${ids.map(id=>`<i style="--c:${pc(PI[id])}"></i>`).join('')}</span><span class="lt">${esc(ev.h)}</span>${srcIcons(ev)}</button>`;
}
function eraList(evs,dotsFor){
  let s='',cur=-1;
  evs.forEach(ev=>{if(ev.e!==cur){cur=ev.e;s+=`<div class="eh">${esc(ERAS[cur].n)}　${esc(ERAS[cur].s)}</div>`}s+=listItem(ev,dotsFor)});
  return s;
}
function lensName(L){
  if(L.type==='motif')return`母题：${MOT[L.id].n}`;
  if(L.type==='src')return`出处：${SRC[L.id].f}`;
  if(L.type==='rel')return`同一件事：${RELI[L.id].n}`;
}
const SC={b:'#d8c8a4',c:'#dcab4c',s:'#d4505f',t:'#8ab375'};
function pgRange(us){
  const strip=x=>x.replace(/^pp?\.\s*/,'');
  if(us.length===1)return U[us[0]].pg;
  const a=strip(U[us[0]].pg).split('–')[0],b=strip(U[us[us.length-1]].pg).split('–').pop();
  return a===b?`p. ${a}`:`pp. ${a}–${b}`;
}
function blockCap(b){
  const pr=pgRange(b.u);
  if(b.src==='b')return`贝坦索斯《印加史综述》第一部第${b.ch}章，${pr}（Martín Rubio 1987年本）`;
  if(b.src==='c')return`西萨《秘鲁纪事第二部》第${b.ch}章，${pr}（坎图1985年本）`;
  if(b.src==='s')return b.ch==='fee'?`萨米恩托《印加史》所附核验证明书，${pr}（Rosenblat 1947年本）`:`萨米恩托《印加史》第${b.ch}章，${pr}（Rosenblat 1947年本）`;
  return`《1572年库斯科调查录》，Levillier 1940, t. II, ${pr}`;
}
function marked(text,ranges){
  if(!ranges||!ranges.length)return esc(text);
  const rr=ranges.map(r=>r.slice()).sort((a,b)=>a[0]-b[0]),m=[];
  rr.forEach(r=>{const l=m[m.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else m.push(r)});
  let o='',p=0;m.forEach(([a,b])=>{o+=esc(text.slice(p,a))+'<mark>'+esc(text.slice(a,b))+'</mark>';p=b});
  return o+esc(text.slice(p));
}
function trNote(src,us){
  const t=us.map(u=>U[u].tr);
  if(t.every(x=>x==='p'))return`译文：项目《${SRC[src].pair}》`;
  if(t.every(x=>!x))return'这一段项目中暂无译文';
  return`译文：项目《${SRC[src].pair}》，部分段落暂无译文`;
}
function unitHTML(id,b,role){
  const u=U[id],chNote=String(u.ch)!==String(b.ch)?(u.ch==='fee'?'核验证明书，':`第${u.ch}章，`):'';
  const lab=role==='pre'?`上文 · ${chNote}${u.pg}`:role==='post'?`下文 · ${chNote}${u.pg}`:u.pg;
  const es=role==='core'?marked(u.es,b.hl[id]):esc(u.es),zh=role==='core'?marked(u.zh,b.hz[id]):esc(u.zh);
  return`<div class="pu ${role==='core'?'core':'ctx'}"><div class="pl">${esc(lab)}</div><p class="es" lang="es">${es}</p>${u.zh?`<p class="zh">${zh}</p>`:'<p class="nozh">（这一段项目中暂无译文）</p>'}</div>`;
}
function blockHTML(b){
  let s=`<figure class="q" style="--qc:${SC[b.src]}"><figcaption>${icon(b.src)}<span>${esc(blockCap(b))}</span></figcaption>`;
  if(b.pre)s+=unitHTML(b.pre,b,'pre');
  b.u.forEach(id=>{s+=unitHTML(id,b,'core')});
  if(b.post)s+=unitHTML(b.post,b,'post');
  return s+`<div class="tr">${esc(trNote(b.src,b.u))}</div></figure>`;
}
function renderPanel(){
  const P=document.getElementById('panel');let s='';
  const v=state.view;
  if(v==='event'&&state.sel){
    const ev=EVI[state.sel];
    if(state.back)s+=`<button class="back" data-view="${state.back}">← 回到${state.back==='persons'?'人物线':'列表'}</button>`;
    s+=`<div class="ctx">${esc(eraW(ev.e))}</div><h2>${esc(ev.h)}</h2><div class="who">${pchips(ev.l)}</div><p class="x">${esc(ev.x)}</p>`;
    if(ev.Q.length){
      const nu=ev.Q.reduce((a,b)=>a+b.u.length,0);
      s+=`<div class="qh"><h3>原文 · ${ev.Q.length} 处 · ${nu} 段</h3><button class="ctxbtn" data-ctx>${state.ctx?'收起上下文':'显示上下文'}</button></div>`;
      ev.Q.forEach(b=>{s+=blockHTML(b)});
    }else if(ev.s){s+=`<h3>出处</h3><p class="x" style="font-size:13.5px;color:var(--dim)">${esc(srcText(ev.s))}</p>`}
    if(ev.m.length)s+=`<h3>母题</h3><div class="mchips">${ev.m.map(m=>`<button class="chip" data-lens="motif:${m}" aria-pressed="${!!(state.lens&&state.lens.id===m)}">${esc(MOT[m].n)}</button>`).join('')}</div>`;
    if(ev.rels.length){
      s+=`<h3>同一件事，别处的说法</h3><div class="rel">`;
      ev.rels.forEach(r=>{s+=`<div class="rn"><button class="relbtn" data-lens="rel:${r.id}"><b style="font-weight:400">${esc(r.n)}</b><span>看这一串 →</span></button></div>`;
        r.ev.map(id=>EVI[id]).sort((a,b)=>a.px-b.px).forEach(o=>{s+=listItem(o)});});
      s+=`</div>`;
    }
    const k=SEQ.indexOf(ev);
    s+=`<div class="nav"><button data-step="-1" ${k<=0?'disabled':''}>← 上一件</button><span>${k>=0?`${k+1} / ${SEQ.length}`:'不在当前筛选里'}</span><button data-step="1" ${k<0||k>=SEQ.length-1?'disabled':''}>下一件 →</button></div>`;
  }else if(v==='persons'&&state.persons.length){
    const ps=state.persons.map(id=>PI[id]);
    s+=`<div class="ctx">人物线</div><h2>${ps.map(p=>esc(p.n)).join('、')}</h2>`;
    ps.forEach(p=>{
      const cnt={};p.evs.forEach(e=>e.src.forEach(k=>cnt[k]=(cnt[k]||0)+1));
      const srcs=SRCORD.filter(k=>cnt[k]).map(k=>`${SRC[k].n} ${cnt[k]}`).join(' · ');
      const outs=p.loops.length;
      s+=`<div class="card" style="--c:${pc(p)}"><b>${esc(p.n)}</b>${p.a?`<span class="al">${esc(p.a)}</span>`:''}<p>${esc(p.d)}</p><div class="st">出场 ${p.evs.length} 件 · 从绳里绕出 ${outs} 次${p.open?'，最后一次没有回到绳里':''}<br>见于：${srcs||'—'}</div></div>`;
    });
    if(ps.length>1){const both=EV.filter(e=>state.persons.filter(id=>e.l.includes(id)).length>1);s+=`<h3>同场 ${both.length} 件</h3>${both.length?eraList(both,state.persons):'<p class="x" style="color:var(--dim);font-size:13.5px">这几个人没有同时出现过。</p>'}`;}
    const evs=state.lens?SEQ:EV.filter(e=>e.l.some(id=>state.persons.includes(id)));
    s+=`<h3>时间线 · ${evs.length} 件${state.lens?`（${esc(lensName(state.lens))}）`:''}</h3>${eraList(evs,state.persons)}`;
  }else if(v==='lens'&&state.lens){
    const L=state.lens;
    s+=`<div class="ctx">${L.type==='rel'?'同一件事，几种说法':L.type==='src'?'出处':'母题'}</div><h2>${esc(L.type==='rel'?RELI[L.id].n:L.type==='src'?SRC[L.id].f:MOT[L.id].n)}</h2>`;
    if(L.type==='rel')s+=`<p class="x" style="font-size:13.5px;color:var(--dim)">图上用虚线把这几件事连了起来。</p>`;
    s+=`<h3>${SEQ.length} 件</h3>${eraList(SEQ)}`;
  }else{
    s+=`<div class="intro"><div class="ctx">怎样读这根绳</div><h2>一股绳，${PEOPLE.length}根线</h2>
<p>绳子从左往右走，从印加人到来以前，一直走到1572年。绳里拧着${PEOPLE.length}个人：先来的人、洞里出来的人、历代印加、他们身边的人，还有记下这一切的人。</p>
<p>轮到谁有戏，谁就从绳里绕出来，在自己那一段线上打结；戏完了，再回到绳里。几个人同场，结与结之间有一道细线。有${PEOPLE.filter(p=>p.open).length}根线，到1572年也没有回去。</p><p>点开一个结，右边是这件事在各本书里的原文：整段照录，前后各带一段上下文，关键的句子标亮；每段都配项目里的译文。</p>
<h3>结的形状是出处</h3><div class="legend">${SRCORD.map(k=>`${icon(k)}<span>${esc(SRC[k].f)}</span>`).join('')}</div>
<p style="font-size:13px;color:var(--dim)">一个结上并排两个形状，就是两本书都讲了这件事。</p>
<h3>同一件事，几种说法</h3>${REL.map(r=>`<button class="relbtn" data-lens="rel:${r.id}">${esc(r.n)}<span>${r.ev.length} 处</span></button>`).join('')}
<div class="foot">史料：贝坦索斯《印加史综述》第一部（Martín Rubio 1987年本）；西萨《秘鲁纪事第二部》（坎图1985年本）；萨米恩托《印加史》（Rosenblat 1947年本）；《1572年库斯科调查录》（Levillier 1940, t. II）。原文与译文均取自本项目的西汉对照。</div></div>`;
  }
  P.innerHTML=s;P.scrollTop=0;
}

/* ---------- actions ---------- */
const sc=()=>document.getElementById('sc');
function reveal(ev,instant){
  const S=sc(),x=ev.px,y=ev.ay+50,w=S.clientWidth,h=S.clientHeight;
  let L=S.scrollLeft,T=S.scrollTop;
  if(x<L+90||x>L+w-90)L=x-w/2;
  if(y<T+80||y>T+h-40)T=y-h/2;
  S.scrollTo({left:L,top:T,behavior:instant?'auto':'smooth'});
}
function select(id,o={}){
  if(!EVI[id])return;
  if(state.view!=='event')state.back=(state.view==='persons'||state.view==='lens')?state.view:null;
  state.sel=id;state.view='event';refresh();
  if(o.scroll!==false)reveal(EVI[id],o.instant);
}
function step(d){
  if(!SEQ.length)return;
  const cur=EVI[state.sel];let k=SEQ.indexOf(cur);
  if(k<0){const x=cur?cur.px:-1;k=d>0?SEQ.findIndex(e=>e.px>x):SEQ.length-1-[...SEQ].reverse().findIndex(e=>e.px<x);if(k<0||k>=SEQ.length)return;select(SEQ[k].id);return}
  k+=d;if(k<0||k>=SEQ.length)return;select(SEQ[k].id);
}
function togglePerson(id){
  const i=state.persons.indexOf(id);
  if(i<0)state.persons.push(id);else state.persons.splice(i,1);
  state.view=state.persons.length?'persons':(state.lens?'lens':(state.sel?'event':'home'));state.back=null;
  refresh();
}
function setLens(type,id){
  const same=state.lens&&state.lens.type===type&&state.lens.id===id;
  state.lens=same?null:{type,id};
  state.view=state.lens?'lens':(state.persons.length?'persons':(state.sel?'event':'home'));state.back=null;
  refresh();
  if(state.lens&&SEQ.length){const S=sc(),x=SEQ[0].px;if(x<S.scrollLeft||x>S.scrollLeft+S.clientWidth)S.scrollTo({left:x-120,behavior:'smooth'})}
}
function clearAll(){state.persons=[];state.lens=null;state.view=state.sel?'event':'home';state.back=null;refresh()}

/* ---------- wiring ---------- */
const tip=document.getElementById('tip');
function showTip(ev,e){tip.innerHTML=`<small>${esc(ERAS[ev.e].n)}</small>${esc(ev.h)}<small>${ev.l.map(id=>esc(PI[id].n)).join('、')}</small>`;tip.classList.add('on');moveTip(e)}
function moveTip(e){const x=Math.min(e.clientX+14,innerWidth-290),y=e.clientY+16>innerHeight-90?e.clientY-80:e.clientY+16;tip.style.left=x+'px';tip.style.top=y+'px'}
function hideTip(){tip.classList.remove('on')}
function hov(pid,on){TH[pid].th.forEach(t=>t.classList.toggle('hov',on))}

function wire(){
  const svg=document.getElementById('braid');
  svg.addEventListener('click',e=>{
    const k=e.target.closest('.k,.lab');if(k){select(k.dataset.ev,{scroll:false});return}
    const t=e.target.closest('.hit,.tag');if(t){togglePerson(t.dataset.p)}
  });
  svg.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const k=e.target.closest('.k');if(k){e.preventDefault();select(k.dataset.ev,{scroll:false});return}
    const t=e.target.closest('.tag');if(t){e.preventDefault();togglePerson(t.dataset.p)}
  });
  svg.addEventListener('pointerover',e=>{
    const k=e.target.closest('.k,.lab');if(k){showTip(EVI[k.dataset.ev],e);return}
    const t=e.target.closest('.hit,.tag');if(t)hov(t.dataset.p,true);
  });
  svg.addEventListener('pointermove',e=>{if(tip.classList.contains('on'))moveTip(e)});
  svg.addEventListener('pointerout',e=>{
    const k=e.target.closest('.k,.lab');if(k)hideTip();
    const t=e.target.closest('.hit,.tag');if(t)hov(t.dataset.p,false);
  });
  document.getElementById('side').addEventListener('click',e=>{const b=e.target.closest('.pr');if(b)togglePerson(b.dataset.p)});
  document.getElementById('side').addEventListener('pointerover',e=>{const b=e.target.closest('.pr');if(b)hov(b.dataset.p,true)});
  document.getElementById('side').addEventListener('pointerout',e=>{const b=e.target.closest('.pr');if(b)hov(b.dataset.p,false)});
  document.addEventListener('click',e=>{
    const l=e.target.closest('[data-lens]');if(l){const [t,id]=l.dataset.lens.split(':');setLens(t,id);return}
    const g=e.target.closest('[data-go]');if(g){select(g.dataset.go);return}
    const tg=e.target.closest('[data-toggle]');if(tg){togglePerson(tg.dataset.toggle);return}
    const st=e.target.closest('[data-step]');if(st){step(+st.dataset.step);return}
    if(e.target.closest('[data-ctx]')){state.ctx=!state.ctx;document.body.classList.toggle('noctx',!state.ctx);document.querySelectorAll('[data-ctx]').forEach(b=>b.textContent=state.ctx?'收起上下文':'显示上下文');return}
    const bv=e.target.closest('[data-view]');if(bv){state.view=bv.dataset.view;state.back=null;renderPanel();return}
    if(e.target.id==='clearBtn'){clearAll();return}
    if(e.target.closest('#whoBtn')){document.getElementById('side').classList.toggle('open');return}
    if(!e.target.closest('#side')&&!e.target.closest('.hit,.tag'))document.getElementById('side').classList.remove('open');
  });
  document.getElementById('again').addEventListener('click',()=>{if(SEQ.length)select(SEQ[0].id)});
  document.addEventListener('keydown',e=>{
    if(e.altKey||e.ctrlKey||e.metaKey)return;
    if(e.key==='ArrowRight'){e.preventDefault();step(1)}
    else if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}
    else if(e.key==='Escape'){clearAll();document.getElementById('side').classList.remove('open')}
  });
  // minimap
  const mini=document.getElementById('mini'),vp=document.getElementById('vp'),S=sc();
  const syncVp=()=>{const mw=mini.clientWidth;vp.style.left=(S.scrollLeft/W*mw)+'px';vp.style.width=Math.max(8,S.clientWidth/W*mw)+'px';mini.setAttribute('aria-valuenow',Math.round(S.scrollLeft/Math.max(1,W-S.clientWidth)*100))};
  S.addEventListener('scroll',syncVp,{passive:true});addEventListener('resize',syncVp);syncVp();
  let drag=false;
  const go=e=>{const r=mini.getBoundingClientRect();S.scrollLeft=(e.clientX-r.left)/r.width*W-S.clientWidth/2};
  mini.addEventListener('pointerdown',e=>{drag=true;mini.setPointerCapture(e.pointerId);go(e)});
  mini.addEventListener('pointermove',e=>{if(drag)go(e)});
  mini.addEventListener('pointerup',()=>drag=false);
  mini.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.stopPropagation();e.preventDefault();S.scrollBy({left:(e.key==='ArrowRight'?1:-1)*S.clientWidth*.6,behavior:'smooth'})}});
}

function start(data){
  build();
  const d=data||{};
  state.persons=(d.persons||[]).filter(id=>PI[id]);
  state.lens=d.lens&&((d.lens.type==='motif'&&MOT[d.lens.id])||(d.lens.type==='src'&&SRC[d.lens.id])||(d.lens.type==='rel'&&RELI[d.lens.id]))?d.lens:null;
  state.sel=EVI[d.sel]?d.sel:null;
  state.view=['event','persons','lens','home'].includes(d.view)?d.view:'home';
  state.ctx=d.ctx!==false;document.body.classList.toggle('noctx',!state.ctx);
  if(state.view==='event'&&!state.sel)state.view='home';
  refresh();
  const S=sc();
  if(typeof d.sx==='number'){S.scrollLeft=d.sx;S.scrollTop=d.sy||0}
  else S.scrollTop=Math.max(0,RY+50-S.clientHeight/2);
  window.claude?.hot?.snapshot?.(()=>({sel:state.sel,persons:state.persons,lens:state.lens,view:state.view,ctx:state.ctx,sx:sc().scrollLeft,sy:sc().scrollTop}));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
